<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你可以幫我按摩嗎？</title>
<style>
  :root{
    --paper:#f6f2ea; --paper2:#efe9de; --line:#ddd5c7;
    --ink:#2a2420; --muted:#7d7469; --faint:#a89e91;
    --wine:#7a1426; --wine-hi:#9b2236; --wine-lo:#560c1a;
    --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:var(--serif);color:var(--ink);
    background:
      radial-gradient(900px 600px at 50% 40%,#fbf8f2,transparent 70%),
      linear-gradient(var(--paper),var(--paper2));
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  /* 紙張細紋 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:repeating-linear-gradient(0deg,rgba(120,100,80,.035) 0 1px,transparent 1px 3px);
  }

  /* 頂部：No. 01 ／ 拜託 婚禮籌備委員會 ／ 01 / 05 */
  header{
    position:fixed;top:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px 12px;border-bottom:1px solid var(--line);background:rgba(246,242,234,.85);
  }
  .chip{
    font-size:11px;letter-spacing:.08em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;background:#fbf9f4;
  }
  .org{font-size:14px;letter-spacing:.35em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .org .xi{color:var(--wine);margin-right:.5em;letter-spacing:0}
  .progress{position:fixed;top:49px;left:0;height:2px;background:var(--wine);width:20%;z-index:4;transition:width .5s}

  main{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 16px 110px;text-align:center;
  }
  .seal{
    width:64px;height:64px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--faint);font-size:26px;margin-bottom:38px;
    background:#fbf9f4;transition:transform .4s,color .3s,border-color .3s;
  }
  .seal.hit{color:var(--wine);border-color:var(--wine);transform:rotate(-12deg) scale(1.08)}
  .to{margin:-14px 0 14px;font-size:clamp(16px,3.6vw,20px);letter-spacing:.25em;color:var(--wine)}
  .to::before,.to::after{content:"";display:inline-block;width:28px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
  .tag{font-size:11px;letter-spacing:.3em;color:var(--muted);margin:0 0 18px}
  h1{
    margin:0 0 54px;font-weight:600;letter-spacing:.12em;
    font-size:clamp(24px,5.4vw,38px);line-height:1.4;
  }

  #yes{
    border:0;cursor:pointer;font-family:var(--serif);font-weight:700;
    font-size:clamp(18px,4.2vw,22px);letter-spacing:.3em;text-indent:.3em;color:#fff;
    padding:16px 44px;border-radius:999px;
    background:linear-gradient(180deg,var(--wine-hi),var(--wine) 55%,var(--wine-lo));
    box-shadow:0 10px 24px rgba(90,10,25,.28),inset 0 1px 0 rgba(255,255,255,.18);
    transform:scale(var(--grow,1));
    transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,filter .2s;
  }
  #yes:hover{filter:brightness(1.1);box-shadow:0 14px 30px rgba(90,10,25,.36),inset 0 1px 0 rgba(255,255,255,.18)}
  #yes:active{translate:0 2px}

  #no{
    position:fixed;z-index:5;cursor:pointer;font-family:var(--serif);
    font-size:12px;letter-spacing:.15em;color:var(--muted);white-space:nowrap;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    box-shadow:0 3px 10px rgba(60,40,20,.08);
    rotate:-8deg;transform:scale(var(--shrink,1));
    transition:left .28s cubic-bezier(.2,.9,.3,1.2),top .28s cubic-bezier(.2,.9,.3,1.2),transform .3s,rotate .3s;
  }
  #no.shake{animation:shake .3s}
  @keyframes shake{25%{rotate:-22deg}75%{rotate:8deg}}

  #taunt{
    position:fixed;left:0;right:0;bottom:44px;margin:0 auto;padding:0 16px;text-align:center;
    font-size:13px;letter-spacing:.12em;color:var(--muted);
  }
  #taunt.pop{animation:pop .4s}
  @keyframes pop{40%{color:var(--wine);transform:translateY(-2px)}}
  #counter{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.15em;color:var(--faint)}

  /* 成功畫面 */
  #win{
    position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(246,242,234,.9);backdrop-filter:blur(4px);
  }
  #win.show{display:flex}
  .card{
    background:#fffdf8;border:1px solid var(--line);border-radius:6px;
    padding:40px 30px 32px;max-width:400px;width:calc(100% - 32px);text-align:center;
    box-shadow:0 24px 60px rgba(60,30,20,.16);animation:rise .55s cubic-bezier(.3,1.4,.5,1);
    outline:1px solid var(--line);outline-offset:-10px;
  }
  @keyframes rise{from{transform:translateY(30px);opacity:0}}
  .card .stamp{
    width:76px;height:76px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--wine);
    color:var(--wine);display:grid;place-items:center;font-size:34px;rotate:-10deg;
    animation:stamp .5s .15s both cubic-bezier(.3,1.8,.5,1);
  }
  @keyframes stamp{from{transform:scale(2.4);opacity:0}}
  .card h2{margin:0 0 10px;font-size:24px;font-weight:600;letter-spacing:.12em}
  .card p{margin:0 0 26px;color:var(--muted);letter-spacing:.08em;line-height:1.7}
  .card button{
    border:1px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer;
    font-family:var(--serif);font-size:13px;letter-spacing:.15em;background:#fff;color:var(--muted);
  }
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:21}

  /* 自訂模板面板 */
  #gear{
    position:fixed;right:12px;bottom:12px;z-index:30;border:0;background:transparent;
    font-size:18px;cursor:pointer;opacity:.35;
  }
  #gear:hover{opacity:1}
  #panel{
    position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(380px,100%);
    background:#fffdf8;box-shadow:-10px 0 40px rgba(0,0,0,.15);padding:20px 18px;overflow:auto;
    transform:translateX(105%);transition:transform .3s;user-select:text;-webkit-user-select:text;
    font-family:"Microsoft JhengHei",system-ui,sans-serif;
  }
  #panel.open{transform:none}
  #panel h3{margin:0 0 4px}
  #panel .hint{font-size:12px;color:var(--muted);margin:0 0 14px}
  #panel label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px}
  #panel input,#panel textarea{
    width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:14px;
  }
  #panel textarea{min-height:92px;resize:vertical}
  #panel .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  #panel .row button{
    flex:1;border:0;border-radius:10px;padding:10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
    background:#efe9de;color:var(--ink);
  }
  #panel .row button.primary{background:var(--wine);color:#fff}
  #toast{
    position:fixed;left:50%;top:64px;translate:-50% 0;z-index:40;background:var(--ink);color:#fff;
    padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  #toast.show{opacity:1}

  @media (max-width:480px){
    .org{letter-spacing:.15em;font-size:13px}
    #yes{padding:14px 38px}
  }
</style>
</head>
<body>

<header>
  <span class="chip" id="noChip">No. 01</span>
  <span class="org"><span class="xi">拜託</span><span id="org">肩頸舒緩委員會</span></span>
  <span class="chip" id="pageChip">01 / 05</span>
</header>
<div class="progress" id="progress"></div>

<main>
  <div class="seal" id="seal">意</div>
  <p class="to" id="toLine" hidden></p>
  <p class="tag" id="tag">第一題・意願確認</p>
  <h1 id="question">你可以幫我按摩嗎？💆</h1>
  <button id="yes" type="button">可以</button>
</main>

<button id="no" type="button">不想要</button>
<p id="taunt">再靠近一次，我的肩膀就更痠了。</p>
<div id="counter"></div>

<div id="win" role="dialog" aria-modal="true">
  <div class="card">
    <div class="stamp">拜託</div>
    <h2 id="winTitle">已收到您的按摩回覆</h2>
    <p id="winText">按摩時段已幫你預約好，反悔無效。<br>手準備好！</p>
    <button id="again" type="button">再看一次</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<button id="gear" type="button" title="自訂文案">⚙️</button>
<aside id="panel" aria-label="自訂文案">
  <h3>自訂模板</h3>
  <p class="hint">改完按「套用」即時預覽；「複製分享連結」會把文案帶進網址，對方打開就是你的版本。</p>
  <label for="f_org">頂部抬頭</label><input id="f_org">
  <label for="f_tag">題號小字</label><input id="f_tag">
  <label for="f_q">問題</label><input id="f_q">
  <label for="f_yes">「可以」按鈕文字</label><input id="f_yes">
  <label for="f_no">「不想要」按鈕文字</label><input id="f_no">
  <label for="f_taunts">下方小字（一行一句，每閃一次換下一句；{n} = 閃躲次數）</label><textarea id="f_taunts"></textarea>
  <label for="f_ok">成功標題</label><input id="f_ok">
  <label for="f_okt">成功內文</label><input id="f_okt">
  <div class="row">
    <button type="button" id="apply" class="primary">套用</button>
    <button type="button" id="share">複製分享連結</button>
  </div>
  <div class="row">
    <button type="button" id="reset">還原預設</button>
    <button type="button" id="close">關閉</button>
  </div>
</aside>
<div id="toast"></div>

<script src="config.js"></script>
<script>
// ===== 模板預設文案：直接改這裡，或用右下角 ⚙️ 產生分享連結 =====
const DEFAULTS = {
  org: '肩頸舒緩委員會',
  tag: '第一題・意願確認',
  q:   '你可以幫我按摩嗎？💆',
  yes: '可以',
  no:  '不想要',
  taunts: [
    '再靠近一次，我的肩膀就更痠了。',
    '我看到了，你剛剛想按「不想要」。',
    '這段我會截圖存證。',
    '第 {n} 次了，我的肩頸都在記錄。',
    '「不想要」按鈕：我只是裝飾用的。',
    '紅色那顆比較好按，真的。',
    '再閃下去，就從 10 分鐘加到 30 分鐘。',
    '好啦，你逃不掉的。'
  ],
  ok:  '已收到您的按摩回覆',
  okt: '按摩時段已幫你預約好，反悔無效。手準備好！'
};
const NO_LABELS = ['不想要', '真的不想要？', '再想想', '不…', '好啦', '可以'];
const SEALS = ['意', '嗯', '咦', '哼', '欸', '拜託'];

const $ = id => document.getElementById(id);
const yesBtn = $('yes'), noBtn = $('no'), taunt = $('taunt');
const clone = o => JSON.parse(JSON.stringify(o));
const KEYS = ['org', 'tag', 'q', 'yes', 'no', 'ok', 'okt'];
let cfg = load(), dodges = 0, won = false;

// ---- 專屬邀請：網址後面直接加 ?name=名字 就好（舊版 ?to= 也認得）；id/n 選填 ----
const P = new URLSearchParams(location.search);
const INVITEE = { to: (P.get('name') || P.get('to') || '').trim(), id: P.get('id') || '', n: P.get('n') || '', preview: P.has('preview') };
if (!INVITEE.id) INVITEE.id = INVITEE.to;   // 沒給 id 就用名字區分不同人
const nameOf = () => INVITEE.to || '你';
const fill = s => String(s).split('{name}').join(nameOf());

function store(key, fn){   // localStorage 可能被擋，失敗就當沒記過
  try { const v = fn(localStorage.getItem(key)); if (v != null) localStorage.setItem(key, v); return v; } catch { return null; }
}
function report(text, beacon){
  const hook = window.INVITE_CONFIG && window.INVITE_CONFIG.webhook;
  if (!INVITEE.to || INVITEE.preview || !hook) return;
  // 同一個人、同一題的通知串在同一個討論串（不同題目的網址分開，不會混在一起）
  const topic = fill(cfg.q);
  const url = hook + '&threadKey=' + encodeURIComponent('invite-' + (INVITEE.id || INVITEE.to) + '-' + hashOf(topic)) +
              '&messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD';
  // 每則通知都標明是哪一題的回覆，避免給錯網址時分不出來
  text = text.replace('\n', `\n📝 題目：「${topic}」\n`);
  // text/plain 是 CORS 簡單請求，不需預檢；Chat webhook 照樣解析 JSON
  const body = JSON.stringify({ text });
  if (beacon && navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type: 'text/plain;charset=UTF-8'}))) return;
  fetch(url, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=UTF-8'}, body, keepalive: true }).catch(() => {});
}
function hashOf(s){   // 題目轉短代碼當 threadKey 的一部分
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return h.toString(36);
}
const tag = () => `*${INVITEE.to}*` + (INVITEE.n ? `（No.${INVITEE.n}）` : '');
const now = () => new Date().toLocaleString('zh-TW', {hour12: false});

function load(){
  const p = new URLSearchParams(location.search), c = clone(DEFAULTS);
  for (const k of KEYS) if (p.has(k)) c[k] = p.get(k);
  if (p.has('t')) c.taunts = p.get('t').split('\n').map(s => s.trim()).filter(Boolean);
  if (!c.taunts.length) c.taunts = DEFAULTS.taunts.slice();
  return c;
}

function render(){
  document.title = fill(cfg.q);
  $('org').textContent = fill(cfg.org);
  $('tag').textContent = fill(cfg.tag);
  $('question').textContent = fill(cfg.q);
  yesBtn.textContent = cfg.yes;
  noBtn.textContent = cfg.no;
  $('winTitle').textContent = fill(cfg.ok);
  $('winText').textContent = fill(cfg.okt);
  if (INVITEE.to){
    $('toLine').textContent = '致 ' + INVITEE.to;
    $('toLine').hidden = false;
    $('gear').hidden = true;          // 收件人看不到自訂面板
  }
  if (INVITEE.n) $('noChip').textContent = 'No. ' + String(INVITEE.n).padStart(2, '0');
  setTaunt(false);
}

function setTaunt(animate){
  const line = cfg.taunts[Math.min(dodges, cfg.taunts.length - 1)];
  taunt.textContent = fill(line).split('{n}').join(dodges);
  if (animate){ taunt.classList.remove('pop'); void taunt.offsetWidth; taunt.classList.add('pop'); }
}

// ---- 「不要」按鈕：初始放在問題右下、偏離中線 ----
function placeInitial(){
  const r = noBtn.getBoundingClientRect(), q = $('question').getBoundingClientRect();
  const x = Math.min(innerWidth - r.width - 16, Math.max(q.right + 10, innerWidth * 0.78));
  const y = q.bottom + 8;
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';
}

// 選一個離指標夠遠、不壓到「要」按鈕／頂部抬頭、不出界的位置
function dodge(px, py){
  if (won) return;
  const nr = noBtn.getBoundingClientRect(), yr = yesBtn.getBoundingClientRect();
  const pad = 14, top = 64, bottom = 80, w = nr.width, h = nr.height;
  let best = null, bestScore = -1;
  for (let i = 0; i < 40; i++){
    const x = pad + Math.random() * (innerWidth - w - pad * 2);
    const y = top + Math.random() * (innerHeight - h - top - bottom);
    const cx = x + w / 2, cy = y + h / 2;
    const dPointer = Math.hypot(cx - px, cy - py);
    const overYes = !(x + w < yr.left - 20 || x > yr.right + 20 || y + h < yr.top - 20 || y > yr.bottom + 20);
    const travel = Math.hypot(cx - (nr.left + w / 2), cy - (nr.top + h / 2));
    const score = overYes ? -1 : dPointer + Math.min(travel, 260) * 0.3;
    if (score > bestScore){ bestScore = score; best = [x, y]; }
  }
  if (!best) return;
  noBtn.style.left = best[0] + 'px';
  noBtn.style.top  = best[1] + 'px';

  dodges++;
  noBtn.classList.remove('shake'); void noBtn.offsetWidth; noBtn.classList.add('shake');
  noBtn.style.setProperty('--shrink', Math.max(0.6, 1 - dodges * 0.04));
  noBtn.style.rotate = (Math.random() * 24 - 12).toFixed(1) + 'deg';
  yesBtn.style.setProperty('--grow', Math.min(1.6, 1 + dodges * 0.06));
  noBtn.textContent = dodges < 3 ? cfg.no : NO_LABELS[Math.min(Math.floor(dodges / 3), NO_LABELS.length - 1)];
  const seal = $('seal');
  seal.textContent = SEALS[Math.min(Math.floor(dodges / 2), SEALS.length - 1)];
  seal.classList.add('hit'); clearTimeout(seal._t); seal._t = setTimeout(() => seal.classList.remove('hit'), 400);
  $('counter').textContent = `閃躲紀錄 ${String(dodges).padStart(2, '0')} 次`;
  $('progress').style.width = Math.min(100, 20 + dodges * 8) + '%';
  setTaunt(true);
}

// 靠近就閃（不必真的碰到）
const DANGER = 90;
function nearNo(x, y){
  const r = noBtn.getBoundingClientRect();
  const dx = Math.max(r.left - x, 0, x - r.right);
  const dy = Math.max(r.top - y, 0, y - r.bottom);
  return Math.hypot(dx, dy) < DANGER;
}
// 按鈕滑動動畫 0.28s 內再閃一次會被「滑過游標底下」誤觸，所以共用冷卻時間
let lastDodge = -1e9;
function tryDodge(x, y){
  const now = performance.now();
  if (now - lastDodge < 300) return;
  lastDodge = now;
  dodge(x, y);
}
function onMove(e){ if (nearNo(e.clientX, e.clientY)) tryDodge(e.clientX, e.clientY); }
document.addEventListener('pointermove', onMove);
document.addEventListener('mousemove', onMove);
// 游標直接落在按鈕上（例如快速甩過去）也立刻閃
for (const ev of ['pointerenter', 'mouseover'])
  noBtn.addEventListener(ev, e => tryDodge(e.clientX, e.clientY));
// 觸控：手指一碰到附近就跑
document.addEventListener('pointerdown', e => {
  if (nearNo(e.clientX, e.clientY)){ e.preventDefault(); tryDodge(e.clientX, e.clientY); }
}, {passive:false});
// 觸控：擋掉 touchstart 預設動作，否則按鈕還在滑動途中、手指放開時仍會觸發 click
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (t && nearNo(t.clientX, t.clientY)) e.preventDefault();
}, {passive:false});
// 萬一還是被按到（鍵盤 Tab+Enter 等）→ 一律當成「要」；剛閃完的那一下不算
noBtn.addEventListener('click', e => {
  e.preventDefault();
  if (performance.now() - lastDodge < 800) return;
  win();
});
noBtn.addEventListener('focus', () => {
  const r = noBtn.getBoundingClientRect();
  tryDodge(r.left + r.width / 2, r.top + r.height / 2);
});

yesBtn.addEventListener('click', win);
$('again').addEventListener('click', resetGame);

function win(){
  if (won) return;
  won = true;
  $('progress').style.width = '100%';
  $('win').classList.add('show');
  confetti();
  const times = store('invite-yes-' + INVITEE.id + '-' + hashOf(fill(cfg.q)), v => String((+v || 0) + 1));
  const how = dodges === 0 ? `毫不猶豫，直接按下「${cfg.yes}」！` : `追著「${cfg.no}」閃了 ${dodges} 次後，乖乖按下「${cfg.yes}」。`;
  report(`✅ ${tag()} 回覆：*${cfg.yes}*\n${how}` + (times > 1 ? `（這是第 ${times} 次按）` : '') + `\n🕒 ${now()}`);
}
// 開啟就通知；沒按「要」就離開也通知一次（手機切 App 也算離開）
let leftReported = false;
function reportLeave(){
  if (won || leftReported) return;
  leftReported = true;
  report(`🏃 ${tag()} 離開了頁面，還沒按「${cfg.yes}」` + (dodges ? `（已嘗試按「${cfg.no}」${dodges} 次）` : '') + `\n🕒 ${now()}`, true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') reportLeave(); });
addEventListener('pagehide', reportLeave);   // 直接關分頁時有些瀏覽器不發 visibilitychange
function resetGame(){
  won = false; dodges = 0;
  $('win').classList.remove('show');
  noBtn.style.setProperty('--shrink', 1);
  noBtn.style.rotate = '';
  yesBtn.style.setProperty('--grow', 1);
  noBtn.textContent = cfg.no;
  $('seal').textContent = SEALS[0];
  $('counter').textContent = '';
  $('progress').style.width = '20%';
  setTaunt(false);
  placeInitial();
}

// ---- 花瓣彩帶（酒紅／金／米白）----
function confetti(){
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const colors = ['#7a1426', '#9b2236', '#c9a227', '#e6cf8a', '#f3e9e0', '#b5485d'];
  const parts = Array.from({length: 160}, () => ({
    x: innerWidth / 2, y: innerHeight * 0.45,
    vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 14 - 4,
    s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
    c: colors[Math.random() * colors.length | 0]
  }));
  let t = 0;
  (function frame(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts){
      p.vy += 0.3; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s / 2, p.s / 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (++t < 220) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

// ---- 自訂面板 ----
function fillForm(){
  for (const k of KEYS) $('f_' + k).value = cfg[k];
  $('f_taunts').value = cfg.taunts.join('\n');
}
function readForm(){
  const c = {};
  for (const k of KEYS) c[k] = $('f_' + k).value.trim() || DEFAULTS[k];
  c.taunts = $('f_taunts').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!c.taunts.length) c.taunts = DEFAULTS.taunts.slice();
  return c;
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
$('gear').addEventListener('click', () => { fillForm(); $('panel').classList.add('open'); });
$('close').addEventListener('click', () => $('panel').classList.remove('open'));
$('apply').addEventListener('click', () => { cfg = readForm(); render(); resetGame(); toast('已套用'); });
$('reset').addEventListener('click', () => { cfg = clone(DEFAULTS); fillForm(); render(); resetGame(); });
$('share').addEventListener('click', async () => {
  cfg = readForm(); render(); resetGame();
  const p = new URLSearchParams();
  for (const k of KEYS) if (cfg[k] !== DEFAULTS[k]) p.set(k, cfg[k]);
  if (cfg.taunts.join('\n') !== DEFAULTS.taunts.join('\n')) p.set('t', cfg.taunts.join('\n'));
  const url = location.origin + location.pathname + (p.toString() ? '?' + p : '');
  try { await navigator.clipboard.writeText(url); toast('連結已複製'); }
  catch { prompt('複製這個連結：', url); }
});

addEventListener('resize', () => {
  const r = noBtn.getBoundingClientRect();
  if (r.right > innerWidth || r.bottom > innerHeight) placeInitial();
});

render();
placeInitial();
if (INVITEE.to){
  const opens = store('invite-open-' + INVITEE.id + '-' + hashOf(fill(cfg.q)), v => String((+v || 0) + 1));
  report(`👀 ${tag()} 打開了邀請` + (opens > 1 ? `（第 ${opens} 次）` : '') + `\n🕒 ${now()}`);
}
</script>
