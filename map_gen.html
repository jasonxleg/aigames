<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Gemini AI - MAP 題庫自動產生器 (預設 Key 版)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 40px; color: #333; }
        .box { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid #1a73e8; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; text-align: center; font-size: 0.95em; color: #666; min-height: 24px; }
        .hint { font-size: 0.85em; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 Gemini MAP 題庫產生器</h2>
    
    <div class="input-group">
        <label>1. Gemini API Key (已預設)：</label>
        <input type="password" id="apiKey" value="AIzaSyDn_zDS6VQNbeLkOWd5HGcK0oqI2pUxV_I">
        <div class="hint">※ 已填入你提供的預設金鑰</div>
    </div>

    <div class="input-group">
        <label>2. 設定難度 (Lexile)：</label>
        <select id="lexile">
            <option value="400L-500L">400L-500L (初階 / 小學低年級)</option>
            <option value="600L-750L" selected>600L-750L (中階 / 目前藍思值 680L 適用)</option>
            <option value="850L-1000L">850L-1000L (高階 / 挑戰目標)</option>
        </select>
    </div>

    <div class="input-group">
        <label>3. 題目數量：</label>
        <input type="number" id="qCount" value="10" min="1" max="20">
        <div class="hint">建議每次生成 10 題以獲得最佳內容品質。</div>
    </div>

    <button id="genBtn" onclick="startGeneration()">開始 AI 生成並下載練習卷</button>
    <div id="status"></div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value;
        const lexile = document.getElementById('lexile').value;
        const count = document.getElementById('qCount').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key) return alert("請輸入有效的 API Key");

        btn.disabled = true;
        status.innerHTML = "<b>⏳ 正在聯絡 AI 構思題目中...</b><br>這通常需要 10-20 秒，請不要關閉視窗。";

        // 優化的 Prompt，確保 AI 產出的格式嚴謹
        const prompt = `Act as an expert MAP Test content creator. Generate a Reading practice test.
        Target Lexile Level: ${lexile}.
        Question Count: ${count}.
        Content Requirements:
        1. Mix of informational texts and literary passages.
        2. Passages should be 150-250 words.
        3. Questions must focus on Vocabulary in Context, Main Idea, and Inference.
        4. Output format MUST be a single raw JSON array of objects.
        Object format: 
        - {isPassage: true, text: "html_formatted_passage"}
        - {isPassage: false, q: "question_text", options: ["A", "B", "C", "D"], ans: correct_index_0_to_3}
        
        Output ONLY the raw JSON array.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            let rawJson = data.candidates[0].content.parts[0].text;
            // 清理 Markdown 標記
            rawJson = rawJson.replace(/```json/g, '').replace(/```/g, '').trim();
            const quizData = JSON.parse(rawJson);

            downloadHtml(quizData, lexile);
            status.innerHTML = "<span style='color: #27ae60;'><b>✨ 生成完成！</b> 檔案已自動開始下載。</span>";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color: #c0392b;'><b>❌ 出錯了：</b> " + error.message + "</span>";
        } finally {
            btn.disabled = false;
        }
    }

    function downloadHtml(quizData, lexile) {
        const finalHtml = `
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>MAP Practice Test (${lexile})</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; line-height: 1.6; }
        .card { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .passage { background: #eef7ff; padding: 20px; border-left: 6px solid #1a73e8; margin: 20px 0; border-radius: 4px; font-style: italic; }
        .q-block { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        label { display: block; padding: 12px; border: 2px solid #ddd; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #f9f9f9; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; font-weight: bold; color: #155724; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        .correct::after { content: " (✔ Correct Answer)"; margin-left: 10px; }
        .wrong::after { content: " (✘ Your Choice)"; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="text-align:center; color:#2c3e50;">MAP Reading 模擬練習卷</h1>
        <p style="text-align:center; color: #666;">難度：Lexile ${lexile}</p>
        <div id="content"></div>
        <button id="subBtn" onclick="check()">提交答案並顯示結果</button>
        <h2 id="res" style="text-align:center; margin-top: 20px;"></h2>
    </div>
    <script>
        const data = ${JSON.stringify(quizData)};
        const container = document.getElementById('content');
        data.forEach((item, idx) => {
            if(item.isPassage) {
                container.innerHTML += '<div class="passage">' + item.text + '</div>';
            } else {
                let opts = '';
                item.options.forEach((o, i) => {
                    const id = 'q' + idx + '_' + i;
                    opts += '<li><input type="radio" name="q'+idx+'" id="'+id+'" value="'+i+'"><label for="'+id+'">' + o + '</label></li>';
                });
                container.innerHTML += '<div class="q-block"><p><b>' + item.q + '</b></p><ul style="list-style:none; padding:0;">' + opts + '</ul></div>';
            }
        });
        function check() {
            let score = 0; let total = 0;
            data.forEach((item, idx) => {
                if(!item.isPassage) {
                    total++;
                    const sel = document.querySelector('input[name="q'+idx+'"]:checked');
                    const correctLabel = document.querySelector('label[for="q'+idx+'_'+item.ans+'"]');
                    correctLabel.classList.add("correct");
                    if(sel) {
                        const val = parseInt(sel.value);
                        if(val === item.ans) score++;
                        else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");
                    }
                    document.querySelectorAll('input[name="q'+idx+'"]').forEach(r => r.disabled = true);
                }
            });
            document.getElementById('res').innerText = "最終得分: " + score + " / " + total;
            document.getElementById('subBtn').disabled = true;
        }
    <\/script>
</body>
</html>`;

        const blob = new Blob([finalHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MAP_Reading_${lexile}_${new Date().toLocaleDateString()}.html`;
        a.click();
    }
</script>

</body>
</html>
