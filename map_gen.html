<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ChatGPT MAP 題庫產生器 (修復版)</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 40px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 10px solid #10a37f; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #10a37f; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; text-align: center; color: #666; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>🤖 ChatGPT MAP 題庫產生器</h2>
    <label>OpenAI API Key:</label>
    <input type="password" id="apiKey" value="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">
    
    <label>設定難度 (Lexile):</label>
    <select id="lexile">
        <option value="600L-750L">600L-750L (中階)</option>
        <option value="850L-1000L">850L-1000L (高階)</option>
    </select>

    <button id="genBtn" onclick="startGeneration()">開始 AI 生成題庫</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        btn.disabled = true;
        status.innerText = "⏳ 正在發送請求至 OpenAI...";

        const prompt = "Generate a MAP reading test in JSON format. Level: Lexile " + lexile + ". Output ONLY a JSON array: [{'isPassage':true, 'text':'...'}, {'isPassage':false, 'q':'...', 'options':['A','B','C','D'], 'ans':0}]";

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + key
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini", // 換成 mini 測試連線穩定度
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorDetail = await response.json();
                throw new Error(errorDetail.error.message || "API 請求失敗");
            }

            const data = await response.json();
            const content = data.choices[0].message.content.replace(/```json/g, "").replace(/```/g, "").trim();
            const quizData = JSON.parse(content);
            
            // 下載邏輯（略）
            alert("生成成功！請檢查瀏覽器下載。");
            console.log(quizData);
            
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color:red;'>❌ 錯誤報告：</span>\n" + error.message + 
            "\n\n(提示：若持續出現 Failed to fetch，請嘗試更換網路環境或使用 Chrome 瀏覽器私密模式)";
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
