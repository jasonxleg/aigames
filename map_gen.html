<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro MAP 題庫產生器</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f8fafc; padding: 40px; color: #1e293b; }
        .box { max-width: 600px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 10px solid #8b5cf6; }
        h2 { color: #8b5cf6; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
        input, select, button { width: 100%; padding: 14px; margin-top: 5px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box; font-size: 16px; }
        button { background: #8b5cf6; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #7c3aed; transform: translateY(-1px); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status { margin-top: 25px; text-align: center; color: #64748b; line-height: 1.6; font-size: 0.95em; }
        .footer-note { font-size: 0.8em; color: #94a3b8; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 MAP AI 題庫產生器 (1.5 Pro)</h2>
    
    <div class="input-group">
        <label>Gemini API Key:</label>
        <input type="password" id="apiKey" value="AIzaSyDn_zDS6VQNbeLkOWd5HGcK0oqI2pUxV_I">
    </div>

    <div class="input-group">
        <label>藍思值 (Lexile) 難度:</label>
        <select id="lexile">
            <option value="400L-500L">400L-500L (初階)</option>
            <option value="600L-750L" selected>600L-750L (中階 - 藍思 680 適用)</option>
            <option value="850L-1000L">850L-1000L (高階挑戰)</option>
        </select>
    </div>

    <div class="input-group">
        <label>題目數量:</label>
        <input type="number" id="qCount" value="10" min="1" max="15">
    </div>

    <button id="genBtn" onclick="startGeneration()">生成並下載高品質練習卷</button>
    
    <div id="status">準備就緒。點擊按鈕開始生成。</div>
    <div class="footer-note">提示：GitHub 執行時請確認 Key 未被封鎖。</div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const count = document.getElementById('qCount').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key) return alert("請輸入 API Key！");

        btn.disabled = true;
        status.innerHTML = "<b>⏳ 使用 Gemini 1.5 Pro 思考中...</b><br>此模型分析力較強，約需 20-40 秒。";

        const prompt = `You are a professional educational content creator. 
        Create a MAP Reading test. Target Lexile: ${lexile}. Question Count: ${count}.
        Rules:
        1. Mix high-quality informational texts and fictional passages.
        2. Questions must cover Inference, Main Idea, and Vocabulary in Context.
        3. Output ONLY a valid raw JSON array of objects.
        4. Format: [{"isPassage":true, "text":"HTML_FORMATTED_PASSAGE"}, {"isPassage":false, "q":"QUESTION", "options":["A","B","C","D"], "ans":INDEX_0_TO_3}]`;

        try {
            // 使用 Gemini 1.5 Pro 最穩定的 v1beta 路徑
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        temperature: 0.4 // 降低隨機性，讓題目分級更精準
                    }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error.message || "請求失敗");
            }

            const data = await response.json();
            const rawJson = data.candidates[0].content.parts[0].text;
            const quizData = JSON.parse(rawJson);

            generateDownload(quizData, lexile);
            
            status.innerHTML = "<span style='color:#10b981;'><b>✅ 生成成功！</b></span><br>檔案已自動下載至您的電腦。";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color:#ef4444;'><b>❌ 發生錯誤：</b></span><br>" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function generateDownload(quizData, lexile) {
        const finalHtml = `
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>MAP Practice - ${lexile}</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f1f5f9; line-height: 1.6; }
        .page { max-width: 800px; margin: auto; background: white; padding: 50px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .passage { background: #f8fafc; padding: 25px; border-left: 8px solid #8b5cf6; margin: 25px 0; border-radius: 4px; font-size: 1.1em; }
        .question { margin-bottom: 40px; }
        label { display: block; padding: 15px; border: 2px solid #e2e8f0; margin: 10px 0; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        label:hover { border-color: #8b5cf6; background: #f5f3ff; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #14532d; font-weight: bold; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #7f1d1d; }
        button { width: 100%; padding: 20px; background: #8b5cf6; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="page">
        <h1 style="color:#1e293b; text-align:center;">MAP Reading Practice</h1>
        <p style="text-align:center; color:#64748b;">Difficulty: Lexile ${lexile} | AI Generated by Gemini Pro</p>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin:30px 0;">
        <div id="quiz-area"></div>
        <button id="checkBtn" onclick="reveal()">Submit Answers</button>
        <h2 id="finalScore" style="text-align:center; margin-top:30px;"></h2>
    </div>
    <script>
        const quiz = ${JSON.stringify(quizData)};
        const area = document.getElementById('quiz-area');
        quiz.forEach((item, i) => {
            if(item.isPassage) {
                area.innerHTML += '<div class="passage">' + item.text + '</div>';
            } else {
                let opts = '';
                item.options.forEach((o, j) => {
                    const id = 'q' + i + '_' + j;
                    opts += '<li><input type="radio" name="q'+i+'" id="'+id+'" value="'+j+'" style="display:none;"><label for="'+id+'">' + o + '</label></li>';
                });
                area.innerHTML += '<div class="question"><p><b>' + item.q + '</b></p><ul style="list-style:none; padding:0;">' + opts + '</ul></div>';
            }
        });
        function reveal() {
            let s = 0; let t = 0;
            quiz.forEach((item, i) => {
                if(!item.isPassage) {
                    t++;
                    const sel = document.querySelector('input[name="q'+i+'"]:checked');
                    document.querySelector('label[for="q'+i+'_'+item.ans+'"]').classList.add("correct");
                    if(sel) {
                        if(parseInt(sel.value) === item.ans) s++;
                        else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");
                    }
                    document.querySelectorAll('input[name="q'+i+'"]').forEach(r => r.disabled = true);
                }
            });
            document.getElementById('finalScore').innerText = "Final Score: " + s + " / " + t;
            document.getElementById('checkBtn').disabled = true;
        }
    <\/script>
</body>
</html>`;

        const blob = new Blob([finalHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `MAP_Pro_Exercise.html`;
        a.click();
    }
</script>

</body>
</html>
