<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Gemini MAP 產生器 - V1Beta 穩定版</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 40px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 10px solid #3498db; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; text-align: center; color: #666; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 MAP 題庫自動產生器2</h2>
    <label>Gemini API Key:</label>
    <input type="password" id="apiKey" value="AIzaSyDn_zDS6VQNbeLkOWd5HGcK0oqI2pUxV_I">
    
    <label>設定難度 (Lexile):</label>
    <select id="lexile">
        <option value="600L-750L">600L-750L (中階 - 藍思 680 適用)</option>
        <option value="850L-1000L">850L-1000L (高階挑戰)</option>
    </select>

    <label>題目數量:</label>
    <input type="number" id="qCount" value="5" min="1" max="10">

    <button id="genBtn" onclick="startGeneration()">生成並下載練習卷</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const count = document.getElementById('qCount').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        btn.disabled = true;
        status.innerText = "⏳ 正在透過 v1beta 調用 Gemini 1.5 Flash...";

        // 嚴格規範 AI 輸出的 JSON 結構
        const prompt = "Generate a MAP Reading test in JSON format. Level: Lexile " + lexile + ". Question Count: " + count + ". " +
                       "Strictly follow this JSON structure: " +
                       "[{\"isPassage\":true, \"text\":\"...\"}, {\"isPassage\":false, \"q\":\"...\", \"options\":[\"A\",\"B\",\"C\",\"D\"], \"ans\":0}]. " +
                       "Output ONLY raw JSON code.";

        try {
            // 修正點：切換至 v1beta 並使用 gemini-1.5-flash
            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json" // 強制 JSON 模式
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error.message || "連線失敗");
            }

            const data = await response.json();
            const rawJson = data.candidates[0].content.parts[0].text;
            
            // 解析 AI 回傳的 JSON
            const quizData = JSON.parse(rawJson);
            generateDownload(quizData, lexile);
            
            status.innerHTML = "<span style='color:green;'>✅ 生成成功！檔案已存至下載資料夾。</span>";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color:red;'>❌ 錯誤報告：</span>\n" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function generateDownload(quizData, lexile) {
        // 生成互動練習網頁的模板
        const htmlContent = `
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>MAP Practice - ${lexile}</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f4f7f6; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .passage { background: #eef7ff; padding: 20px; border-left: 6px solid #1a73e8; margin: 20px 0; font-style: italic; }
        .q-block { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        label { display: block; padding: 12px; border: 2px solid #ddd; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #f9f9f9; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MAP 閱讀模擬練習 (${lexile})</h1>
        <div id="quiz"></div>
        <button id="subBtn" onclick="check()">提交答案</button>
        <h2 id="res" style="text-align:center; margin-top:20px;"></h2>
    </div>
    <script>
        const data = ${JSON.stringify(quizData)};
        const container = document.getElementById('quiz');
        
        data.forEach((item, idx) => {
            if(item.isPassage) {
                container.innerHTML += '<div class="passage">' + item.text + '</div>';
            } else {
                let opts = '';
                item.options.forEach((o, i) => {
                    const id = 'q' + idx + '_' + i;
                    opts += '<li><input type="radio" name="q'+idx+'" id="'+id+'" value="'+i+'" style="display:none;"><label for="'+id+'">' + o + '</label></li>';
                });
                container.innerHTML += '<div class="q-block"><p><b>' + item.q + '</b></p><ul style="list-style:none; padding:0;">' + opts + '</ul></div>';
            }
        });

        function check() {
            let score = 0; let total = 0;
            data.forEach((item, idx) => {
                if(!item.isPassage) {
                    total++;
                    const sel = document.querySelector('input[name="q'+idx+'"]:checked');
                    const correctLabel = document.querySelector('label[for="q'+idx+'_'+item.ans+'"]');
                    correctLabel.classList.add("correct");
                    if(sel) {
                        if(parseInt(sel.value) === item.ans) score++;
                        else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");
                    }
                    document.querySelectorAll('input[name="q'+idx+'"]').forEach(r => r.disabled = true);
                }
            });
            document.getElementById('res').innerText = "得分: " + score + " / " + total;
            document.getElementById('subBtn').disabled = true;
        }
    <\/script>
</body>
</html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "MAP_Practice_Test.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
