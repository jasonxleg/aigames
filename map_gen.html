<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT MAP 題庫產生器 - 安全版</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f7f6; padding: 40px; color: #333; }
        .box { max-width: 600px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 10px solid #10a37f; }
        h2 { color: #10a37f; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, select, button { width: 100%; padding: 14px; margin-top: 5px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        input[type="password"] { background: #f0fdf4; border: 1px solid #10a37f; }
        button { background: #10a37f; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #0e8c6d; transform: translateY(-1px); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 25px; text-align: center; color: #666; line-height: 1.6; font-size: 0.95em; white-space: pre-wrap; }
        .hint { font-size: 0.85em; color: #10a37f; margin-top: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🤖 ChatGPT MAP 題庫產生器</h2>
    
    <div class="input-group">
        <label>1. 輸入您的 OpenAI API Key：</label>
        <input type="password" id="apiKey" placeholder="請貼上 sk- 開頭的金鑰">
        <div class="hint">※ 金鑰僅存於您的瀏覽器記憶體中。</div>
    </div>

    <div class="input-group">
        <label>2. 設定難度 (Lexile)：</label>
        <select id="lexile">
            <option value="400L-500L">400L-500L (初階)</option>
            <option value="600L-750L" selected>600L-750L (中階 - 藍思 680 適用)</option>
            <option value="850L-1000L">850L-1000L (高階挑戰)</option>
        </select>
    </div>

    <div class="input-group">
        <label>3. 題目數量：</label>
        <input type="number" id="qCount" value="10" min="1" max="15">
    </div>

    <button id="genBtn" onclick="startGeneration()">開始 AI 生成練習卷</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    // 網頁開啟時，載入上次使用的 Key
    window.onload = function() {
        const savedKey = localStorage.getItem('my_openai_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    };

    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const count = document.getElementById('qCount').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key.startsWith('sk-')) {
            alert("請輸入有效的 OpenAI API Key (以 sk- 開頭)！");
            return;
        }

        // 儲存 Key 到本地
        localStorage.setItem('my_openai_key', key);

        btn.disabled = true;
        status.innerHTML = "<b>⏳ 正在調用 GPT-4o 生成高品質題庫...</b><br>這需要 15-30 秒，請稍候。";

        const prompt = `You are a professional educational content creator for MAP Test. 
        Generate a reading practice test in a JSON array format.
        Difficulty: Lexile ${lexile}.
        Question Count: ${count}.
        Requirements:
        1. Include informational texts and literary passages.
        2. Questions must focus on: Vocabulary in Context, Main Idea, and Inference.
        3. Output MUST be ONLY a raw JSON array.
        Structure: [{"isPassage": true, "text": "html_string"}, {"isPassage": false, "q": "question", "options": ["A", "B", "C", "D"], "ans": 0}].`;

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{ role: "user", content: prompt }],
                    response_format: { type: "json_object" },
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || "連線失敗");
            }

            const data = await response.json();
            let content = data.choices[0].message.content;
            
            // 解析回傳資料，確保它是陣列
            let quizData = JSON.parse(content);
            if (!Array.isArray(quizData)) {
                quizData = quizData.questions || Object.values(quizData)[0];
            }

            downloadHtml(quizData, lexile);
            status.innerHTML = "<span style='color:#10a37f;'><b>✅ 生成成功！</b></span><br>檔案已儲存。";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color:#e74c3c;'><b>❌ 出錯了：</b></span>\n" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function downloadHtml(quizData, lexile) {
        // 下載練習卷的 HTML 模板
        const finalHtml = `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>MAP Practice - ChatGPT</title><style>body{font-family:sans-serif;padding:40px;background:#f9f9f9;line-height:1.6;} .container{max-width:800px;margin:auto;background:white;padding:40px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);} .passage{background:#f0fdf4;padding:25px;border-left:8px solid #10a37f;margin:25px 0;border-radius:5px;font-style:italic;} label{display:block;padding:15px;border:2px solid #ddd;margin:10px 0;border-radius:10px;cursor:pointer;transition:0.2s;} label:hover{border-color:#10a37f;background:#f0fdf4;} .correct{background:#dcfce7 !important;border-color:#22c55e !important;color:#14532d;font-weight:bold;} .wrong{background:#fee2e2 !important;border-color:#ef4444 !important;color:#7f1d1d;} button{width:100%;padding:20px;background:#10a37f;color:white;border:none;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;}</style></head><body><div class="container"><h1>MAP Reading Practice</h1><p style="text-align:center;color:#666;">Difficulty: Lexile ${lexile} | Generated by GPT-4o</p><div id="quiz"></div><button id="subBtn" onclick="check()">Submit</button><h2 id="res" style="text-align:center;margin-top:25px;"></h2></div><script>const data = \${JSON.stringify(quizData)};const container = document.getElementById('quiz');data.forEach((item, idx) => {if(item.isPassage){container.innerHTML += '<div class="passage">' + item.text + '</div>';}else{let opts = '';item.options.forEach((o, i) => {const id = 'q' + idx + '_' + i;opts += '<li><input type="radio" name="q'+idx+'" id="'+id+'" value="'+i+'" style="display:none;"><label for="'+id+'">' + o + '</label></li>';});container.innerHTML += '<div style="margin-bottom:35px;"><p><b>' + item.q + '</b></p><ul style="list-style:none;padding:0;">' + opts + '</ul></div>';}});function check(){let score = 0;let total = 0;data.forEach((item, idx) => {if(!item.isPassage){total++;const sel = document.querySelector('input[name="q'+idx+'"]:checked');document.querySelector('label[for="q'+idx+'_'+item.ans+'"]').classList.add("correct");if(sel){if(parseInt(sel.value) === item.ans) score++;else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");}document.querySelectorAll('input[name="q'+idx+'"]').forEach(r => r.disabled = true);}});document.getElementById('res').innerText = "Score: " + score + " / " + total; document.getElementById('subBtn').disabled = true;}<\/script></body></html>`;
        const blob = new Blob([finalHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "MAP_ChatGPT_Practice.html";
        a.click();
    }
</script>

</body>
</html>
