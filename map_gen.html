<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Gemini MAP 產生器 - 偵錯加強版</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 40px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 10px solid #2ecc71; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #2ecc71; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; text-align: center; color: #666; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 MAP 題庫產生器 (Debug Mode)</h2>
    <label>API Key:</label>
    <input type="password" id="apiKey" value="AIzaSyDn_zDS6VQNbeLkOWd5HGcK0oqI2pUxV_I">
    
    <label>難度:</label>
    <select id="lexile">
        <option value="600L-750L">600L-750L (中階)</option>
        <option value="850L-1000L">850L-1000L (高階)</option>
    </select>

    <button id="genBtn" onclick="startGeneration()">開始 AI 生成</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        btn.disabled = true;
        status.innerText = "⏳ 正在發送請求...";

        const prompt = "Generate a 5-question MAP test in JSON. Level: Lexile " + lexile + ". Output ONLY raw JSON array: [{'isPassage':true, 'text':'...'}, {'isPassage':false, 'q':'...', 'options':['A','B','C','D'], 'ans':0}]";

        try {
            const url = "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=" + key;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error("API 錯誤: " + data.error.message);
            }

            if (!data.candidates || !data.candidates[0]) {
                throw new Error("AI 沒有回傳內容，請檢查 API Key 是否有效。");
            }

            let rawJson = data.candidates[0].content.parts[0].text;
            // 清理 Markdown 符號
            rawJson = rawJson.replace(/```json/g, "").replace(/```/g, "").trim();
            
            const quizData = JSON.parse(rawJson);
            generateDownload(quizData, lexile);
            
            status.innerText = "✅ 生成成功！檔案已下載。";
        } catch (error) {
            console.error(error);
            status.innerText = "❌ 錯誤訊息:\n" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function generateDownload(quizData, lexile) {
        // 使用更簡單的模板避免轉義出錯
        const content = `
        <!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>MAP Practice</title></head>
        <body style="font-family:sans-serif; padding:40px; background:#f4f7f6;">
            <div style="max-width:800px; margin:auto; background:white; padding:40px; border-radius:15px;">
                <h1>MAP Reading (${lexile})</h1>
                <div id="quiz"></div>
                <button onclick="check()" style="width:100%; padding:15px; background:#2ecc71; color:white; border:none; border-radius:10px; font-size:20px; cursor:pointer;">提交</button>
            </div>
            <script>
                const data = ${JSON.stringify(quizData)};
                const container = document.getElementById('quiz');
                data.forEach((item, idx) => {
                    if(item.isPassage) {
                        container.innerHTML += '<div style="background:#eef7ff; padding:20px; border-left:8px solid #1a73e8; margin:20px 0;">' + item.text + '</div>';
                    } else {
                        let opts = '';
                        item.options.forEach((o, i) => {
                            opts += '<li><label><input type="radio" name="q'+idx+'" value="'+i+'"> ' + o + '</label></li>';
                        });
                        container.innerHTML += '<div style="margin-bottom:30px;"><p><b>' + item.q + '</b></p><ul style="list-style:none; padding:0;">' + opts + '</ul></div>';
                    }
                });
                function check() {
                    let score = 0;
                    data.forEach((item, idx) => {
                        if(!item.isPassage) {
                            const sel = document.querySelector('input[name="q'+idx+'"]:checked');
                            if(sel && parseInt(sel.value) === item.ans) score++;
                        }
                    });
                    alert("你的得分: " + score);
                }
            <\/script>
        </body>
        </html>`;

        const blob = new Blob([content], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "MAP_Test.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
