<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Gemini AI - MAP 題庫自動產生器 (Pro 修正版)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 40px; color: #333; }
        .box { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid #1a73e8; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; text-align: center; font-size: 0.95em; color: #666; min-height: 24px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 Gemini MAP 題庫產生器 (Pro 版)</h2>
    
    <div class="input-group">
        <label>1. Gemini API Key：</label>
        <input type="password" id="apiKey" value="AIzaSyDn_zDS6VQNbeLkOWd5HGcK0oqI2pUxV_I">
    </div>

    <div class="input-group">
        <label>2. 設定難度 (Lexile)：</label>
        <select id="lexile">
            <option value="400L-500L">400L-500L (初階)</option>
            <option value="600L-750L" selected>600L-750L (中階)</option>
            <option value="850L-1000L">850L-1000L (高階)</option>
        </select>
    </div>

    <div class="input-group">
        <label>3. 題目數量：</label>
        <input type="number" id="qCount" value="10" min="1" max="15">
        <div style="font-size: 0.8em; color: #e67e22;">※ Pro 模型生成速度較慢但品質更高，建議一次不超過 15 題。</div>
    </div>

    <button id="genBtn" onclick="startGeneration()">開始 AI 生成並下載練習卷</button>
    <div id="status"></div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value;
        const lexile = document.getElementById('lexile').value;
        const count = document.getElementById('qCount').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key) return alert("請輸入有效的 API Key");

        btn.disabled = true;
        status.innerHTML = "<b>⏳ 正在使用 Gemini-1.5-Pro 生成高品質題庫...</b><br>Pro 版思考較深，約需 20-30 秒，請稍候。";

        const prompt = `Generate a MAP Reading practice test. Level: Lexile ${lexile}. Question Count: ${count}. 
        Format requirements:
        1. Mix informational and literary passages.
        2. Focus on: Vocabulary in Context, Main Idea, and Inference.
        3. Output MUST be ONLY a raw JSON array of objects.
        4. Objects should be either:
           - {isPassage:true, text:"HTML_CONTENT"}
           - {isPassage:false, q:"QUESTION_TEXT", options:["A","B","C","D"], ans:0_TO_3_INDEX}`;

        try {
            // 切換至 v1beta 並使用 gemini-1.5-pro
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.7,
                        topK: 1,
                        topP: 1,
                        maxOutputTokens: 4096,
                    }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            let rawJson = data.candidates[0].content.parts[0].text;
            // 清理 AI 輸出的 Markdown 代碼塊
            rawJson = rawJson.replace(/```json/g, '').replace(/```/g, '').trim();
            
            const quizData = JSON.parse(rawJson);

            downloadHtml(quizData, lexile);
            status.innerHTML = "<span style='color: #27ae60;'><b>✨ Pro 級題庫生成完成！</b> 檔案已下載。</span>";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color: #c0392b;'><b>❌ 出錯了：</b><br>" + error.message + "</span>";
        } finally {
            btn.disabled = false;
        }
    }

    function downloadHtml(quizData, lexile) {
        // (保持與之前相同的 HTML 模板)
        const finalHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MAP Practice Pro</title><style>body{font-family:sans-serif;padding:20px;background:#f4f7f6;} .card{max-width:800px;margin:auto;background:white;padding:40px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);} .passage{background:#eef7ff;padding:20px;border-left:6px solid #1a73e8;margin:20px 0;font-style:italic;} label{display:block;padding:12px;border:2px solid #ddd;margin:8px 0;border-radius:8px;cursor:pointer;} .correct{background:#d4edda!important;color:#155724;font-weight:bold;} .wrong{background:#f8d7da!important;color:#721c24;} button{width:100%;padding:15px;background:#28a745;color:white;border:none;border-radius:8px;font-size:18px;cursor:pointer;}</style></head><body><div class="card"><h1>MAP Reading (${lexile}) - AI Pro</h1><div id="content"></div><button id="subBtn" onclick="check()">Submit</button><h2 id="res" style="text-align:center;"></h2></div><script>const data = \${JSON.stringify(quizData)};const container = document.getElementById('content');data.forEach((item, idx) => {if(item.isPassage){container.innerHTML += '<div class="passage">' + item.text + '</div>';}else{let opts = '';item.options.forEach((o, i) => {const id = 'q' + idx + '_' + i;opts += '<li><input type="radio" name="q'+idx+'" id="'+id+'" value="'+i+'"><label for="'+id+'">' + o + '</label></li>';});container.innerHTML += '<div class="q-block"><p><b>' + item.q + '</b></p><ul style="list-style:none;padding:0;">' + opts + '</ul></div>';}});function check(){let score = 0;let total = 0;data.forEach((item, idx) => {if(!item.isPassage){total++;const sel = document.querySelector('input[name="q'+idx+'"]:checked');const correctLabel = document.querySelector('label[for="q'+idx+'_'+item.ans+'"]');correctLabel.classList.add("correct");if(sel){if(parseInt(sel.value) === item.ans) score++;else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");}document.querySelectorAll('input[name="q'+idx+'"]').forEach(r => r.disabled = true);}});document.getElementById('res').innerText = "Score: " + score + " / " + total;document.getElementById('subBtn').disabled = true;}<\/script></body></html>`;
        const blob = new Blob([finalHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MAP_Pro_Practice_${lexile}.html`;
        a.click();
    }
</script>

</body>
</html>
