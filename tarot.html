<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarot for Kids — 兒童塔羅中文說明 + 抽牌模擬器</title>
<style>
  :root{
    --bg:#160f2e; --bg2:#241a45; --panel:#2c2054; --panel2:#372a66;
    --line:#4a3b82; --txt:#f3efff; --dim:#b6a9e0; --gold:#ffd166;
    --pink:#ff8fd1; --ok:#7ee787; --blue:#7fd4ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0 0 60px;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1000px 600px at 15% -10%, #3b2a7a 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 0%, #5b2d6e 0%, transparent 55%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed; min-height:100vh;
  }
  header{padding:20px 16px 6px; text-align:center}
  h1{margin:0; font-size:clamp(21px,5vw,31px); letter-spacing:1px}
  .sub{color:var(--dim); font-size:13.5px; margin-top:6px; line-height:1.6}
  .wrap{max-width:1080px; margin:0 auto; padding:0 14px}

  /* 分頁 */
  .tabs{display:flex; gap:8px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap}
  .tab{background:var(--panel); border:2px solid var(--line); color:var(--txt); font-family:inherit;
    border-radius:14px; padding:10px 20px; font-size:15.5px; cursor:pointer; font-weight:700; transition:.15s}
  .tab:hover{background:var(--panel2)}
  .tab.on{background:linear-gradient(135deg,#ffd166,#ff9f6b); color:#2b1d00; border-color:#ffd166}
  .page{display:none} .page.on{display:block}

  /* 搜尋列 */
  .searchbar{position:sticky; top:0; z-index:30; padding:10px 0 8px;
    background:linear-gradient(180deg, rgba(22,15,46,.96) 70%, rgba(22,15,46,0));}
  .sbox{display:flex; gap:8px; align-items:center; background:var(--panel);
    border:2px solid var(--line); border-radius:16px; padding:6px 10px; box-shadow:0 6px 24px #0006}
  .sbox:focus-within{border-color:var(--gold); box-shadow:0 0 0 3px #ffd16633,0 6px 24px #0006}
  #q{flex:1; background:transparent; border:0; outline:0; color:var(--txt);
    font-size:18px; padding:10px 4px; font-family:inherit}
  #q::placeholder{color:#8d7fbb}
  .sicon{font-size:20px}
  .clear{background:#0003;border:0;color:var(--dim);font-size:18px;cursor:pointer;
    border-radius:50%; width:30px; height:30px; line-height:1}
  .clear:hover{color:#fff;background:#0006}

  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:999px; padding:6px 12px; font-size:13.5px; cursor:pointer; font-family:inherit; transition:.15s}
  .chip:hover{background:var(--panel2); transform:translateY(-1px)}
  .chip.on{background:var(--gold); color:#2b1d00; border-color:var(--gold); font-weight:700}

  .count{color:var(--dim); font-size:13px; margin:12px 2px 8px}
  .count b{color:var(--gold)}

  .grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line); border-radius:16px; padding:13px 14px; cursor:pointer;
    text-align:left; color:inherit; font-family:inherit; transition:.15s; position:relative; overflow:hidden}
  .card:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 10px 24px #0007}
  .card .top{display:flex; align-items:center; gap:10px}
  .card .ico{font-size:30px; line-height:1}
  .card .nm{font-size:17px; font-weight:700}
  .card .en{font-size:12px; color:var(--dim); letter-spacing:.4px}
  .card .ex{font-size:13.5px; color:#ddd4ff; line-height:1.65; margin-top:9px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .tagline{position:absolute; top:0; left:0; width:5px; height:100%}
  .empty{text-align:center; color:var(--dim); padding:40px 10px; line-height:2}
  mark{background:#ffd16655; color:#fff3c4; border-radius:4px; padding:0 2px}

  /* 詳細視窗 */
  .mask{position:fixed; inset:0; background:#0b0718cc; backdrop-filter:blur(3px);
    display:none; z-index:50; padding:16px; overflow:auto}
  .mask.on{display:block}
  .modal{max-width:640px; margin:24px auto; background:linear-gradient(170deg,#2e2159,#1d1440);
    border:2px solid var(--line); border-radius:22px; padding:20px 20px 24px; box-shadow:0 20px 60px #000a}
  .mhead{display:flex; align-items:center; gap:14px}
  .mhead .ico{font-size:46px}
  .mhead .nm{font-size:24px; font-weight:800}
  .mhead .en{color:var(--dim); font-size:13px}
  .badge{display:inline-block; font-size:11.5px; padding:3px 9px; border-radius:999px;
    background:#0004; border:1px solid var(--line); color:var(--dim); margin-top:5px}
  .x{margin-left:auto; background:#0004; border:1px solid var(--line); color:var(--txt);
    width:36px; height:36px; border-radius:50%; font-size:19px; cursor:pointer; flex:none}
  .sec{margin-top:16px; background:#00000026; border-radius:14px; padding:12px 14px; border-left:4px solid var(--line)}
  .sec h3{margin:0 0 6px; font-size:14.5px; letter-spacing:.5px}
  .sec p{margin:0; font-size:15px; line-height:1.85; color:#ece6ff}
  .sec.up{border-left-color:var(--ok)}    .sec.up h3{color:var(--ok)}
  .sec.rev{border-left-color:var(--pink)} .sec.rev h3{color:var(--pink)}
  .sec.story{border-left-color:var(--blue)} .sec.story h3{color:var(--blue)}
  .sec.tip{border-left-color:var(--gold)} .sec.tip h3{color:var(--gold)}
  .kwbox{margin-top:14px; display:flex; flex-wrap:wrap; gap:6px}
  .kw{background:#ffffff12; border:1px solid var(--line); border-radius:8px;
    padding:4px 9px; font-size:12.5px; color:var(--dim); cursor:pointer}
  .kw:hover{color:var(--gold); border-color:var(--gold)}
  .kwt{width:100%; font-size:12px; color:#8d7fbb; margin-bottom:2px}
  .nav{display:flex; gap:8px; margin-top:18px}
  .nav button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:11px; font-size:14px; cursor:pointer; font-family:inherit}
  .nav button:hover{background:var(--panel2); border-color:var(--gold)}

  /* ===== 模擬器 ===== */
  .simbox{background:#ffffff08; border:2px solid var(--line); border-radius:20px; padding:16px; margin-top:14px}
  .step{font-size:13px; color:var(--gold); letter-spacing:1.5px; margin-bottom:8px}
  .spreads{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .spread{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px;
    cursor:pointer; text-align:left; color:inherit; font-family:inherit; transition:.15s}
  .spread:hover{border-color:var(--gold); transform:translateY(-2px)}
  .spread.on{border-color:var(--gold); background:linear-gradient(150deg,#4a3a1f,#372a66)}
  .spread .t{font-size:15.5px; font-weight:700}
  .spread .d{font-size:12.5px; color:var(--dim); margin-top:4px; line-height:1.6}
  .qwrap{margin-top:12px}
  .qwrap label{font-size:13px; color:var(--dim)}
  #question{width:100%; margin-top:6px; background:var(--panel); border:2px solid var(--line);
    border-radius:12px; color:var(--txt); font-size:15px; padding:10px 12px; font-family:inherit; outline:0}
  #question:focus{border-color:var(--gold)}
  .bigbtn{width:100%; margin-top:12px; background:linear-gradient(135deg,#a06bff,#ff8fd1);
    border:0; color:#fff; font-weight:800; font-size:17px; padding:14px; border-radius:14px;
    cursor:pointer; font-family:inherit; letter-spacing:1px; box-shadow:0 8px 20px #0006}
  .bigbtn:hover{filter:brightness(1.1)}
  .bigbtn.ghost{background:var(--panel); border:1px solid var(--line); color:var(--txt); font-size:15px; box-shadow:none}

  .deck{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:14px}
  .back{width:52px; height:78px; border-radius:8px; cursor:pointer; border:1px solid #6a55b8;
    background:repeating-linear-gradient(45deg,#3b2a7a 0 6px,#503aa0 6px 12px);
    box-shadow:0 3px 8px #0006; transition:.15s; position:relative}
  .back:hover{transform:translateY(-6px); border-color:var(--gold)}
  .back::after{content:'✦'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#ffd16688; font-size:17px}
  .back.picked{transform:translateY(-10px); border-color:var(--gold); box-shadow:0 0 14px #ffd16688}
  .back.dim{opacity:.35; pointer-events:none}
  .shuffling .back{animation:sh .5s ease-in-out infinite}
  @keyframes sh{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-4deg)}75%{transform:translateY(4px) rotate(4deg)}}

  .picknote{text-align:center; color:var(--dim); font-size:14px; margin-top:12px; line-height:1.8}
  .picknote b{color:var(--gold); font-size:17px}

  .reading{margin-top:14px}
  .rcard{background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:16px; padding:14px 15px; margin-bottom:12px; position:relative; overflow:hidden;
    animation:flip .45s ease both}
  @keyframes flip{from{opacity:0; transform:rotateY(70deg) translateY(10px)}to{opacity:1; transform:none}}
  .rcard .pos{font-size:12px; color:var(--gold); letter-spacing:1px}
  .rcard .head{display:flex; align-items:center; gap:12px; margin-top:6px}
  .rcard .ico{font-size:38px}
  .rcard .nm{font-size:19px; font-weight:800}
  .rcard .en{font-size:12px; color:var(--dim)}
  .rcard .dir{display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:999px; margin-top:4px}
  .dir.u{background:#7ee78722; color:var(--ok); border:1px solid #7ee78755}
  .dir.r{background:#ff8fd122; color:var(--pink); border:1px solid #ff8fd155}
  .rcard .body{font-size:14.5px; line-height:1.85; color:#ece6ff; margin-top:10px}
  .rcard .tip{font-size:13.5px; color:var(--gold); margin-top:8px; line-height:1.75}
  .rcard .more{margin-top:9px; background:#0003; border:1px solid var(--line); color:var(--dim);
    border-radius:9px; padding:5px 10px; font-size:12.5px; cursor:pointer; font-family:inherit}
  .rcard .more:hover{color:var(--gold); border-color:var(--gold)}
  .summary{background:#00000030; border:2px dashed var(--gold); border-radius:16px; padding:14px 16px; margin-top:6px}
  .summary h3{margin:0 0 8px; font-size:16px; color:var(--gold)}
  .summary p{margin:0 0 8px; font-size:14.5px; line-height:1.9; color:#ece6ff}
  .btnrow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .btnrow button{flex:1; min-width:130px}
  /* ===== 牌組結構頁 ===== */
  .arcana{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .arc{background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:16px; padding:15px 16px; position:relative; overflow:hidden}
  .arc .ico{font-size:34px}
  .arc .t{font-size:18px; font-weight:800; margin-top:4px}
  .arc .c{font-size:12.5px; color:var(--gold); letter-spacing:1px; margin-top:2px}
  .arc .line{font-size:14px; line-height:1.85; color:#ece6ff; margin-top:9px}
  .arc .ex{font-size:13px; color:var(--dim); margin-top:7px}
  .arc .kid{font-size:13.5px; line-height:1.8; color:#fff3c4; background:#ffd16614;
    border-left:3px solid var(--gold); border-radius:0 10px 10px 0; padding:8px 11px; margin-top:11px}
  .arc .go{margin-top:11px; background:#0003; border:1px solid var(--line); color:var(--dim);
    border-radius:9px; padding:6px 11px; font-size:12.5px; cursor:pointer; font-family:inherit}
  .arc .go:hover{color:var(--gold); border-color:var(--gold)}
  .howto{margin:14px 0 0; font-size:14.5px; line-height:1.9; color:#ece6ff;
    background:#00000030; border:2px dashed var(--line); border-radius:14px; padding:12px 14px}
  .elhint{font-size:13.5px; color:var(--dim); line-height:1.8; margin:0 0 12px}
  .eltable{display:grid; gap:11px}
  .elrow{display:grid; gap:10px; grid-template-columns:150px 1fr; align-items:start;
    background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; cursor:pointer; text-align:left; color:inherit;
    font-family:inherit; transition:.15s; position:relative; overflow:hidden}
  .elrow:hover{border-color:var(--gold); transform:translateY(-2px)}
  .elrow .nmwrap .n{font-size:16px; font-weight:800}
  .elrow .nmwrap .e{font-size:13px; color:var(--gold); margin-top:3px}
  .elrow .sc{font-size:14px; color:#ece6ff; line-height:1.8}
  .elrow .kid{font-size:13px; color:var(--dim); line-height:1.75; margin-top:6px}
  @media(max-width:560px){ .elrow{grid-template-columns:1fr} }
  footer{text-align:center; color:#7c6cae; font-size:12px; margin-top:34px; line-height:1.9}
  @media(max-width:520px){ .grid{grid-template-columns:1fr} .modal{margin:8px auto; padding:16px}
    .back{width:42px; height:63px} }
</style>
</head>
<body>
<header>
  <h1>🔮 Tarot for Kids</h1>
  <div class="sub">兒童塔羅 78 張牌 · 中文說明查詢 + 抽牌模擬器</div>
  <div class="tabs">
    <button class="tab on" id="tabSearch">📖 關鍵字查說明</button>
    <button class="tab" id="tabSim">🎴 抽牌模擬器</button>
    <button class="tab" id="tabGuide">📘 牌組結構</button>
  </div>
</header>

<div class="wrap">

  <!-- ============ 頁面一：查詢 ============ -->
  <div class="page on" id="pageSearch">
    <div class="searchbar">
      <div class="sbox">
        <span class="sicon">🔍</span>
        <input id="q" type="search" autocomplete="off"
               placeholder="輸入關鍵字：勇氣、朋友、考試、courage、money、The Fool">
        <button class="clear" id="clr" title="清除">✕</button>
      </div>
      <div class="chips" id="topics"></div>
      <div class="chips" id="suits"></div>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ============ 頁面二：模擬器 ============ -->
  <div class="page" id="pageSim">
    <div class="simbox" id="simSetup">
      <div class="step">STEP 1 · 選一種抽牌方式</div>
      <div class="spreads" id="spreads"></div>
      <div class="qwrap">
        <label for="question">STEP 2 · 你想問什麼？（可以不填，自己心裡想也行）</label>
        <input id="question" type="text" placeholder="例如：我要怎麼跟好朋友和好？">
      </div>
      <button class="bigbtn" id="shuffleBtn">🔀 洗牌，開始抽牌</button>
    </div>

    <div class="simbox" id="simPick" style="display:none">
      <div class="step" id="pickStep">STEP 3 · 洗牌中…</div>
      <div class="picknote" id="pickNote">心裡想著你的問題，慢慢深呼吸 🌬️</div>
      <div class="deck" id="deck"></div>
      <div class="btnrow"><button class="bigbtn ghost" id="cancelPick">← 重新選牌陣</button></div>
    </div>

    <div class="simbox" id="simResult" style="display:none">
      <div class="step" id="resultStep">你的牌</div>
      <div class="summary" id="summary"></div>
      <div class="reading" id="reading"></div>
      <div class="btnrow">
        <button class="bigbtn" id="again">🔄 再抽一次</button>
        <button class="bigbtn ghost" id="copy">📋 複製這次的結果</button>
      </div>
    </div>
  </div>

  <!-- ============ 頁面三：牌組結構 ============ -->
  <div class="page" id="pageGuide">
    <div class="simbox">
      <div class="step">78 張牌是怎麼分的？</div>
      <div class="arcana" id="arcana"></div>
      <p class="howto" id="howto"></p>
    </div>
    <div class="simbox">
      <div class="step">小牌的四大元素架構</div>
      <p class="elhint">小阿爾克那 56 張分成四個花色，各自對應一種自然元素，剛好對應到生活的四個層面。點一張可以直接看那個花色的 14 張牌。</p>
      <div class="eltable" id="eltable"></div>
    </div>
  </div>

  <footer>
    共 78 張牌 · 大牌 22 + 火焰棒 / 心情杯 / 想法劍 / 金幣 各 14<br>
    塔羅在這裡是「聊心情的圖卡」，不是預言，也不會決定你的未來。答案永遠在你自己手上 ✨
  </footer>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
/* ==== cards.js（由 build-single.js 內嵌）==== */
/* Tarot for Kids — 78 張塔羅牌的兒童版中文說明資料
 * 欄位：id 編號 / name 中文 / en 英文 / suit 牌組 / emoji 圖示
 *       kw 關鍵字(搜尋用) / up 正位 / rev 逆位 / story 生活小故事 / tip 給你的小提醒
 * 說明都用國小中年級看得懂的話寫，沒有算命恐嚇，只講「這張牌想提醒你什麼」。
 */
const SUITS = {
  major: { name: '大牌（人生大事牌）', color: '#a06bff', el:'—', elEmoji:'🌌',
           scope:'人生重大轉折、靈魂課題、強大的精神力量',
           desc: '22 張，講的是比較大的心情和轉變，像是「開始」「改變」「完成」。' },
  wands: { name: '火焰棒（權杖）', color: '#ff7a45', el:'火元素', elEmoji:'🔥',
           scope:'行動力、工作、熱情、挑戰與旅行',
           desc: '14 張，講的是熱情、點子、想做的事。像心裡有一團火。' },
  cups:  { name: '心情杯（聖杯）', color: '#3fa9f5', el:'水元素', elEmoji:'💧',
           scope:'情感、人際關係、直覺與心理狀態',
           desc: '14 張，講的是感情、朋友、開心和難過。像一杯水裝著心情。' },
  swords:{ name: '想法劍（寶劍）', color: '#8fa3b8', el:'風元素', elEmoji:'🌬️',
           scope:'思考、邏輯、衝突、傷害與決策',
           desc: '14 張，講的是想法、說話、煩惱和誠實。像腦袋裡的聲音。' },
  coins: { name: '金幣（錢幣）', color: '#2ec27e', el:'土元素', elEmoji:'⛰️',
           scope:'金錢、物質、健康、穩定與現實結果',
           desc: '14 張，講的是身體、金錢、東西和努力。像看得到摸得到的東西。' }
};

/* ===== 牌組結構：大牌 vs 小牌的核心差異 + 小牌的四大元素架構 =====
 * 每一段都給兩種說法：sym/use 是正式的牌義結構；kid 是講給小朋友聽的白話版。
 */
const STRUCTURE = {
  major: {
    title: '大阿爾克那 Major Arcana',
    count: '共 22 張',
    emoji: '🌌',
    sym : '象徵：人生重大轉折、靈魂課題、不可抗拒的命運或強大的精神力量。',
    use : '作用：指出事件的「核心本質」與長遠影響。',
    ex  : '例如：命運之輪、死神、愚者。',
    kid : '白話版：這是「大事牌」。它不管今天午餐吃什麼，它講的是你正在長大的那一段——像轉學、畢業、和好朋友分開、第一次自己做決定。'
  },
  minor: {
    title: '小阿爾克那 Minor Arcana',
    count: '共 56 張',
    emoji: '🎴',
    sym : '象徵：日常生活的具體事件、情緒起伏、具體行動與人際關係。',
    use : '作用：補充事件的細節、時間點與人物特質。',
    ex  : '四個花色 × 14 張（一到十 + 小學徒、騎士、皇后、國王）。',
    kid : '白話版：這是「日常牌」。它會告訴你細節：是誰、什麼時候、你可以做什麼。大牌說「你在改變」，小牌說「那今天先做這件事」。'
  },

<script>
(function(){
  const $ = id => document.getElementById(id);
  const grid=$('grid'), qEl=$('q'), countEl=$('count'), maskEl=$('mask'), modalEl=$('modal');
  let suitFilter='all', view=[];

  /* ================= 搜尋核心 ================= */
  const norm = s => (s||'').toLowerCase();
  function tokens(q){
    q = (q||'').trim();
    if(!q) return [];
    let parts = q.split(/[\s,、，]+/).filter(Boolean).map(norm);
    const kept = parts.filter(t => !STOPWORDS.has(t));      // 去掉 the / of 之類的虛詞
    return kept.length ? kept : parts;
  }
  function score(c, toks){
    if(!toks.length) return 1;
    let s=0;
    const nm=norm(c.name+' '+c.en+' '+c.id), kw=norm(c.kw+' '+c.ekw),
          body=norm([c.up,c.rev,c.story,c.tip].join(' ')), suit=norm(SUITS[c.suit].name);
    const hit = (t,w)=>{
      if(!t) return 0;
      if(nm.includes(t))   return 10*w;
      if(kw.includes(t))   return 5*w;
      if(suit.includes(t)) return 3*w;
      if(body.includes(t)) return 1*w;
      return 0;
    };
    for(const t of toks){
      let best = hit(t,1);
      if(!best){                                            // 直接找不到 → 用同義詞再找一次（半分）
        for(const syn of (SYN[t]||[])){
          best = Math.max(best, hit(norm(syn),0.5));
          if(best>=5) break;
        }
      }
      s += best;
    }
    return s;
  }
  function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function hl(text, toks){
    let out = esc(text);
    for(const t of toks){
      if(!t) continue;
      const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
      out = out.replace(re, m=>'<mark>'+m+'</mark>');
    }
    return out;
  }

  function render(){
    const toks = tokens(qEl.value);
    let list = CARDS.filter(c => suitFilter==='all' || c.suit===suitFilter);
    if(toks.length){
      list = list.map(c=>({c, s:score(c,toks)})).filter(o=>o.s>0)
                 .sort((a,b)=>b.s-a.s).map(o=>o.c);
    }
    view = list;
    countEl.innerHTML = toks.length
      ? '找到 <b>'+list.length+'</b> 張跟「'+esc(qEl.value.trim())+'」有關的牌（越前面越貼近）'
      : (suitFilter==='all' ? '全部 <b>78</b> 張牌 — 直接點一張，或在上面輸入關鍵字'
                            : SUITS[suitFilter].name + ' · <b>' + SUITS[suitFilter].elEmoji + ' '
                              + SUITS[suitFilter].el + '</b> — ' + SUITS[suitFilter].scope
                              + '<br>' + SUITS[suitFilter].desc);
    if(!list.length){
      grid.innerHTML = '<div class="empty">找不到耶 😅<br>換個說法試試：心情／朋友／勇氣／考試／累／開心<br>'
        + 'Or try English: courage, friends, money, tired, hope</div>';
      return;
    }
    grid.innerHTML = list.map((c,i)=>`
      <button class="card" data-i="${i}">
        <span class="tagline" style="background:${SUITS[c.suit].color}"></span>
        <span class="top">
          <span class="ico">${c.emoji}</span>
          <span><div class="nm">${hl(c.name,toks)}</div><div class="en">${hl(c.en,toks)}</div></span>
        </span>
        <div class="ex">${hl(c.up,toks)}</div>
      </button>`).join('');
  }

  /* ================= 牌義視窗 ================= */
  function open(card){
    const toks = tokens(qEl.value);
    const kws = (card.kw+' '+card.ekw).split(/\s+/).filter(Boolean);
    const idx = view.indexOf(card);
    modalEl.innerHTML = `
      <div class="mhead">
        <div class="ico">${card.emoji}</div>
        <div>
          <div class="nm">${card.name}</div>
          <div class="en">${card.en}</div>
          <div class="badge" style="border-color:${SUITS[card.suit].color}">${SUITS[card.suit].name}${
            card.suit==='major' ? ' · 人生大事' : ' · '+SUITS[card.suit].elEmoji+' '+SUITS[card.suit].el}</div>
        </div>
        <button class="x" id="xbtn">✕</button>
      </div>
      <div class="sec up"><h3>🌞 正位（牌是正的）</h3><p>${hl(card.up,toks)}</p></div>
      <div class="sec rev"><h3>🌙 逆位（牌是倒過來的）</h3><p>${hl(card.rev,toks)}</p></div>
      <div class="sec story"><h3>🏫 生活小故事</h3><p>${hl(card.story,toks)}</p></div>
      <div class="sec tip"><h3>💛 給你的小提醒</h3><p>${hl(card.tip,toks)}</p></div>
      <div class="kwbox"><div class="kwt">關鍵字（點一下可以再搜尋 · click to search）</div>
        ${kws.map(k=>`<span class="kw" data-k="${esc(k)}">${esc(k)}</span>`).join('')}
      </div>
      <div class="nav">
        <button id="prev" ${idx<=0?'disabled style=opacity:.35':''}>← 上一張</button>
        <button id="next" ${idx<0||idx>=view.length-1?'disabled style=opacity:.35':''}>下一張 →</button>
      </div>`;
    maskEl.classList.add('on'); maskEl.scrollTop = 0;
    $('xbtn').onclick = close;
    modalEl.querySelectorAll('.kw').forEach(e=>{
      e.onclick = ()=>{ showPage('search'); qEl.value = e.dataset.k; suitFilter='all';
                        paintSuits(); render(); close(); window.scrollTo({top:0,behavior:'smooth'}); };
    });
    const p=$('prev'), n=$('next');
    if(p && idx>0) p.onclick = ()=>open(view[idx-1]);
    if(n && idx>=0 && idx<view.length-1) n.onclick = ()=>open(view[idx+1]);
  }
  function close(){ maskEl.classList.remove('on'); }
  maskEl.addEventListener('click', e=>{ if(e.target===maskEl) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  grid.addEventListener('click', e=>{
    const b = e.target.closest('.card'); if(!b) return;
    open(view[+b.dataset.i]);
  });

  /* ================= 主題 / 牌組按鈕 ================= */
  $('topics').innerHTML = TOPICS.map((t,i)=>`<button class="chip" data-t="${i}">${t.label}</button>`).join('');
  $('topics').querySelectorAll('[data-t]').forEach(b=>{
    b.onclick = ()=>{ qEl.value = TOPICS[+b.dataset.t].kw; suitFilter='all'; paintSuits(); render(); };
  });
  function paintSuits(){
    const keys = ['all'].concat(Object.keys(SUITS));
    $('suits').innerHTML = keys.map(k=>{
      const label = k==='all' ? '📚 全部 78 張' : SUITS[k].name;
      return `<button class="chip ${suitFilter===k?'on':''}" data-s="${k}">${label}</button>`;
    }).join('');
    $('suits').querySelectorAll('[data-s]').forEach(b=>{
      b.onclick = ()=>{ suitFilter=b.dataset.s; paintSuits(); render(); };
    });
  }

  /* ================= 分頁切換 ================= */
  const PAGES = { search:['pageSearch','tabSearch'], sim:['pageSim','tabSim'], guide:['pageGuide','tabGuide'] };
  function showPage(which){
    Object.keys(PAGES).forEach(k=>{
      const [pg,tb] = PAGES[k];
      $(pg).classList.toggle('on', k===which);
      $(tb).classList.toggle('on', k===which);
    });
    window.scrollTo({top:0, behavior:'smooth'});
  }
  $('tabSearch').onclick = ()=>showPage('search');
  $('tabSim').onclick    = ()=>showPage('sim');
  $('tabGuide').onclick  = ()=>showPage('guide');

  /* ================= 牌組結構頁 ================= */
  function gotoSuit(key){
    showPage('search'); qEl.value=''; suitFilter = key; paintSuits(); render();
  }
  (function buildGuide(){
    const A = STRUCTURE;
    const block = (o, goKey, goLabel) => `
      <div class="arc">
        <span class="tagline" style="background:${goKey==='major'?SUITS.major.color:'#ffb703'}"></span>
        <div class="ico">${o.emoji}</div>
        <div class="t">${o.title}</div>
        <div class="c">${o.count}</div>
        <div class="line">${o.sym}</div>
        <div class="line">${o.use}</div>
        <div class="ex">${o.ex}</div>
        <div class="kid">${o.kid}</div>
        <button class="go" data-go="${goKey}">${goLabel}</button>
      </div>`;
    $('arcana').innerHTML = block(A.major,'major','看這 22 張大牌 →') + block(A.minor,'minor','看小牌的四個花色 ↓');
    $('howto').textContent = A.howto;
    $('arcana').querySelectorAll('[data-go]').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.go === 'major') gotoSuit('major');
        else $('eltable').scrollIntoView({behavior:'smooth', block:'start'});
      };
    });
    $('eltable').innerHTML = A.elements.map(e=>`
      <button class="elrow" data-s="${e.suit}">
        <span class="tagline" style="background:${SUITS[e.suit].color}"></span>
        <span class="nmwrap"><div class="n">${e.n}</div><div class="e">${e.el} · 14 張</div></span>
        <span><div class="sc">${e.scope}</div><div class="kid">👦 ${e.kid}</div></span>
      </button>`).join('');
    $('eltable').querySelectorAll('[data-s]').forEach(b=>{ b.onclick = ()=>gotoSuit(b.dataset.s); });
  })();

  /* ================= 抽牌模擬器 ================= */
  const SPREADS = [
    { key:'one',  t:'🌟 今日一張', n:1, d:'今天心裡放一句話就好。最適合每天早上抽。',
      pos:['今天的提醒'] },
    { key:'three',t:'🕰️ 三張牌', n:3, d:'過去 → 現在 → 接下來。想看事情怎麼走的時候用。',
      pos:['過去 · 已經發生的事','現在 · 你正在的地方','接下來 · 可以試試的方向'] },
    { key:'five', t:'🧭 五張牌', n:5, d:'把一件煩惱看清楚：情況、卡住的點、真心話、可以做的事、結果。',
      pos:['現在的情況','卡住的地方','你心裡真正想要的','你可以做的事','如果這樣做，可能會…'] },
    { key:'yesno',t:'🤔 可不可以', n:1, d:'心裡有件想做的事，先問問看適不適合現在做。',
      pos:['這件事現在適合嗎'] }
  ];
  let spread = SPREADS[1], picks = [], deckOrder = [], picking = false;

  $('spreads').innerHTML = SPREADS.map(s=>`
    <button class="spread ${s.key===spread.key?'on':''}" data-k="${s.key}">
      <div class="t">${s.t}<span style="color:var(--dim);font-size:12px"> · ${s.n} 張</span></div>
      <div class="d">${s.d}</div>
    </button>`).join('');
  $('spreads').querySelectorAll('[data-k]').forEach(b=>{
    b.onclick = ()=>{
      spread = SPREADS.find(s=>s.key===b.dataset.k);
      $('spreads').querySelectorAll('.spread').forEach(e=>e.classList.toggle('on', e.dataset.k===spread.key));
    };
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function startShuffle(){
    picks = []; picking = true;
    deckOrder = shuffle(CARDS).map(c => ({ card:c, rev: Math.random() < 0.35 }));
    $('simSetup').style.display='none';
    $('simResult').style.display='none';
    $('simPick').style.display='';
    $('pickStep').textContent = 'STEP 3 · 洗牌中…';
    $('pickNote').textContent = '心裡想著你的問題，慢慢深呼吸 🌬️';
    const deck = $('deck');
    deck.className = 'deck shuffling';
    deck.innerHTML = deckOrder.map((o,i)=>`<div class="back" data-i="${i}"></div>`).join('');
    setTimeout(()=>{
      deck.className = 'deck';
      $('pickStep').textContent = 'STEP 3 · 選你的牌';
      updateNote();
      deck.querySelectorAll('.back').forEach(el=>{ el.onclick = ()=>pick(+el.dataset.i, el); });
    }, 1200);
  }
  function updateNote(){
    const left = spread.n - picks.length;
    $('pickNote').innerHTML = left>0
      ? `不用想哪張比較好，憑感覺點就對了 —— 還要選 <b>${left}</b> 張`
      : '好了！正在翻牌…';
  }
  function pick(i, el){
    if(!picking || picks.some(p=>p.i===i)) return;
    picks.push({ i, ...deckOrder[i] });
    el.classList.add('picked');
    updateNote();
    if(picks.length >= spread.n){
      picking = false;
      $('deck').querySelectorAll('.back:not(.picked)').forEach(e=>e.classList.add('dim'));
      setTimeout(showResult, 600);
    }
  }

  // 綜合小結：大牌 / 小牌比例（本質 vs 細節）、花色元素、正逆位
  const SUIT_THEME = {
    wands :'「權杖（火焰棒）· 火元素」—— 重點在行動力：你想做什麼、有沒有真的去做。',
    cups  :'「聖杯（心情杯）· 水元素」—— 重點在情感和人際關係：你跟別人之間的心情。',
    swords:'「寶劍（想法劍）· 風元素」—— 重點在思考和決定：你怎麼想、怎麼說，還有腦袋裡打結的地方。',
    coins :'「錢幣（金幣）· 土元素」—— 重點在很實際的事：練習、時間、東西和成果。'
  };
  function summarize(list){
    const cnt = {major:0,wands:0,cups:0,swords:0,coins:0};
    list.forEach(p=>cnt[p.card.suit]++);
    const revN = list.filter(p=>p.rev).length, n = list.length;
    const minorKeys = ['wands','cups','swords','coins'];
    const minorN = n - cnt.major;
    const topMinor = minorKeys.slice().sort((a,b)=>cnt[b]-cnt[a])[0];

    let themeTxt;
    if(cnt.major === n){
      themeTxt = (n===1 ? '抽到的是「大阿爾克那（大牌）」' : '這次全部都是「大阿爾克那（大牌）」')
        + ' —— 講的是這件事的核心本質和長遠影響，代表它對你來說真的滿重要的，不是小事。';
    }else if(cnt.major*2 >= n && cnt.major > 0){
      themeTxt = `這次有 ${cnt.major} 張大牌 + ${minorN} 張小牌 —— 大牌指出這件事的本質（它對你的意義），`
        + `小牌補上細節；小牌這邊以 ${SUIT_THEME[topMinor]}`;
    }else if(cnt.major > 0){
      themeTxt = `這次以小牌為主（${minorN} 張），講的是日常的具體情況和心情；另外那 ${cnt.major} 張大牌，`
        + `是在提醒你這件事背後還有比較大的意義。小牌這邊以 ${SUIT_THEME[topMinor]}`;
    }else{
      themeTxt = '這次全部都是小牌 —— 講的是眼前的具體事件、心情和可以馬上做的事。以 ' + SUIT_THEME[topMinor];
    }
    let dirTxt;
    if(revN===0)        dirTxt = '全部都是正位，代表現在方向蠻順的，可以放心往前。';
    else if(revN===n)   dirTxt = '全部都是逆位，代表現在卡卡的，先別急，慢下來反而會更快。';
    else                dirTxt = `有 ${revN} 張逆位，代表有些地方順、有些地方要調整一下，這很正常。`;
    return { themeTxt, dirTxt, cnt, revN };
  }

  function showResult(){
    $('simPick').style.display='none';
    $('simResult').style.display='';
    const qtext = $('question').value.trim();
    const s = summarize(picks);
    $('resultStep').textContent = spread.t + ' · 你抽到的牌';
    let yn = '';
    if(spread.key==='yesno'){
      yn = picks[0].rev
        ? '<p><b>🌙 目前的感覺是：先等一下。</b>不是不行，是現在還缺一點東西，準備好再做會更順。</p>'
        : '<p><b>🌞 目前的感覺是：可以，去試試看。</b>條件看起來還不錯，勇敢一點。</p>';
    }
    $('summary').innerHTML =
      '<h3>🔎 這次的小結</h3>' +
      (qtext ? `<p>你問的是：「${esc(qtext)}」</p>` : '') +
      yn +
      `<p>${s.themeTxt}</p><p>${s.dirTxt}</p>` +
      '<p style="color:var(--dim);font-size:13px">記得：牌只是幫你把心裡的話講出來，真正做決定的人是你。</p>';

    $('reading').innerHTML = picks.map((p,i)=>{
      const c = p.card;
      return `<div class="rcard" style="animation-delay:${i*0.12}s">
        <span class="tagline" style="background:${SUITS[c.suit].color}"></span>
        <div class="pos">${spread.pos[i] || ('第 '+(i+1)+' 張')}</div>
        <div class="head">
          <div class="ico" style="${p.rev?'transform:rotate(180deg)':''}">${c.emoji}</div>
          <div>
            <div class="nm">${c.name}</div>
            <div class="en">${c.en}</div>
            <span class="dir ${p.rev?'r':'u'}">${p.rev?'🌙 逆位':'🌞 正位'}</span>
          </div>
        </div>
        <div class="body">${esc(p.rev ? c.rev : c.up)}</div>
        <div class="tip">💛 ${esc(c.tip)}</div>
        <button class="more" data-id="${c.id}">看這張牌的完整說明 →</button>
      </div>`;
    }).join('');
    $('reading').querySelectorAll('.more').forEach(b=>{
      b.onclick = ()=>{ const c = CARDS.find(x=>x.id===b.dataset.id); view=[c]; open(c); };
    });
    $('simResult').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function resultText(){
    const q = $('question').value.trim();
    const s = summarize(picks);
    let t = '【Tarot for Kids 抽牌結果】\n牌陣：' + spread.t + '\n';
    if(q) t += '問題：' + q + '\n';
    t += '\n';
    picks.forEach((p,i)=>{
      t += (spread.pos[i]||('第'+(i+1)+'張')) + '：' + p.card.name + '（' + p.card.en + '）'
         + (p.rev?' 逆位':' 正位') + '\n'
         + '　' + (p.rev ? p.card.rev : p.card.up) + '\n'
         + '　💛 ' + p.card.tip + '\n\n';
    });
    t += '小結：' + s.themeTxt + ' ' + s.dirTxt + '\n';
    return t;
  }

  $('shuffleBtn').onclick = startShuffle;
  $('again').onclick = ()=>{ $('simResult').style.display='none'; $('simSetup').style.display=''; startShuffle(); };
  $('cancelPick').onclick = ()=>{ picking=false; $('simPick').style.display='none'; $('simSetup').style.display=''; };
  $('copy').onclick = ()=>{
    const t = resultText();
    const done = ()=>{ $('copy').textContent = '✅ 已複製'; setTimeout(()=>$('copy').textContent='📋 複製這次的結果', 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fallback); }
    else fallback();
    function fallback(){
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ alert(t); }
      ta.remove();
    }
  };

  /* ================= 啟動 ================= */
  qEl.addEventListener('input', render);
  $('clr').onclick = ()=>{ qEl.value=''; render(); qEl.focus(); };
  paintSuits();
  // 網址參數：?q=勇氣 直接查詢；#sim 直接開模擬器（方便加書籤 / 分享）
  const urlQ = new URLSearchParams(location.search).get('q');
  if(urlQ) qEl.value = urlQ;
  render();
  if(location.hash === '#sim') showPage('sim');
  if(location.hash === '#guide') showPage('guide');

  // 給自動測試用的鉤子
  window.__tk = { showPage, startShuffle, pick, showResult, summarize, resultText,
                  get picks(){return picks}, get spread(){return spread},
                  setSpread(k){ spread = SPREADS.find(s=>s.key===k); }, SPREADS, tokens, score };
  window.__ready = true;
})();
</script>
</body>
</html>
