<!doctype html>
<html lang="zh-Hant" data-lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「廢」筆發光！廢棄蠟筆摩擦奈米發電 — IEYI 世界青少年創客發明展</title>
<meta name="description" content="利用美術課廢棄蠟筆（石蠟）製作接觸-分離式摩擦奈米發電器（TENG），零材料成本把校園廢棄物變成發電地墊。IEYI 參賽作品說明、互動原理模擬、實驗數據站與中英雙語 pitch。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%A1</text></svg>">
<script>
/* 預設深色；使用者按過切換就記住他的選擇。放在 <head> 是為了避免載入時閃一下白畫面。 */
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('teng-theme') || 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  try {
    var l = localStorage.getItem('teng-lang');
    if (l) {
      document.documentElement.setAttribute('data-lang', l);
      document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'zh-Hant');
    }
  } catch (e2) {}
})();
</script>
<style>
/* ============================================================
   IEYI 參賽網站｜廢棄蠟筆石蠟摩擦發電（TENG）
   單一檔案、純前端、離線可用。
   圖表色彩：量值用單一藍色系；分類用三色色盤
   （#2a78d6 / #eb6834 / #1baf7a，已通過 CVD 與對比驗證）。
   ============================================================ */
:root {
  color-scheme: light;
  --page: #f7f5f0; --card: #fffdfa; --card-2: #fbf9f4; --chart-surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --rule: #c3c2b7;
  --brand: #10795a; --brand-ink: #0d5f47; --brand-soft: #e4f2ec;
  --spark: #b07500; --spark-soft: #fbf0d8;
  --danger: #b6402f; --danger-soft: #fbeae6;
  --on-brand: #ffffff;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px -16px rgba(11,11,11,.18);
  --ring: rgba(11,11,11,.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --grid: #e1e0d9; --baseline: #c3c2b7;
  --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-450: #2a78d6;
  --cr1: #d8452f; --cr2: #e79a1b; --cr3: #2f9e5e; --cr4: #2a78d6; --cr5: #7b4bb5;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --page: #0d0d0d; --card: #171716; --card-2: #1e1e1c; --chart-surface: #1a1a19;
  --ink: #fff; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --rule: #383835;
  --brand: #2fbd8a; --brand-ink: #56d2a5; --brand-soft: #14291f;
  --spark: #eda100; --spark-soft: #2a2313;
  --danger: #e08b7a; --danger-soft: #2c1a16;
  --on-brand: #08130f;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.8);
  --ring: rgba(255,255,255,.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --grid: #2c2c2a; --baseline: #383835;
  --seq-100: #104281; --seq-250: #1c5cab; --seq-450: #3987e5;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --card: #171716; --card-2: #1e1e1c; --chart-surface: #1a1a19;
  --ink: #fff; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --rule: #383835;
  --brand: #2fbd8a; --brand-ink: #56d2a5; --brand-soft: #14291f;
  --spark: #eda100; --spark-soft: #2a2313;
  --danger: #e08b7a; --danger-soft: #2c1a16;
  --on-brand: #08130f;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.8);
  --ring: rgba(255,255,255,.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --grid: #2c2c2a; --baseline: #383835;
  --seq-100: #104281; --seq-250: #1c5cab; --seq-450: #3987e5;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  font-size: 16px; line-height: 1.75; -webkit-text-size-adjust: 100%;
}
h1,h2,h3,h4 { line-height: 1.32; margin: 0; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0 0 10px; }
a { color: var(--brand-ink); }

/* ---------- 中英雙語切換（純 CSS 控制顯示） ---------- */
html[data-lang="zh"] .i18n-en { display: none !important; }
html[data-lang="en"] .i18n-zh { display: none !important; }
html[data-lang="both"] .i18n-en.bb { display: block; color: var(--ink-2); font-size: .93em; }
html[data-lang="both"] .i18n-en.ii::before { content: " / "; color: var(--muted); }
html[data-lang="en"] .i18n-en.bb, html[data-lang="en"] .i18n-en.ii { display: revert; }
.i18n-en.bb { margin-top: 2px; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 60; background: var(--page); border-bottom: 1px solid var(--line); }
@supports (backdrop-filter: blur(4px)) {
  .top { background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: blur(12px); }
}
.top-in { max-width: 1140px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.brand .dot { width: 24px; height: 24px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, var(--cr1), var(--cr2) 34%, var(--cr3) 64%, var(--cr4)); }
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); line-height: 1.25; }
nav.nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
nav.nav::-webkit-scrollbar { display: none; }
nav.nav ul { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
nav.nav a { display: block; padding: 6px 9px; border-radius: 8px; font-size: 13px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
nav.nav a:hover { background: var(--card-2); color: var(--ink); }
nav.nav a.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.top-act { display: flex; gap: 6px; flex: none; align-items: center; }

/* ---------- buttons ---------- */
.btn { font: inherit; font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 9px;
  border: 1px solid var(--ring); background: var(--card); color: var(--ink); cursor: pointer;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
.seg-group { display: inline-flex; border: 1px solid var(--ring); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg-group button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 9px; border: 0;
  background: transparent; color: var(--ink-2); cursor: pointer; }
.seg-group button + button { border-left: 1px solid var(--line); }
.seg-group button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-ink); }
select, input[type=number], input[type=text] { font: inherit; font-size: 14px; width: 100%; padding: 6px 9px;
  border-radius: 9px; border: 1px solid var(--rule); background: var(--card-2); color: var(--ink); }
select:focus-visible, input:focus-visible, .btn:focus-visible, a:focus-visible, button:focus-visible {
  outline: 2px solid var(--series-1); outline-offset: 1px; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(900px 400px at 10% -10%, var(--brand-soft), transparent 70%),
              radial-gradient(720px 340px at 94% 2%, var(--spark-soft), transparent 70%); }
.hero-in { position: relative; max-width: 1140px; margin: 0 auto; padding: 44px 16px 34px; }
.crayons { display: flex; gap: 5px; margin-bottom: 16px; }
.crayons i { height: 7px; border-radius: 99px; display: block; }
.crayons i:nth-child(1){width:54px;background:var(--cr1)} .crayons i:nth-child(2){width:34px;background:var(--cr2)}
.crayons i:nth-child(3){width:20px;background:var(--cr3)} .crayons i:nth-child(4){width:42px;background:var(--cr4)}
.crayons i:nth-child(5){width:15px;background:var(--cr5)}
.kicker { font-size: 12.5px; font-weight: 800; color: var(--brand-ink); letter-spacing: .05em; }
.hero h1 { font-size: clamp(26px, 4.4vw, 44px); margin: 10px 0 4px; }
.hero h1 .hl { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--spark) 32%, transparent) 62%); padding: 0 2px; }
.hero .en-title { font-size: clamp(14px, 1.7vw, 17px); color: var(--ink-2); font-weight: 600; margin: 6px 0 0; }
.hero .sub { font-size: clamp(15px, 1.6vw, 17.5px); color: var(--ink-2); max-width: 64ch; margin: 12px 0 0; }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
.tag { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--card);
  border: 1px solid var(--ring); color: var(--ink-2); }
.tag.b { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.tag.s { background: var(--spark-soft); color: var(--spark); border-color: transparent; }
.hero-act { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-top: 26px; }
.tile { background: var(--card); border: 1px solid var(--ring); border-radius: 13px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .lb { font-size: 11.5px; color: var(--muted); }
.tile .vl { font-size: 24px; font-weight: 700; margin-top: 1px; }
.tile .nt { font-size: 11.5px; color: var(--ink-2); }
.tile.hero-fig .vl { font-size: 44px; letter-spacing: -.03em; color: var(--brand-ink); }

/* ---------- layout ---------- */
main { max-width: 1140px; margin: 0 auto; padding: 0 16px 80px; }
section.sec { padding: 46px 0 8px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
.sec-head { display: flex; align-items: baseline; gap: 11px; }
.sec-no { font-size: 12px; font-weight: 800; color: var(--brand-ink); background: var(--brand-soft);
  border-radius: 7px; padding: 2px 8px; flex: none; }
.sec-head h2 { font-size: clamp(20px, 2.5vw, 27px); }
.sec-lead { color: var(--ink-2); margin: 6px 0 20px; max-width: 76ch; }
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.mt { margin-top: 12px; }
.quote { border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 0 12px 12px 0; padding: 14px 18px; }
.note { font-size: 13.5px; color: var(--ink-2); background: var(--card-2); border: 1px dashed var(--rule); border-radius: 11px; padding: 10px 13px; }
.warn { font-size: 14px; background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
  border-radius: 11px; padding: 10px 13px; }
.warn b { color: var(--danger); }
ol.clean, ul.clean { margin: 0; padding-left: 1.2em; }
ol.clean li, ul.clean li { margin: 6px 0; }
.lbl { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }

/* innovation / numbered cards */
.icard { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.icard .n { display: inline-grid; place-items: center; width: 27px; height: 27px; border-radius: 9px;
  background: var(--brand); color: var(--on-brand); font-weight: 800; font-size: 14px; margin-bottom: 8px; }
.icard h4 { font-size: 15.5px; margin-bottom: 5px; }
.icard p { font-size: 14.5px; color: var(--ink-2); margin: 0; }
.goals { counter-reset: g; display: grid; gap: 10px; }
.goal { counter-increment: g; display: flex; gap: 12px; background: var(--card); border: 1px solid var(--ring);
  border-radius: 13px; padding: 13px 16px; }
.goal::before { content: counter(g); flex: none; width: 25px; height: 25px; border-radius: 8px; background: var(--spark-soft);
  color: var(--spark); font-weight: 800; font-size: 13.5px; display: grid; place-items: center; }
.goal > div > b { display: block; font-size: 14.5px; }   /* 只讓「標題型」粗體換行，不影響句中的 <b> */
.goal > div > span { color: var(--ink-2); font-size: 14.5px; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 540px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--card-2); font-size: 12.5px; color: var(--ink-2); font-weight: 700; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { background: var(--card-2); font-weight: 700; border-top: 1px solid var(--rule); }
tr.hi td { background: var(--brand-soft); }
.stars { color: var(--spark); letter-spacing: 1px; white-space: nowrap; }
.yes { color: var(--brand-ink); font-weight: 700; }
.no { color: var(--danger); font-weight: 700; }

/* steps */
.steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); counter-reset: s; }
.step { counter-increment: s; background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.step .hd { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.step .hd i { font-style: normal; width: 27px; height: 27px; border-radius: 9px; flex: none; background: var(--spark-soft);
  color: var(--spark); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.step .hd i::before { content: counter(s); }
.step h4 { font-size: 15px; }
.step .t { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.step p { font-size: 14.5px; color: var(--ink-2); }

/* variable-design cards */
.vc { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.vc > h4 { padding: 12px 16px; background: var(--card-2); border-bottom: 1px solid var(--line); font-size: 14.5px; }
.vrow { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.vrow:last-child { border-bottom: 0; }
.vrole { font-size: 11px; font-weight: 800; border-radius: 7px; padding: 2px 6px; height: fit-content; text-align: center; }
.vrole.m { background: var(--spark-soft); color: var(--spark); }
.vrole.c { background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); }
.vrole.d { background: var(--brand-soft); color: var(--brand-ink); }

/* phases diagram */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.phase { background: var(--chart-surface); border: 1px solid var(--ring); border-radius: 13px; padding: 10px; }
.phase svg { width: 100%; height: auto; display: block; }
.phase h5 { font-size: 13.5px; margin: 6px 0 2px; font-weight: 700; }
.phase p { font-size: 12.5px; color: var(--ink-2); margin: 0; }

/* ---------- simulator ---------- */
.lab { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.5fr) minmax(238px, .95fr); }
@media (max-width: 880px) { .lab { grid-template-columns: 1fr; } }
.stage { background: var(--chart-surface); border: 1px solid var(--ring); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.stage canvas { width: 100%; display: block; border-radius: 9px; touch-action: manipulation; }
#simCanvas { cursor: pointer; }
.scope-lb { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 4px 2px; font-size: 12px; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.fld { margin-bottom: 10px; }
.fld > label { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 10px; }
.ro { background: var(--card-2); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; }
.ro .lb { font-size: 11px; color: var(--muted); }
.ro .vl { font-size: 18.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ro.wide { grid-column: 1 / -1; }
.meter { height: 9px; border-radius: 99px; background: var(--seq-100); overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--seq-450); width: 0; }
.led { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: -2px; background: var(--rule); margin-right: 6px; }
.led.on { background: #ffd23f; box-shadow: 0 0 10px 3px rgba(255,210,63,.7); }
.hintkey { font-size: 11.5px; color: var(--muted); }
kbd { font: inherit; font-size: 11.5px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--rule);
  background: var(--card-2); box-shadow: 0 1px 0 var(--rule); }
.simlog { margin-top: 12px; }
table.log { min-width: 620px; font-size: 13px; }
table.log td, table.log th { padding: 7px 10px; }

/* ---------- data station ---------- */
.dtabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.dwrap { display: grid; gap: 12px; grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: start; }
@media (max-width: 920px) { .dwrap { grid-template-columns: 1fr; } }
table.entry { min-width: 470px; }
table.entry input { width: 70px; padding: 4px 7px; font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
table.entry input.wide { width: 100%; text-align: left; }
table.entry select { width: auto; min-width: 80px; padding: 4px 7px; font-size: 13px; }
table.entry td.avg { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
table.entry th:first-child, table.entry td:first-child { white-space: nowrap; font-weight: 600; }
.figure { background: var(--chart-surface); border: 1px solid var(--ring); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.figure h4 { font-size: 14.5px; }
.figure .fsub { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 10px; }
.figure figcaption { font-size: 12px; color: var(--muted); margin-top: 8px; }
.figure svg { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 16px; height: 3px; border-radius: 99px; display: block; }
.empty { color: var(--muted); font-size: 13.5px; padding: 30px 0; text-align: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* ---------- SDG / impact ---------- */
.sdg { border: 1px solid var(--ring); border-radius: 13px; padding: 13px 15px; background: var(--card); }
.sdg .no { font-size: 11.5px; font-weight: 800; color: var(--on-brand); background: var(--brand); border-radius: 6px; padding: 1px 7px; }
.sdg h4 { font-size: 14.5px; margin: 8px 0 3px; }
.sdg p { font-size: 13.5px; color: var(--ink-2); margin: 0; }

/* ---------- pitch ---------- */
.pitch { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.pitch .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.pitch .sec-t { font-size: 15.5px; font-weight: 700; }
.pitch .dur { font-size: 11.5px; font-weight: 800; color: var(--spark); background: var(--spark-soft); border-radius: 99px; padding: 2px 9px; }
.pitch .script { font-size: 15px; line-height: 1.85; }
.pitch .script.en { font-size: 14.5px; }

  background: transparent; color: var(--ink); border: 0; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }

/* ---------- checklist ---------- */

<script>
/* ==========================================================================

"use strict";

/* ---------- 雙語小工具：ti() 行內、tb() 段落 ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function ti(zh, en) { return '<span class="i18n-zh">' + zh + '</span><span class="i18n-en ii">' + en + '</span>'; }
function tb(zh, en) { return '<div class="i18n-zh">' + zh + '</div><div class="i18n-en bb">' + en + '</div>'; }
function tp(zh, en) { return '<p class="i18n-zh">' + zh + '</p><p class="i18n-en bb">' + en + '</p>'; }

/* ==========================================================================
   1. HERO
   ========================================================================== */
function renderHero() {
  return [
    '<div class="crayons" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>',
    '<div class="kicker">' + ti('IEYI 世界青少年創客發明展｜參賽作品', 'IEYI World Young Inventors Exhibition — Entry') + '</div>',
    '<div style="font-size:13.5px;color:var(--ink-2);margin-top:4px">' +
      ti('參賽人 <b>林日向</b>　·　林口康橋國際學校　·　Hinata Team',
         'Inventor <b>Hinata Lin</b> · Kang Chiao International School, Linkou Campus · Hinata Team') + '</div>',
    '<h1>' + ti('「<span class="hl">廢</span>」筆發光！<br>把美術課的斷蠟筆，變成會發電的地墊',
                'Waste Crayons That <span class="hl">Light Up</span><br>A power-generating floor mat made from broken art-class crayons') + '</h1>',
    '<p class="en-title">' + ti('Waste Crayons That Light Up — A Paraffin-Based Triboelectric Nanogenerator (TENG) Built from School Art-Class Waste',
                                '利用美術課廢棄蠟筆（石蠟）製作接觸-分離式摩擦奈米發電器') + '</p>',
    '<p class="sub">' + ti('蠟筆的主成分「石蠟」在靜電序列中極易吸引電子。我們把美術課丟掉的斷蠟筆熔成薄膜，和鋁箔反覆接觸、分離，做成一片<b>總成本不到 50 元</b>的摩擦奈米發電器（TENG）；經整流儲能後可點亮 LED 指示燈，能鋪成教室門口的「發電地墊」。',
                           'Paraffin wax — the main ingredient of crayons — sits at the strongly electron-attracting end of the triboelectric series. We melt discarded crayons into a thin film and let it contact and separate from aluminium foil, forming a triboelectric nanogenerator (TENG) that costs <b>under NT$50 (≈US$1.5)</b>. Rectified and stored in a capacitor, it lights an LED indicator — and can be laid down as a power-generating doormat at a classroom entrance.') + '</p>',
    '<div class="tags">',
    '<span class="tag b">' + ti('綠色能源 / 環境保護', 'Green Energy / Environment') + '</span>',
    '<span class="tag">' + ti('廢棄物升級再造 Upcycling', 'Upcycling') + '</span>',
    '<span class="tag">' + ti('摩擦奈米發電 TENG', 'Triboelectric Nanogenerator') + '</span>',
    '<span class="tag s">' + ti('SDG 7 · 11 · 12 · 4', 'SDG 7 · 11 · 12 · 4') + '</span>',
    '<span class="tag">© Hinata Team</span>',
    '</div>',
    '<div class="hero-act no-print">',
    '<a class="btn primary" href="#lab">' + ti('▶ 玩互動原理模擬器', '▶ Try the interactive simulator') + '</a>',
    '<a class="btn" href="#pitch">' + ti('🎤 中英 Pitch 稿', '🎤 Bilingual pitch script') + '</a>',
    '<a class="btn" href="#data">' + ti('📊 實驗數據站', '📊 Data workstation') + '</a>',
    '<button class="btn" id="printBtn2">' + ti('🖨️ 列印說明書', '🖨️ Print the report') + '</button>',
    '</div>',
    '<div class="tiles">',
    tile('hero-fig', ti('材料成本', 'Material cost'), 'NT$0', ti('廢蠟筆＋廢紙板＋鋁箔', 'Waste crayons + cardboard + foil')),
    tile('', ti('全模組總成本', 'Total cost / module'), '≈ NT$45', ti('含整流、電容、LED', 'incl. rectifier, capacitor, LED')),
    tile('', ti('製作時間', 'Build time'), '35 ' + ti('分鐘', 'min'), ti('三個步驟，國小生可自製', 'three steps, child-buildable')),
    tile('', ti('瞬間峰值電壓', 'Peak voltage'), '10–20 V', ti('乾燥環境、最佳組合', 'dry air, best combination')),
    tile('', ti('對照組（無蠟層）', 'Control (no wax)'), '1–2 V', ti('證明電來自石蠟', 'proves the wax is the source')),
    '</div>'
  ].join('');
}
function tile(cls, lb, vl, nt) {
  return '<div class="tile ' + cls + '"><div class="lb">' + lb + '</div><div class="vl">' + vl + '</div><div class="nt">' + nt + '</div></div>';
}

/* ==========================================================================
   2. 章節內容
   ========================================================================== */

/* --- 問題與動機 --- */
function secProblem() {
  return '<div class="grid g3">' +
    icard(1, ti('校園每年丟掉大量斷蠟筆', 'Schools throw away broken crayons every year'),
      ti('美術課結束後，斷掉、太短、混色的蠟筆幾乎都被當一般垃圾丟棄。蠟筆是石蠟＋顏料，焚化會產生額外碳排，而它本身其實是一種<b>完全沒被利用的高分子材料</b>。',
         'After art class, crayons that are broken, too short or colour-mixed are thrown out as general waste. Crayons are paraffin wax plus pigment: incinerating them adds carbon emissions, even though the wax itself is <b>a polymer material nobody is using</b>.')) +
    icard(2, ti('微能源「撿電」正在崛起', 'Micro-energy harvesting is rising'),
      ti('人走路、開門、踩地墊的動作，每天都在浪費掉大量機械能。摩擦奈米發電器（TENG）可以把這些動作轉成電，但研究常用的 PTFE、PDMS 等薄膜<b>要買、要設備、小學生做不出來</b>。',
         'Walking, opening doors and stepping on mats waste mechanical energy all day. Triboelectric nanogenerators (TENGs) can convert that motion into electricity, but the PTFE / PDMS films used in research <b>must be purchased, need equipment, and are out of reach for primary-school students</b>.')) +
    icard(3, ti('我們發現一個巧合', 'We noticed a coincidence'),
      ti('查「摩擦起電順序表」時，我們發現<b>石蠟（paraffin）就排在強負電的一端</b>，和 PTFE 同一區。也就是說——被丟掉的蠟筆，本來就是很好的 TENG 材料。',
         'Reading the triboelectric series, we found that <b>paraffin sits at the strongly negative end</b>, in the same region as PTFE. In other words, the crayons being thrown away are already an excellent TENG material.')) +
    '</div>' +
    '<div class="quote mt">' + tb('<b>問題定義：</b>有沒有辦法讓「零成本、隨手可得的校園廢棄物」，變成小學生自己做得出來、又真的能點亮燈的綠色發電模組？',
         '<b>Problem statement:</b> can zero-cost, readily available school waste be turned into a green power module that children can build themselves and that really lights a lamp?') + '</div>';
}
function icard(n, h, p) {
  return '<div class="icard"><div class="n">' + n + '</div><h4>' + h + '</h4><div style="font-size:14.5px;color:var(--ink-2)">' + p + '</div></div>';
}

/* --- 解決方案與創新 --- */
function secSolution() {
  var innov = [
    [ti('材料創新：用「垃圾」取代實驗室薄膜', 'Material: waste replaces lab-grade film'),
     ti('以美術課<b>廢棄蠟筆</b>作為摩擦負極層，取代研究常用的 PTFE／PDMS。材料成本從「要採購」變成 <b>NT$0</b>，任何學校都能複製。',
        'Discarded crayons serve as the negative triboelectric layer in place of PTFE / PDMS. Material cost drops from "must be purchased" to <b>NT$0</b>, so any school can reproduce it.')],
    [ti('製程創新：吹風機「熱塗佈」10 分鐘成膜', 'Process: a 10-minute hair-dryer hot-coating'),
     ti('不用真空鍍膜、不用化學溶劑：切碎蠟筆鋪在鋁箔上，<b>吹風機熔融＋刮平</b>，冷卻即成平整石蠟膜。刮下重熔就能重做，蠟層<b>可再生</b>。',
        'No vacuum deposition, no solvents: chop the crayons onto foil, <b>melt with a hair dryer and level with a spatula</b>, then let it set into a flat paraffin film. Scrape and re-melt to rebuild it — the layer is <b>renewable</b>.')],
    [ti('結構創新：菜瓜布海綿當回彈間隙件', 'Structure: a dish sponge as the spacer-spring'),
     ti('四角黏上高密度海綿塊，自然撐出 3 mm 間隙，手壓接觸、鬆手彈開，<b>零機械零件</b>完成接觸-分離機構，踩踏壽命長且完全不怕摔。',
        'High-density sponge blocks at the four corners hold a 3 mm gap: press to contact, release to separate. The contact-separation mechanism uses <b>zero mechanical parts</b>, survives repeated stepping, and cannot break by dropping.')],
    [ti('應用創新：一塊地墊解三件事', 'Application: one mat, three jobs'),
     ti('做成教室門口<b>發電地墊</b>：同時完成①廢棄物減量 ②停電時的夜間避難指引燈 ③靜電與綠能的動手教材。',
        'Built as a <b>power-generating doormat</b> at the classroom door, it simultaneously delivers (1) waste reduction, (2) an emergency night-time guidance light during blackouts, and (3) a hands-on teaching kit for static electricity and green energy.')]
  ];
  var cards = innov.map(function (v, i) { return icard(i + 1, v[0], v[1]); }).join('');

  var rows = [
    [ti('市售壓電／電磁發電地墊', 'Commercial piezo / electromagnetic mat'),
     ti('壓電陶瓷、線圈磁鐵', 'Piezo ceramic, coil + magnet'),
     ti('高（需採購模組）', 'High (must be purchased)'),
     ti('需工廠製造', 'Factory-made'),
     '<span class="no">' + ti('不可自行維修', 'Not user-repairable') + '</span>',
     ti('含稀土／重金屬', 'Contains rare-earth / heavy metals')],
    [ti('實驗室級 TENG（PTFE／PDMS）', 'Lab-grade TENG (PTFE / PDMS)'),
     ti('工業高分子薄膜', 'Industrial polymer film'),
     ti('中（薄膜需購買）', 'Medium (film purchased)'),
     ti('需鍍膜／模具設備', 'Needs coating / moulding tools'),
     '<span class="no">' + ti('薄膜破損即報廢', 'Scrap once the film tears') + '</span>',
     ti('新料、不可再生', 'Virgin material, non-renewable')],
    [ti('★ 本作品：廢蠟筆 TENG', '★ This work: waste-crayon TENG'),
     ti('<b>校園廢棄蠟筆（石蠟）</b>', '<b>School waste crayons (paraffin)</b>'),
     '<span class="yes">NT$0</span>',
     ti('吹風機＋紙板，10 分鐘', 'Hair dryer + cardboard, 10 min'),
     '<span class="yes">' + ti('刮下重熔即可再生', 'Scrape & re-melt to renew') + '</span>',
     ti('廢棄物再利用、無新料', 'Upcycled waste, no virgin material')]
  ];
  var head = ['', ti('摩擦層材料來源', 'Triboelectric layer'), ti('材料成本', 'Material cost'),
              ti('製作門檻', 'Build barrier'), ti('可維修／再生', 'Repairable / renewable'), ti('環境效益', 'Environmental benefit')];
  var cmp = '<div class="tw"><table><thead><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(function (r, i) {
      return '<tr' + (i === 2 ? ' class="hi"' : '') + '>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';

  return '<div class="grid g2">' + cards + '</div>' +
    '<h3 style="font-size:17px;margin:26px 0 8px">' + ti('與現有做法的比較（前案比較）', 'Comparison with existing approaches (prior art)') + '</h3>' +
    cmp +
    '<div class="note mt">' + tb('比較內容為依公開資料與文獻整理之定性比較，成本為自製實測估算；正式送審前請補上專利檢索紀錄（建議檢索關鍵字：triboelectric、paraffin wax、energy harvesting floor mat）。',
      'This is a qualitative comparison compiled from public sources and literature; costs are estimated from our own build. Before formal submission, attach a patent-search record (suggested keywords: triboelectric, paraffin wax, energy-harvesting floor mat).') + '</div>';
}

/* --- 研究目的 --- */
function secGoals() {
  var g = [
    [ti('對擦材料', 'Counter-material'), ti('探討鋁箔、銅箔、PET 塑膠片、影印紙四種對擦材料，對廢蠟筆發電電壓與亮燈效果的影響。',
      'Compare aluminium foil, copper foil, PET sheet and copy paper as counter-materials, and their effect on output voltage and lamp brightness.')],
    [ti('顏料顏色', 'Pigment colour'), ti('探討黑、白、紅、藍四種顏色廢蠟筆，對摩擦起電量的差異（黑色含碳黑、白色含鈦白粉）。',
      'Compare black, white, red and blue waste crayons (black contains carbon black, white contains titanium dioxide) for differences in triboelectric charge.')],
    [ti('表面粗糙度', 'Surface roughness'), ti('探討石蠟塗層的表面粗糙度（平滑熔融面 vs. 200 目／600 目砂紙打磨）對發電量與充電速度的影響。',
      'Compare paraffin coatings that are smooth-melted versus sanded with 200-grit / 600-grit paper, for output and charging speed.')],
    [ti('儲能與實用性', 'Storage & practicality'), ti('測試經橋式整流與 10 µF 電容儲能後，點亮 LED 與驅動低功耗元件的可行性與持續時間。',
      'Test feasibility and duration of lighting an LED and driving low-power components after bridge rectification and storage in a 10 µF capacitor.')],
    [ti('環境耐受性', 'Environmental robustness'), ti('探討濕度對輸出的影響，並驗證加上封條／防水膜維持乾燥的改善效果（臺灣潮濕氣候的關鍵）。',
      'Study how humidity affects output, and verify the improvement from sealing / a moisture barrier — critical in Taiwan&rsquo;s humid climate.')]
  ];
  return '<div class="goals">' + g.map(function (v) {
    return '<div class="goal"><div><b>' + v[0] + '</b><span>' + v[1] + '</span></div></div>';
  }).join('') + '</div>';
}

/* --- 技術原理 --- */
function phaseSVG(kind) {
  var S = '<svg viewBox="0 0 170 104" role="img">';
  var top = { a: 16, b: 30, c: 44, d: 30 }[kind];
  var plate = 'stroke="var(--rule)" stroke-width="1"';
  S += '<rect x="18" y="' + top + '" width="134" height="9" rx="2" fill="#c9ccd1" ' + plate + '/>';
  S += '<rect x="18" y="' + (top - 8) + '" width="134" height="8" rx="2" fill="#c8a074" ' + plate + '/>';
  S += '<rect x="18" y="66" width="134" height="10" rx="2" fill="#3a3a38" ' + plate + '/>';
  S += '<rect x="18" y="76" width="134" height="7" rx="2" fill="#c9ccd1" ' + plate + '/>';
  S += '<rect x="18" y="83" width="134" height="8" rx="2" fill="#c8a074" ' + plate + '/>';

function secHow() {
  var ph = [
    ['a', ti('① 接觸', '① Contact'), ti('壓下後石蠟與鋁箔緊密接觸，石蠟從金屬奪走電子，界面帶等量正負電。', 'Pressing brings paraffin and foil into contact; paraffin strips electrons from the metal, leaving equal and opposite charges at the interface.')],
    ['b', ti('② 分離（放電流）', '② Separation (current)'), ti('鬆手彈開，間隙產生電位差，電子被迫經外電路流動——這就是我們量到的電。', 'On release the gap creates a potential difference, forcing electrons through the external circuit — this is the current we measure.')],
    ['c', ti('③ 最大分離', '③ Fully separated'), ti('間隙 3 mm 時電位差最大，電流停止，此時電表顯示峰值電壓。', 'At the 3 mm gap the potential difference peaks and current stops; the meter reads peak voltage.')],
    ['d', ti('④ 再壓合（反向）', '④ Pressed again (reverse)'), ti('再次壓下時電子反向流回，形成交流訊號，所以必須整流才能儲存。', 'Pressing again drives electrons back, producing an AC signal — which is why rectification is required before storage.')]
  ];
  return tp('石蠟屬於<b>摩擦起電順序表的強負電端</b>（和 PTFE 同區），鋁、銅則偏正電端。兩者接觸時電子從金屬轉移到石蠟，分離時因間隙產生電位差，電子便被迫流過外電路——一壓一放就是一次交流脈衝。因此我們用<b>橋式整流（4 顆 1N4007）</b>把交流轉直流，再由 <b>10 µF 電容</b>把微小電荷「積少成多」，最後點亮 LED。',
    'Paraffin lies at the <b>strongly negative end of the triboelectric series</b> (the same region as PTFE), while aluminium and copper sit toward the positive end. On contact, electrons transfer from metal to paraffin; on separation the gap creates a potential difference that forces electrons through the external circuit. Each press-and-release is therefore one AC pulse. We use a <b>bridge rectifier (four 1N4007 diodes)</b> to convert AC to DC and a <b>10 µF capacitor</b> to accumulate the tiny charges until they can light an LED.') +
    '<div class="phases mt">' + ph.map(function (p) {
      return '<div class="phase">' + phaseSVG(p[0]) + '<h5>' + p[1] + '</h5><div style="font-size:12.5px;color:var(--ink-2)">' + p[2] + '</div></div>';
    }).join('') + '</div>' +
    '<div class="grid g2 mt">' +
      '<div class="warn">' + tb('<b>安全：為什麼幾十伏特卻不會電到人？</b>摩擦發電是靜電，瞬間電壓高但電流極微弱（微安培 µA 級），總電量非常小，對人體安全；也正因為電流小，才必須靠電容累積。',
        '<b>Safety: why is tens of volts harmless?</b> This is static electricity: the instantaneous voltage is high but the current is extremely small (microamperes), so the total charge is tiny and safe for the human body. That small current is exactly why a capacitor is needed to accumulate energy.') + '</div>' +
      '<div class="note">' + tb('<b>成功的兩個關鍵：</b>①石蠟層要<b>乾燥乾淨</b>——摩擦起電最怕濕氣，在冷氣房做、用乾布擦淨，電壓可從幾伏特升到十幾伏特。②導線要<b>緊貼鋁箔</b>，用長尾夾或膠帶加重物壓緊，靜電訊號才導得出來。',
        '<b>Two keys to success:</b> (1) keep the paraffin layer <b>dry and clean</b> — triboelectricity hates moisture; working in an air-conditioned room and wiping with a dry cloth can lift output from a few volts to over ten. (2) Keep the wires <b>pressed tightly onto the foil</b> with bulldog clips or tape and a weight, or the static signal never reaches the meter.') + '</div>' +
    '</div>';
}

/* 軸刻度：先選乾淨的間距，再由間距決定上限，讓每個刻度都是整數或一位小數 */
function niceScale(raw, ticks) {
  if (!(raw > 0)) return { max: ticks, step: 1 };
  var need = raw / ticks;
  var pow = Math.pow(10, Math.floor(Math.log10(need)));
  var cand = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10], i, step = 10 * pow;
  for (i = 0; i < cand.length; i++) { if (cand[i] * pow >= need - 1e-9) { step = cand[i] * pow; break; } }
  return { max: step * ticks, step: step };
}
function wrapLabel(s, per) {
  if (/[一-鿿]/.test(s)) {
    var out = [], i;
    for (i = 0; i < s.length; i += per) out.push(s.slice(i, i + per));
    return out.slice(0, 2);
  }
  var w = s.split(' '), lines = [''], k = 0;
  w.forEach(function (t) {
    if ((lines[k] + ' ' + t).trim().length > per + 3 && lines[k]) { k++; lines[k] = t; } else { lines[k] = (lines[k] + ' ' + t).trim(); }
  });
  return lines.slice(0, 2);
}
function barChart(o) {

        'Black crayons contain <b>carbon black</b> (conductive particles); white contains <b>titanium dioxide</b> (high dielectric constant). Both alter the dielectric behaviour of the wax surface, so the "colour" effect is really a difference in pigment filler, not colour itself. This is the point judges most often probe — and the best chance to show real scientific reasoning.')],
    [ti('表面粗糙度的影響', 'Effect of surface roughness'),
     ti('砂紙打磨後<b>微觀有效接觸面積增加</b>，每次拍打轉移的電荷密度提高，因此電容充電速度明顯加快。但過度粗糙會讓接觸不完全，存在<b>最佳粗糙度</b>——這是我們下一步想找出的曲線。',
        'Sanding <b>increases the effective microscopic contact area</b>, raising the charge density transferred per tap and visibly speeding up capacitor charging. Excessive roughness, however, prevents full contact, so an <b>optimum roughness</b> should exist — finding that curve is our next step.')],
    [ti('高電壓、微電流的本質', 'High voltage, tiny current'),
     ti('TENG 的輸出是<b>高電壓、極微電流（µA 級）</b>的交流脈衝。因此①對人體安全；②不能直接驅動負載，必須全波整流＋電容「積少成多」；③量測要用高阻抗電表，否則電表本身就會把電荷洩掉，量到的值會偏低。',
        'A TENG outputs <b>high-voltage, extremely low-current (microampere) AC pulses</b>. Therefore: (1) it is safe for humans; (2) it cannot drive a load directly and needs full-wave rectification plus capacitor accumulation; (3) measurement requires a high-impedance meter, or the meter itself bleeds the charge away and the reading comes out too low.')],
    [ti('濕度：臺灣氣候的最大變數', 'Humidity: the biggest variable in Taiwan'),
     ti('水膜會讓表面電荷迅速漏失。實測若在潮濕天氣進行，電壓可能只剩乾燥時的三分之一。解法是模組四周加封條／防水膜並放入除濕包，維持內部乾燥；展場也建議隨身帶乾布與除濕包。',
        'A water film lets surface charge leak away quickly. Measured in humid weather, the output can fall to about a third of its dry-air value. The fix is to seal the module with tape or a moisture barrier and add a desiccant pack; we also recommend carrying a dry cloth and desiccant to the exhibition hall.')]
  ];

  }).join('') + '</div>';
}

  var p30en = 'Hello! We turned broken crayons thrown away in art class into a mat that generates electricity.<br>Paraffin wax — the main ingredient of crayons — is one of the strongest electron-grabbing materials in the triboelectric series. Let it touch aluminium foil and separate again, over and over, and it produces more than ten volts.<br>Using waste cardboard, kitchen foil and a dish sponge, we built a generator module for under one and a half US dollars. Sixty seconds of stepping lights an LED indicator.<br><b>Rubbish that costs nothing becomes light you can see in a blackout.</b>';

    [ti('洞察與方法（20 秒）', 'Insight & method (20 s)'), ti('我們發現石蠟在靜電序列的強負電端，和實驗室用的 PTFE 同區。於是把蠟筆熔成薄膜，配鋁箔做成接觸-分離式 TENG。', 'We found paraffin sits at the strongly negative end of the triboelectric series, in the same region as lab-grade PTFE. So we melted crayons into a film and paired it with foil as a contact-separation TENG.')],

    ['瞬間峰值電壓', 'Peak voltage (Vmax)', ti('一次拍打能量到的最高電壓', 'The highest voltage reached in one tap')],

  return '<div class="grid g2">' +

      '<div class="pitch"><div class="hd"><span class="dur">90s</span><span class="sec-t">' + ti('完整簡報結構', 'Full pitch structure') +

/* ---------- 評審問答 ---------- */
function secQA() {
  var qa = [
    [ti('為什麼電壓有幾十伏特，卻不會電到人？', 'Why doesn&rsquo;t tens of volts give you a shock?'),
     ti('因為摩擦發電是<b>靜電</b>：瞬間電壓雖高，但電流非常微弱，只有微安培（µA）等級，總電量極小，所以對人體完全安全。也正因為電流這麼小，必須靠電容把電荷「積少成多」，才能拿來點燈。',
        'Because this is <b>static electricity</b>: the instantaneous voltage is high, but the current is only microamperes, so the total charge is tiny and completely safe for the human body. That same tiny current is why we must accumulate charge in a capacitor before we can light anything.')],
    [ti('你怎麼證明電是「蠟筆」發出來的，而不是敲桌子的震動？', 'How do you prove the electricity comes from the crayons, not from the vibration of tapping?'),
     ti('我們做了<b>對照組</b>：把下層石蠟拿掉，只用兩張紙板或兩片鋁箔對敲，電壓只有 1–2 V；加上廢蠟筆石蠟層後，電壓飆升到十幾伏特。差距十倍，證明石蠟確實扮演關鍵的電子吸引角色。',
        'We ran a <b>control</b>: with the paraffin removed, tapping two bare boards or two foils together yields only 1–2 V. Adding the waste-crayon wax layer raises it to over ten volts — a tenfold difference proving the wax is the key electron-attracting element.')],
    [ti('如果下雨、濕度很大，發不出電怎麼辦？', 'What if it rains and the humidity is high — does it stop working?'),
     ti('濕度確實會讓表面電荷漏失，這是我們實測到的現象。解法是在模組四周加上簡單的封條／防水膜並放入除濕包，保持內部乾燥；我們展場也會帶乾布與備用模組。這正好也是我們下一階段要量化的變因。',
        'Humidity does let surface charge leak away — we measured it. The fix is to seal the module edges with tape or a moisture barrier and add a desiccant pack to keep the inside dry; we also bring a dry cloth and a spare module to the exhibition. Quantifying this variable is our next stage.')],
    [ti('這跟別人做過的 TENG 有什麼不同？創新在哪？', 'How is this different from existing TENGs? Where is the innovation?'),
     ti('三點：①<b>材料</b>——別人用要採購的 PTFE／PDMS 薄膜，我們用零成本的校園廢棄蠟筆；②<b>製程</b>——不用鍍膜設備，吹風機熔融 10 分鐘就成膜，且刮下重熔可再生；③<b>應用</b>——直接做成教室門口地墊，同時解決廢棄物、停電照明與教學三件事。',
        'Three things: (1) <b>material</b> — others use purchased PTFE/PDMS film; we use zero-cost school waste crayons; (2) <b>process</b> — no coating equipment: a hair dryer forms the film in ten minutes, and it can be scraped and re-melted; (3) <b>application</b> — built directly into a classroom doormat that tackles waste, blackout lighting and teaching at once.')],
    [ti('發這麼一點電，真的有用嗎？', 'Is such a small amount of power actually useful?'),
     ti('我們不打算取代電力系統。它的定位是<b>「不需要電池的指示燈與感測器」</b>：踩踏 60 秒就能點亮 LED 幾秒到十幾秒，剛好夠當停電時的避難指引；而且它同時是感測器——被踩到就送出訊號。價值在「零成本、免佈線、免換電池」。',
        'We are not trying to replace the grid. Its role is a <b>battery-free indicator light and sensor</b>: 60 seconds of stepping lights an LED for several seconds to over ten — enough to guide people during a blackout. It is also a sensor: being stepped on emits a signal. The value is zero cost, no wiring and no battery replacement.')],
    [ti('可以量產嗎？成本多少？', 'Can it be mass-produced? At what cost?'),
     ti('單片 10×10 cm 約 NT$45，九成以上是電子元件。做成 30×30 cm 地墊時九片共用一組整流儲能電路，單片降到約 NT$8，一片地墊 NT$100 以內；蠟筆與紙板由校內廢棄物持續供應，等於邊做邊減廢。',
        'A single 10×10 cm module costs about NT$45, over 90% of it electronics. In a 30×30 cm mat, nine modules share one rectifier-and-storage circuit, dropping to roughly NT$8 per module — under NT$100 per mat. Crayons and cardboard keep arriving as school waste, so production itself reduces waste.')],
    [ti('這是你們自己做的嗎？分工是什麼？', 'Did you build this yourselves? How was the work divided?'),
     ti('（請按實際情況回答，並準備好實驗紀錄本）建議說明：誰負責熔蠟製膜、誰負責電路焊接／夾接、誰負責量測與記錄、誰負責畫圖表與海報，以及大人只在<b>加熱步驟</b>從旁協助安全。',
        '(Answer honestly and have your lab notebook ready.) Suggested framing: who cast the wax film, who assembled the circuit, who measured and logged data, who made the charts and poster — and note that an adult assisted only with <b>safety during heating</b>.')]
  ];
  return qa.map(function (q, i) {
    return '<div class="qa"><button type="button" data-qa="' + i + '"><span class="q">Q' + (i + 1) + '</span><span>' + q[0] +
      '</span><span class="cv no-print">' + ti('看解答 ▾', 'Show ▾') + '</span></button>' +
      '<div class="ans"><div class="badge">' + ti('完美回答', 'Model answer') + '</div><div class="body" style="font-size:14.5px">' + q[1] + '</div></div></div>';
  }).join('');
}

    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

function toCSV(rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      c = c == null ? '' : String(c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
    }).join(',');
  }).join('\r\n');
}
function download(name, text, mime) {
  var blob = new Blob(['﻿' + text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportDataCSV() {
  var rows = [];
  Object.keys(TABLES).forEach(function (k) {
    var t = TABLES[k], n = t.cols ? t.cols.length : t.trials;
    rows.push([t.title[1]]);

    for (var i = 0; i < n; i++) head.push(t.cols ? t.cols[i][1] : ('trial_' + (i + 1) + '_V'));
    if (!t.cols) head.push('mean_peak_V');

      line.push(rec.e);

function wireNav() {
  var links = Array.prototype.slice.call(document.querySelectorAll('[data-nav]'));
  var secs = SECTIONS.map(function (s) { return document.getElementById(s.id); }).filter(Boolean);
  if (!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function (ents) {
    ents.forEach(function (en) {
      if (!en.isIntersecting) return;
      links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-nav') === en.target.id); });
      var on = document.querySelector('[data-nav].on');
      if (on && on.parentNode.parentNode.scrollWidth > on.parentNode.parentNode.clientWidth) {
        var nav = on.parentNode.parentNode.parentNode;
        if (nav) nav.scrollLeft = on.offsetLeft - nav.clientWidth / 2;
      }
    });
  }, { rootMargin: '-78px 0px -70% 0px' });
  secs.forEach(function (s) { io.observe(s); });
}

    boxes.forEach(function (b) { b.checked = false; });
    try { localStorage.removeItem(CK_KEY); } catch (e) {}
    upd();
  });
  upd();
}
function wireTeam() {
  Array.prototype.forEach.call(document.querySelectorAll('.teamf'), function (el) {
    el.addEventListener('input', function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem(TEAM_KEY) || '{}'); } catch (e) { s = {}; }
      s[el.getAttribute('data-k')] = el.value;
      try { localStorage.setItem(TEAM_KEY, JSON.stringify(s)); } catch (e) {}
    });
  });
}
function wireTimers() {
  [['bT30', 't30', 30], ['bT90', 't90', 90]].forEach(function (c) {
    var btn = document.getElementById(c[0]), out = document.getElementById(c[1]);
    if (!btn || !out) return;
    var id = null, left = c[2];
    function show() { out.textContent = Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2); }
    btn.addEventListener('click', function () {
      if (id) { clearInterval(id); id = null; left = c[2]; show(); out.style.color = ''; btn.textContent = pick('▶ 計時', '▶ Time it'); return; }
      btn.textContent = pick('■ 停止', '■ Stop');
      id = setInterval(function () {
        left--; show();
        if (left <= 5) out.style.color = 'var(--danger)';
        if (left <= 0) { clearInterval(id); id = null; left = c[2]; out.textContent = pick('時間到！', 'Time!'); btn.textContent = pick('▶ 再一次', '▶ Again'); }
      }, 1000);
    });
    show();
  });
}
function wireChrome() {
  var tb = document.getElementById('themeBtn');
  tb.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var eff = cur || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = eff === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('teng-theme', next); } catch (e) {}
  });
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  var p2 = document.getElementById('printBtn2');
  if (p2) p2.addEventListener('click', function () { window.print(); });
  document.getElementById('langSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    var l = b.getAttribute('data-lang');
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'zh-Hant');
    try { localStorage.setItem('teng-lang', l); } catch (e2) {}
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(x.getAttribute('data-lang') === l));
    });
    boot();
  });
}
function boot() {
  renderAll();
  wireData(); wireCheck(); wireTeam(); wireTimers(); wireNav();
  initSim(); renderLog();
}
(function start() {
  /* 主題與語言已在 <head> 的 inline script 先套好（避免閃白），這裡只負責接線 */
  wireChrome(); wireQA(); wireOnce();
  boot();
  var lg2 = document.documentElement.getAttribute('data-lang');
  Array.prototype.forEach.call(document.querySelectorAll('#langSeg button'), function (x) {
    x.setAttribute('aria-pressed', String(x.getAttribute('data-lang') === lg2));
  });
})();
</script>
</body>
</html>
