<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☕ 咖啡吧台模擬器 · 真實練習泡咖啡</title>
<style>
  :root{
    --green:#00704A; --green-d:#1e3932; --green-l:#d4e9e2;
    --gold:#cba258; --cream:#f7f4ec; --brown:#3b2a1a; --crema:#c79b5b;
    --milk:#fdfbf6; --foam:#fff; --steel:#c9ccd1;
    --good:#2ecc71; --warn:#f1c40f; --bad:#e74c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%,#1e3932,#0d1f1a 70%);
    color:#fff;user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;
  }
  #app{width:100%;max-width:680px;height:100%;display:flex;flex-direction:column;position:relative}

  /* ---- 頂部狀態列 ---- */
  header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:linear-gradient(180deg,#00704A,#005c3c);
    box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:10;
  }
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
  .logo .ring{width:22px;height:22px;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
  header .spacer{flex:1}
  .stat{background:rgba(0,0,0,.25);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
  .stat small{opacity:.7;font-weight:400;font-size:11px}

  /* ---- 主舞台 ---- */
  main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;padding:14px;animation:fade .3s}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- 點單卡 ---- */
  .order-card{
    background:linear-gradient(180deg,#fffef9,#f3ede0);color:#3b2a1a;border-radius:16px;
    padding:16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);position:relative;border:1px solid #e3d9c5;
  }
  .order-card .tag{position:absolute;top:-10px;right:14px;background:var(--gold);color:#3b2a1a;font-weight:800;
    padding:3px 12px;border-radius:20px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .order-card h2{margin:2px 0 4px;font-size:24px}
  .order-card .who{font-size:13px;color:#8a7a5f;margin-bottom:8px}
  .recipe-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:#eee3cd;color:#5b4a2f;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;border:1px solid #ddceb0}
  .chip.done{background:var(--green);color:#fff;border-color:var(--green)}
  .chip.cur{background:var(--gold);color:#3b2a1a;border-color:var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ---- 工作站通用 ---- */
  .station{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
  .station h3{margin:0;font-size:19px;text-align:center}
  .hint{font-size:13px;opacity:.8;text-align:center;max-width:90%;line-height:1.5}
  .stage-art{position:relative;display:flex;align-items:center;justify-content:center}

  .bigbtn{
    background:linear-gradient(180deg,#00845a,#00603f);color:#fff;border:none;border-radius:40px;
    padding:15px 34px;font-size:17px;font-weight:800;box-shadow:0 6px 0 #004029,0 8px 16px rgba(0,0,0,.4);
    cursor:pointer;transition:.08s;letter-spacing:1px;touch-action:manipulation;
  }
  .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #004029,0 4px 8px rgba(0,0,0,.4)}
  .bigbtn.gold{background:linear-gradient(180deg,#e0b667,#c79338);box-shadow:0 6px 0 #8a6420,0 8px 16px rgba(0,0,0,.4);color:#3b2a1a}
  .bigbtn:disabled{filter:grayscale(.7);opacity:.5}
  .hold-note{font-size:12px;opacity:.65}

  /* ---- 量表 / 進度 ---- */
  .gauge{width:90%;max-width:380px;height:26px;background:#0d2a22;border-radius:14px;overflow:hidden;position:relative;border:2px solid #2c4d42}
  .gauge .zone{position:absolute;top:0;bottom:0;background:rgba(46,204,113,.32);border-left:2px dashed #2ecc71;border-right:2px dashed #2ecc71}
  .gauge .fill{height:100%;width:0%;background:linear-gradient(90deg,#cba258,#e7c987);transition:width .05s linear}
  .gauge .needle{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;box-shadow:0 0 8px #fff;left:0}
  .readout{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .readout small{font-size:14px;opacity:.6;font-weight:500}

  /* ---- 杯子 SVG 容器 ---- */
  .cup-wrap{filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}

  /* ---- 評分彈窗 ---- */
  .modal{position:absolute;inset:0;background:rgba(5,15,12,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(3px)}
  .modal.show{display:flex;animation:fade .3s}
  .scorecard{background:linear-gradient(180deg,#fffef9,#efe7d6);color:#3b2a1a;border-radius:20px;padding:22px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .scorecard .grade{font-size:72px;font-weight:900;line-height:1;margin:4px 0}
  .scorecard .pts{font-size:15px;color:#8a7a5f;margin-bottom:10px}
  .breakdown{text-align:left;background:#f6efe0;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
  .breakdown .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #ddceb0}
  .breakdown .row:last-child{border:none}
  .breakdown .v{font-weight:700}
  .stars{font-size:24px;letter-spacing:3px;margin:6px 0;color:var(--gold)}

  /* ---- 選單 / 練習模式 ---- */
  .menu-screen{align-items:center;justify-content:flex-start;gap:16px;padding-top:28px;overflow-y:auto}
  .title-big{font-size:30px;font-weight:900;text-align:center;line-height:1.2;margin-top:8px}
  .title-big span{color:var(--gold)}
  .subtitle{opacity:.8;text-align:center;font-size:14px;margin-top:-6px}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:480px;padding:0 4px}
  .mode-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;cursor:pointer;transition:.15s;text-align:center}
  .mode-card:active{transform:scale(.97)}
  .mode-card:hover{background:rgba(255,255,255,.13);border-color:var(--gold)}
  .mode-card .ic{font-size:34px}
  .mode-card .nm{font-weight:800;font-size:16px;margin-top:6px}
  .mode-card .ds{font-size:12px;opacity:.7;margin-top:3px;line-height:1.4}

  .drink-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:480px;overflow-y:auto;padding:4px}
  .drink-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.12s}
  .drink-item:active{transform:scale(.97)}
  .drink-item:hover{border-color:var(--gold);background:rgba(255,255,255,.12)}
  .drink-item .em{font-size:26px}
  .drink-item .info .n{font-weight:700;font-size:14px}
  .drink-item .info .d{font-size:11px;opacity:.65}

  /* size picker */
  .size-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .size-btn{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 6px;width:88px;cursor:pointer;text-align:center;transition:.12s}
  .size-btn.sel{border-color:var(--gold);background:rgba(203,162,88,.18)}
  .size-btn .cupemo{font-size:30px}
  .size-btn .sn{font-weight:700;font-size:13px;margin-top:2px}
  .size-btn .so{font-size:11px;opacity:.6}

  .top-actions{position:absolute;top:10px;left:14px;z-index:20;display:flex;gap:8px}
  .iconbtn{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  .toast{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1;bottom:100px}

  footer{padding:8px;text-align:center;font-size:11px;opacity:.4}

  /* steam particles */
  .steam{position:absolute;width:8px;height:8px;background:rgba(255,255,255,.5);border-radius:50%;filter:blur(2px);pointer-events:none}

  /* feedback tip box */
  .tipbox{background:rgba(0,0,0,.28);border-left:4px solid var(--gold);border-radius:8px;padding:9px 13px;font-size:12.5px;line-height:1.5;max-width:92%;text-align:left}
  .tipbox b{color:var(--gold)}
  .progress-dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .progress-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
  .progress-dots i.on{background:var(--gold)}

  /* 即時教練提示條 */
  .coach{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.32);border-radius:13px;padding:10px 14px;margin-top:10px;border-left:4px solid var(--gold);transition:background .15s,border-color .15s;min-height:44px}
  .coach .face{font-size:24px;flex:none;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .coach .ct{font-size:14px;font-weight:700;line-height:1.4}
  .coach.go{border-left-color:#2ecc71;background:rgba(46,204,113,.22)}
  .coach.go .ct{color:#9fffc4}
  .coach.warn{border-left-color:#e74c3c;background:rgba(231,76,60,.22)}
  .coach.warn .ct{color:#ffb3aa}
  .coach.warn .face{animation:shake .35s infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .coach.wait{border-left-color:#cba258}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="ring">★</span> 咖啡吧台</div>
    <div class="spacer"></div>
    <div class="stat" id="statShift" style="display:none">☕ <span id="madeCount">0</span><small>杯</small></div>
    <div class="stat" id="statScore" style="display:none">⭐ <span id="totalScore">0</span></div>
  </header>

  <main>
    <!-- ============ 主選單 ============ -->
    <section class="screen active menu-screen" id="scrMenu">
      <div class="title-big">☕ 咖啡吧台<br><span>真實泡咖啡練習器</span></div>
      <div class="subtitle">磨豆 · 填壓 · 萃取 · 打奶泡 · 出杯<br>練到肌肉記憶，上手真機台不慌</div>
      <div class="mode-grid">
        <div class="mode-card" onclick="Game.startMode('practice')">
          <div class="ic">🎯</div><div class="nm">自由練習</div>

        </div>
        <div class="mode-card" onclick="Game.startMode('shift')">
          <div class="ic">🔔</div><div class="nm">尖峰營業</div>

        <div class="mode-card" onclick="Game.openGuide()">
          <div class="ic">📖</div><div class="nm">配方手冊</div>

        </div>
        <div class="mode-card" onclick="Game.startMode('exam')">
          <div class="ic">🏆</div><div class="nm">咖啡師檢定</div>
          <div class="ds">隨機指定一杯<br>追求滿分手藝</div>
        </div>
      </div>
      <footer>純前端 · 雙擊即玩 · 手機同 WiFi 也能連</footer>
    </section>

    <!-- ============ 選飲料 ============ -->
    <section class="screen" id="scrPick">
      <div class="top-actions"><button class="iconbtn" onclick="Game.toMenu()">←</button></div>
      <h3 style="text-align:center;margin:4px 0 10px">選一杯來練 👇</h3>
      <div class="drink-list" id="drinkList"></div>
    </section>

    <!-- ============ 選杯型 ============ -->
    <section class="screen" id="scrSize">
      <div class="top-actions"><button class="iconbtn" onclick="Game.backToPick()">←</button></div>
      <div class="station">
        <h3 id="sizeTitle">選擇杯型</h3>
        <p class="hint">杯型決定濃縮份數與糖漿用量，是咖啡師第一個判斷</p>
        <div class="size-row" id="sizeRow"></div>
        <button class="bigbtn gold" id="sizeGo" disabled onclick="Game.confirmSize()">開始製作 →</button>
      </div>
    </section>

    <!-- ============ 製作主舞台 ============ -->
    <section class="screen" id="scrMake">
      <div class="top-actions">
        <button class="iconbtn" onclick="Game.abandon()">✕</button>
        <button class="iconbtn" id="coachToggle" title="教練提示開關" onclick="Game.toggleCoach()">🧑‍🏫</button>
      </div>
      <div class="order-card" id="orderCard">
        <div class="tag" id="orderTag">點單</div>
        <h2 id="orderName">—</h2>
        <div class="who" id="orderWho"></div>
        <div class="recipe-steps" id="recipeSteps"></div>
      </div>
      <div class="coach" id="coachBar"><span class="face">🧑‍🏫</span><span class="ct" id="coachTxt">教練準備中…</span></div>
      <div class="station" id="stationArea"></div>
    </section>
  </main>

  <div class="modal" id="scoreModal">
    <div class="scorecard" id="scoreCard"></div>
  </div>
  <div class="modal" id="guideModal">
    <div class="scorecard" id="guideCard" style="max-width:440px;max-height:82%;overflow-y:auto"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   咖啡吧台模擬器  ——  純前端，無外部相依
   設計目標：把星巴克式手沖/濃縮流程拆成可重複練習的關卡，
   每一步都對應真實吧台動作與品質判準。
   ============================================================ */

// ---------- 音效（WebAudio，免檔案） ----------
const Sound = (()=>{
  let ctx;
  const on = ()=>{ try{ ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended')ctx.resume(); }catch(e){} };
  function tone(f,d,type='sine',vol=.25,slide=0){
    if(!ctx)return; const t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d);
  }
  // 持續性噪音（磨豆 / 蒸氣）
  function noise(dur,filterFreq,vol=.18){
    if(!ctx)return null;
    const bufSize=ctx.sampleRate*dur;
    const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=filterFreq;filt.Q.value=.8;
    const g=ctx.createGain();g.gain.value=vol;
    src.connect(filt);filt.connect(g);g.connect(ctx.destination);
    src.start();return {src,g};
  }
  return {
    on,
    click:()=>tone(520,.05,'square',.18),
    tick:()=>tone(880,.03,'sine',.12),
    good:()=>{tone(660,.1,'sine',.25);setTimeout(()=>tone(880,.12,'sine',.25),90);setTimeout(()=>tone(1175,.18,'sine',.25),190);},
    bad:()=>{tone(200,.25,'sawtooth',.22,-80);},
    pour:(vol=.2)=>noise(.4,800,vol),
    grind:()=>noise(2,400,.22),
    steam:()=>noise(3,2200,.16),
    bell:()=>{tone(1318,.4,'sine',.3);setTimeout(()=>tone(1760,.5,'sine',.25),120);},
    stamp:()=>tone(140,.12,'square',.3),
  };
})();

// ---------- 即時教練 ----------
// 每一關給「基礎指示」(set)，並在 mini-game 的 RAF loop 裡依即時數值給「動態提示」(cue)。
const Coach = (()=>{
  let on=true, bar, txt, base='', lastTone='';
  function init(){ bar=document.getElementById('coachBar'); txt=document.getElementById('coachTxt'); apply(); }
  function apply(){ if(bar) bar.style.display = on?'flex':'none'; const b=document.getElementById('coachToggle'); if(b)b.style.opacity=on?1:.4; }
  function enable(v){ on=v; apply(); }
  function toggle(){ on=!on; apply(); return on; }
  function render(t,tone){ if(!txt)return; txt.textContent=t; bar.className='coach '+(tone||'base'); lastTone=tone; }
  function set(b){ base=b; if(on)render(b,'base'); }   // 進關時的基礎教學
  function cue(c,tone){ if(on)render(c,tone||'wait'); } // 操作中的即時反應
  return {init,enable,toggle,set,cue, get on(){return on;}};
})();

// ---------- 配方資料 ----------
// 每杯由一連串 step 組成。step 種類：grind, tamp, shot, steam, syrup, sauce, water, pour, topping
// shots/milk/syrup 數量會依杯型調整
const SIZES = [
  {id:'short', name:'Short',  oz:'8oz',  shots:1, ms:1, em:'🥃'},
  {id:'tall',  name:'Tall',   oz:'12oz', shots:1, ms:1, em:'🥤'},
  {id:'grande',name:'Grande', oz:'16oz', shots:2, ms:2, em:'🧋'},
  {id:'venti', name:'Venti',  oz:'20oz', shots:2, ms:3, em:'🧉'},
];

const DRINKS = {
  espresso:{ name:'濃縮咖啡', en:'Espresso', em:'☕', diff:'入門',
    desc:'最純粹的一杯：只有萃取。練好它，其他都簡單。',
    build:['grind','tamp','shot','serve'] },
  americano:{ name:'美式咖啡', en:'Caffè Americano', em:'🫗', diff:'入門',
    desc:'濃縮加熱水。先濃縮後沖水，保留漂亮 crema。',
    build:['grind','tamp','shot','water','serve'] },
  latte:{ name:'拿鐵', en:'Caffè Latte', em:'🥛', diff:'經典',
    desc:'濃縮 + 大量蒸奶 + 薄奶泡。微泡綿密是關鍵。',
    build:['grind','tamp','shot','steam','pour','serve'] },
  cappuccino:{ name:'卡布奇諾', en:'Cappuccino', em:'☁️', diff:'經典',
    desc:'濃縮 + 奶 + 厚奶泡，傳統 1:1:1。奶泡要打得乾蓬。',
    build:['grind','tamp','shot','steam','pour','serve'] },
  flatwhite:{ name:'馥列白', en:'Flat White', em:'🤍', diff:'進階',
    desc:'Ristretto 濃縮 + 極細微泡奶。奶泡薄到像絲緞。',
    build:['grind','tamp','shot','steam','pour','serve'] },
  caramelmacchiato:{ name:'焦糖瑪奇朵', en:'Caramel Macchiato', em:'🍮', diff:'進階',
    desc:'香草糖漿→蒸奶→濃縮「印」上去→焦糖醬畫格。順序不能錯！',
    build:['syrup','grind','tamp','steam','pour','shot','topping','serve'],
    syrup:'香草糖漿', topping:'焦糖醬' },
  mocha:{ name:'摩卡', en:'Caffè Mocha', em:'🍫', diff:'進階',
    desc:'摩卡醬 + 濃縮拌勻 + 蒸奶 + 鮮奶油。先溶醬再融合。',
    build:['sauce','grind','tamp','shot','steam','pour','topping','serve'],
    sauce:'摩卡醬', topping:'鮮奶油' },
};

const DRINK_ORDER = ['espresso','americano','latte','cappuccino','flatwhite','caramelmacchiato','mocha'];
const CUSTOMERS = ['Emily','Jason','小美','阿宏','David','Yuki','陳先生','Lisa','店長','Mike','婷婷','Kevin'];

// 步驟中文標籤
const STEP_LABEL = {
  grind:'磨豆', tamp:'填壓', shot:'萃取濃縮', steam:'蒸奶', water:'加熱水',
  pour:'倒奶融合', syrup:'打糖漿', sauce:'下醬', topping:'點綴', serve:'出杯'
};

// ---------- 遊戲狀態 ----------
const Game = (()=>{
  let mode='practice';
  let drinkId=null, size=null;
  let stepIdx=0, steps=[];
  let scores={}; // 各步驟得分
  let madeCount=0, totalScore=0;
  let shiftQueue=[], shiftRemaining=0, shiftTimer=null, shiftTimeLeft=0;
  let cleanup=null; // 當前 mini-game 的清理函式

  const $=id=>document.getElementById(id);
  const screens=['scrMenu','scrPick','scrSize','scrMake'];
  function show(id){ screens.forEach(s=>$(s).classList.toggle('active',s===id)); }
  function toast(msg,ms=1600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }

  function startMode(m){
    Sound.on();
    mode=m;
    $('statShift').style.display = m==='shift'?'flex':'none';
    $('statScore').style.display='flex';
    if(m==='practice'){ renderDrinkPicker(); show('scrPick'); }
    else if(m==='shift'){ startShift(); }
    else if(m==='exam'){ // 隨機指定，含進階
      drinkId = DRINK_ORDER[Math.floor(rnd()*DRINK_ORDER.length)];
      size = SIZES[1+Math.floor(rnd()*3)].id;
      beginMake(true);
    }
  }

  // 偽隨機（避免 Math.random 限制無關，這裡正常可用；保留簡單封裝）
  function rnd(){ return Math.random(); }

  function toMenu(){ stopShift(); show('scrMenu'); $('statShift').style.display='none'; }
  function backToPick(){ if(mode==='practice'){renderDrinkPicker();show('scrPick');} else toMenu(); }

  // ---- 選飲料 ----
  function renderDrinkPicker(){
    const list=$('drinkList'); list.innerHTML='';
    DRINK_ORDER.forEach(id=>{
      const d=DRINKS[id];
      const el=document.createElement('div'); el.className='drink-item';
      el.innerHTML=`<div class="em">${d.em}</div><div class="info"><div class="n">${d.name}</div><div class="d">${d.en} · ${d.diff}</div></div>`;
      el.onclick=()=>{ Sound.click(); drinkId=id; renderSizePicker(); show('scrSize'); };
      list.appendChild(el);
    });
  }

  // ---- 選杯型 ----
  function renderSizePicker(){
    const d=DRINKS[drinkId];
    $('sizeTitle').textContent=`${d.em} ${d.name} — 選杯型`;
    const row=$('sizeRow'); row.innerHTML=''; size=null; $('sizeGo').disabled=true;
    SIZES.forEach(s=>{
      const b=document.createElement('div'); b.className='size-btn';
      b.innerHTML=`<div class="cupemo">${s.em}</div><div class="sn">${s.name}</div><div class="so">${s.oz} · ${s.shots}份濃縮</div>`;
      b.onclick=()=>{ Sound.click(); size=s.id; [...row.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); $('sizeGo').disabled=false; };
      row.appendChild(b);
    });
  }
  function confirmSize(){ Sound.click(); beginMake(); }
  function backToPick_(){ backToPick(); }

  // ---- 開始製作 ----
  function beginMake(fromExam){
    const d=DRINKS[drinkId];
    steps=d.build.slice();
    stepIdx=0; scores={};
    $('orderTag').textContent = mode==='shift'?`排隊中 · 剩 ${shiftRemaining} 杯`:(fromExam?'檢定指定':'練習');
    $('orderName').textContent=`${d.em} ${SIZES.find(s=>s.id===size).name} ${d.name}`;
    $('orderWho').textContent = mode==='shift'||fromExam ? `客人：${currentCustomer}` : d.desc;
    show('scrMake');
    Coach.enable(mode!=='exam'); // 檢定模式預設關閉手把手提示，其餘開啟
    renderRecipeChips();
    runStep();
  }

  let currentCustomer='';

  function renderRecipeChips(){
    const wrap=$('recipeSteps'); wrap.innerHTML='';
    steps.filter(s=>s!=='serve').forEach((s,i)=>{
      const c=document.createElement('span'); c.className='chip';
      c.textContent=STEP_LABEL[s]||s;
      if(i<stepIdx)c.classList.add('done');
      else if(i===stepIdx)c.classList.add('cur');
      wrap.appendChild(c);
    });
  }

  // 杯子內容狀態（畫圖用）
  let cup; // {coffee, milk, foam, water, syrup, sauce, topping}

  function runStep(){
    if(cleanup){cleanup();cleanup=null;}
    renderRecipeChips();
    const step=steps[stepIdx];
    const area=$('stationArea'); area.innerHTML='';
    const stepFns={grind:Steps.grind,tamp:Steps.tamp,shot:Steps.shot,steam:Steps.steam,
      water:Steps.water,pour:Steps.pour,syrup:Steps.syrup,sauce:Steps.sauce,topping:Steps.topping};
    if(step==='serve'){ finish(); return; }
    (stepFns[step]||(()=>nextStep(100)))(area);
  }

  function nextStep(score, note){
    scores[steps[stepIdx]] = {score, note};
    stepIdx++;
    if(score>=85)Sound.good(); else if(score<55)Sound.bad();
    setTimeout(runStep, score>=85?420:520);
  }

  // ---- 完成 / 評分 ----
  function finish(){
    const keys=Object.keys(scores);
    const avg = keys.length? Math.round(keys.reduce((a,k)=>a+scores[k].score,0)/keys.length):0;
    madeCount++; totalScore+=avg;
    $('madeCount').textContent=madeCount; $('totalScore').textContent=totalScore;
    showScore(avg);
    Sound.bell();
  }

  function gradeOf(s){ return s>=95?'S':s>=88?'A':s>=78?'B':s>=65?'C':s>=50?'D':'F'; }
  function starsOf(s){ const n=Math.max(0,Math.min(5,Math.round(s/20))); return '★'.repeat(n)+'☆'.repeat(5-n); }

  function showScore(avg){
    const d=DRINKS[drinkId];
    const g=gradeOf(avg);
    const gc={'S':'#cba258','A':'#2ecc71','B':'#27ae60','C':'#f1c40f','D':'#e67e22','F':'#e74c3c'}[g];
    let rows='';
    steps.filter(s=>s!=='serve').forEach(s=>{
      const sc=scores[s]; if(!sc)return;
      const col=sc.score>=85?'#2ecc71':sc.score>=60?'#e0a800':'#e74c3c';
      rows+=`<div class="row"><span>${STEP_LABEL[s]}</span><span class="v" style="color:${col}">${sc.score} 分</span></div>`;
    });
    // 找最弱一步給建議
    let worst=null;
    steps.filter(s=>s!=='serve').forEach(s=>{ if(scores[s]&&(!worst||scores[s].score<scores[worst].score))worst=s; });
    const tip = worst && scores[worst].note ? `<div class="tipbox" style="margin-top:10px"><b>進步重點：</b>${scores[worst].note}</div>` : '';
    const isShift = mode==='shift';
    $('scoreCard').innerHTML=`
      <div style="font-size:14px;color:#8a7a5f">${d.em} ${d.name} 完成</div>
      <div class="grade" style="color:${gc}">${g}</div>
      <div class="stars">${starsOf(avg)}</div>
      <div class="pts">總評 ${avg} 分</div>
      <div class="breakdown">${rows}</div>
      ${tip}
      <div style="display:flex;gap:10px;margin-top:16px">
        ${isShift && shiftRemaining>0 ? `<button class="bigbtn gold" style="flex:1" onclick="Game.nextCustomer()">下一位客人 →</button>`
          : `<button class="bigbtn" style="flex:1" onclick="Game.retry()">再做一杯</button>
             <button class="bigbtn gold" style="flex:1" onclick="Game.afterScore()">完成</button>`}
      </div>`;
    $('scoreModal').classList.add('show');
  }

  function retry(){ $('scoreModal').classList.remove('show'); beginMake(mode==='exam'); }
  function afterScore(){
    $('scoreModal').classList.remove('show');
    if(mode==='exam'){ // 換一杯隨機
      drinkId=DRINK_ORDER[Math.floor(rnd()*DRINK_ORDER.length)];
      size=SIZES[1+Math.floor(rnd()*3)].id; beginMake(true);
    } else if(mode==='practice'){ backToPick(); }
    else toMenu();
  }

  // ---- 尖峰營業 ----
  function startShift(){
    shiftRemaining=5; madeCount=0; totalScore=0;
    $('madeCount').textContent=0; $('totalScore').textContent=0;
    nextCustomer(true);
  }
  function nextCustomer(first){
    $('scoreModal').classList.remove('show');
    if(!first) shiftRemaining--;
    if(shiftRemaining<=0){ endShift(); return; }
    drinkId=DRINK_ORDER[Math.floor(rnd()*5)]; // 尖峰用前 5 種較常見
    size=SIZES[1+Math.floor(rnd()*3)].id;
    currentCustomer=CUSTOMERS[Math.floor(rnd()*CUSTOMERS.length)];
    beginMake();
  }
  function endShift(){
    const avg=madeCount?Math.round(totalScore/madeCount):0;
    $('scoreCard').innerHTML=`
      <div style="font-size:40px">🎉</div>
      <div class="grade" style="color:#cba258;font-size:46px">營業結束！</div>
      <div class="stars">${starsOf(avg)}</div>
      <div class="pts">做了 ${madeCount} 杯 · 平均 ${avg} 分</div>
      <div class="tipbox" style="margin-top:8px">${avg>=85?'手藝穩定，可以獨當一面了！':avg>=70?'已經很不錯，再磨一下萃取與奶泡就更穩。':'多回到自由練習磨基本功，尖峰會更從容。'}</div>
      <button class="bigbtn gold" style="margin-top:16px;width:100%" onclick="Game.toMenu()">回主選單</button>`;
    $('scoreModal').classList.add('show');
  }
  function stopShift(){ if(shiftTimer){clearInterval(shiftTimer);shiftTimer=null;} }

  function abandon(){ if(cleanup){cleanup();cleanup=null;} if(mode==='shift'){ if(confirm('放棄這次營業？'))toMenu(); } else toMenu(); }

  // ---- 配方手冊 ----
  function openGuide(){
    let html=`<div style="font-size:22px;font-weight:900;margin-bottom:4px">📖 配方手冊</div>
      <div style="font-size:12px;color:#8a7a5f;margin-bottom:12px">看懂組成，練起來更有方向</div>`;
    DRINK_ORDER.forEach(id=>{
      const d=DRINKS[id];
      const flow=d.build.filter(s=>s!=='serve').map(s=>STEP_LABEL[s]).join(' → ');
      html+=`<div style="text-align:left;background:#f6efe0;border-radius:12px;padding:11px 14px;margin-bottom:9px">
        <div style="font-weight:800;font-size:15px">${d.em} ${d.name} <span style="font-size:11px;color:#8a7a5f">${d.en}</span></div>
        <div style="font-size:12.5px;color:#5b4a2f;margin:4px 0;line-height:1.45">${d.desc}</div>
        <div style="font-size:11.5px;color:#00704A;font-weight:700">${flow}</div></div>`;
    });
    html+=`<button class="bigbtn gold" style="margin-top:8px;width:100%" onclick="document.getElementById('guideModal').classList.remove('show')">關閉</button>`;
    $('guideCard').innerHTML=html;
    $('guideModal').classList.add('show');
  }

  // 暴露給 Steps 模組
  const ctx={
    nextStep, $, toast, get drinkId(){return drinkId;}, get size(){return size;},
    sizeObj(){return SIZES.find(s=>s.id===size);}, get drink(){return DRINKS[drinkId];},
    setCleanup(fn){cleanup=fn;}, Sound
  };

  function toggleCoach(){ const v=Coach.toggle(); toast(v?'教練提示：開':'教練提示：關'); }

  return {startMode,toMenu,backToPick,confirmSize,beginMake,retry,afterScore,abandon,
    nextCustomer,openGuide,toggleCoach,ctx, get _drinkId(){return drinkId;}};
})();

// ============================================================
//  各工作站 mini-game
// ============================================================
const Steps = (()=>{
  const C = ()=>Game.ctx;
  const make=(tag,html)=>{ const d=document.createElement('div'); d.className=tag; d.innerHTML=html; return d; };

  // 通用：建立一個杯子 SVG，依填充比例畫液體層
  function cupSVG(layers){
    // layers: [{h:0~1, color}] 由下往上堆疊
    let lvl=0, rects='';
    layers.forEach(l=>{
      const y=140-(lvl+l.h)*120, h=l.h*120;
      rects+=`<rect x="62" y="${y.toFixed(1)}" width="116" height="${h.toFixed(1)}" fill="${l.color}"/>`;
      lvl+=l.h;
    });
    return `<svg class="cup-wrap" width="200" height="190" viewBox="0 0 240 200">
      <defs><clipPath id="cupclip"><path d="M60 20 L180 20 L168 150 Q120 165 72 150 Z"/></clipPath></defs>
      <g clip-path="url(#cupclip)">
        <rect x="60" y="20" width="120" height="140" fill="#ffffff"/>
        ${rects}
      </g>
      <path d="M60 20 L180 20 L168 150 Q120 165 72 150 Z" fill="none" stroke="#d9d2c4" stroke-width="4"/>
      <ellipse cx="120" cy="20" rx="60" ry="8" fill="#fff" stroke="#d9d2c4" stroke-width="3"/>
    </svg>`;
  }

  // ============ 1. 磨豆 + 落粉量 ============
  function grind(area){
    Coach.set('第①關 磨豆：按住下面按鈕開始磨，盯著上方數字，到 18~20g（綠帶）就放手。');
    area.appendChild(make('h3','① 磨豆與落粉'));
    area.appendChild(make('hint','長按磨豆，把咖啡粉填到綠色區間（約一份 18~20g）。太少萃取淡、太多會苦澀。'));
    const gWrap=make('','');
    gWrap.innerHTML=`<div class="readout"><span id="gVal">0.0</span><small> g</small></div>`;
    area.appendChild(gWrap);
    const gauge=make('gauge','<div class="zone" style="left:75%;width:18%"></div><div class="fill" id="gFill"></div>');
    area.appendChild(gauge);
    const btn=make('','<button class="bigbtn" id="gBtn">⏺ 長按磨豆</button><div class="hold-note">放開即停 · 對準綠色帶</div>');
    btn.style.textAlign='center'; area.appendChild(btn);

    const target=19; // 18-20g 區間（綠帶 75%-93% → 對應 18-22.3g，目標19）
    let g=0, raf=null, snd=null, holding=false;
    const maxG=24;
    function tick(){
      if(holding){ g=Math.min(maxG, g+0.28); C().$('gVal').textContent=g.toFixed(1);
        C().$('gFill').style.width=(g/maxG*100)+'%'; if(Math.random()<.3)Game.ctx.Sound.tick();
        if(g<17.5) Coach.cue('繼續磨…快到了','wait');
        else if(g<=20.5) Coach.cue('👌 剛剛好，現在放手！','go');
        else Coach.cue('太多了！下次早一點放手','warn'); }
      raf=requestAnimationFrame(tick);
    }
    function start(e){ e.preventDefault(); holding=true; if(!snd)snd=Game.ctx.Sound.grind(); }
    function stop(){ if(!holding)return; holding=false;
      if(snd){try{snd.src.stop()}catch(e){};snd=null;}
      finishGrind(); }
    function finishGrind(){
      cancelAnimationFrame(raf);
      // 評分：離 19g 的距離
      const diff=Math.abs(g-target);
      let score = diff<=1?100 : diff<=2?88 : diff<=3.5?70 : diff<=5?50 : 30;
      let note;
      if(g<14) note='落粉偏少，濃縮會過萃發酸又稀；下次磨久一點。';
      else if(g>22) note='粉量過多，水流不過去容易苦澀；磨少一點。';
      else note='落粉量很標準！穩定的劑量是好濃縮的第一步。';
      cleanupG();
      C().nextStep(score, note);
    }
    const gb=C().$('gBtn');
    gb.addEventListener('mousedown',start); gb.addEventListener('touchstart',start,{passive:false});
    window.addEventListener('mouseup',stop); window.addEventListener('touchend',stop);
    function cleanupG(){ gb.removeEventListener('mousedown',start); gb.removeEventListener('touchstart',start); window.removeEventListener('mouseup',stop); window.removeEventListener('touchend',stop); cancelAnimationFrame(raf); if(snd){try{snd.src.stop()}catch(e){}} }
    C().setCleanup(cleanupG);
    raf=requestAnimationFrame(tick);
  }

  // ============ 2. 填壓 ============
  function tamp(area){
    Coach.set('第②關 填壓：先點「開始蓄力」，指針會左右擺動。掃到中間綠色時，再點一下落壓。');
    area.appendChild(make('h3','② 填壓 Tamping'));
    area.appendChild(make('hint','點一下開始蓄力，在綠色區間（約 15kg 力道、水平壓實）再點一下落壓。太輕鬆散、太重也不會更好。'));
    const ro=make('',`<div class="readout"><span id="tVal">0</span><small> kg</small></div>`); area.appendChild(ro);
    const gauge=make('gauge','<div class="zone" style="left:55%;width:22%"></div><div class="needle" id="tNeedle"></div>'); area.appendChild(gauge);
    const btn=make('','<button class="bigbtn gold" id="tBtn">開始蓄力</button>'); btn.style.textAlign='center'; area.appendChild(btn);

    let pos=0, dir=1, raf=null, running=false, locked=false;
    const W=gauge.querySelector('.gauge')||gauge;
    function loop(){
      if(running){ pos+=dir*1.6; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;}
        C().$('tNeedle').style.left=pos+'%'; C().$('tVal').textContent=Math.round(pos*0.3); // 0~30kg
        const inZone = pos>=53 && pos<=79;
        Coach.cue(inZone?'🎯 現在！點一下落壓':'等指針掃到中間綠色…', inZone?'go':'wait');
      }
      raf=requestAnimationFrame(loop);
    }
    const tb=C().$('tBtn');
    function press(){
      if(locked)return;
      if(!running){ running=true; tb.textContent='落壓！'; }
      else{
        running=false; locked=true; Game.ctx.Sound.stamp();
        // 綠帶 55-77% → 約 16.5~23kg，理想中心 66%≈20kg；真實 15kg 概念化
        const center=66, diff=Math.abs(pos-center);
        let score = diff<=6?100 : diff<=12?85 : diff<=20?65 : 40;
        let note;
        if(pos<45) note='填壓太輕，粉餅鬆散會造成通道效應、萃取不均。';
        else if(pos>85) note='壓太大力其實沒幫助，重點是「水平壓實、力道一致」。';
        else note='填壓力道剛好又平整，水流會很均勻。';
        cleanupT(); C().nextStep(score,note);
      }
    }
    tb.addEventListener('click',press);
    function cleanupT(){ tb.removeEventListener('click',press); cancelAnimationFrame(raf); }
    C().setCleanup(cleanupT);
    raf=requestAnimationFrame(loop);
  }

  // ============ 3. 萃取濃縮（時間窗 + 杯子注入）============
  function shot(area){
    const shots=C().sizeObj().shots;
    Coach.set(`第③關 萃取：點「開始萃取」，秒數會跑。等到 25~30 秒之間，再點「出杯」。`);
    area.appendChild(make('h3',`③ 萃取濃縮 ×${shots}`));
    area.appendChild(make('hint',`按下開始萃取，咖啡流出後在 <b>25~30 秒</b>之間出杯最佳（金黃 crema）。太早酸澀、太晚過萃發苦。`));
    const art=make('stage-art',cupSVG([{h:0,color:'#3b2a1a'}])); area.appendChild(art);
    const ro=make('',`<div class="readout"><span id="sVal">0.0</span><small> 秒</small></div>`); area.appendChild(ro);
    const gauge=make('gauge','<div class="zone" style="left:62%;width:13%"></div><div class="fill" id="sFill"></div>'); area.appendChild(gauge);
    const btn=make('','<button class="bigbtn" id="sBtn">▶ 開始萃取</button>'); btn.style.textAlign='center'; area.appendChild(btn);

    let t=0, raf=null, started=false, snd=null, fillH=0;
    const maxT=40; // 40秒滿表
    const ideal=27;
    let last=null;
    function loop(ts){
      if(started){
        if(last===null)last=ts; const dt=(ts-last)/1000; last=ts; t+=dt;
        C().$('sVal').textContent=t.toFixed(1);
        C().$('sFill').style.width=Math.min(100,t/maxT*100)+'%';
        // 杯內咖啡上升
        fillH=Math.min(0.5, t/ idealFill());
        redraw();
        if(t<24) Coach.cue('萃取中…還太早，等到 25 秒','wait');
        else if(t<=30) Coach.cue('🎯 完美區間！點「出杯」','go');
        else Coach.cue('過萃了！快點「出杯」','warn');
        if(t>=maxT){ stopShot(); }
      }
      raf=requestAnimationFrame(loop);
    }
    function idealFill(){ return ideal*2/ (0.5); } // 讓 27 秒約半杯
    function redraw(){ art.innerHTML=cupSVG([{h:fillH,color:'#2a1c10'},{h:Math.min(0.06,fillH*0.18),color:'#c79b5b'}]); }
    const sb=C().$('sBtn');
    function clickBtn(){
      if(!started){ started=true; sb.textContent='⏹ 出杯（停止）'; snd=Game.ctx.Sound.pour(.16); }
      else stopShot();
    }
    function stopShot(){
      if(snd){try{snd.src.stop()}catch(e){}}
      const diff=Math.abs(t-ideal);
      let score = diff<=2.5?100 : diff<=5?86 : diff<=8?66 : diff<=12?45 : 28;
      let note;
      if(t<20) note='出杯太早（萃取不足），味道會尖酸、crema 偏淡。可磨細一點或拉長時間。';
      else if(t>34) note='萃取過久（過萃），會有焦苦與澀感。磨粗一點或提早出杯。';
      else note='萃取時間漂亮，crema 金黃綿密——這就是教科書級的一份濃縮。';
      cleanupS(); C().nextStep(score,note);
    }
    sb.addEventListener('click',clickBtn);
    function cleanupS(){ sb.removeEventListener('click',clickBtn); cancelAnimationFrame(raf); if(snd){try{snd.src.stop()}catch(e){}} }
    C().setCleanup(cleanupS);
    raf=requestAnimationFrame(loop);
  }

  // ============ 4. 蒸奶（溫度 + 奶泡量雙控）============
  function steam(area){
    const d=C().drink;
    // 不同飲品奶泡目標：拿鐵薄、卡布厚、馥列白極薄
    const foamTarget = d.en==='Cappuccino'?0.5 : d.en==='Flat White'?0.12 : 0.25;
    const foamName = d.en==='Cappuccino'?'厚奶泡（乾蓬）' : d.en==='Flat White'?'極薄微泡（絲緞感）' : '薄微泡（綿密）';
    const foamPct = Math.round(foamTarget*100);
    Coach.set(`第④關 蒸奶：先按住「進氣」把奶泡打到約 ${foamPct}%（${foamName}），再按住「加熱」升到 60~65°C 放手。`);
    area.appendChild(make('h3','④ 蒸奶 Steaming'));
    area.appendChild(make('hint',`這杯要：<b>${foamName}</b>。<br>先「進氣」打出奶泡（前段），再「下沉」加熱到 <b>60~65°C</b>。溫度過高奶會燒焦變腥。`));
    const art=make('stage-art',''); area.appendChild(art);
    const ro=make('',`<div class="readout"><span id="mTemp">20</span><small>°C</small> &nbsp; <span id="mFoam">0</span><small>% 奶泡</small></div>`); area.appendChild(ro);
    // 溫度表
    const tg=make('gauge','<div class="zone" style="left:66%;width:11%"></div><div class="fill" id="mtFill" style="background:linear-gradient(90deg,#5dade2,#e74c3c)"></div>'); area.appendChild(tg);
    const note=make('hint','溫度條：綠色＝60~65°C 最佳'); note.style.fontSize='11px'; area.appendChild(note);
    const btns=make('',`
      <button class="bigbtn gold" id="airBtn">空氣感 · 進氣（長按）</button>
      <button class="bigbtn" id="heatBtn" style="margin-top:8px">加熱 · 下沉（長按）</button>
      <div class="hold-note" style="margin-top:6px">先進氣到目標奶泡量，再切換加熱；到 60~65°C 放手</div>`);
    btns.style.textAlign='center'; area.appendChild(btns);
    const doneBtn=make('','<button class="bigbtn" id="steamDone" style="margin-top:10px">✔ 完成蒸奶</button>'); doneBtn.style.textAlign='center'; area.appendChild(doneBtn);

    let temp=20, foam=0, raf=null, airing=false, heating=false, snd=null;
    function draw(){
      const milkH=0.46, fH=Math.min(0.4,foam/100*0.4);
      art.innerHTML = `<div style="position:relative">${cupSVG([{h:milkH-fH*0.4,color:'#fdfbf6'},{h:fH,color:'#fffef8'}])}</div>`;
      C().$('mTemp').textContent=Math.round(temp);
      C().$('mFoam').textContent=Math.round(foam);
      C().$('mtFill').style.width=Math.min(100,(temp-20)/(75-20)*100)+'%';
      // 蒸氣
      if(airing||heating){
        for(let i=0;i<2;i++){ const s=document.createElement('div'); s.className='steam';
          const host=art.firstChild; if(host){host.style.position='relative';
          s.style.left=(90+Math.random()*30)+'px'; s.style.top='30px'; host.appendChild(s);
          const dx=(Math.random()*30-15); let y=30,op=.6;
          const an=setInterval(()=>{y-=3;op-=.04;s.style.top=y+'px';s.style.opacity=op;s.style.transform=`translateX(${dx*(30-y)/30}px)`;if(op<=0){clearInterval(an);s.remove();}},40);} }
      }
    }
    function loop(){
      if(airing){ foam=Math.min(100,foam+0.9); temp=Math.min(75,temp+0.12); }
      if(heating){ temp=Math.min(82,temp+0.42); foam=Math.min(100,foam+0.06); }
      if(airing||heating)draw();
      coachSteam();
      raf=requestAnimationFrame(loop);
    }
    function coachSteam(){
      if(!Coach.on)return;
      if(temp>68) Coach.cue('⚠️ 快停！溫度太高要燒焦，點「完成蒸奶」','warn');
      else if(foam/100 < foamTarget-0.04) Coach.cue('按住「空氣感·進氣」打奶泡到 '+foamPct+'%','wait');
      else if(temp<60) Coach.cue('奶泡夠了！改按住「加熱·下沉」升溫','go');
      else Coach.cue('🎯 溫度到 60~65°C 了，點「完成蒸奶」','go');
    }
    const airB=C().$('airBtn'), heatB=C().$('heatBtn'), doneB=C().$('steamDone');
    function startSnd(){ if(!snd)snd=Game.ctx.Sound.steam(); }
    function stopSnd(){ if(snd&&!airing&&!heating){try{snd.src.stop()}catch(e){};snd=null;} }
    const aStart=e=>{e.preventDefault();airing=true;heating=false;startSnd();};
    const aStop=()=>{airing=false;setTimeout(stopSnd,50);};
    const hStart=e=>{e.preventDefault();heating=true;airing=false;startSnd();};
    const hStop=()=>{heating=false;setTimeout(stopSnd,50);};
    airB.addEventListener('mousedown',aStart);airB.addEventListener('touchstart',aStart,{passive:false});
    heatB.addEventListener('mousedown',hStart);heatB.addEventListener('touchstart',hStart,{passive:false});
    window.addEventListener('mouseup',()=>{aStop();hStop();}); window.addEventListener('touchend',()=>{aStop();hStop();});
    function done(){
      const tempDiff=Math.abs(temp-62.5);
      const foamDiff=Math.abs(foam/100 - foamTarget)*100;
      let tScore = temp>70?Math.max(20,80-(temp-70)*6) : tempDiff<=4?100:tempDiff<=8?82:tempDiff<=14?60:40;
      let fScore = foamDiff<=8?100:foamDiff<=16?80:foamDiff<=26?58:38;
      let score=Math.round(tScore*0.55+fScore*0.45);
      let note;
      if(temp>70) note='牛奶過熱（>70°C）會產生腥味、破壞甜感。聽到尖叫聲前就要停。';
      else if(temp<55) note='溫度不夠，喝起來不夠暖、甜味出不來。再下沉加熱久一點。';
      else if(foam/100>foamTarget+0.18) note='奶泡偏多，進氣時間太長；想要綿密就早點切到加熱。';
      else if(foam/100<foamTarget-0.12) note='奶泡偏少，前段要多「進氣」打出空氣感。';
      else note='溫度甜蜜點 + 奶泡綿密，倒出來會有絲綢般的光澤。';
      cleanupM(); C().nextStep(score,note);
    }
    doneB.addEventListener('click',done);
    function cleanupM(){ cancelAnimationFrame(raf); if(snd){try{snd.src.stop()}catch(e){}}
      airB.removeEventListener('mousedown',aStart);heatB.removeEventListener('mousedown',hStart);
      airB.removeEventListener('touchstart',aStart);heatB.removeEventListener('touchstart',hStart);
      doneB.removeEventListener('click',done); }
    C().setCleanup(cleanupM);
    draw(); raf=requestAnimationFrame(loop);
  }

  function pour(area){
    const d=C().drink;
    Coach.set('倒奶融合：按住「穩定倒奶」把飄移的準星壓回中央，讓融合度衝到 90% 以上再完成。');

    const art=make('stage-art',''); area.appendChild(art);
    // 一個左右飄移的準星，玩家長按「穩定」把它拉回中心
    const track=make('gauge','<div class="zone" style="left:42%;width:16%"></div><div class="needle" id="pNeedle"></div>'); area.appendChild(track);
    const ro=make('hint','<span id="pQual">融合度 0%</span>'); area.appendChild(ro);
    const btn=make('','<button class="bigbtn gold" id="pBtn">🥛 長按穩定倒奶</button><div class="hold-note">維持準星在中央約 3 秒</div>'); btn.style.textAlign='center'; area.appendChild(btn);
    let pos=50, vel=1.2, raf=null, holding=false, quality=0, snd=null, elapsed=0;
    function draw(){
      const coffeeH=0.42, milkRise=Math.min(0.4,quality/100*0.4);
      art.innerHTML=cupSVG([{h:coffeeH-milkRise,color:'#3b2a1a'},{h:milkRise,color:'#e8d8c0'},{h:Math.min(0.05,milkRise*0.2),color:'#fffef8'}]);
      C().$('pNeedle').style.left=pos+'%';
      C().$('pQual').textContent='融合度 '+Math.round(quality)+'%';
    }
    function loop(){
      // 準星自然飄移
      pos+=vel; if(pos>92){pos=92;vel=-Math.abs(vel);} if(pos<8){pos=8;vel=Math.abs(vel);}
      if(holding){ // 穩定倒奶：阻尼 vel + 把準星拉回中心
        vel*=0.82;
        pos += (50-pos)*0.18;
        if(Math.abs(pos-50)<12){ quality=Math.min(100,quality+0.9); elapsed+=1; }
        else quality=Math.max(0,quality-0.2);
      } else { vel += (Math.random()-0.5)*0.5; vel=Math.max(-2.4,Math.min(2.4,vel)); }
      draw();
      if(quality>=90) Coach.cue('🎯 融合很漂亮，可點「完成融合」','go');
      else if(holding && Math.abs(pos-50)<12) Coach.cue('穩住！融合度上升中…','go');
      else Coach.cue('按住穩定，把準星拉回中央','wait');
      if(quality>=100){ stop(true); }
      raf=requestAnimationFrame(loop);
    }
    const pb=C().$('pBtn');
    const st=e=>{e.preventDefault();holding=true;if(!snd)snd=Game.ctx.Sound.pour(.14);};
    const sp=()=>{holding=false;};
    function stop(auto){
      if(snd){try{snd.src.stop()}catch(e){};snd=null;}
      let score = quality>=90?100:quality>=70?86:quality>=50?66:quality>=30?48:30;
      let note = quality>=90?'奶柱穩、融合漂亮，表面有光澤甚至能拉花！':quality>=60?'融合不錯，再讓奶柱更穩一點就能拉出對稱紋路。':'奶倒得太晃，奶泡與濃縮分層、表面會花。手腕放鬆、奶柱貼著中心。';
      cleanupPo(); C().nextStep(score,note);

    pb.addEventListener('mousedown',st);pb.addEventListener('touchstart',st,{passive:false});

    function cleanupPo(){pb.removeEventListener('mousedown',st);pb.removeEventListener('touchstart',st);window.removeEventListener('mouseup',sp);window.removeEventListener('touchend',sp);cancelAnimationFrame(raf);if(snd){try{snd.src.stop()}catch(e){}}}
    C().setCleanup(cleanupPo); draw(); raf=requestAnimationFrame(loop);
  }

      wb.addEventListener('mousedown',st);wb.addEventListener('touchstart',st,{passive:false});
      window.addEventListener('mouseup',sp);window.addEventListener('touchend',sp);
      function cleanupW(){wb.removeEventListener('mousedown',st);wb.removeEventListener('touchstart',st);window.removeEventListener('mouseup',sp);window.removeEventListener('touchend',sp);cancelAnimationFrame(raf);if(snd){try{snd.src.stop()}catch(e){}}}
      C().setCleanup(cleanupW); draw(); raf=requestAnimationFrame(loop);
    }
  }

  return {grind,tamp,shot,steam,water,syrup,sauce,pour,topping};
})();
