<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Games Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --poke-red: #dc0a2d; --poke-dark-red: #8b0000;
            --poke-yellow: #ffcb05; --poke-blue: #2a75bb; --poke-green: #00b894;
            --border-color: #212121;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive; background-color: var(--poke-red);
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image:
                radial-gradient(900px 500px at 50% -10%, rgba(255,255,255,.12), transparent 60%),
                linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px);
            background-size: auto, 22px 22px, 22px 22px;
        }
        .pokedex-top { width: 100%; max-width: 1000px; padding: 18px 40px 0 40px; display: flex; align-items: center; gap: 15px; }
        .camera-lens { width: 58px; height: 58px; background: #1976d2; border-radius: 50%; border: 5px solid white;
            box-shadow: 0 0 12px rgba(0,0,0,0.3); position: relative; animation: lensGlow 3s ease-in-out infinite; }
        @keyframes lensGlow { 0%,100%{box-shadow:0 0 12px rgba(120,200,255,.4)} 50%{box-shadow:0 0 26px rgba(120,200,255,.9)} }
        .camera-lens::after { content: ''; position: absolute; top: 10px; left: 10px; width: 15px; height: 15px; background: rgba(255,255,255,0.6); border-radius: 50%; }
        .small-lights { display: flex; gap: 10px; }
        .light { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); }
        .red { background: #ff5252; animation: blink 1.2s infinite; }
        .yellow { background: #ffeb3b; animation: blink 1.2s .3s infinite; }
        .green { background: #69f0ae; animation: blink 1.2s .6s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
        header { margin-top: 16px; text-align: center; color: white; text-shadow: 4px 4px 0px var(--border-color); }
        h1 { margin: 0; font-size: 2rem; line-height: 1.5; animation: pop .6s ease-out; }
        @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
        header p { font-size: 0.8rem; color: var(--poke-yellow); margin-top: 10px; text-shadow: 2px 2px 0px black; }

        .stats { width: 90%; max-width: 900px; margin: 18px 20px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; }
        .stat { background: rgba(255,255,255,.92); border: 3px solid var(--border-color); border-radius: 12px; padding: 10px 12px;
            box-shadow: 4px 4px 0 rgba(0,0,0,.25); display: flex; align-items: center; gap: 10px; animation: cardIn .5s both; }
        .stat .ico { font-size: 1.6rem; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
        .stat .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .stat .lbl { font-size: .42rem; color: #777; letter-spacing: 1px; }
        .stat .num { font-family: system-ui, "Microsoft JhengHei", sans-serif; font-weight: 900; font-size: 1.05rem;
            color: var(--poke-blue); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat.fav .num { color: var(--poke-red); }

        .screen-border { background-color: #dedede; border-radius: 20px 20px 50px 20px; padding: 26px; margin: 20px; width: 90%; max-width: 900px;
            box-shadow: inset -5px -5px 20px rgba(0,0,0,0.2), 10px 10px 0px rgba(0,0,0,0.2); border: 4px solid var(--border-color); }
        .screen-display { background: radial-gradient(120% 100% at 50% 0%, #2b2b3d 0%, #1a1a24 70%); border-radius: 10px; padding: 22px;
            border: 4px solid #555; min-height: 400px; box-shadow: inset 0 0 24px black; }
        .screen-head { display:flex; justify-content:space-between; align-items:center; color:#9fe; font-size:.55rem; margin: 0 4px 16px; letter-spacing:1px; }
        .screen-head .dot { color:#69f0ae; animation: blink 1s infinite; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; }

        .game-card { background: white; border-radius: 15px; padding: 18px 16px; text-align: center; text-decoration: none; color: #333;
            border: 4px solid var(--poke-blue); box-shadow: 6px 6px 0px var(--border-color);
            transition: transform .12s, box-shadow .12s, background-color .12s, border-color .12s;
            display: flex; flex-direction: column; justify-content: center; height: 168px; position: relative; overflow: hidden; animation: cardIn .5s both; }
        @keyframes cardIn { from{opacity:0; transform: translateY(18px) scale(.96)} to{opacity:1; transform:none} }
        .game-card::before { content: ''; position: absolute; right: -20px; bottom: -20px; width: 100px; height: 100px; opacity: 0.25; transform: rotate(-20deg);
            transition: transform .25s, opacity .25s;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="%23cfd8e3" stroke-width="10" fill="none"/><path d="M 5 50 L 95 50" stroke="%23cfd8e3" stroke-width="10"/><circle cx="50" cy="50" r="15" stroke="%23cfd8e3" stroke-width="10" fill="white"/></svg>') no-repeat; }
        .game-card::after { content:''; position:absolute; top:0; left:-120%; width:60%; height:100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg); transition: left .55s ease; }
        .game-card:hover::after { left: 160%; }
        .game-card:hover { transform: translate(-2px,-3px); box-shadow: 8px 10px 0px var(--border-color); background-color: #fff9c4; border-color: var(--poke-yellow); }
        .game-card:hover::before { transform: rotate(0deg) scale(1.15); opacity:.4; }
        .game-card:active { transform: translate(4px,4px); box-shadow: 2px 2px 0px var(--border-color); }
        .game-card .icon { font-size: 2.5rem; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); transition: transform .2s; }
        .game-card:hover .icon { transform: scale(1.15) rotate(-6deg); }
        .game-card h2 { margin: 0; font-size: 0.95rem; color: var(--poke-blue); line-height: 1.4; word-break: break-word; }
        .game-card .go { margin-top: 12px; font-size: 0.6rem; color: #fff; background: var(--poke-blue); padding: 5px 12px; border-radius: 20px; display: inline-block; align-self: center; }
        .plays { position: absolute; top: 8px; left: 8px; z-index: 2; font-family: system-ui, sans-serif; font-weight: 800; font-size: .62rem;
            background: #eef2f7; color: #2a75bb; padding: 3px 8px; border-radius: 20px; border: 2px solid #cfd8e3; display: none; }
        .plays.show { display: inline-block; }
        .badge { position: absolute; top: 8px; right: 8px; z-index: 2; font-family: system-ui, sans-serif; font-weight: 900; font-size: .58rem; padding: 3px 8px; border-radius: 20px; color: #fff; display: none; }
        .badge.new { display: inline-block; background: linear-gradient(90deg,#00b894,#55efc4); box-shadow:0 0 10px rgba(0,200,150,.6); }
        .badge.hot { display: inline-block; background: linear-gradient(90deg,#ff512f,#ffcb05); box-shadow:0 0 12px rgba(255,120,40,.7); }
        .game-card.hot { border-color: var(--poke-yellow); }
        .game-card.hot { animation: cardIn .5s both, hotPulse 1.8s ease-in-out infinite; }
        @keyframes hotPulse { 0%,100%{box-shadow:6px 6px 0 var(--border-color), 0 0 0 rgba(255,203,5,0)} 50%{box-shadow:6px 6px 0 var(--border-color), 0 0 22px rgba(255,203,5,.85)} }
        .card-del { position:absolute; bottom:6px; right:8px; z-index:3; background:#ff5252; color:#fff; border:none; width:22px; height:22px;
            border-radius:50%; font-size:.8rem; line-height:1; cursor:pointer; display:none; }
        .game-card.custom .card-del { display:block; }

        footer { margin-top: auto; padding: 20px; color: rgba(255,255,255,0.75); font-size: 0.6rem; text-align: center; line-height:1.8; }

        /* ➕ 新增遊戲：浮動鈕 + 視窗 */
        .fab { position:fixed; right:18px; bottom:18px; z-index:50; width:58px; height:58px; border-radius:50%; border:4px solid var(--border-color);
            background:linear-gradient(135deg,#ffcb05,#ff9800); color:#212121; font-size:2rem; font-weight:900; cursor:pointer;
            box-shadow:4px 4px 0 rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transition:transform .15s; }
        .fab:hover { transform:translateY(-3px) rotate(90deg); }
        .modal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); padding:18px; }
        .modal.show { display:flex; }
        .modal-box { background:#fff; border:4px solid var(--border-color); border-radius:18px; box-shadow:8px 8px 0 rgba(0,0,0,.3); padding:22px; width:100%; max-width:380px;
            font-family:system-ui,"Microsoft JhengHei",sans-serif; animation: pop .25s ease-out; }
        .modal-box h3 { margin:0 0 14px; font-family:'Press Start 2P',cursive; font-size:.9rem; color:var(--poke-blue); }
        .modal-box label { display:block; font-size:.74rem; color:#555; margin:10px 0 4px; font-weight:700; }
        .modal-box input { width:100%; padding:10px; border:2px solid #cfd8e3; border-radius:10px; font-size:.95rem; font-family:inherit; }
        .modal-box input:focus { outline:none; border-color:var(--poke-blue); }
        .modal-row { display:flex; gap:10px; } .modal-row > div { flex:1; }
        .modal-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
        .mbtn { flex:1; min-width:90px; padding:11px; border:none; border-radius:10px; font-weight:800; font-size:.9rem; cursor:pointer; font-family:inherit; }
        .mbtn.go { background:var(--poke-blue); color:#fff; } .mbtn.gray { background:#eef2f7; color:#444; } .mbtn.exp { background:var(--poke-green); color:#fff; }
        .hint { font-size:.72rem; color:#888; margin-top:12px; line-height:1.7; }

        @media (max-width:520px){ h1{font-size:1.4rem} .game-card{height:150px} .game-card .icon{font-size:2rem} .game-card h2{font-size:.82rem} }
    </style>
</head>
<body>
    <div class="pokedex-top">
        <div class="camera-lens"></div>
        <div class="small-lights"><div class="light red"></div><div class="light yellow"></div><div class="light green"></div></div>
    </div>
    <header><h1>Josh Games</h1><p>CHOOSE YOUR BATTLE</p></header>

    <div class="stats" id="stats"></div>

    <div class="screen-border">
        <div class="screen-display">
            <div class="screen-head"><span><span class="dot">●</span> SELECT A GAME</span><span id="totalPlays">TOTAL PLAYS: 0</span></div>
            <div class="container" id="grid"></div>
        </div>
    </div>

    <footer>&copy; 2024 JOSH GAMES · GOTTA PLAY 'EM ALL!<br><span id="footNote"></span></footer>

    <button class="fab" id="fab" title="新增遊戲">＋</button>
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3>➕ 新增遊戲</h3>
            <label>遊戲名稱</label><input id="m_name" placeholder="例如：Snake">
            <label>連結網址（完整 URL）</label><input id="m_url" placeholder="https://...">
            <div class="modal-row">
                <div><label>圖示 emoji</label><input id="m_icon" placeholder="🎮" maxlength="4"></div>
                <div><label>按鈕字</label><input id="m_go" placeholder="PLAY"></div>
            </div>
            <div class="modal-actions">
                <button class="mbtn gray" id="m_close">關閉</button>
                <button class="mbtn exp" id="m_export">複製設定</button>
                <button class="mbtn go" id="m_add">新增</button>
            </div>
            <div class="hint">新增的遊戲存在此瀏覽器。按「複製設定」可複製 JSON，貼進原始碼 <b>GAMES</b> 陣列即可讓所有人看到。</div>
        </div>
    </div>

<script>
(() => {
'use strict';
const BASE = 'https://jasonxleg.github.io/aigames/';

/* ====== 全域投票後端（Google 表單）======
   填好下面三個值即啟用「跨所有訪客」的點擊投票統計；留空則只用本機 localStorage。
   1) action: 你的表單回應端點，形如  https://docs.google.com/forms/d/e/XXXXX/formResponse
   2) entry : 表單「遊戲名稱」那題的欄位 id，形如  entry.123456789
   3) resultsCsv: 回應試算表「發布到網路 → CSV」的連結（要顯示全球票數才需要）        */
const VOTE = { action: 'https://docs.google.com/forms/d/e/1FAIpQLSdy-E5VDRUoe74EMplpO6xz6iv9JZTe-qCSrLGB-5z51hhssQ/formResponse', entry: 'entry.1203998677', resultsCsv: '' };  // B方案：訪客只看本機統計；全站數據在你連結的 Google 試算表後台查看

/* ====== 內建遊戲清單（順序保留；要永久新增就在這裡加一筆）====== */
const GAMES = [
    { name:'White & Black', file:'whiteblack.html',      icon:'⚫', go:'START' },
    { name:'AI Go',         file:'aigo.html',            icon:'⭕', go:'START' },
    { name:'Ghost Picker',  file:'picker.html',          icon:'👻', go:'START' },
    { name:'Race',          file:'race.html',            icon:'🏎️', go:'START' },
    { name:'Fish',          file:'fish.html',            icon:'🐟', go:'START' },
    { name:'Music v2',      file:'music.html',           icon:'🎵', go:'START' },
    { name:'Hero',          file:'hero.html',            icon:'🦸', go:'START' },
    { name:'Tank',          file:'tank.html',            icon:'🪖', go:'START' },
    { name:'WebSite',       file:'website.html',         icon:'🌐', go:'OPEN' },
    { name:'CheckCheat',    file:'OpenGem.html',         icon:'💎', go:'GEM' },
    { name:'IDR Exchange',  file:'IDRExchange.html',     icon:'💱', go:'IDR' },
    { name:'Map Gemini',    file:'map_gen_gemini.html',  icon:'🗺️', go:'MAP' },
    { name:'nenfight',      file:'nenfight.html',        icon:'👊', go:'FIGHT' },
    { name:'basketball',    file:'basket.html',          icon:'🏀', go:'PLAY' },
    { name:'lottery539',    file:'lottery539.html',      icon:'🎰', go:'DRAW' },
    { name:'flight',        file:'flight.html',          icon:'✈️', go:'FLY' },
    { name:'fighter-panel', file:'fighter-panel.html',   icon:'🛩️', go:'PANEL' },
    { name:'qrcode',        file:'qrcode.html',          icon:'🔳', go:'SCAN' },
    { name:'voicerecord',   file:'voicerecord.html',     icon:'🎙️', go:'REC' },
    { name:'breakout',      file:'neon-breakout.html',   icon:'🧱', go:'PLAY' },
    { name:'pinball',       file:'pinball.html',         icon:'🎱', go:'PLAY },
    { name:'scanner',       file:'drive-scanner.html',   icon:'🎱', go:'PLAY', new:true },
];

/* ---------- localStorage 工具 ---------- */
const VKEY='jg_visits', CKEY='jg_clicks', CGKEY='jg_customgames';
const load=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const save=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ---------- 造訪統計 ---------- */
const visits = load(VKEY, { firstDate:null, lastDate:null, totalDays:0, streak:1, totalVisits:0, todayCount:0 });
const today = todayStr();
visits.totalVisits = (visits.totalVisits||0) + 1;
if (!visits.firstDate) visits.firstDate = today;
if (visits.lastDate !== today) {
    const gap = visits.lastDate ? daysBetween(visits.lastDate, today) : 0;
    visits.streak = (gap === 1) ? (visits.streak||0)+1 : 1;
    visits.totalDays = (visits.totalDays||0) + 1;
    visits.lastDate = today; visits.todayCount = 1;
} else { visits.todayCount = (visits.todayCount||0) + 1; }
save(VKEY, visits);

/* ---------- 點擊統計（本機）& 自訂遊戲 ---------- */
let clicks = load(CKEY, {});                 // { key: count }（本機）
let custom = load(CGKEY, []);                // [{name,url,icon,go}]
let globalCounts = null;                     // { 遊戲名稱: count }（全球，來自表單回應）
let globalStats = null;                      // { todayVisits,totalDays,streak,totalVisits }（全球造訪）
const keyOf = g => g.custom ? g.url : g.file;
const hrefOf = g => g.custom ? g.url : BASE + g.file;
function buildAll(){ return GAMES.concat(custom.map(c => ({...c, file:c.url, custom:true}))); }
let ALL = buildAll();

/* ---------- 投票送出（Google 表單，匿名 no-cors）---------- */
function sendVote(name){
    if (!VOTE.action || !VOTE.entry) return;
    try {
        const fd = new FormData(); fd.append(VOTE.entry, name);
        fetch(VOTE.action, { method:'POST', mode:'no-cors', body:fd }).catch(()=>{});
    } catch(e){}
}
/* ---------- 讀回全球紀錄（回應試算表 CSV）：造訪 + 點擊 ---------- */
async function loadGlobal(){
    if (!VOTE.resultsCsv) return;
    try {
        const r = await fetch(VOTE.resultsCsv, { cache:'no-store' });
        if (!r.ok) return;                          // 401/403/404 → 退回本機統計
        const txt = await r.text();
        if (/^\s*</.test(txt)) return;              // 收到 HTML（登入牆）→ 退回本機統計
        const rows = txt.split(/\r?\n/).slice(1);   // 跳過表頭
        const counts = {}, visitDates = {}; let totalVisits = 0;
        for (const line of rows){
            if (!line.trim()) continue;
            const parts = line.split(',');
            const v = (parts[parts.length-1]||'').trim().replace(/^"|"$/g,'');  // 末欄＝投票值
            if (v.startsWith('GAME:')) { const n=v.slice(5); if(n) counts[n]=(counts[n]||0)+1; }
            else if (v.startsWith('VISIT:')) { const d=v.slice(6); if(d){ visitDates[d]=(visitDates[d]||0)+1; totalVisits++; } }
        }
        if (!Object.keys(counts).length && !Object.keys(visitDates).length) return;  // 無有效資料 → 不覆蓋本機
        globalCounts = counts;
        const dates = Object.keys(visitDates).sort();
        let streak = 0;
        if (dates.length) {
            const set = new Set(dates);
            let d = new Date(set.has(today) ? today : dates[dates.length-1]);
            while (set.has(todayStr(d))) { streak++; d.setDate(d.getDate()-1); }
        }
        globalStats = { todayVisits: visitDates[today]||0, totalDays: dates.length, streak, totalVisits };
        refresh();
    } catch(e){ /* CSV 未發布或離線：靜默退回本機 */ }
}

/* ---------- 計數來源（有全球用全球，否則本機）---------- */
function countOf(g){ return globalCounts ? (globalCounts[g.name]||0) : (clicks[keyOf(g)]||0); }
function totalPlays(){ return ALL.reduce((s,g)=>s+countOf(g),0); }
function favGame(){ let best=null,max=0; for(const g of ALL){ const c=countOf(g); if(c>max){max=c;best=g;} } return max>0?{game:best,count:max}:null; }

/* ---------- 建立卡片 ---------- */
const grid = document.getElementById('grid');
function renderGrid(){
    grid.innerHTML='';
    ALL.forEach((g,i)=>{
        const a=document.createElement('a');
        a.href=hrefOf(g); a.target='_blank'; a.rel='noopener';
        a.className='game-card'+(g.custom?' custom':'');
        a.dataset.key=keyOf(g);
        a.style.animationDelay=(i*40)+'ms';
        a.innerHTML=
            `<span class="plays" data-plays></span>
             <span class="badge" data-badge></span>
             <div class="icon">${g.icon||'🎮'}</div>
             <h2>${g.name}</h2>
             <span class="go">${g.go||'PLAY'} &gt;</span>
             ${g.custom?'<button class="card-del" title="刪除">✕</button>':''}`;
        a.addEventListener('click',(e)=>{
            if(e.target.classList.contains('card-del')){ e.preventDefault(); delCustom(g.url); return; }
            clicks[keyOf(g)]=(clicks[keyOf(g)]||0)+1; save(CKEY,clicks);
            sendVote('GAME:'+g.name);     // 點擊投票到 Google 表單（若已設定）
            refresh();
        });
        grid.appendChild(a);
    });
}

/* ---------- 更新 UI ---------- */
function refresh(){
    const fav = favGame();
    document.querySelectorAll('.game-card').forEach(card=>{
        const key=card.dataset.key;
        const g=ALL.find(x=>keyOf(x)===key); if(!g)return;
        const c=countOf(g);
        const pill=card.querySelector('[data-plays]');
        pill.textContent=(globalCounts?'🌐 ':'▶ ')+c; pill.classList.toggle('show',c>0);
        const isHot=fav && keyOf(fav.game)===key;
        card.classList.toggle('hot',!!isHot);
        const badge=card.querySelector('[data-badge]');
        if(isHot){ badge.className='badge hot'; badge.textContent='🔥 HOT'; }
        else if(g.new){ badge.className='badge new'; badge.textContent='✨ NEW'; }
        else { badge.className='badge'; badge.textContent=''; }
    });
    document.getElementById('totalPlays').textContent=(globalCounts?'🌐 TOTAL VOTES: ':'TOTAL PLAYS: ')+totalPlays();
    const fEl=document.getElementById('stats');
    const favTxt=fav?`${fav.game.icon||'🎮'} ${fav.game.name}`:'—';
    const favSub=fav?`${fav.count} ${globalCounts?'票':'次'}`:'尚未遊玩';
    // 造訪數字：有表單紀錄就用全球，否則用本機
    const g = globalStats;
    const vToday  = g ? g.todayVisits : visits.todayCount;
    const vDays   = g ? g.totalDays   : visits.totalDays;
    const vStreak = g ? g.streak      : visits.streak;
    const pfx = g ? '🌐 ' : '';
    fEl.innerHTML=
        statHTML('📅',pfx+'今日造訪',vToday+' 次',0)+
        statHTML('🗓️',pfx+'造訪天數',vDays+' 天',60)+
        statHTML('🔥',pfx+'連續造訪',vStreak+' 天',120)+
        statHTML('🎮',globalCounts?'總點擊票數':'總遊玩次數',totalPlays()+(globalCounts?' 票':' 次'),180)+
        statHTML('👑','最熱門',favTxt,240,'fav',favSub);
}
function statHTML(ico,lbl,num,delay,cls,sub){
    return `<div class="stat ${cls||''}" style="animation-delay:${delay}ms"><div class="ico">${ico}</div>
        <div class="meta"><div class="lbl">${lbl}</div><div class="num" title="${num}">${num}</div>
        ${sub?`<div class="lbl">${sub}</div>`:''}</div></div>`;
}

/* ---------- 新增 / 刪除 自訂遊戲 ---------- */
const modal=document.getElementById('modal');
document.getElementById('fab').onclick=()=>{ modal.classList.add('show'); document.getElementById('m_name').focus(); };
document.getElementById('m_close').onclick=()=>modal.classList.remove('show');
modal.addEventListener('click',e=>{ if(e.target===modal)modal.classList.remove('show'); });
document.getElementById('m_add').onclick=()=>{
    const name=document.getElementById('m_name').value.trim();
    let url=document.getElementById('m_url').value.trim();
    const icon=document.getElementById('m_icon').value.trim()||'🎮';
    const go=document.getElementById('m_go').value.trim()||'PLAY';
    if(!name){ alert('請輸入遊戲名稱'); return; }
    if(!url){ alert('請輸入連結網址'); return; }
    if(!/^https?:\/\//i.test(url)) url='https://'+url;
    custom.push({name,url,icon,go}); save(CGKEY,custom);
    ALL=buildAll(); renderGrid(); refresh();
    document.getElementById('m_name').value=''; document.getElementById('m_url').value='';
    document.getElementById('m_icon').value=''; document.getElementById('m_go').value='';
    modal.classList.remove('show');
};
document.getElementById('m_export').onclick=()=>{
    if(!custom.length){ alert('目前沒有自訂遊戲'); return; }
    const lines=custom.map(c=>`    { name:'${c.name.replace(/'/g,"\\'")}', file:'${c.url}', icon:'${c.icon}', go:'${c.go}' },`).join('\n');
    const txt='// 貼進 GAMES 陣列（注意：自訂項目的 file 已是完整網址）\n'+lines;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
        .then(()=>alert('已複製設定到剪貼簿！貼進原始碼 GAMES 陣列即可永久保留。'))
        .catch(()=>prompt('複製以下內容貼進 GAMES 陣列：',txt));
};
function delCustom(url){
    if(!confirm('刪除這個自訂遊戲？')) return;
    custom=custom.filter(c=>c.url!==url); save(CGKEY,custom);
    ALL=buildAll(); renderGrid(); refresh();
}

/* ---------- 啟動 ---------- */
renderGrid();
refresh();
// 送出「今日造訪」到表單（每台裝置每天一次，避免灌爆）
if (load('jg_lastvisitsent','') !== today) { sendVote('VISIT:'+today); save('jg_lastvisitsent', today); }
loadGlobal();    // 若設定了表單 CSV → 改顯示全球造訪/票數
const fn=document.getElementById('footNote');
if(visits.streak>=3) fn.textContent=`🔥 連續造訪 ${visits.streak} 天，太狂了！`;
else if(visits.totalDays<=1) fn.textContent=`👋 歡迎首次光臨，挑一款玩玩吧！`;
else fn.textContent=`已造訪 ${visits.totalDays} 天 · 累計開啟 ${visits.totalVisits} 次`;
})();
</script>
