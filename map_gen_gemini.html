<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Gemini MAP 題庫產生器 - 最終相容版</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f7fa; padding: 40px; color: #333; }
        .box { max-width: 600px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 10px solid #4285f4; }
        h2 { color: #4285f4; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, button { width: 100%; padding: 14px; margin-top: 5px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #4285f4; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #3367d6; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 25px; text-align: center; color: #666; font-size: 0.9em; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 MAP AI 題庫產生器</h2>
    
    <div class="input-group">
        <label>1. 輸入 Gemini API Key：</label>
        <input type="password" id="apiKey" placeholder="在此輸入 AIza...">
    </div>

    <div class="input-group">
        <label>2. 設定難度 (Lexile)：</label>
        <select id="lexile">
            <option value="600L-750L" selected>600L-750L (中階)</option>
            <option value="850L-1000L">850L-1000L (高階挑戰)</option>
        </select>
    </div>

    <button id="genBtn" onclick="startGeneration()">開始生成並下載</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    // 記憶 Key 到本地
    window.onload = () => {
        const savedKey = localStorage.getItem('my_gemini_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key) return alert("請輸入 Key！");
        localStorage.setItem('my_gemini_key', key);

        btn.disabled = true;
        status.innerHTML = "⏳ 正在嘗試調用模型 (1/2)...";

        const prompt = "Generate a MAP reading test with 10 questions. Level: Lexile " + lexile + ". Output ONLY a raw JSON array: [{\"isPassage\": true, \"text\": \"html\"}, {\"isPassage\": false, \"q\": \"...\", \"options\": [\"A\",\"B\",\"C\",\"D\"], \"ans\": 0}]";

        // 嘗試列表：先試 v1，不行就試 v1beta
        const endpoints = [
            `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-pro:generateContent?key=${key}`,
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${key}`,
            `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}` // 最後備案用 Flash
        ];

        let success = false;
        for (let i = 0; i < endpoints.length; i++) {
            try {
                status.innerHTML = `⏳ 正在嘗試請求路徑 (\${i + 1}/\${endpoints.length})...`;
                const response = await fetch(endpoints[i], {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (response.ok && data.candidates) {
                    processResult(data, lexile);
                    success = true;
                    break;
                } else {
                    console.warn(`路徑 \${i + 1} 失敗:`, data.error ? data.error.message : "未知錯誤");
                }
            } catch (err) {
                console.error(`連線路徑 \${i + 1} 發生錯誤`);
            }
        }

        if (!success) {
            status.innerHTML = "<span style='color:red;'>❌ 所有連線路徑均失敗。</span><br>請檢查 API Key 是否正確，或該 Key 是否有權限調用 Gemini 1.5 系列模型。";
            btn.disabled = false;
        }
    }

    function processResult(data, lexile) {
        let rawText = data.candidates[0].content.parts[0].text;
        // 提取 JSON 部分
        const jsonStart = rawText.indexOf('[');
        const jsonEnd = rawText.lastIndexOf(']') + 1;
        const quizData = JSON.parse(rawText.substring(jsonStart, jsonEnd));
        
        downloadHtml(quizData, lexile);
        document.getElementById('status').innerHTML = "<span style='color:green;'>✅ 生成完成！檔案已下載。</span>";
        document.getElementById('genBtn').disabled = false;
    }

    function downloadHtml(quizData, lexile) {
        const template = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:30px;background:#f4f7f6;}.card{max-width:800px;margin:auto;background:white;padding:35px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}.passage{background:#eef7ff;padding:20px;border-left:8px solid #4285f4;margin:20px 0;}.correct{background:#d4edda!important;}.wrong{background:#f8d7da!important;}label{display:block;padding:12px;border:2px solid #ddd;margin:8px 0;border-radius:8px;cursor:pointer;}button{width:100%;padding:18px;background:#28a745;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;}</style></head><body><div class="card"><h1>MAP Reading (\${lexile})</h1><div id="quiz"></div><button id="btn" onclick="check()">Submit</button><h2 id="res" style="text-align:center;"></h2></div><script>const data = \${JSON.stringify(quizData)};const box = document.getElementById('quiz');data.forEach((item, idx) => {if(item.isPassage) box.innerHTML += '<div class="passage">' + item.text + '</div>';else {let opts = '';item.options.forEach((o, i) => {opts += '<li><label id="l_'+idx+'_'+i+'"><input type="radio" name="q'+idx+'" value="'+i+'"> '+o+'</label></li>';});box.innerHTML += '<div style="margin-bottom:30px;"><p><b>'+item.q+'</b></p><ul style="list-style:none;padding:0;">'+opts+'</ul></div>';}});function check(){let score = 0;data.forEach((item, idx) => {if(!item.isPassage){const sel = document.querySelector('input[name="q'+idx+'"]:checked');document.getElementById('l_'+idx+'_'+item.ans).classList.add("correct");if(sel && parseInt(sel.value) === item.ans) score++;else if(sel) document.getElementById('l_'+idx+'_'+sel.value).classList.add("wrong");}});document.getElementById('res').innerText = "Score: " + score;document.getElementById('btn').disabled = true;}<\/script></body></html>`;
        const blob = new Blob([template], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "MAP_Test.html";
        a.click();
    }
</script>

</body>
</html>
