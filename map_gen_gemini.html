<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini MAP 產生器 - 終極穩定版</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f7fa; padding: 40px; color: #333; }
        .box { max-width: 600px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 10px solid #4285f4; }
        h2 { color: #4285f4; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, select, button { width: 100%; padding: 14px; margin-top: 5px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #4285f4; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #3367d6; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 25px; text-align: center; color: #666; font-size: 0.9em; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 MAP AI 題庫產生器</h2>
    
    <div class="input-group">
        <label>1. Gemini API Key：</label>
        <input type="password" id="apiKey" placeholder="在此輸入 AIza...">
    </div>

    <div class="input-group">
        <label>2. 設定難度 (Lexile)：</label>
        <select id="lexile">
            <option value="600L-750L" selected>600L-750L (中階)</option>
            <option value="850L-1000L">850L-1000L (高階挑戰)</option>
        </select>
    </div>

    <button id="genBtn" onclick="startGeneration()">開始生成並下載</button>
    <div id="status">準備就緒。</div>
</div>

<script>
    // 記憶 Key
    window.onload = () => {
        const savedKey = localStorage.getItem('my_gemini_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    async function startGeneration() {
        const key = document.getElementById('apiKey').value.trim();
        const lexile = document.getElementById('lexile').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('genBtn');

        if (!key) return alert("請輸入 Key！");
        localStorage.setItem('my_gemini_key', key);

        btn.disabled = true;
        status.innerHTML = "⏳ 正在生成中...請稍候約 20 秒。";

        // 在 Prompt 中強調只輸出 JSON，不要廢話
        const prompt = "Generate a MAP reading test with 10 questions. Level: Lexile " + lexile + ". " +
                       "Output ONLY a raw JSON array. Do not include any text before or after the JSON. " +
                       "Structure: [{\"isPassage\": true, \"text\": \"html_text\"}, {\"isPassage\": false, \"q\": \"...\", \"options\": [\"A\",\"B\",\"C\",\"D\"], \"ans\": 0}]";

        try {
            // 使用最通用的 v1beta 路徑，移除 responseMimeType
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.7
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message);
            }

            const data = await response.json();
            let rawText = data.candidates[0].content.parts[0].text;
            
            // --- 核心清洗邏輯：移除 Markdown 標籤 ---
            const jsonStart = rawText.indexOf('[');
            const jsonEnd = rawText.lastIndexOf(']') + 1;
            const cleanedJson = rawText.substring(jsonStart, jsonEnd);
            
            const quizData = JSON.parse(cleanedJson);
            downloadHtml(quizData, lexile);
            
            status.innerHTML = "<span style='color:green;'>✅ 生成完成！檔案已下載。</span>";
        } catch (error) {
            console.error(error);
            status.innerHTML = "<span style='color:red;'>❌ 錯誤：</span>" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function downloadHtml(quizData, lexile) {
        const template = `
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>MAP Practice</title><style>body{font-family:sans-serif;padding:30px;background:#f4f7f6;}.card{max-width:800px;margin:auto;background:white;padding:35px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}.passage{background:#eef7ff;padding:20px;border-left:8px solid #4285f4;margin:20px 0;}.correct{background:#d4edda!important;border-color:#28a745!important;}.wrong{background:#f8d7da!important;border-color:#dc3545!important;}label{display:block;padding:12px;border:2px solid #ddd;margin:8px 0;border-radius:8px;cursor:pointer;}button{width:100%;padding:18px;background:#28a745;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;}</style></head>
<body>
    <div class="card">
        <h1>MAP Reading (${lexile})</h1>
        <div id="quiz"></div>
        <button id="btn" onclick="check()">Submit</button>
        <h2 id="res" style="text-align:center;"></h2>
    </div>
    <script>
        const data = ${JSON.stringify(quizData)};
        const box = document.getElementById('quiz');
        data.forEach((item, idx) => {
            if(item.isPassage) box.innerHTML += '<div class="passage">' + item.text + '</div>';
            else {
                let opts = '';
                item.options.forEach((o, i) => {
                    const id = 'q'+idx+'_'+i;
                    opts += '<li><input type="radio" name="q'+idx+'" id="'+id+'" value="'+i+'" style="display:none;"><label for="'+id+'">'+o+'</label></li>';
                });
                box.innerHTML += '<div style="margin-bottom:30px;"><p><b>'+item.q+'</b></p><ul style="list-style:none;padding:0;">'+opts+'</ul></div>';
            }
        });
        function check() {
            let score = 0;
            data.forEach((item, idx) => {
                if(!item.isPassage) {
                    const sel = document.querySelector('input[name="q'+idx+'"]:checked');
                    document.querySelector('label[for="q'+idx+'_'+item.ans+'"]').classList.add("correct");
                    if(sel) {
                        if(parseInt(sel.value) === item.ans) score++;
                        else document.querySelector('label[for="'+sel.id+'"]').classList.add("wrong");
                    }
                }
            });
            document.getElementById('res').innerText = "Score: " + score;
            document.getElementById('btn').disabled = true;
        }
    <\/script>
</body>
</html>`;
        const blob = new Blob([template], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "MAP_Practice.html";
        a.click();
    }
</script>

</body>
</html>
