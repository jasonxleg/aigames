        const tot = r.reduce((s, i) => s + ws[i], 0) + gp * (r.length - 1);
        let x = (W - tot) / 2;
        if (draw) r.forEach(i => {
          rr(ctx, x, y, ws[i], hh, hh / 2); ctx.fillStyle = rgba(P.accent, 0.1); ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = rgba(P.accent, 0.6); ctx.stroke();
          ctx.fillStyle = P.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(parts[i], x + ws[i] / 2, y + hh / 2 + 2); x += ws[i] + gp;
        });
        y += hh + gp;
      });
      y -= gp;
    } else {
      setFont(ctx, 42, 500);
      for (const ln of wrap(ctx, T.tagline, CW)) {
        if (draw) { ctx.fillStyle = P.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(ln, W / 2, y); }
        y += lh(42, 1.35);
      }
    }
    gap(54);
  }

  // ---------- 主圖
  if (hero) {
    const ch = Math.round(CW * 0.6);
    if (draw) {
      ctx.save();
      ctx.shadowColor = P.dark ? rgba(P.accent, 0.35) : 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 18;
      rr(ctx, M, y, CW, ch, 44); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
      ctx.save(); rr(ctx, M, y, CW, ch, 44); ctx.clip(); drawCover(ctx, hero.el, M, y, CW, ch, 0.5, 0.3); ctx.restore();
      rr(ctx, M, y, CW, ch, 44); ctx.lineWidth = 6; ctx.strokeStyle = rgba(P.accent, 0.95); ctx.stroke();
    }
    y += ch; gap(70);
  }

  // ---------- 簡介
  if (S.sec.intro && T.intro.trim()) {
    setFont(ctx, 46, 500);
    const lines = wrap(ctx, T.intro, CW - 70), L = lh(46, 1.5);
    if (draw) {
      rr(ctx, M, y + 6, 12, lines.length * L - 12, 6); ctx.fillStyle = P.accent; ctx.fill();
      ctx.fillStyle = P.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      lines.forEach((ln, i) => ctx.fillText(ln, M + 52, y + i * L));
    }
    y += lines.length * L; gap(70);
  }

  // ---------- 大數字
  const stats = S.sec.stats ? S.stats.filter(s => s.value.trim()) : [];
  if (stats.length) {
    const n = stats.length, cw = CW / n, H = 250;
    if (draw) {
      rr(ctx, M, y, CW, H, 36); ctx.fillStyle = P.card; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = P.cardLine; ctx.stroke();
      stats.forEach((s, i) => {
        const cx = M + cw * i + cw / 2;
        let px = 108; setFont(ctx, px, 800, '', TFONT);
        while (px > 40 && ctx.measureText(s.value).width > cw - 40) { px -= 4; setFont(ctx, px, 800, '', TFONT); }
        ctx.fillStyle = P.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(s.value, cx, y + 140);
        setFont(ctx, 30, 500); ctx.fillStyle = P.muted; ctx.textBaseline = 'top';
        wrap(ctx, s.label, cw - 40).slice(0, 2).forEach((ln, k) => ctx.fillText(ln, cx, y + 160 + k * 38));
        if (i) { ctx.fillStyle = P.cardLine; ctx.fillRect(M + cw * i - 1, y + 50, 2, H - 100); }
      });
    }
    y += H; gap(76);
  }

  const sectionHead = (txt) => {
    if (!txt.trim()) return;
    setFont(ctx, 34, 800); setLS(ctx, 10);
    const s = txt.toUpperCase(), tw = ctx.measureText(s).width;
    if (draw) {
      ctx.fillStyle = P.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(s, W / 2 + 5, y);
      const lw = (CW - tw - 100) / 2;
      ctx.fillStyle = rgba(P.accent, 0.55);
      ctx.fillRect(M, y + 18, lw, 3); ctx.fillRect(W - M - lw, y + 18, lw, 3);
    }
    setLS(ctx, 0); y += 40; gap(40);
  };

  // ---------- 重點卡片
  const cards = S.sec.cards ? S.cards.filter(c => c.on && (c.title.trim() || c.items.length)) : [];
  if (cards.length) {
    sectionHead(T.cardsH);
    const GP = 40, cwid = (CW - GP) / 2;
    for (let i = 0; i < cards.length; i += 2) {
      const pair = cards.slice(i, i + 2);
      const single = pair.length === 1;
      const w = single ? CW : cwid;
      const hs = pair.map(c => cardBlock(ctx, P, c, i + 1, 0, 0, w, false));
      const h = Math.max(...hs);
      pair.forEach((c, k) => { if (draw) cardBlock(ctx, P, c, i + k + 1, M + k * (cwid + GP), y, w, true, h); });
      y += h; if (i + 2 < cards.length) y += GP;
    }
    gap(76);
  }

  // ---------- 時間軸
  const tl = S.sec.timeline ? S.timeline.filter(t => t.year.trim() || t.text.trim()) : [];
  if (tl.length) {
    sectionHead(T.timeH);
    const lx = M + 250, tx = M + 310, tw = CW - 310;
    const rows = tl.map(t => { setFont(ctx, 36, 500); const lines = wrap(ctx, t.text, tw); return { t, lines, h: Math.max(62, lines.length * lh(36, 1.35)) + 38 }; });
    const total = rows.reduce((s, r) => s + r.h, 0);
    if (draw) {
      ctx.fillStyle = rgba(P.accent, 0.4); ctx.fillRect(lx - 2, y + 30, 4, total - rows[rows.length - 1].h + 2);
      let yy = y;
      rows.forEach(r => {
        ctx.beginPath(); ctx.arc(lx, yy + 32, 15, 0, 7); ctx.fillStyle = P.accent; ctx.fill();
        ctx.beginPath(); ctx.arc(lx, yy + 32, 25, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = rgba(P.accent, 0.35); ctx.stroke();
        setFont(ctx, 56, 800, '', TFONT); ctx.fillStyle = P.accent; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(r.t.year, lx - 50, yy + 54);
        setFont(ctx, 36, 500); ctx.fillStyle = P.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        r.lines.forEach((ln, k) => ctx.fillText(ln, tx, yy + 12 + k * lh(36, 1.35)));
        yy += r.h;
      });
    }
    y += total - 38; gap(76);
  }

  // ---------- 名言
  if (S.sec.quote && T.quote.trim()) {
    setFont(ctx, 58, 600, 'italic');
    const lines = wrap(ctx, T.quote, CW - 220), L = lh(58, 1.4);
    const by = T.quoteBy.trim(), H = 150 + lines.length * L + (by ? 80 : 0);
    if (draw) {
      rr(ctx, M, y, CW, H, 40);
      const g = ctx.createLinearGradient(M, y, M + CW, y + H); g.addColorStop(0, rgba(P.accent, 0.22)); g.addColorStop(1, rgba(P.accent, 0.05));
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = rgba(P.accent, 0.45); ctx.stroke();
      setFont(ctx, 300, 800, '', TFONT); ctx.fillStyle = rgba(P.accent, 0.3); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('“', M + 36, y + 250);
      setFont(ctx, 58, 600, 'italic'); ctx.fillStyle = P.text; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + 90 + i * L));
      if (by) { setFont(ctx, 34, 600); ctx.fillStyle = P.accent; ctx.fillText('— ' + by, W / 2, y + 100 + lines.length * L + 16); }
    }
    y += H; gap(76);
  }

  // ---------- 副圖
  const extras = S.sec.gallery ? S.extraIds.map(id => S.images.find(i => i.id === id && i.el)).filter(Boolean).slice(0, 4) : [];
  if (extras.length) {
    const GPx = 24, ars = extras.map(i => (i.el.naturalWidth || 1) / (i.el.naturalHeight || 1));
    const h = Math.min(520, (CW - GPx * (extras.length - 1)) / ars.reduce((a, b) => a + b, 0));
    if (draw) {
      let x = M;
      extras.forEach((im, k) => {
        const w = ars[k] * h;
        ctx.save(); rr(ctx, x, y, w, h, 30); ctx.clip(); drawCover(ctx, im.el, x, y, w, h); ctx.restore();
        rr(ctx, x, y, w, h, 30); ctx.lineWidth = 3; ctx.strokeStyle = rgba(P.accent, 0.7); ctx.stroke();
        x += w + GPx;
      });
    }
    y += h; gap(76);
  }

  // ---------- 頁尾（留白推到這裡，讓固定比例時頁尾貼底）
  y += flex;
  if (T.footer.trim()) {
    setFont(ctx, 26, 500); setLS(ctx, 2);
    if (draw) {
      ctx.fillStyle = P.cardLine; ctx.fillRect(M, y, CW, 2);
      ctx.fillStyle = P.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(ellipsize(ctx, T.footer, CW), W / 2, y + 30);
    }
    setLS(ctx, 0); y += 76;
  }
  y += 40;
  return { end: y, nG };
}

/** 單張卡片。回傳高度；draw=true 時真的畫（minH 讓同列等高）。 */
function cardBlock(ctx, P, c, num, x, y0, w, draw, minH) {
  const pad = 46, iw = w - pad * 2;
  let y = y0 + pad;
  if (c.tag && c.tag.trim()) {
    setFont(ctx, 22, 700); setLS(ctx, 4);
    if (draw) { ctx.fillStyle = rgba(P.accent, 0.95); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(ellipsize(ctx, c.tag.toUpperCase(), iw - 100), x + pad, y); }
    setLS(ctx, 0); y += 40;
  }
  if (c.title.trim()) {
    setFont(ctx, 50, 800);
    const lines = wrap(ctx, c.title, iw - 90);
    lines.forEach(ln => { if (draw) { ctx.fillStyle = P.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(ln, x + pad, y); } y += 62; });
    if (draw) { rr(ctx, x + pad, y + 2, 90, 6, 3); ctx.fillStyle = P.accent; ctx.fill(); }
    y += 36;
  }
  c.items.forEach((it, i) => {
    const bx = x + pad;
    if (it.label) {
      setFont(ctx, 33, 800);
      wrap(ctx, it.label, iw - 34).forEach(ln => {
        if (draw) { ctx.fillStyle = P.accent; ctx.beginPath(); ctx.moveTo(bx, y + 22); ctx.lineTo(bx + 9, y + 13); ctx.lineTo(bx + 18, y + 22); ctx.lineTo(bx + 9, y + 31); ctx.fill(); ctx.fillStyle = P.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(ln, bx + 34, y); }
        y += 42;
      });
      if (it.text) {
        setFont(ctx, 29, 400);
        wrap(ctx, it.text, iw - 34).forEach(ln => { if (draw) { ctx.fillStyle = P.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(ln, bx + 34, y); } y += 40; });
      }
      y += 20;
    } else {
      setFont(ctx, 31, 400);
      const lines = wrap(ctx, it.text, iw - 34);
      lines.forEach((ln, k) => {
        if (draw) {
          if (!k) { ctx.fillStyle = P.accent; ctx.beginPath(); ctx.arc(bx + 8, y + 21, 7, 0, 7); ctx.fill(); }
          ctx.fillStyle = P.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(ln, bx + 34, y);
        }
        y += 42;
      });
      y += 14;
    }
  });
  let h = y - y0 + pad - 14;
  if (minH) h = Math.max(h, minH);
  if (draw) {
    ctx.save();
    // 底板最後才畫（用 destination-over 墊在文字下面）
    ctx.globalCompositeOperation = 'destination-over';
    rr(ctx, x, y0, w, h, 34); ctx.fillStyle = P.card; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = P.cardLine; ctx.stroke();
    ctx.restore();
    setFont(ctx, 120, 800, '', TFONT); ctx.fillStyle = rgba(P.accent, 0.13); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText(String(num).padStart(2, '0'), x + w - 30, y0 + 14);
  }
  return h;
}

function backdrop(ctx, P, W, H) {
  const g = ctx.createLinearGradient(0, 0, W * 0.4, H); g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const bg = (S.bgAuto && S.theme !== 'pdf') ? null : S.images.find(i => i.id === S.bgId && i.el);
  if (bg) {
    drawCover(ctx, bg.el, 0, 0, W, H, 0.5, 0.5);
    ctx.fillStyle = rgba(P.bg1, S.overlay); ctx.fillRect(0, 0, W, H);
  }
  const R = rng(20240229);
  if (P.dark) {
    for (let i = 0; i < Math.round(H / 7); i++) {
      const r = R() < 0.06 ? 3 : R() < 0.3 ? 2 : 1.2;
      ctx.fillStyle = `rgba(255,255,255,${0.15 + R() * 0.6})`;
      ctx.beginPath(); ctx.arc(R() * W, R() * H, r, 0, 7); ctx.fill();
    }
  }
  for (const [cx, cy, r, a] of [[W * 0.92, H * 0.06, W * 0.7, 0.2], [W * 0.05, H * 0.55, W * 0.6, 0.12], [W * 0.85, H * 0.96, W * 0.65, 0.16]]) {
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    rg.addColorStop(0, rgba(P.accent, a)); rg.addColorStop(1, rgba(P.accent, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  ctx.lineWidth = 3; ctx.strokeStyle = rgba(P.accent, P.dark ? 0.55 : 0.7);
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(P.accent, 0.25); ctx.strokeRect(48, 48, W - 96, H - 96);
}

const measureCv = document.createElement('canvas');
function renderTo(cv, scale) {
  const W = 1600, P = palette(), mctx = measureCv.getContext('2d');
  const r1 = compose(mctx, P, W, 0, 0, false);
  const ratio = SIZES[S.size];
  const Hp = ratio ? Math.round(W * ratio) : 0;
  let H = r1.end, extra = 0, flex = 0;
  if (Hp > r1.end) {
    const need = Hp - r1.end;
    extra = Math.min(need / Math.max(1, r1.nG), 150);
    flex = need - extra * r1.nG; H = Hp;
  }
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  backdrop(ctx, P, W, H);
  compose(ctx, P, W, extra, flex, true);
  return { W, H };
}

// ------------------------------------------------------------ 顯示／重繪
const cv = $('cv');
let raf = 0;
function redraw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; try { const d = renderTo(cv, 1); $('dims').textContent = `${d.W} × ${d.H} px`; applyFit(d); } catch (e) { console.error(e); toast('繪製失敗：' + e.message); } }); }
function applyFit(d) {
  d = d || { W: cv.width, H: cv.height };
  const st = $('stage'), mode = $('fit').value;
  let w;
  if (mode === 'full') w = d.W;
  else if (mode === 'h') w = Math.max(200, (st.clientHeight - 70)) * d.W / d.H;
  else w = Math.min(st.clientWidth - 36, 1000);
  cv.style.width = Math.round(w) + 'px'; cv.style.height = Math.round(w * d.H / d.W) + 'px';
}
window.addEventListener('resize', () => applyFit());
$('fit').onchange = () => applyFit();
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200); }

// ------------------------------------------------------------ 載入 PDF
function setStatus(m, err) { const s = $('status'); s.textContent = m; s.className = err ? 'err' : ''; }
function setBar(f) { const b = $('bar'); b.style.display = f >= 1 || f <= 0 ? 'none' : 'block'; b.firstElementChild.style.width = Math.round(f * 100) + '%'; }

function imgFromBytes(bytes, mime) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    const el = new Image(); el.onload = () => res({ el, url }); el.onerror = () => rej(new Error('圖片無法顯示')); el.src = url;
  });
}
async function ensureImage(it) {
  if (it.el) return it.el;
  if (!it.pending) it.pending = it.ex.load().then(r => imgFromBytes(r.bytes, r.mime)).then(r => { it.el = r.el; it.url = r.url; return r.el; });
  return it.pending;
}

async function loadPdf(bytes, name) {
  setStatus('讀取中…'); setBar(0.01);
  try {
    const ex = await PosterExtract.extract(bytes, (f, m) => { setBar(f); setStatus(m); });
    S.fileName = name.replace(/\.pdf$/i, '').replace(/\.(pptx?|docx?|key)$/i, '');
    const model = PosterExtract.analyze(ex, { fileName: S.fileName });
    S.model = model;
    // 圖片
    S.images.forEach(i => i.url && URL.revokeObjectURL(i.url));
    S.images = ex.images.map(im => ({ id: im.id, page: im.page, isBg: im.isBg, pw: im.pw, ph: im.ph, el: null, url: null, ex: im }));
    const photos = S.images.filter(i => !i.isBg);
    for (const it of photos) { try { await ensureImage(it); } catch (e) { it.bad = true; } }
    S.images = S.images.filter(i => !i.bad);
    const ph = S.images.filter(i => !i.isBg);
    S.heroId = ph.length ? ph.slice().sort((a, b) => b.pw * b.ph - a.pw * a.ph)[0].id : 0;
    S.extraIds = [];
    S.bgId = 0; S.bgAuto = false;
    const bgs = S.images.filter(i => i.isBg);
    const t = S.text;
    t.title = model.title; t.kicker = model.kicker; t.tagline = model.tagline; t.intro = model.intro;
    t.quote = model.quote; t.quoteBy = model.quoteBy;
    t.cardsH = model.lang === 'zh' ? '重點速覽' : 'Key Facts';
    t.timeH = model.lang === 'zh' ? '時間軸' : 'Timeline';
    t.footer = (model.lang === 'zh' ? '資料來源：' : 'Source: ') + S.fileName;
    S.cards = model.cards.map(c => ({ page: c.page, tag: c.tag || '', title: c.title, items: c.items.map(i => ({ label: i.label || '', text: i.text || '' })), on: c.on }));
    // 預設只放最豐富的 4 張（有小標的優先），海報才不會長成一條；其餘可在面板勾選
    const rich = S.cards.map((c, i) => ({ i, s: c.items.filter(x => x.label).length * 10 + Math.min(c.items.length, 6) })).sort((a, b) => b.s - a.s).slice(0, 4).map(x => x.i);
    S.cards.forEach((c, i) => c.on = rich.includes(i));
    S.stats = model.stats.map(s => ({ value: s.value, label: s.label }));
    S.timeline = model.timeline.map(x => ({ year: x.year, text: x.text }));
    S.accent = '';
    buildPanel();
    setBar(1);
    const nPhoto = ph.length;
    setStatus(`完成：${ex.pages.length} 頁，擷取 ${nPhoto} 張照片、${bgs.length} 張頁面底圖，${S.cards.length} 張重點卡片。` + (ex.warnings.length ? ' ⚠ ' + ex.warnings.join('；') : ''));
    ['btnPng', 'btnPdf', 'btnPng2', 'btnPdf2'].forEach(id => $(id).disabled = false);
    redraw();
    // 背景底圖慢慢解（只有要用時才需要，順便預設用封面那張）
    for (const it of bgs) {
      try { await ensureImage(it); } catch (e) { continue; }
      if (!S.bgId && it.page === 1) { S.bgId = it.id; S.bgAuto = true; }
      renderGallery(); redraw();
    }
  } catch (e) {
    console.error(e); setBar(0);
    setStatus('讀取失敗：' + (e && e.message || e), true);
  }
}
async function loadFile(f) {
  if (!f) return;
  if (!/pdf$/i.test(f.name) && f.type !== 'application/pdf') { setStatus('這不是 PDF 檔。', true); return; }
  const buf = await f.arrayBuffer();
  loadPdf(new Uint8Array(buf), f.name);
}
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = () => { loadFile(file.files[0]); file.value = ''; };
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

// ------------------------------------------------------------ 面板
const SECS = [['intro', '簡介'], ['stats', '大數字'], ['cards', '重點卡片'], ['timeline', '時間軸'], ['quote', '名言'], ['gallery', '副圖']];
function buildStatic() {
  $('themes').innerHTML = Object.entries(THEMES).map(([k, t]) => {
    const bg = k === 'pdf' ? 'linear-gradient(135deg,#0b1030,#ffc857)' : `linear-gradient(135deg,${t.bg1},${t.bg2} 60%,${t.accent})`;
    return `<div class="sw" data-k="${k}" style="background:${bg}">${t.name}</div>`;
  }).join('');
  $('secs').innerHTML = SECS.map(([k, n]) => `<label><input type="checkbox" data-sec="${k}" checked>${n}</label>`).join('');
}
function syncStatic() {
  document.querySelectorAll('.sw').forEach(e => e.classList.toggle('on', e.dataset.k === S.theme));
  $('size').value = S.size; $('overlay').value = S.overlay; $('ovV').textContent = Math.round(S.overlay * 100) + '%';
  $('accent').value = S.accent || palette().accent;
  document.querySelectorAll('[data-sec]').forEach(c => c.checked = S.sec[c.dataset.sec]);
}
$('themes').onclick = e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; S.theme = k; S.accent = ''; syncStatic(); redraw(); };
$('size').onchange = e => { S.size = e.target.value; redraw(); };
$('overlay').oninput = e => { S.overlay = +e.target.value; $('ovV').textContent = Math.round(S.overlay * 100) + '%'; redraw(); };
$('accent').oninput = e => { S.accent = e.target.value; redraw(); };
$('accentAuto').onclick = () => { S.accent = ''; syncStatic(); redraw(); };
$('secs').onchange = e => { const k = e.target.dataset.sec; if (k) { S.sec[k] = e.target.checked; redraw(); } };

const TEXTS = { tTitle: 'title', tKicker: 'kicker', tTagline: 'tagline', tIntro: 'intro', tQuote: 'quote', tQuoteBy: 'quoteBy', tCardsH: 'cardsH', tTimeH: 'timeH', tFooter: 'footer' };
for (const [id, k] of Object.entries(TEXTS)) $(id).oninput = e => { S.text[k] = e.target.value; redraw(); };

// 圖片
function renderGallery() {
  const mk = it => {
    const cls = it.id === S.heroId ? 'hero' : S.extraIds.includes(it.id) ? 'extra' : it.id === S.bgId ? 'bg' : '';
    const tag = cls === 'hero' ? '主圖' : cls === 'extra' ? '副圖' : cls === 'bg' ? '背景' : '';
    return `<figure class="${cls}" data-id="${it.id}" title="第 ${it.page} 頁，${it.pw}×${it.ph}">${it.url ? `<img src="${it.url}" alt="">` : ''}${tag ? `<span class="tag">${tag}</span>` : ''}<figcaption><span>第 ${it.page} 頁</span><span>${it.pw}×${it.ph}</span></figcaption></figure>`;
  };
  const ph = S.images.filter(i => !i.isBg), bg = S.images.filter(i => i.isBg);
  $('gal').innerHTML = ph.length ? ph.map(mk).join('') : '<div class="hint">這份 PDF 裡沒有找到可用的照片。</div>';
  $('galBg').innerHTML = bg.map(mk).join('') + (bg.length ? `<figure data-id="0" class="${S.bgId ? '' : 'bg'}" style="display:flex;align-items:center;justify-content:center;font-size:12.5px">${S.bgId ? '不用背景圖' : '✔ 不用背景圖'}</figure>` : '');
  $('bgHead').style.display = bg.length ? 'block' : 'none';
  $('imgCount').textContent = `（照片 ${ph.length}・底圖 ${bg.length}）`;
}
function galClick(e) {
  const f = e.target.closest('figure'); if (!f) return;
  const id = +f.dataset.id, it = S.images.find(i => i.id === id);
  const mode = document.querySelector('input[name=mode]:checked').value;
  const bgBefore = S.bgId;
  if (!it) { S.bgId = 0; }
  else if (it.isBg) { S.bgId = S.bgId === id ? 0 : id; }
  else if (mode === 'hero') { S.heroId = S.heroId === id ? 0 : id; S.extraIds = S.extraIds.filter(x => x !== id); }
  else if (mode === 'extra') {
    if (S.heroId === id) return toast('這張已是主圖');
    S.extraIds = S.extraIds.includes(id) ? S.extraIds.filter(x => x !== id) : S.extraIds.concat(id).slice(-4);
  } else { S.bgId = S.bgId === id ? 0 : id; }
  if (S.bgId !== bgBefore) S.bgAuto = false;
  renderGallery(); redraw();
}
$('gal').onclick = galClick; $('galBg').onclick = galClick;

// 卡片
const items2text = items => items.map(i => i.label ? i.label + ' ｜ ' + i.text : i.text).join('\n');
function text2items(t) {
  return t.split(/\n/).map(s => s.trim()).filter(Boolean).map(s => {
    const k = s.indexOf('｜');
    if (k > 0) return { label: s.slice(0, k).trim(), text: s.slice(k + 1).trim() };
    return { label: '', text: s };
  });
}
function renderCards() {
  $('cardCount').textContent = `（${S.cards.filter(c => c.on).length}/${S.cards.length} 張）`;
  $('cards').innerHTML = S.cards.map((c, i) => `
    <div class="card ${c.on ? '' : 'off'}" data-i="${i}">
      <div class="head"><input type="checkbox" data-f="on" ${c.on ? 'checked' : ''} title="放進海報">
        <input type="text" data-f="title" value="${esc(c.title)}" placeholder="卡片標題">
        <button class="sm" data-act="up" title="上移">▲</button><button class="sm" data-act="down" title="下移">▼</button><button class="sm" data-act="del" title="刪除">✕</button></div>
      <input type="text" data-f="tag" value="${esc(c.tag)}" placeholder="小標籤（章節名，可空白）" style="margin-bottom:5px">
      <textarea data-f="items" placeholder="每行一個要點；「小標 ｜ 內文」">${esc(items2text(c.items))}</textarea>
    </div>`).join('') || '<div class="hint">沒有卡片。</div>';
}
$('cards').addEventListener('input', e => {
  const box = e.target.closest('.card'); if (!box) return; const c = S.cards[+box.dataset.i], f = e.target.dataset.f;
  if (f === 'on') { c.on = e.target.checked; box.classList.toggle('off', !c.on); $('cardCount').textContent = `（${S.cards.filter(x => x.on).length}/${S.cards.length} 張）`; }
  else if (f === 'items') c.items = text2items(e.target.value);
  else if (f) c[f] = e.target.value;
  redraw();
});
$('cards').addEventListener('click', e => {
  const a = e.target.dataset.act; if (!a) return; const i = +e.target.closest('.card').dataset.i;
  if (a === 'del') S.cards.splice(i, 1);
  else { const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= S.cards.length) return; [S.cards[i], S.cards[j]] = [S.cards[j], S.cards[i]]; }
  renderCards(); redraw();
});
$('addCard').onclick = () => { S.cards.push({ page: 0, tag: '', title: '新卡片', items: [{ label: '', text: '要點' }], on: true }); renderCards(); redraw(); };

// 數字／時間軸（兩欄列表）
function pairList(boxId, arr, a, b, ph) {
  const box = $(boxId);
  box.innerHTML = arr.map((x, i) => `<div class="pair" data-i="${i}"><input type="text" data-k="${a}" value="${esc(x[a])}" placeholder="${ph[0]}"><input type="text" data-k="${b}" value="${esc(x[b])}" placeholder="${ph[1]}"><button class="sm" data-act="del">✕</button></div>`).join('') || '<div class="hint">沒有資料。</div>';
}
function bindPair(boxId, arr, rebuild) {
  const box = $(boxId);
  box.addEventListener('input', e => { const p = e.target.closest('.pair'); if (p && e.target.dataset.k) { arr()[+p.dataset.i][e.target.dataset.k] = e.target.value; redraw(); } });
  box.addEventListener('click', e => { if (e.target.dataset.act === 'del') { arr().splice(+e.target.closest('.pair').dataset.i, 1); rebuild(); redraw(); } });
}
const rStats = () => pairList('stats', S.stats, 'value', 'label', ['數字', '說明']);
const rTimes = () => pairList('times', S.timeline, 'year', 'text', ['年份', '事件']);
bindPair('stats', () => S.stats, rStats); bindPair('times', () => S.timeline, rTimes);
$('addStat').onclick = () => { S.stats.push({ value: '', label: '' }); rStats(); };
$('addTime').onclick = () => { S.timeline.push({ year: '', text: '' }); rTimes(); };

function buildPanel() {
  for (const [id, k] of Object.entries(TEXTS)) $(id).value = S.text[k];
  syncStatic(); renderGallery(); renderCards(); rStats(); rTimes();
}

// ------------------------------------------------------------ 輸出
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const safeName = () => (S.text.title || S.fileName || 'poster').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60);
function exportCanvas() {
  const sc = +$('scale').value, out = document.createElement('canvas');
  let s = sc;
  const probe = renderTo(out, 1);
  while (probe.W * s * probe.H * s > 120e6 && s > 1) s -= 0.5;
  renderTo(out, s);
  return out;
}
const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function savePng() {
  try { toast('輸出中…'); await new Promise(r => setTimeout(r, 30)); const c = exportCanvas(); download(await toBlob(c, 'image/png'), safeName() + '-poster.png'); toast('已下載 PNG（' + c.width + '×' + c.height + '）'); }
  catch (e) { toast('輸出失敗：' + e.message); }
}
async function savePdf() {
  try {
    toast('輸出中…'); await new Promise(r => setTimeout(r, 30));
    const c = exportCanvas(), blob = await toBlob(c, 'image/jpeg', 0.93);
    const jpg = new Uint8Array(await blob.arrayBuffer());
    const wPt = 842, hPt = Math.round(842 * c.height / c.width * 100) / 100;
    download(new Blob([makePdf(jpg, c.width, c.height, wPt, hPt)], { type: 'application/pdf' }), safeName() + '-poster.pdf');
    toast('已下載 PDF');
  } catch (e) { toast('輸出失敗：' + e.message); }
}
/** 單頁 PDF：整張海報當一張 JPEG（DCTDecode 原樣嵌入，不需任何函式庫）。 */
function makePdf(jpg, pw, ph, wPt, hPt) {
  const enc = s => new TextEncoder().encode(s), parts = [], offs = []; let len = 0;
  const push = b => { parts.push(b); len += b.length; };
  push(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2D, 0x31, 0x2E, 0x34, 0x0A, 0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  const obj = (n, body) => { offs[n] = len; push(enc(n + ' 0 obj\n')); push(typeof body === 'string' ? enc(body) : body); push(enc('\nendobj\n')); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wPt} ${hPt}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(enc(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`)); push(jpg); push(enc('\nendstream\nendobj\n'));
  const cs = `q ${wPt} 0 0 ${hPt} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(enc(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`));
  const out = new Uint8Array(len); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
$('btnPng').onclick = $('btnPng2').onclick = savePng;
$('btnPdf').onclick = $('btnPdf2').onclick = savePdf;

// ------------------------------------------------------------ 啟動
buildStatic(); syncStatic(); redraw();
(function boot() {
  const q = new URLSearchParams(location.search);
  const src = q.get('src');
  const report = q.get('report');   // 無頭模式：做完把 PNG 用 POST 回報（make-poster.js 用；dump-dom 會被 virtual-time 搞亂）
  const post = o => fetch(report, { method: 'POST', body: JSON.stringify(o) }).catch(() => {});
  if (report) window.addEventListener('error', e => post({ ok: false, err: String(e.message) + ' @' + e.lineno }));
  if (src) fetch(src).then(r => r.arrayBuffer()).then(async b => {
    await loadPdf(new Uint8Array(b), q.get('name') || decodeURIComponent(src.split('/').pop()));
    if (!report) return;
    const o = JSON.parse(q.get('opt') || '{}');
    if (o.theme) S.theme = o.theme;
    if (o.size) S.size = o.size;
    if (o.title) S.text.title = o.title;
    if (o.nobg) S.bgId = 0;
    const c = document.createElement('canvas');
    renderTo(c, +o.scale || 2);
    post({ ok: true, w: c.width, h: c.height, status: $('status').textContent, model: { title: S.text.title, cards: S.cards.length, stats: S.stats, timeline: S.timeline.length }, png: c.toDataURL('image/png') });
  }).catch(e => report && post({ ok: false, err: String(e && e.stack || e) }));
})();
window.__poster = { S, renderTo, loadPdf, palette, compose };
</script>
</body>
