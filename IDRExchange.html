<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印尼盾面額加總計算機</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; }
        .row { display: flex; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .label { flex: 1; font-weight: bold; color: #555; }
        .label span { font-size: 0.8rem; color: #888; display: block; }
        input[type="number"] { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
        .total-section { margin-top: 20px; padding: 15px; background: #e8f4fd; border-radius: 8px; text-align: center; }
        .total-label { font-size: 1.1rem; color: #34495e; }
        .total-amount { font-size: 1.8rem; font-weight: bold; color: #27ae60; margin-top: 5px; }
        .btn-reset { width: 100%; padding: 10px; margin-top: 15px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-reset:hover { background: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇮🇩 印尼盾計算機</h2>
    
    <div id="denominations">
        <div class="row">
            <div class="label">100,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="100000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">50,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="50000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">20,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="20000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">10,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="10000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">5,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="5000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">2,000 <span>(紙鈔)</span></div>
            <input type="number" class="qty" data-value="2000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">1,000 <span>(紙鈔/硬幣)</span></div>
            <input type="number" class="qty" data-value="1000" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">500 <span>(硬幣)</span></div>
            <input type="number" class="qty" data-value="500" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">200 <span>(硬幣)</span></div>
            <input type="number" class="qty" data-value="200" min="0" placeholder="0">
        </div>
        <div class="row">
            <div class="label">100 <span>(硬幣)</span></div>
            <input type="number" class="qty" data-value="100" min="0" placeholder="0">
        </div>
    </div>

    <div class="total-section">
        <div class="total-label">總計金額 (Total)</div>
        <div class="total-amount">Rp <span id="grandTotal">0</span></div>
    </div>

    <button class="btn-reset" onclick="resetAll()">清空重算</button>
</div>

<script>
    const inputs = document.querySelectorAll('.qty');
    const totalDisplay = document.getElementById('grandTotal');

    inputs.forEach(input => {
        input.addEventListener('input', calculate);
    });

    function calculate() {
        let total = 0;
        inputs.forEach(input => {
            const val = parseInt(input.getAttribute('data-value'));
            const qty = parseInt(input.value) || 0;
            total += val * qty;
        });
        // 使用國際格式化數字 (加逗號)
        totalDisplay.textContent = total.toLocaleString('id-ID');
    }

    function resetAll() {
        inputs.forEach(input => input.value = '');
        totalDisplay.textContent = '0';
    }
</script>

</body>
</html>
