<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印尼盾全方位計算機</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 480px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        h3 { font-size: 1rem; color: #5f6368; border-left: 4px solid #1a73e8; padding-left: 10px; margin: 20px 0 10px; }
        
        /* 匯率區塊樣式 */
        .fx-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; margin-bottom: 5px; color: #666; }
        
        /* 面額區塊樣 style */
        .row { display: flex; align-items: center; margin-bottom: 8px; padding: 8px; background: #fff; border-radius: 8px; transition: 0.2s; }
        .row:hover { background: #f1f3f4; }
        .label { flex: 1; font-weight: 500; }
        .label span { font-size: 0.75rem; color: #9aa0a6; margin-left: 5px; }
        input[type="number"] { width: 90px; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; text-align: right; font-size: 1rem; }
        
        /* 總計區塊 */
        .total-box { margin-top: 25px; padding: 20px; background: #1a73e8; color: white; border-radius: 12px; text-align: center; }
        .total-amount { font-size: 2rem; font-weight: bold; margin-top: 5px; }
        .btn-reset { width: 100%; padding: 12px; margin-top: 15px; background: #f1f3f4; border: none; border-radius: 8px; cursor: pointer; color: #3c4043; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇮🇩 印尼盾 IDR 計算機</h2>

    <h3>美金匯率換算</h3>
    <div class="fx-section">
        <div class="fx-grid">
            <div class="input-group">
                <label>美金金額 (USD)</label>
                <input type="number" id="usdAmount" placeholder="0" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>當前匯率 (1 USD = ?)</label>
                <input type="number" id="fxRate" value="16832" oninput="calculate()">
            </div>
        </div>
        <p style="font-size: 0.85rem; color: #1e8e3e; margin-top: 10px; margin-bottom: 0;">
            換算 IDR: Rp <span id="usdToIdrResult">0</span>
        </p>
    </div>

    <h3>現金面額點算</h3>
    <div id="denominations">
        <div class="row"><div class="label">100.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="100000" oninput="calculate()"></div>
        <div class="row"><div class="label">50.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="50000" oninput="calculate()"></div>
        <div class="row"><div class="label">20.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="20000" oninput="calculate()"></div>
        <div class="row"><div class="label">10.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="10000" oninput="calculate()"></div>
        <div class="row"><div class="label">5.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="5000" oninput="calculate()"></div>
        <div class="row"><div class="label">2.000 <span>紙鈔</span></div><input type="number" class="qty" data-value="2000" oninput="calculate()"></div>
        <div class="row"><div class="label">1.000 <span>硬幣/紙</span></div><input type="number" class="qty" data-value="1000" oninput="calculate()"></div>
        <div class="row"><div class="label">500 <span>硬幣</span></div><input type="number" class="qty" data-value="500" oninput="calculate()"></div>
    </div>

    <div class="total-box">
        <div style="font-size: 0.9rem; opacity: 0.9;">總計金額 (Grand Total)</div>
        <div class="total-amount">Rp <span id="grandTotal">0</span></div>
    </div>

    <button class="btn-reset" onclick="resetAll()">全部清空</button>
</div>

<script>
    function calculate() {
        // 1. 計算美金換算部分
        const usdAmount = parseFloat(document.getElementById('usdAmount').value) || 0;
        const fxRate = parseFloat(document.getElementById('fxRate').value) || 0;
        const usdConverted = usdAmount * fxRate;
        document.getElementById('usdToIdrResult').textContent = usdConverted.toLocaleString('id-ID');

        // 2. 計算實體面額部分
        let cashTotal = 0;
        const inputs = document.querySelectorAll('.qty');
        inputs.forEach(input => {
            const val = parseInt(input.getAttribute('data-value'));
            const qty = parseInt(input.value) || 0;
            cashTotal += val * qty;
        });

        // 3. 總加總
        const grandTotal = usdConverted + cashTotal;
        document.getElementById('grandTotal').textContent = grandTotal.toLocaleString('id-ID');
    }

    function resetAll() {
        document.getElementById('usdAmount').value = '';
        const inputs = document.querySelectorAll('.qty');
        inputs.forEach(input => input.value = '');
        calculate();
    }
</script>

</body>
</html>
