<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印尼盾全方位計算機</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; margin-bottom: 20px; }
        h3 { font-size: 0.95rem; color: #5f6368; border-left: 4px solid #1a73e8; padding-left: 10px; margin: 20px 0 12px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 匯率與換算區塊 */
        .fx-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; margin-bottom: 5px; color: #666; font-weight: bold; }
        
        /* 面額區塊 */
        .row { display: flex; align-items: center; margin-bottom: 8px; padding: 8px 12px; background: #fff; border-radius: 8px; border: 1px solid #f1f3f4; }
        .label { flex: 1; font-weight: 500; font-size: 1.1rem; }
        .label span { font-size: 0.75rem; color: #9aa0a6; margin-left: 5px; }
        input[type="number"] { width: 100px; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; text-align: right; font-size: 1rem; }
        input:focus { outline: none; border-color: #1a73e8; background: #fdfdfd; }

        /* 結果展示區 */
        .result-panel { margin-top: 25px; padding: 20px; background: #1a73e8; color: white; border-radius: 12px; text-align: center; }
        .total-amount { font-size: 2.2rem; font-weight: bold; margin: 8px 0; }
        .twd-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 8px; font-size: 1.1rem; }
        .twd-amount { font-weight: bold; color: #ffd700; font-size: 1.3rem; }
        
        .btn-reset { width: 100%; padding: 12px; margin-top: 15px; background: #f1f3f4; border: none; border-radius: 8px; cursor: pointer; color: #3c4043; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇮🇩 IDR 萬能計算機</h2>

    <h3>美金匯率換算 (USD → IDR)</h3>
    <div class="fx-section">
        <div class="fx-grid">
            <div class="input-group">
                <label>美金金額 (USD)</label>
                <input type="number" id="usdAmount" placeholder="0" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>美金匯率 (1 USD=?)</label>
                <input type="number" id="fxRate" value="16832" oninput="calculate()">
            </div>
        </div>
    </div>

    <h3>台幣換算設定 (IDR → TWD)</h3>
    <div class="fx-section" style="background-color: #fff9e6; border-color: #ffe082;">
        <div class="fx-grid" style="grid-template-columns: 1fr;">
            <div class="input-group">
                <label>目前台幣匯率 (1 TWD 可換多少 IDR?)</label>
                <input type="number" id="twdRate" value="515" oninput="calculate()" style="width: 100%; box-sizing: border-box;">
                <span style="font-size: 0.7rem; color: #888; margin-top: 4px;">* 目前參考值約 510~520 之間</span>
            </div>
        </div>
    </div>

    <h3>現金面額點算</h3>
    <div id="denominations">
        <div class="row"><div class="label">100.000 <span>紙</span></div><input type="number" class="qty" data-value="100000" oninput="calculate()"></div>
        <div class="row"><div class="label">50.000 <span>紙</span></div><input type="number" class="qty" data-value="50000" oninput="calculate()"></div>
        <div class="row"><div class="label">20.000 <span>紙</span></div><input type="number" class="qty" data-value="20000" oninput="calculate()"></div>
        <div class="row"><div class="label">10.000 <span>紙</span></div><input type="number" class="qty" data-value="10000" oninput="calculate()"></div>
        <div class="row"><div class="label">5.000 <span>紙</span></div><input type="number" class="qty" data-value="5000" oninput="calculate()"></div>
        <div class="row"><div class="label">2.000 <span>紙</span></div><input type="number" class="qty" data-value="2000" oninput="calculate()"></div>
        <div class="row"><div class="label">1.000 <span>幣</span></div><input type="number" class="qty" data-value="1000" oninput="calculate()"></div>
        <div class="row"><div class="label">500 <span>幣</span></div><input type="number" class="qty" data-value="500" oninput="calculate()"></div>
    </div>

    <div class="result-panel">
        <div style="font-size: 0.9rem; opacity: 0.9;">總計印尼盾 (IDR)</div>
        <div class="total-amount">Rp <span id="grandTotal">0</span></div>
        <div class="twd-box">
            約合台幣 🇹🇼 <span class="twd-amount">NT$ <span id="twdResult">0</span></span>
        </div>
    </div>

    <button class="btn-reset" onclick="resetAll()">全部清空</button>
</div>

<script>
    function calculate() {
        // 1. 計算美金換來的印尼盾
        const usdAmount = parseFloat(document.getElementById('usdAmount').value) || 0;
        const fxRate = parseFloat(document.getElementById('fxRate').value) || 0;
        const usdConverted = usdAmount * fxRate;

        // 2. 計算實體面額總計
        let cashTotal = 0;
        const inputs = document.querySelectorAll('.qty');
        inputs.forEach(input => {
            const val = parseInt(input.getAttribute('data-value'));
            const qty = parseInt(input.value) || 0;
            cashTotal += val * qty;
        });

        // 3. 印尼盾總和
        const grandTotalIdr = usdConverted + cashTotal;
        document.getElementById('grandTotal').textContent = grandTotalIdr.toLocaleString('id-ID');

        // 4. 換算回台幣
        // 算法：印尼盾總額 / 台幣匯率
        const twdRate = parseFloat(document.getElementById('twdRate').value) || 1;
        const twdTotal = Math.round(grandTotalIdr / twdRate);
        document.getElementById('twdResult').textContent = twdTotal.toLocaleString('zh-TW');
    }

    function resetAll() {
        document.getElementById('usdAmount').value = '';
        const inputs = document.querySelectorAll('.qty');
        inputs.forEach(input => input.value = '');
        calculate();
    }
</script>

</body>
</html>
