<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印尼盾全方位音效計算機</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; margin-bottom: 20px; }
        h3 { font-size: 0.95rem; color: #5f6368; border-left: 4px solid #1a73e8; padding-left: 10px; margin: 20px 0 12px; }
        
        .fx-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; margin-bottom: 5px; color: #666; font-weight: bold; }
        
        .row { display: flex; align-items: center; margin-bottom: 8px; padding: 8px 12px; background: #fff; border-radius: 8px; border: 1px solid #f1f3f4; }
        .label { flex: 1; font-weight: 500; font-size: 1.1rem; }
        .label span { font-size: 0.75rem; color: #9aa0a6; margin-left: 5px; }
        input[type="number"] { width: 100px; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; text-align: right; font-size: 1rem; }

        .result-panel { margin-top: 25px; padding: 20px; background: #1a73e8; color: white; border-radius: 12px; text-align: center; position: relative; overflow: hidden; }
        .total-amount { font-size: 2.2rem; font-weight: bold; margin: 8px 0; }
        .twd-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 8px; font-size: 1.1rem; }
        .twd-amount { font-weight: bold; color: #ffd700; font-size: 1.3rem; }
        
        .btn-reset { width: 100%; padding: 12px; margin-top: 15px; background: #f1f3f4; border: none; border-radius: 8px; cursor: pointer; color: #3c4043; font-weight: 500; }
        .btn-reset:active { background: #e0e0e0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇮🇩 IDR 萬能計算機 🔊</h2>

    <h3>美金匯率換算 (USD → IDR)</h3>
    <div class="fx-section">
        <div class="fx-grid">
            <div class="input-group">
                <label>美金金額 (USD)</label>
                <input type="number" id="usdAmount" placeholder="0" oninput="handleInput()">
            </div>
            <div class="input-group">
                <label>美金匯率</label>
                <input type="number" id="fxRate" value="16832" oninput="handleInput()">
            </div>
        </div>
    </div>

    <h3>台幣換算設定 (IDR → TWD)</h3>
    <div class="fx-section" style="background-color: #fff9e6; border-color: #ffe082;">
        <div class="input-group">
            <label>台幣匯率 (1 TWD = ? IDR)</label>
            <input type="number" id="twdRate" value="515" oninput="handleInput()" style="width: 100%; box-sizing: border-box;">
        </div>
    </div>

    <h3>現金面額點算</h3>
    <div id="denominations">
        <div class="row"><div class="label">100.000 <span>紙</span></div><input type="number" class="qty" data-value="100000" oninput="handleInput()"></div>
        <div class="row"><div class="label">50.000 <span>紙</span></div><input type="number" class="qty" data-value="50000" oninput="handleInput()"></div>
        <div class="row"><div class="label">20.000 <span>紙</span></div><input type="number" class="qty" data-value="20000" oninput="handleInput()"></div>
        <div class="row"><div class="label">10.000 <span>紙</span></div><input type="number" class="qty" data-value="10000" oninput="handleInput()"></div>
        <div class="row"><div class="label">5.000 <span>紙</span></div><input type="number" class="qty" data-value="5000" oninput="handleInput()"></div>
        <div class="row"><div class="label">2.000 <span>紙</span></div><input type="number" class="qty" data-value="2000" oninput="handleInput()"></div>
        <div class="row"><div class="label">1.000 <span>幣</span></div><input type="number" class="qty" data-value="1000" oninput="handleInput()"></div>
        <div class="row"><div class="label">500 <span>幣</span></div><input type="number" class="qty" data-value="500" oninput="handleInput()"></div>
    </div>

    <div class="result-panel">
        <div style="font-size: 0.9rem; opacity: 0.9;">總計印尼盾 (IDR)</div>
        <div class="total-amount">Rp <span id="grandTotal">0</span></div>
        <div class="twd-box">約合台幣 🇹🇼 <span id="twdResult">0</span> 元</div>
    </div>

    <button class="btn-reset" onclick="resetAll()">全部清空</button>
</div>

<script>
    // 建立音效上下文
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 播放打字聲 (短促的高音)
    function playTick() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    // 播放收銀聲 (叮！雙頻音)
    function playChime() {
        const now = audioCtx.currentTime;
        [660, 880].forEach(freq => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.5);
        });
    }

    function handleInput() {
        playTick();
        calculate();
    }

    function calculate() {
        const usdAmount = parseFloat(document.getElementById('usdAmount').value) || 0;
        const fxRate = parseFloat(document.getElementById('fxRate').value) || 0;
        const usdConverted = usdAmount * fxRate;

        let cashTotal = 0;
        document.querySelectorAll('.qty').forEach(input => {
            cashTotal += (parseInt(input.getAttribute('data-value')) * (parseInt(input.value) || 0));
        });

        const grandTotalIdr = usdConverted + cashTotal;
        document.getElementById('grandTotal').textContent = grandTotalIdr.toLocaleString('id-ID');

        const twdRate = parseFloat(document.getElementById('twdRate').value) || 1;
        document.getElementById('twdResult').textContent = Math.round(grandTotalIdr / twdRate).toLocaleString('zh-TW');
    }

    function resetAll() {
        playChime();
        document.getElementById('usdAmount').value = '';
        document.querySelectorAll('.qty').forEach(input => input.value = '');
        calculate();
    }
</script>

</body>
</html>
