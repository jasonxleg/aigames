<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>無限念界 - 線上對戰加強版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #050304;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            color: #fff;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 900px;
            max-height: 900px;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            border: 2px solid #2a1410;
            box-shadow: 0 0 80px rgba(255, 90, 30, 0.45);
            cursor: crosshair;
            background: #000;
        }
        #lobby {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #2a1408 0%, #050304 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }
        #lobby h1 {
            font-size: 28px;
            color: #ffb05a;
            text-shadow: 0 0 22px #ff6622;
            margin-bottom: 8px;
            text-align: center;
        }
        #lobby .sub { color: rgba(255, 200, 150, 0.65); margin-bottom: 24px; text-align: center; font-size: 14px; }
        .panel {
            background: rgba(20, 8, 0, 0.7);
            border: 1px solid rgba(255, 130, 50, 0.4);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(255, 90, 30, 0.18);
        }
        .panel h3 { color: #ffc266; margin-bottom: 12px; font-size: 16px; }
        button {
            background: linear-gradient(180deg, #ff8a33 0%, #cc5500 100%);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 6px;
            font-family: inherit;
            box-shadow: 0 0 12px rgba(255, 120, 50, 0.5);
            transition: transform 0.1s;
            touch-action: manipulation;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
        button.guest { background: linear-gradient(180deg, #a98aff 0%, #5b3aa0 100%); box-shadow: 0 0 12px rgba(169, 138, 255, 0.5); }
        input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 160, 80, 0.45);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            width: 100%;
            margin-bottom: 10px;
        }
        #roomCode {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #ffd966;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            user-select: all;
            border: 1px dashed rgba(255, 160, 80, 0.5);
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }
        #status { color: #ffd966; font-size: 14px; margin-top: 16px; min-height: 20px; text-align: center; }
        #status.err { color: #ff5544; }
        
        #touchOverlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.35); }
        #novaBtn { right: 20px; bottom: 110px; border-color: #ff44aa; box-shadow: 0 0 15px rgba(255, 68, 170, 0.3); }
        #restartBtn { right: 20px; bottom: 200px; border-color: #ffd700; font-size: 14px; }
        
        #tutorial {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 200, 150, 0.65);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            line-height: 1.6;
            z-index: 5;
            width: 90%;
        }
        #netInfo {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 220, 180, 0.7);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            z-index: 5;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="lobby">
        <h1>無限念界 · 線上對戰</h1>
        <div class="sub">跨平台 PeerJS / WebRTC P2P 1v1</div>

        <div id="modeSelect" class="panel">
            <h3>選擇身份</h3>
            <button id="hostBtn" style="width:100%; margin: 6px 0;">建立房間 (P1 橘)</button>
            <button id="joinBtn" class="guest" style="width:100%; margin: 6px 0;">加入房間 (P2 紫)</button>
        </div>

        <div id="hostInfo" class="panel hidden">
            <h3>你的房間碼（傳給朋友）</h3>
            <div id="roomCode">建立中...</div>
            <button id="copyBtn" style="width:100%; margin: 0 0 10px 0;">複製房號</button>
            <div style="color: rgba(255,255,255,0.6); font-size: 13px; text-align: center;">⏳ 等待對手加入中...</div>
        </div>

        <div id="joinInfo" class="panel hidden">
            <h3>輸入房間碼</h3>
            <input id="roomInput" placeholder="貼上對方的房間碼" autocomplete="off">
            <button id="connectBtn" class="guest" style="width:100%; margin: 0 0 10px 0;">連線開戰</button>
            <div id="backToMode" style="cursor:pointer; color:#ff8a33; text-align:center; font-size:14px; margin-top:5px;">← 返回選擇身份</div>
        </div>

        <div id="status"></div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="900" class="hidden"></canvas>
        
        <div id="touchOverlay" class="hidden">
            <div id="novaBtn" class="touch-btn">念波</div>
            <div id="restartBtn" class="touch-btn hidden">重開</div>
        </div>
        
        <div id="tutorial" class="hidden">
            電腦：WASD移動 | 按住滑鼠射擊(自動鎖定敵方) | Q念波 | R重開<br>
            手機：左下角隱形搖桿移動 | 右半邊觸控射擊(自動鎖定) | 點擊按鈕放念波<br>
            接寶石(10秒)：💎散彈 🛡️防護罩 🍄縮小對方 ⚡雷射
        </div>
        <div id="netInfo" class="hidden">
            <span id="netRole"></span> ｜ Ping: <span id="netPing">--</span>ms
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ============= 連線網路層 =============
const net = {
    peer: null,
    conn: null,
    role: null,
    connected: false,
    remote: { x: 0, y: -100, vx: 0, vy: 0, aim: 0, hp: 100, nen: 0 },
    remoteRender: { x: 0, y: -100 },
    ping: 0,
    lastPingSent: 0
};

const lobby = document.getElementById('lobby');
const statusEl = document.getElementById('status');

function setStatus(msg, err) {
    statusEl.textContent = msg;
    statusEl.className = err ? 'err' : '';
}

function resetNetworkEntities() {
    if (net.conn) { net.conn.close(); net.conn = null; }
    if (net.peer) { net.peer.destroy(); net.peer = null; }
    net.connected = false;
}

document.getElementById('hostBtn').addEventListener('click', startHost);
document.getElementById('joinBtn').addEventListener('click', () => {
    document.getElementById('modeSelect').classList.add('hidden');
    document.getElementById('joinInfo').classList.remove('hidden');
});
document.getElementById('backToMode').addEventListener('click', () => {
    document.getElementById('joinInfo').classList.add('hidden');
    document.getElementById('modeSelect').classList.remove('hidden');
});
document.getElementById('connectBtn').addEventListener('click', startGuest);
document.getElementById('copyBtn').addEventListener('click', () => {
    const code = document.getElementById('roomCode').textContent;
    navigator.clipboard.writeText(code).then(() => setStatus('已複製到剪貼簿'));
});

function newRoomCode() {
    return 'nen-' + Math.random().toString(36).slice(2, 7);
}

function startHost() {
    resetNetworkEntities();
    net.role = 'host';
    document.getElementById('modeSelect').classList.add('hidden');
    document.getElementById('hostInfo').classList.remove('hidden');
    setStatus('連接 PeerJS broker 中...');

    const roomId = newRoomCode();
    net.peer = new Peer(roomId, { 
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } // 補上 STUN 強化 iOS 穿透
    });

    net.peer.on('open', id => {
        document.getElementById('roomCode').textContent = id;
        setStatus('房間已開，等待對手...');
    });
    net.peer.on('connection', conn => {
        net.conn = conn;
        setStatus('對手已加入，握手中...');
        wireConnection();
    });
    net.peer.on('error', err => handlePeerError(err, roomId));
    net.peer.on('disconnected', () => {
        setStatus('與 Broker 中斷，請重試', true);
        showRetryButton();
    });
}

function startGuest() {
    const roomId = document.getElementById('roomInput').value.trim();
    if (!roomId) { setStatus('請輸入房間碼', true); return; }
    resetNetworkEntities();
    net.role = 'guest';
    setStatus('連到 PeerJS broker 中...');

    net.peer = new Peer({ 
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    });
    net.peer.on('open', myId => {
        setStatus(`已取得 ID，呼叫房間 ${roomId}...`);
        net.conn = net.peer.connect(roomId, { reliable: true });
        wireConnection();
        startConnTimeout(roomId);
    });
    net.peer.on('error', err => handlePeerError(err, roomId));
    net.peer.on('disconnected', () => {
        setStatus('與 Broker 中斷', true);
    });
}

let connTimeoutId = null;
function startConnTimeout(roomId) {
    if (connTimeoutId) clearTimeout(connTimeoutId);
    connTimeoutId = setTimeout(() => {
        if (!net.connected) {
            setStatus(`連線逾時 — 房號可能不存在或對方未開房`, true);
            showRetryButton();
        }
    }, 10000);
}

function handlePeerError(err, roomId) {
    let msg = '錯誤: ' + err.type;
    if (err.type === 'peer-unavailable') msg = `找不到房間 ${roomId || ''}`;
    setStatus(msg, true);
    showRetryButton();
}

function showRetryButton() {
    if (document.getElementById('retryBtn')) return;
    const btn = document.createElement('button');
    btn.id = 'retryBtn';
    btn.textContent = '返回主選單';
    btn.style.marginTop = '12px';
    btn.onclick = () => {
        btn.remove();
        resetNetworkEntities();
        document.getElementById('hostInfo').classList.add('hidden');
        document.getElementById('joinInfo').classList.add('hidden');
        document.getElementById('modeSelect').classList.remove('hidden');
        setStatus('');
    };
    statusEl.parentNode.appendChild(btn);
}

function wireConnection() {
    const onOpen = () => {
        if (connTimeoutId) { clearTimeout(connTimeoutId); connTimeoutId = null; }
        net.connected = true;
        setStatus('已連線！開戰...');
        setTimeout(beginMatch, 600);
    };
    if (net.conn.open) onOpen();
    else net.conn.on('open', onOpen);

    net.conn.on('data', handleMessage);
    net.conn.on('close', () => {
        net.connected = false;
        setStatus('對手已離線', true);
        lobby.classList.remove('hidden');
        document.getElementById('gameCanvas').classList.add('hidden');
        document.getElementById('touchOverlay').classList.add('hidden');
        showRetryButton();
    });
}

function send(msg) {
    if (net.conn && net.conn.open) net.conn.send(msg);
}

function handleMessage(msg) {
    switch (msg.t) {
        case 's':
            if (game.state !== 'playing') return; // 如果已經進入重置階段，丟棄舊的狀態包，防抖動
            net.remote.x = msg.x; net.remote.y = msg.y;
            net.remote.vx = msg.vx; net.remote.vy = msg.vy;
            net.remote.aim = msg.a;
            if (remotePlayer.hitFlash <= 0) remotePlayer.hp = msg.hp;
            remotePlayer.nen = msg.nen;
            // 同步對方的強化狀態 (用於護盾擋傷判定與縮小渲染)
            if (msg.pw !== undefined) { remotePlayer.powerType = msg.pw; remotePlayer.powerTime = msg.pt; remotePlayer.shrinkTime = msg.sk; }
            break;
        case 'b':
            if (game.state !== 'playing') return;
            bullets.push({
                ownerId: remotePlayer.id, x: msg.x, y: msg.y, z: 0, vx: msg.vx, vy: msg.vy,
                radius: 8, color: remotePlayer.color, life: 120, damage: 5, remote: true
            });
            break;
        case 'n':
            if (game.state !== 'playing') return;
            novas.push({
                ownerId: remotePlayer.id, x: msg.x, y: msg.y, r: 10, maxR: 220, speed: 8,
                color: remotePlayer.color, life: 1, hit: new Set(), remote: true
            });
            game.shake = Math.max(game.shake, 6);
            break;
        case 'gem': // host 廣播寶石生成 (guest 接收)
            if (game.state !== 'playing') return;
            gems.push({ id: msg.id, x: msg.x, y: msg.y, z: SPAWN_Z, type: msg.type, pulse: 0, radius: GEM_RADIUS });
            break;
        case 'gc': // 對方收集了寶石 → 移除並對 remotePlayer 套用效果
            if (game.state !== 'playing') return;
            for (let i = gems.length - 1; i >= 0; i--) { if (gems[i].id === msg.id) { gems.splice(i, 1); break; } }
            applyGemEffect(false, msg.type, msg.x, msg.y);
            break;
        case 'laser': // 對方發射雷射 (純渲染，傷害由對方權威端透過 'd' 送達)
            if (game.state !== 'playing') return;
            lasers.push({ ownerId: remotePlayer.id, x: msg.x, y: msg.y, angle: msg.a, life: 14, len: 1600, color: remotePlayer.color, remote: true });
            game.shake = Math.max(game.shake, 5);
            break;
        case 'd':
            if (game.state !== 'playing') return;
            if (localPlayer.powerType === GEM_SHIELD) { // 防護罩：擋下傷害
                spawnParticle(msg.sx, msg.sy, 0, '#4ad6ff', 8, 2);
                break;
            }
            applyDamageLocal(localPlayer, msg.dmg, msg.sx, msg.sy);
            break;
        case 'ko':
            endMatch(msg.winner);
            break;
        case 'rst': // 核心修改：收到對方的強制重開指令，無條件跟隨重開
            resetMatch();
            break;
        case 'ping':
            send({ t: 'pong', ts: msg.ts });
            break;
        case 'pong':
            net.ping = Date.now() - msg.ts;
            document.getElementById('netPing').textContent = net.ping;
            break;
    }
}

function beginMatch() {
    lobby.classList.add('hidden');
    document.getElementById('gameCanvas').classList.remove('hidden');
    document.getElementById('touchOverlay').classList.remove('hidden');
    document.getElementById('tutorial').classList.remove('hidden');
    document.getElementById('netInfo').classList.remove('hidden');
    document.getElementById('netRole').textContent = net.role === 'host' ? 'P1 (Host)' : 'P2 (Guest)';
    assignSides();
    resetMatch();
    if (!game.loopStarted) { game.loopStarted = true; loop(); }
}

// ============= 透視相機與設定 =============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cam = { cx: W / 2, cy: H / 2 + 90, focal: 360 };
const TUNNEL_W = 320;
const TUNNEL_H = 380;
const MAX_Z = 3000;
const SPAWN_Z = 2700;

// ============= 寶石強化系統設定 =============
const POWER_DURATION = 600;          // 10 秒 (約 60fps)
const GEM_SCATTER = 1;               // 扇形散彈
const GEM_SHIELD  = 2;               // 防護罩
const GEM_MUSHROOM = 3;              // 香菇 (讓對方變小)
const GEM_LASER   = 4;               // 雷射
const GEM_RADIUS  = 26;              // 寶石半徑（放大，手機較好辨識）
const GEM_MIN_GAP = 300;             // 寶石彼此最小間距（避免生成太近）
function gemColor(type) {
    switch (type) {
        case GEM_SCATTER:  return '#ffd54a';
        case GEM_SHIELD:   return '#4ad6ff';
        case GEM_MUSHROOM: return '#ff5aa0';
        case GEM_LASER:    return '#6cff6c';
        default: return '#ffffff';
    }
}
// drawBlackholeCore 調色盤：自己吃到 vs 對方吃到 顏色不同
const CORE_PALETTE_SELF  = { d0: 'rgba(180, 50, 255, 0.85)', d1: 'rgba(255, 80, 200, 0.5)', d2: 'rgba(180, 50, 255, 0)', ring: 'rgba(255, 110, 255, 0.55)' };
const CORE_PALETTE_ENEMY = { d0: 'rgba(50, 255, 180, 0.85)', d1: 'rgba(80, 255, 255, 0.5)', d2: 'rgba(50, 255, 180, 0)', ring: 'rgba(110, 255, 200, 0.55)' };
// 中央黑洞核心狀態 (吃到 gem 時顯示，持續時間與 gem 相同)
const blackholeCore = { timeLeft: 0, palette: CORE_PALETTE_SELF };

function project(x, y, z) {
    const s = cam.focal / (cam.focal + z);
    return { x: cam.cx + x * s, y: cam.cy + y * s, s };
}

// ============= 遊戲狀態 =============
const MATCH_FRAMES = 90 * 60;
const game = {
    state: 'playing', winner: null, timeLeft: MATCH_FRAMES, speed: 5, shake: 0,
    flashColor: null, flashTime: 0, frame: 0, loopStarted: false,
    warpBoost: 0   // 吃到 gem 時的穿梭加速計時（仿 infinite_nen_fall25D 按 space 的加速感）
};
const WARP_BOOST_FRAMES = 50;

// ============= 音效系統 (WebAudio；手機需在使用者手勢後解鎖) =============
const audio = { ctx: null, master: null, enabled: true };
function initAudio() {
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.4;
    audio.master.connect(audio.ctx.destination);
}
// 在使用者手勢中呼叫：建立 / 恢復 AudioContext（iOS Safari 必須）
function unlockAudio() {
    initAudio();
    if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
}
// 以振盪器合成單音；slideTo 指定頻率滑移目標
function beep(freq, dur, type, vol, slideTo) {
    if (!audio.ctx || !audio.enabled || audio.ctx.state !== 'running') return;
    const t = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audio.master);
    osc.start(t); osc.stop(t + dur + 0.03);
}
function sfxShoot() { beep(620, 0.09, 'square', 0.16, 300); }
function sfxLaser() { beep(880, 0.22, 'sawtooth', 0.20, 180); }
function sfxNova()  { beep(150, 0.40, 'sawtooth', 0.28, 60); }
function sfxGem()   { beep(520, 0.10, 'triangle', 0.30, 1040); } // 上揚收集音
function sfxHit()   { beep(200, 0.18, 'square', 0.30, 80); }
function sfxKO()    { beep(330, 0.6, 'sawtooth', 0.30, 110); }

function createPlayer(id, color, accentColor, coreColor, startX) {
    return {
        id, color, accentColor, coreColor, x: startX, y: -100, vx: 0, vy: 0,
        radius: 24, baseRadius: 24, speed: 5.2, hp: 100, maxHp: 100, nen: 30, maxNen: 100,
        invincible: 0, shootCD: 0, novaCD: 0, trail: [], aimAngle: 0, hitFlash: 0,
        powerType: 0, powerTime: 0, shrinkTime: 0
    };
}
const player1 = createPlayer(1, '#ffb05a', '#1ec8d4', '#fff0c4', -140);
const player2 = createPlayer(2, '#a98aff', '#ff44aa', '#ffe0ff',  140);

let localPlayer = null, remotePlayer = null;
function assignSides() {
    if (net.role === 'host') { localPlayer = player1; remotePlayer = player2; } 
    else { localPlayer = player2; remotePlayer = player1; }
    net.remote.x = remotePlayer.x; net.remote.y = remotePlayer.y;
    net.remoteRender.x = remotePlayer.x; net.remoteRender.y = remotePlayer.y;
}

// ============= 輸入控制層 =============
const keys = {};
const mouse = { x: W/2, y: H/2, down: false };
const touchInput = {
    joystick: { active: false, startX: 0, startY: 0, curX: 0, curY: 0, dx: 0, dy: 0, id: null },
    aim: { active: false, id: null }
};

// 任何使用者手勢都嘗試解鎖音訊（手機首次互動後才有聲音）
['touchstart', 'mousedown', 'keydown'].forEach(ev =>
    window.addEventListener(ev, unlockAudio, { passive: true }));

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'r' && game.state === 'finished') triggerLocalRestart();
    if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function getCanvasMousePos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: ((clientX - rect.left) / rect.width) * W,
        y: ((clientY - rect.top) / rect.height) * H
    };
}

canvas.addEventListener('mousemove', e => {
    const pos = getCanvasMousePos(e.clientX, e.clientY);
    mouse.x = pos.x; mouse.y = pos.y;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
document.addEventListener('mouseup', () => mouse.down = false);

window.addEventListener('touchstart', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.target.classList.contains('touch-btn')) {
            // 點擊重開按鈕事件處理 (防多次觸發)
            if (t.target.id === 'restartBtn' && game.state === 'finished') {
                triggerLocalRestart();
            }
            continue;
        }

        if (t.clientX < window.innerWidth / 2 && !touchInput.joystick.active) {
            touchInput.joystick.active = true;
            touchInput.joystick.id = t.identifier;
            touchInput.joystick.startX = t.clientX; touchInput.joystick.startY = t.clientY;
            touchInput.joystick.curX = t.clientX; touchInput.joystick.curY = t.clientY;
        } 
        else if (t.clientX >= window.innerWidth / 2 && !touchInput.aim.active) {
            touchInput.aim.active = true; touchInput.aim.id = t.identifier;
            mouse.down = true;
            const pos = getCanvasMousePos(t.clientX, t.clientY);
            mouse.x = pos.x; mouse.y = pos.y;
        }
    }
}, { passive: false });

window.addEventListener('touchmove', e => {
    for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        if (t.identifier === touchInput.joystick.id) {
            touchInput.joystick.curX = t.clientX; touchInput.joystick.curY = t.clientY;
            let dx = touchInput.joystick.curX - touchInput.joystick.startX;
            let dy = touchInput.joystick.curY - touchInput.joystick.startY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 50;
            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            touchInput.joystick.dx = dx / maxDist; touchInput.joystick.dy = dy / maxDist;
        } 
        else if (t.identifier === touchInput.aim.id) {
            const pos = getCanvasMousePos(t.clientX, t.clientY);
            mouse.x = pos.x; mouse.y = pos.y;
        }
    }
}, { passive: false });

window.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === touchInput.joystick.id) {
            touchInput.joystick.active = false; touchInput.joystick.id = null;
            touchInput.joystick.dx = 0; touchInput.joystick.dy = 0;
        }
        if (t.identifier === touchInput.aim.id) {
            touchInput.aim.active = false; touchInput.aim.id = null;
            mouse.down = false;
        }
    }
});

document.getElementById('novaBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(localPlayer && localPlayer.novaCD <= 0 && localPlayer.nen >= 40) keys['q_triggered'] = true;
});

// 核心修改：單向重開觸發機制
function triggerLocalRestart() {
    send({ t: 'rst' }); // 傳送強制重開通知給對方
    resetMatch();       // 本地立刻重開
}

// ============= 物件池與粒子系統 =============
const bullets = []; const particles = []; const novas = [];
const speedLines = []; const tunnelRings = []; const wallLights = [];
const blackholeParticles = []; // 吃到 gem 時的黑洞爆發粒子（仿 infinite_nen_fall25D 按 space 效果）
const gems = []; const lasers = []; const mushrooms = [];
let gemSeq = 0;   // host 給 gem 的唯一編號

for (let z = 80; z < MAX_Z; z += 120) tunnelRings.push({ z });
function placeWallLight(l, z) {
    const wall = Math.floor(Math.random() * 4);
    if (wall === 0)      { l.x = -TUNNEL_W; l.y = (Math.random() - 0.5) * TUNNEL_H * 2; }
    else if (wall === 1) { l.x =  TUNNEL_W; l.y = (Math.random() - 0.5) * TUNNEL_H * 2; }
    else if (wall === 2) { l.x = (Math.random() - 0.5) * TUNNEL_W * 2; l.y = -TUNNEL_H; }
    else                 { l.x = (Math.random() - 0.5) * TUNNEL_W * 2; l.y =  TUNNEL_H; }
    l.z = z; l.size = Math.random() * 3 + 1.2; l.hue = 12 + Math.random() * 30; l.bright = Math.random() * 0.6 + 0.4;
}
for (let i = 0; i < 500; i++) { const l = {}; placeWallLight(l, Math.random() * MAX_Z); wallLights.push(l); }
for (let i = 0; i < 140; i++) {
    speedLines.push({
        angle: Math.random() * Math.PI * 2, r: Math.random() * 600 + 30, len: Math.random() * 90 + 30,
        speed: Math.random() * 12 + 6, opacity: Math.random() * 0.45 + 0.2, hue: 18 + Math.random() * 28
    });
}

function spawnParticle(x, y, z, color, count, speed) {
    speed = speed || 3;
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
            x, y, z, vx: Math.cos(a) * speed * (Math.random() + 0.5), vy: Math.sin(a) * speed * (Math.random() + 0.5),
            life: 1, decay: 0.025 + Math.random() * 0.03, color, size: Math.random() * 4 + 2
        });
    }
}

// 發射單發念彈 (本地 + 廣播)
function fireBullet(p, ang, speed, damage) {
    const bx = p.x + Math.cos(ang) * (p.radius + 4);
    const by = p.y + Math.sin(ang) * (p.radius + 4);
    const bvx = Math.cos(ang) * speed, bvy = Math.sin(ang) * speed;
    bullets.push({ ownerId: p.id, x: bx, y: by, z: 0, vx: bvx, vy: bvy, radius: 8, color: p.color, life: 120, damage, remote: false });
    send({ t: 'b', x: bx, y: by, vx: bvx, vy: bvy });
}

// 發射雷射光束 (本地權威判傷)
function fireLaser(p, ang) {
    lasers.push({ ownerId: p.id, x: p.x, y: p.y, angle: ang, life: 14, len: 1600, color: p.color, remote: false, hit: false });
}

// 每幀更新一名玩家的強化/縮小計時與半徑
function updatePowerState(p) {
    if (p.powerTime > 0) { p.powerTime--; if (p.powerTime <= 0) p.powerType = 0; }
    if (p.shrinkTime > 0) p.shrinkTime--;
    p.radius = p.baseRadius * (p.shrinkTime > 0 ? 0.5 : 1);
}

// 套用寶石效果：eaterIsLocal=true 表示本地玩家吃到
function applyGemEffect(eaterIsLocal, type, gx, gy) {
    const eater = eaterIsLocal ? localPlayer : remotePlayer;
    const victim = eaterIsLocal ? remotePlayer : localPlayer;
    if (!eater || !victim) return;

    eater.powerType = type;
    eater.powerTime = POWER_DURATION;

    // 吃到任何 gem 都顯示中央黑洞核心，持續時間與 gem 相同；對方吃到則換色
    blackholeCore.timeLeft = POWER_DURATION;
    blackholeCore.palette = eaterIsLocal ? CORE_PALETTE_SELF : CORE_PALETTE_ENEMY;

    if (type === GEM_MUSHROOM) {
        // 丟出香菇 → 對方變小 (同樣持續 10 秒)
        victim.shrinkTime = POWER_DURATION;
        mushrooms.push({ x: eater.x, y: eater.y, tx: victim.x, ty: victim.y, t: 0, life: 1 });
    }
    spawnParticle(gx, gy, 0, gemColor(type), 16, 3);
    // 仿 infinite_nen_fall25D 按 space 的黑洞穿梭：自畫面中央爆發旋轉擴散的彩色粒子 + 強烈震動
    spawnBlackholeBurst();
    game.shake = Math.max(game.shake, 22);
    sfxGem();
}

// 黑洞爆發粒子：從畫面中央向外螺旋擴散後淡出（仿 space 穿梭特效）
function spawnBlackholeBurst() {
    game.warpBoost = WARP_BOOST_FRAMES;   // 觸發穿梭加速感
    for (let i = 0; i < 160; i++) {
        blackholeParticles.push({
            angle: Math.random() * Math.PI * 2,
            r: 8 + Math.random() * 20,
            speed: 6 + Math.random() * 12,
            spin: (Math.random() - 0.5) * 0.12,   // 螺旋旋轉
            hue: Math.random() * 360,
            size: Math.random() * 3 + 1,
            life: 1
        });
    }
}

function updateBlackholeParticles() {
    for (let i = blackholeParticles.length - 1; i >= 0; i--) {
        const p = blackholeParticles[i];
        p.r += p.speed;
        p.angle += p.spin;
        p.life -= 0.018;
        if (p.life <= 0 || p.r > 900) blackholeParticles.splice(i, 1);
    }
}

// ============= 遊戲主循環邏輯 =============
function updateLocalPlayer() {
    const p = localPlayer;
    if (!p || game.state !== 'playing') return;

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy = -1;
    if (keys['s'] || keys['arrowdown']) dy = 1;
    if (keys['a'] || keys['arrowleft']) dx = -1;
    if (keys['d'] || keys['arrowright']) dx = 1;
    
    if (touchInput.joystick.active) {
        dx = touchInput.joystick.dx; dy = touchInput.joystick.dy;
    } else {
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > 0) { dx /= len; dy /= len; }
    }

    p.vx += (dx * p.speed - p.vx) * 0.18; p.vy += (dy * p.speed - p.vy) * 0.18;
    p.x += p.vx; p.y += p.vy;
    
    const lx = TUNNEL_W * 0.88, ly = TUNNEL_H * 0.88;
    p.x = Math.max(-lx, Math.min(lx, p.x)); p.y = Math.max(-ly, Math.min(ly, p.y));

    const pp = project(p.x, p.y, 0);
    p.trail.push({ sx: pp.x, sy: pp.y, life: 1 });
    if (p.trail.length > 14) p.trail.shift();
    p.trail.forEach(t => t.life -= 0.08); p.trail = p.trail.filter(t => t.life > 0);

    if (p.invincible > 0) p.invincible--;
    if (p.shootCD > 0) p.shootCD--;
    if (p.novaCD > 0) p.novaCD--;
    if (p.hitFlash > 0) p.hitFlash--;
    if (p.nen < p.maxNen) p.nen += 0.18;
    updatePowerState(p);

    // 瞄準箭頭即時對準敵方（自動鎖定方向）；子彈仍以發射當下的方向直線前進、不追蹤
    if (remotePlayer) {
        p.aimAngle = Math.atan2(remotePlayer.y - p.y, remotePlayer.x - p.x);
    } else {
        const sx = mouse.x - (cam.cx + p.x); const sy = mouse.y - (cam.cy + p.y);
        p.aimAngle = Math.atan2(sy, sx);
    }

    if (mouse.down && p.shootCD <= 0 && p.nen >= 4) {
        const ang = p.aimAngle;
        if (p.powerType === GEM_LASER) {
            // 雷射：一道貫穿光束
            fireLaser(p, ang);
            send({ t: 'laser', x: p.x, y: p.y, a: ang });
            p.shootCD = 28; p.nen -= 8; game.shake = Math.max(game.shake, 5);
            sfxLaser();
        } else if (p.powerType === GEM_SCATTER) {
            // 扇形散彈：一次 5 發
            const spread = 0.34;
            for (let i = -2; i <= 2; i++) {
                const a = ang + i * spread;
                fireBullet(p, a, 8, 4);
            }
            p.shootCD = 16; p.nen -= 6;
            spawnParticle(p.x + Math.cos(ang)*4, p.y + Math.sin(ang)*4, 0, p.color, 4, 1.6);
            sfxShoot();
        } else {
            // 一般念彈
            fireBullet(p, ang, 8, 5);
            p.shootCD = 11; p.nen -= 4;
            spawnParticle(p.x + Math.cos(ang)*4, p.y + Math.sin(ang)*4, 0, p.color, 3, 1.4);
            sfxShoot();
        }
    }

    if ((!!keys['q'] || keys['q_triggered']) && p.novaCD <= 0 && p.nen >= 40) {
        keys['q_triggered'] = false;
        novas.push({
            ownerId: p.id, x: p.x, y: p.y, r: 10, maxR: 220, speed: 8,
            color: p.color, life: 1, hit: new Set(), remote: false
        });
        send({ t: 'n', x: p.x, y: p.y });
        p.novaCD = 120; p.nen -= 40; game.shake = 8;
        sfxNova();
    }
}

function updateRemotePlayer() {
    const p = remotePlayer;
    if (!p) return;
    p.aimAngle = net.remote.aim;
    net.remoteRender.x += (net.remote.x - net.remoteRender.x) * 0.25;
    net.remoteRender.y += (net.remote.y - net.remoteRender.y) * 0.25;
    p.x = net.remoteRender.x; p.y = net.remoteRender.y;
    if (p.invincible > 0) p.invincible--;
    if (p.hitFlash > 0) p.hitFlash--;
    // 半徑依（已同步的）縮小狀態調整；計時遞減由 's' 封包權威覆蓋
    if (p.shrinkTime > 0) p.shrinkTime--;
    if (p.powerTime > 0) { p.powerTime--; if (p.powerTime <= 0) p.powerType = 0; }
    p.radius = p.baseRadius * (p.shrinkTime > 0 ? 0.5 : 1);

    const pp = project(p.x, p.y, 0);
    p.trail.push({ sx: pp.x, sy: pp.y, life: 1 });
    if (p.trail.length > 14) p.trail.shift();
    p.trail.forEach(t => t.life -= 0.08); p.trail = p.trail.filter(t => t.life > 0);
}

function updateObjects() {
    if (game.state !== 'playing') return;

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
        if (b.life <= 0 || b.x < -TUNNEL_W || b.x > TUNNEL_W || b.y < -TUNNEL_H || b.y > TUNNEL_H) {
            bullets.splice(i, 1); continue;
        }
        if (b.remote) continue;
        if (remotePlayer.invincible > 0) continue;
        
        const dx = b.x - remotePlayer.x, dy = b.y - remotePlayer.y;
        if (Math.sqrt(dx*dx + dy*dy) < remotePlayer.radius + b.radius) {
            if (remotePlayer.powerType === GEM_SHIELD) { // 對方有防護罩：擋下
                spawnParticle(b.x, b.y, 0, '#4ad6ff', 6, 2); bullets.splice(i, 1); continue;
            }
            dealDamageToRemote(b.damage, b.x, b.y); bullets.splice(i, 1);
        }
    }

    for (let i = novas.length - 1; i >= 0; i--) {
        const n = novas[i]; n.r += n.speed; n.life = 1 - (n.r / n.maxR);
        if (n.r >= n.maxR) { novas.splice(i, 1); continue; }
        if (n.remote) continue;
        if (n.hit.has(remotePlayer.id)) continue;
        
        const dx = remotePlayer.x - n.x, dy = remotePlayer.y - n.y; const d = Math.sqrt(dx*dx + dy*dy);
        if (d < n.r + remotePlayer.radius && d > n.r - 30) {
            if (remotePlayer.powerType === GEM_SHIELD) { spawnParticle(remotePlayer.x, remotePlayer.y, 0, '#4ad6ff', 6, 2); n.hit.add(remotePlayer.id); }
            else { dealDamageToRemote(12, remotePlayer.x, remotePlayer.y); n.hit.add(remotePlayer.id); }
        }
    }

    // 雷射光束
    for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.life--;
        if (l.life <= 0) { lasers.splice(i, 1); continue; }
        if (l.remote || l.hit || !remotePlayer) continue;
        // 點到射線距離判定
        const rx = remotePlayer.x - l.x, ry = remotePlayer.y - l.y;
        const dirx = Math.cos(l.angle), diry = Math.sin(l.angle);
        const proj = rx * dirx + ry * diry;
        if (proj > 0 && proj < l.len) {
            const perp = Math.abs(rx * (-diry) + ry * dirx);
            if (perp < remotePlayer.radius + 14) {
                l.hit = true;
                if (remotePlayer.powerType === GEM_SHIELD) spawnParticle(remotePlayer.x, remotePlayer.y, 0, '#4ad6ff', 8, 2);
                else dealDamageToRemote(18, remotePlayer.x, remotePlayer.y);
            }
        }
    }

    // 寶石（從遠方沿隧道接近，本地玩家碰到即收集）
    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.z -= game.speed; g.pulse += 0.15;

        // 磁吸（接近時把寶石吸向本地玩家）— 移植自 infinite_nen_fall25D.html
        if (g.z < 500 && localPlayer) {
            const dx = localPlayer.x - g.x, dy = localPlayer.y - g.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < 220) { g.x += dx * 0.08; g.y += dy * 0.08; }
        }

        if (Math.abs(g.z) < 70 && localPlayer) {
            const dx = localPlayer.x - g.x, dy = localPlayer.y - g.y;
            if (Math.sqrt(dx*dx + dy*dy) < localPlayer.radius + g.radius + 14) {
                applyGemEffect(true, g.type, g.x, g.y);
                send({ t: 'gc', id: g.id, type: g.type, x: g.x, y: g.y });
                gems.splice(i, 1); continue;
            }
        }
        if (g.z < -200) gems.splice(i, 1);
    }

    // 香菇投射物（純視覺）
    for (let i = mushrooms.length - 1; i >= 0; i--) {
        const m = mushrooms[i];
        m.t += 0.05;
        if (m.t >= 1) { mushrooms.splice(i, 1); continue; }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.vx *= 0.96; p.vy *= 0.96;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function dealDamageToRemote(dmg, sx, sy) {
    send({ t: 'd', dmg, sx, sy });
    remotePlayer.hp = Math.max(0, remotePlayer.hp - dmg);
    remotePlayer.hitFlash = 14; remotePlayer.invincible = 18; 
    game.shake = Math.max(game.shake, 8);
    spawnParticle(sx, sy, 0, remotePlayer.color, 8, 2);
    sfxHit();
}

function applyDamageLocal(target, dmg, fx, fy) {
    target.hp -= dmg; target.invincible = 18; target.hitFlash = 14;
    game.shake = Math.max(game.shake, 12); game.flashColor = target.color; game.flashTime = 8;
    spawnParticle(fx, fy, 0, '#ff3344', 12, 3);
    sfxHit();
    if (target.hp <= 0) {
        target.hp = 0;
        const winnerId = (target.id === 1) ? 2 : 1;
        send({ t: 'ko', winner: winnerId });
        endMatch(winnerId);
    }
}

function updateTunnel() {
    // 穿梭加速：吃到 gem 後短暫讓隧道/速度線高速衝刺並輕微推近鏡頭（仿 space 效果）
    if (game.warpBoost > 0) game.warpBoost--;
    const boost = game.warpBoost / WARP_BOOST_FRAMES;   // 1 → 0 漸退
    cam.focal = 360 - boost * 80;                        // 鏡頭被吸入感
    const adv = game.speed * (1 + boost * 3);            // 隧道前進 ×1～×4
    const lineMult = 1 + boost * 4;                      // 速度線 ×1～×5

    wallLights.forEach(l => { l.z -= adv; if (l.z < -80) placeWallLight(l, MAX_Z); });
    tunnelRings.forEach(r => { r.z -= adv; if (r.z < 10) r.z += MAX_Z; });
    speedLines.forEach(s => {
        s.r += s.speed * lineMult;
        if (s.r > 760) {
            s.r = Math.random() * 40; s.angle = Math.random() * Math.PI * 2;
            s.len = Math.random() * 90 + 30; s.opacity = Math.random() * 0.45 + 0.2;
        }
    });
}

function update() {
    updateLocalPlayer(); updateRemotePlayer(); updateObjects(); updateTunnel();

    if (game.state === 'playing') {
        game.timeLeft--;
        if (game.timeLeft <= 0) {
            game.timeLeft = 0;
            if (net.role === 'host') {
                let winId = 0;
                if (player1.hp > player2.hp) winId = 1;
                else if (player2.hp > player1.hp) winId = 2;
                send({ t: 'ko', winner: winId });
                endMatch(winId);
            }
        }
    }

    if (game.shake > 0) game.shake *= 0.86;
    if (game.shake < 0.3) game.shake = 0;
    if (game.flashTime > 0) game.flashTime--;
    if (blackholeCore.timeLeft > 0) blackholeCore.timeLeft--;
    updateBlackholeParticles();

    // host 權威生成寶石並廣播
    if (game.state === 'playing' && net.role === 'host' && gems.length < 3 && Math.random() < 0.012) {
        const type = Math.floor(Math.random() * 4) + 1;
        const gx = (Math.random() - 0.5) * TUNNEL_W * 1.3;
        const gy = (Math.random() - 0.5) * TUNNEL_H * 1.3;
        // 與既有寶石保持最小間距，避免擠在一起
        const tooClose = gems.some(o => Math.hypot(o.x - gx, o.y - gy) < GEM_MIN_GAP);
        if (!tooClose) {
            const g = { id: ++gemSeq, x: gx, y: gy, z: SPAWN_Z, type, pulse: 0, radius: GEM_RADIUS };
            gems.push(g);
            send({ t: 'gem', id: g.id, x: g.x, y: g.y, type: g.type });
        }
    }

    game.frame++;
    if (net.connected && game.state === 'playing' && game.frame % 2 === 0) {
        send({
            t: 's', x: localPlayer.x, y: localPlayer.y, vx: localPlayer.vx, vy: localPlayer.vy,
            a: localPlayer.aimAngle, hp: localPlayer.hp, nen: localPlayer.nen,
            pw: localPlayer.powerType, pt: localPlayer.powerTime, sk: localPlayer.shrinkTime
        });
    }
    if (net.connected && Date.now() - net.lastPingSent > 1000) {
        net.lastPingSent = Date.now();
        send({ t: 'ping', ts: Date.now() });
    }
}

function endMatch(winnerId) {
    if (game.state !== 'playing') return;
    game.state = 'finished';
    game.winner = winnerId;
    game.shake = 24;
    spawnParticle(0, 0, 0, '#ffd700', 60, 6);
    sfxKO();
    document.getElementById('restartBtn').classList.remove('hidden'); // 顯示手機重開按鈕
}

function resetMatch() {
    game.state = 'playing'; game.winner = null; game.timeLeft = MATCH_FRAMES;
    bullets.length = 0; particles.length = 0; novas.length = 0;
    gems.length = 0; lasers.length = 0; mushrooms.length = 0;
    blackholeCore.timeLeft = 0;
    blackholeParticles.length = 0;
    game.warpBoost = 0; cam.focal = 360;

    // 清空手勢瞄準，防止重開局瞬間自動開火
    mouse.down = false; touchInput.aim.active = false; touchInput.aim.id = null;
    
    [player1, player2].forEach((p, i) => {
        p.hp = p.maxHp; p.nen = 30; p.x = i === 0 ? -140 : 140; p.y = -100;
        p.vx = p.vy = 0; p.invincible = 0; p.shootCD = 0; p.novaCD = 0; p.trail = []; p.hitFlash = 0;
        p.powerType = 0; p.powerTime = 0; p.shrinkTime = 0; p.radius = p.baseRadius;
    });
    net.remote.x = remotePlayer.x; net.remote.y = remotePlayer.y; net.remote.hp = remotePlayer.maxHp;
    net.remoteRender.x = remotePlayer.x; net.remoteRender.y = remotePlayer.y;
    document.getElementById('restartBtn').classList.add('hidden');
}

// ============= 渲染層 =============
function drawBackground() {
    const g = ctx.createRadialGradient(cam.cx, cam.cy, 0, cam.cx, cam.cy, 720);
    g.addColorStop(0, '#2a1408'); g.addColorStop(0.25, '#180a0a'); g.addColorStop(0.7, '#0a0510'); g.addColorStop(1, '#000');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const c = ctx.createRadialGradient(cam.cx, cam.cy, 0, cam.cx, cam.cy, 220);
    c.addColorStop(0, 'rgba(255, 140, 40, 0.45)'); c.addColorStop(0.5, 'rgba(255, 80, 20, 0.15)'); c.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = c; ctx.fillRect(0, 0, W, H);
}

function drawTunnel() {
    const corners = [{ x: -TUNNEL_W, y: -TUNNEL_H }, { x: TUNNEL_W, y: -TUNNEL_H }, { x: TUNNEL_W, y: TUNNEL_H }, { x: -TUNNEL_W, y: TUNNEL_H }];
    const rings = tunnelRings.slice().sort((a, b) => b.z - a.z);
    rings.forEach(r => {
        if (r.z <= 10 || r.z > MAX_Z) return;
        const c = corners.map(p => project(p.x, p.y, r.z));
        const fade = 1 - r.z / MAX_Z;
        ctx.strokeStyle = `rgba(255, 110, 40, ${fade * 0.47})`; ctx.lineWidth = 1 + fade * 1.8;
        ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y); ctx.lineTo(c[1].x, c[1].y); ctx.lineTo(c[2].x, c[2].y); ctx.lineTo(c[3].x, c[3].y); ctx.closePath(); ctx.stroke();
    });
    const nearZ = 10, farZ = MAX_Z * 0.97;
    corners.forEach(p => {
        const n = project(p.x, p.y, nearZ), f = project(p.x, p.y, farZ);
        const lg = ctx.createLinearGradient(n.x, n.y, f.x, f.y);
        lg.addColorStop(0, 'rgba(255, 140, 60, 0.8)'); lg.addColorStop(1, 'rgba(255, 80, 30, 0)');
        ctx.strokeStyle = lg; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(f.x, f.y); ctx.stroke();
    });
    const lights = wallLights.slice().sort((a, b) => b.z - a.z);
    lights.forEach(l => {
        if (l.z <= 5 || l.z > MAX_Z) return;
        const p = project(l.x, l.y, l.z); const fade = 1 - l.z / MAX_Z;
        const size = Math.max(0.4, l.size * p.s * 3); const a = l.bright * fade;
        const color = `hsla(${l.hue}, 100%, 60%, ${a})`;
        ctx.fillStyle = color; ctx.shadowBlur = size * 2.5; ctx.shadowColor = color;
        ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.shadowBlur = 0;
}

function drawSpeedLines() {
    const boost = game.warpBoost / WARP_BOOST_FRAMES;       // 加速時速度線更亮更長
    const opMult = 1 + boost * 1.6;
    const lenMult = 1 + boost * 1.8;
    speedLines.forEach(s => {
        const len = s.len * lenMult;
        const x1 = cam.cx + Math.cos(s.angle) * s.r; const y1 = cam.cy + Math.sin(s.angle) * s.r;
        const x2 = cam.cx + Math.cos(s.angle) * (s.r + len); const y2 = cam.cy + Math.sin(s.angle) * (s.r + len);
        ctx.strokeStyle = `hsla(${s.hue}, 85%, 65%, ${Math.min(1, s.opacity * opMult)})`;
        ctx.lineWidth = 1.5 + boost * 1.5;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    });
}

function drawBullets() {
    bullets.forEach(b => {
        const p = project(b.x, b.y, 0);
        ctx.shadowBlur = 18; ctx.shadowColor = b.color; ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, b.radius * 0.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.shadowBlur = 0;
}

function drawNovas() {
    novas.forEach(n => {
        const pCenter = project(n.x, n.y, 0); const pEdge = project(n.x + n.r, n.y, 0); const rPx = pEdge.x - pCenter.x;
        ctx.strokeStyle = n.color; ctx.globalAlpha = n.life * 0.85;
        ctx.lineWidth = 5; ctx.shadowBlur = 22; ctx.shadowColor = n.color;
        ctx.beginPath(); ctx.arc(pCenter.x, pCenter.y, rPx, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = n.life * 0.35; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.arc(pCenter.x, pCenter.y, rPx, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawGems() {
    const list = gems.slice().filter(g => g.z > 5 && g.z < MAX_Z).sort((a, b) => b.z - a.z);
    list.forEach(g => {
        const p = project(g.x, g.y, g.z); const s = p.s;
        const r = Math.max(2, g.radius * s);
        const pulse = Math.sin(g.pulse) * 2 * s;
        const col = gemColor(g.type);
        ctx.save();
        ctx.translate(p.x, p.y);
        // 外框菱形（旋轉），代表寶石本體
        ctx.save();
        ctx.rotate(g.pulse * 0.5);
        ctx.shadowBlur = 18 * s; ctx.shadowColor = col; ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, -r - pulse); ctx.lineTo(r + pulse, 0); ctx.lineTo(0, r + pulse); ctx.lineTo(-r - pulse, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // 中央依類型畫出可辨識的圖案（不旋轉，較好辨認）
        drawGemIcon(g.type, r, col);
        ctx.restore(); ctx.shadowBlur = 0;
    });
}

// 在已 translate 到寶石中心的座標系下，依類型畫出對應圖案
function drawGemIcon(type, r, col) {
    ctx.shadowBlur = 0;
    const ic = r * 0.62;            // 圖案尺寸
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (type === GEM_SCATTER) {
        // 散彈：中心點 + 三道放射狀彈道
        ctx.strokeStyle = '#3a2c00';
        for (let i = -1; i <= 1; i++) {
            const a = -Math.PI / 2 + i * 0.5;
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * ic, Math.sin(a) * ic); ctx.stroke();
        }
        ctx.fillStyle = '#3a2c00';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
    } else if (type === GEM_SHIELD) {
        // 防護罩：盾牌外框
        ctx.strokeStyle = '#04344a'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.moveTo(0, -ic);
        ctx.lineTo(ic * 0.8, -ic * 0.4);
        ctx.lineTo(ic * 0.8, ic * 0.3);
        ctx.quadraticCurveTo(0, ic * 1.1, 0, ic * 1.1);
        ctx.quadraticCurveTo(0, ic * 1.1, -ic * 0.8, ic * 0.3);
        ctx.lineTo(-ic * 0.8, -ic * 0.4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (type === GEM_MUSHROOM) {
        // 香菇：菇傘 + 菇柄
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-ic * 0.28, -ic * 0.1, ic * 0.56, ic * 0.9); // 菇柄
        ctx.fillStyle = '#7a0030';
        ctx.beginPath();
        ctx.arc(0, -ic * 0.1, ic * 0.9, Math.PI, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffd5e6';
        ctx.beginPath(); ctx.arc(-ic * 0.35, -ic * 0.35, ic * 0.18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ic * 0.3, -ic * 0.25, ic * 0.14, 0, Math.PI * 2); ctx.fill();
    } else if (type === GEM_LASER) {
        // 雷射：垂直光束 + 上下箭頭
        ctx.strokeStyle = '#063b06';
        ctx.beginPath(); ctx.moveTo(0, -ic); ctx.lineTo(0, ic); ctx.stroke();
        ctx.fillStyle = '#063b06';
        ctx.beginPath(); ctx.moveTo(0, -ic - r * 0.1); ctx.lineTo(-ic * 0.35, -ic * 0.4); ctx.lineTo(ic * 0.35, -ic * 0.4); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, ic + r * 0.1); ctx.lineTo(-ic * 0.35, ic * 0.4); ctx.lineTo(ic * 0.35, ic * 0.4); ctx.closePath(); ctx.fill();
    } else {
        // 預設：白色核心
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2); ctx.fill();
    }
}

function drawLasers() {
    lasers.forEach(l => {
        const p0 = project(l.x, l.y, 0);
        const p1 = project(l.x + Math.cos(l.angle) * l.len, l.y + Math.sin(l.angle) * l.len, 0);
        const a = Math.max(0, l.life / 14);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.shadowBlur = 26; ctx.shadowColor = l.color;
        ctx.strokeStyle = l.color; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.globalAlpha = a * 0.9;
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
        ctx.restore(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    });
}

function drawMushrooms() {
    mushrooms.forEach(m => {
        const wx = m.x + (m.tx - m.x) * m.t;
        const wy = m.y + (m.ty - m.y) * m.t - Math.sin(m.t * Math.PI) * 60; // 拋物弧線
        const p = project(wx, wy, 0); const s = p.s;
        const r = 14 * s;
        ctx.save(); ctx.translate(p.x, p.y);
        // 菇柄
        ctx.fillStyle = '#fff0d8';
        ctx.fillRect(-r * 0.35, 0, r * 0.7, r * 0.9);
        // 菇傘
        ctx.fillStyle = '#ff4d6d'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff4d6d';
        ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.closePath(); ctx.fill();
        // 白點
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(-r * 0.4, -r * 0.25, r * 0.18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.35, r * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); ctx.shadowBlur = 0;
    });
}

// 中央黑洞核心 (吃到 gem 時顯示，顏色依吃到者而定)
function drawBlackholeCore() {
    if (blackholeCore.timeLeft <= 0) return;
    const pal = blackholeCore.palette;
    const t = Date.now() * 0.001;
    const fade = Math.min(1, blackholeCore.timeLeft / 40); // 結束前淡出

    ctx.save();
    ctx.globalAlpha = fade;

    // 中央黑體
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cam.cx, cam.cy, 55, 0, Math.PI * 2); ctx.fill();

    // 吸積盤
    const disk = ctx.createRadialGradient(cam.cx, cam.cy, 55, cam.cx, cam.cy, 200);
    disk.addColorStop(0, pal.d0); disk.addColorStop(0.4, pal.d1); disk.addColorStop(1, pal.d2);
    ctx.fillStyle = disk;
    ctx.beginPath(); ctx.arc(cam.cx, cam.cy, 200, 0, Math.PI * 2); ctx.fill();

    // 旋轉光環
    ctx.strokeStyle = pal.ring; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const rad = 70 + i * 28;
        ctx.ellipse(cam.cx, cam.cy, rad, rad * 0.28, t * (1 + i * 0.3), 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

// 黑洞爆發粒子（吃到 gem 時的 space 穿梭特效）
function drawBlackholeParticles() {
    blackholeParticles.forEach(p => {
        const x = cam.cx + Math.cos(p.angle) * p.r;
        const y = cam.cy + Math.sin(p.angle) * p.r;
        const c = `hsla(${p.hue}, 100%, 65%, ${Math.max(0, p.life)})`;
        ctx.fillStyle = c;
        ctx.shadowBlur = 14; ctx.shadowColor = c;
        ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.shadowBlur = 0;
}

function drawParticles() {
    particles.forEach(p => {
        const pr = project(p.x, p.y, p.z || 0); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(0.4, p.size * p.life * pr.s), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawTrail(p) {
    p.trail.forEach(t => {
        ctx.globalAlpha = t.life * 0.4; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(t.sx, t.sy + (1 - t.life) * 30, p.radius * t.life * 0.7, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawPlayer(p, isLocal) {
    const pp = project(p.x, p.y, 0); const r = p.radius; const x = pp.x, y = pp.y;
    ctx.save();
    if (p.invincible > 0 && Math.floor(p.invincible / 3) % 2 === 0) ctx.globalAlpha = 0.45;
    const pulse = Math.sin(Date.now() * 0.006) * 5;
    ctx.shadowBlur = 26 + pulse; ctx.shadowColor = p.hitFlash > 0 ? '#fff' : p.color;

    ctx.fillStyle = p.color; const baseA = ctx.globalAlpha; ctx.globalAlpha = baseA * 0.45;
    ctx.beginPath(); ctx.moveTo(x - r * 1.4, y - r * 0.1); ctx.lineTo(x + r * 1.4, y - r * 0.1); ctx.lineTo(x + r * 0.5, y - r * 2.6); ctx.lineTo(x - r * 0.5, y - r * 2.6); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = baseA;

    ctx.fillStyle = p.hitFlash > 0 ? '#fff' : p.color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.coreColor; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.globalAlpha = baseA * 0.75;
    ctx.beginPath(); ctx.arc(x, y, r + 10 + pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = p.accentColor; ctx.lineWidth = 1.5; ctx.globalAlpha = baseA * 0.55;
    ctx.beginPath(); ctx.arc(x, y, r + 18 + pulse * 0.5, 0, Math.PI * 2); ctx.stroke();

    // 強化狀態視覺
    if (p.powerType === GEM_SHIELD) {
        ctx.globalAlpha = baseA * (0.55 + Math.sin(Date.now() * 0.012) * 0.2);
        ctx.strokeStyle = '#4ad6ff'; ctx.lineWidth = 4; ctx.shadowBlur = 18; ctx.shadowColor = '#4ad6ff';
        ctx.beginPath(); ctx.arc(x, y, r + 14, 0, Math.PI * 2); ctx.stroke();
    } else if (p.powerType === GEM_SCATTER || p.powerType === GEM_LASER) {
        const glow = gemColor(p.powerType);
        ctx.globalAlpha = baseA * 0.7; ctx.strokeStyle = glow; ctx.lineWidth = 3; ctx.shadowBlur = 16; ctx.shadowColor = glow;
        ctx.beginPath(); ctx.arc(x, y, r + 6, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = baseA; ctx.shadowBlur = 0;

    if (isLocal) {
        // 明顯的瞄準指示：發光長線 + 虛線延伸 + 箭頭，依目前子彈類型變色
        const aimCol = p.powerType ? gemColor(p.powerType) : p.accentColor;
        const ca = Math.cos(p.aimAngle), sa = Math.sin(p.aimAngle);
        const x0 = x + ca * (r + 6), y0 = y + sa * (r + 6);
        const lineLen = 150;
        const x1 = x + ca * (r + lineLen), y1 = y + sa * (r + lineLen);

        ctx.shadowBlur = 14; ctx.shadowColor = aimCol;
        // 實線近段
        ctx.globalAlpha = baseA * 0.95; ctx.strokeStyle = aimCol; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x + ca * (r + 60), y + sa * (r + 60)); ctx.stroke();
        // 虛線遠段
        ctx.globalAlpha = baseA * 0.6; ctx.lineWidth = 2.5;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(x + ca * (r + 60), y + sa * (r + 60)); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.setLineDash([]);
        // 箭頭
        ctx.globalAlpha = baseA; ctx.fillStyle = aimCol;
        const ah = 12, aw = 8;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - ca * ah - (-sa) * aw, y1 - sa * ah - (ca) * aw);
        ctx.lineTo(x1 - ca * ah + (-sa) * aw, y1 - sa * ah + (ca) * aw);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
    }
    ctx.restore(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    ctx.fillStyle = p.color; ctx.font = 'bold 14px Microsoft JhengHei'; ctx.textAlign = 'center';
    const label = isLocal ? `P${p.id} (YOU)` : `P${p.id}`;
    ctx.fillText(label, x, y - r - 18);
}

function drawHUD() {
    drawStatusPanel(player1, 20, 20, 'left');
    drawStatusPanel(player2, W - 20, 20, 'right');
    const s = Math.max(0, Math.ceil(game.timeLeft / 60));
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    ctx.fillStyle = s <= 10 ? '#ff5544' : '#fff'; ctx.font = 'bold 36px Microsoft JhengHei'; ctx.textAlign = 'center';
    ctx.shadowBlur = s <= 10 ? 18 : 8; ctx.shadowColor = s <= 10 ? '#ff5544' : '#000';
    ctx.fillText(`${mm}:${ss}`, W / 2, 50);
    ctx.shadowBlur = 0;

    // 本地玩家強化狀態提示
    if (localPlayer && localPlayer.powerType > 0) {
        const names = { 1: '扇形散彈', 2: '防護罩', 3: '香菇', 4: '雷射' };
        const col = gemColor(localPlayer.powerType);
        ctx.fillStyle = col; ctx.font = 'bold 16px Microsoft JhengHei'; ctx.textAlign = 'center';
        ctx.shadowBlur = 10; ctx.shadowColor = col;
        ctx.fillText(`${names[localPlayer.powerType]}  ${(localPlayer.powerTime / 60).toFixed(1)}s`, W / 2, 104);
        ctx.shadowBlur = 0;
    }
    if (localPlayer && localPlayer.shrinkTime > 0) {
        ctx.fillStyle = '#ff5aa0'; ctx.font = 'bold 14px Microsoft JhengHei'; ctx.textAlign = 'center';
        ctx.fillText(`被縮小 ${(localPlayer.shrinkTime / 60).toFixed(1)}s`, W / 2, 124);
    }

    if (localPlayer && localPlayer.novaCD > 0) {
        ctx.fillStyle = localPlayer.color; ctx.font = '12px Microsoft JhengHei'; ctx.textAlign = 'center';
        ctx.fillText(`念波冷卻 ${(localPlayer.novaCD / 60).toFixed(1)}s`, W / 2, 80);
    } else if (localPlayer && localPlayer.nen >= 40) {
        ctx.fillStyle = '#ff66ff'; ctx.font = 'bold 12px Microsoft JhengHei'; ctx.textAlign = 'center';
        ctx.shadowBlur = 8; ctx.shadowColor = '#ff66ff';
        ctx.fillText(`念波就緒`, W / 2, 80);
        ctx.shadowBlur = 0;
    }
}

function drawStatusPanel(p, x, y, align) {
    const barW = 240, barH = 14;
    const barX = align === 'left' ? x : x - barW;
    ctx.fillStyle = p.color; ctx.font = 'bold 16px Microsoft JhengHei'; ctx.textAlign = align;
    const tag = (p === localPlayer) ? `P${p.id} (你)` : `P${p.id}`;
    ctx.fillText(tag, align === 'left' ? barX : x, y + 16);

    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(barX, y + 24, barW, barH);
    const hpPct = p.hp / p.maxHp;
    const hpColor = hpPct > 0.5 ? '#3fff66' : (hpPct > 0.25 ? '#ffd700' : '#ff4444');
    ctx.fillStyle = hpColor; ctx.fillRect(barX, y + 24, barW * hpPct, barH);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.strokeRect(barX, y + 24, barW, barH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Microsoft JhengHei'; ctx.textAlign = 'center';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, barX + barW / 2, y + 35);

    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(barX, y + 44, barW, 6);
    ctx.fillStyle = p.accentColor; ctx.fillRect(barX, y + 44, barW * (p.nen / p.maxNen), 6);
}

function drawVirtualJoystick() {
    if (!touchInput.joystick.active) return;
    const rect = canvas.getBoundingClientRect();
    const cStartX = ((touchInput.joystick.startX - rect.left) / rect.width) * W;
    const cStartY = ((touchInput.joystick.startY - rect.top) / rect.height) * H;
    const cCurX = ((touchInput.joystick.curX - rect.left) / rect.width) * W;
    const cCurY = ((touchInput.joystick.curY - rect.top) / rect.height) * H;
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cStartX, cStartY, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255, 176, 90, 0.4)';
    ctx.beginPath(); ctx.arc(cCurX, cCurY, 20, 0, Math.PI * 2); ctx.fill();
}

function drawFinishScreen() {
    if (game.state !== 'finished') return;
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = 'bold 64px Microsoft JhengHei';
    let title, color;
    if (game.winner === 0) { title = '平手'; color = '#ffd700'; }
    else if (game.winner === localPlayer.id) { title = '勝利!'; color = localPlayer.color; }
    else { title = '敗北...'; color = '#888'; }
    ctx.fillStyle = color; ctx.shadowBlur = 30; ctx.shadowColor = color;
    ctx.fillText(title, W / 2, H / 2 - 20); ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#fff'; ctx.font = '18px Microsoft JhengHei';
    ctx.fillText(`P1 HP: ${Math.ceil(player1.hp)}   |   P2 HP: ${Math.ceil(player2.hp)}`, W / 2, H / 2 + 30);
    
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '16px Microsoft JhengHei';
    ctx.fillText('點擊右下角「重開」或按 R 開始下一局', W / 2, H / 2 + 70);
}

function drawFlash() {
    if (game.flashTime <= 0 || !game.flashColor) return;
    ctx.globalAlpha = (game.flashTime / 8) * 0.25; ctx.fillStyle = game.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
}

function drawVignette() {
    const g = ctx.createRadialGradient(cam.cx, cam.cy, 280, cam.cx, cam.cy, 680);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render() {
    ctx.save();
    if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    
    drawBackground(); drawTunnel(); drawSpeedLines(); drawBlackholeCore(); drawGems();
    drawParticles(); drawNovas(); drawLasers(); drawBullets(); drawMushrooms();
    drawTrail(player1); drawTrail(player2);
    drawPlayer(player1, player1 === localPlayer); drawPlayer(player2, player2 === localPlayer);
    drawBlackholeParticles();
    drawFlash(); drawVignette(); drawVirtualJoystick(); drawHUD(); drawFinishScreen();
    
    ctx.restore();
}

function loop() {
    update(); render(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
