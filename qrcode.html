<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code 產生器（離線版）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
    color: #1a1a1a;
  }
  .sub { text-align: center; color: #999; font-size: 12px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d0d4da;
    border-radius: 10px;
    outline: none;
  }
  input[type=text]:focus { border-color: #4a90d9; }
  button {
    padding: 12px 18px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: #4a90d9;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #3a7bc0; }
  .options {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    font-size: 14px;
    color: #555;
  }
  .options input[type=range] { flex: 1; }
  #result { margin-top: 24px; text-align: center; min-height: 40px; }
  #qrcode {
    display: inline-block;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #eee;
  }
  #qrcode canvas { display: block; }
  .actions { margin-top: 16px; display: none; gap: 8px; justify-content: center; }
  .actions.show { display: flex; }
  .actions button { background: #34a853; }
  .actions button:hover { background: #2c8c45; }
  .err { color: #d93025; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>QR Code 產生器</h1>
    <div class="sub">離線版・無需連網</div>
    <div class="row">
      <input type="text" id="url" placeholder="輸入網址，例如 https://example.com"
             value="https://" autocomplete="off">
      <button id="gen">產生</button>
    </div>
    <div class="options">
      <span>尺寸</span>
      <input type="range" id="size" min="128" max="512" step="32" value="256">
      <span id="sizeVal">256px</span>
    </div>
    <div id="result"></div>
    <div class="actions" id="actions">
      <button id="download">下載 PNG</button>
      <button id="downloadSvg">下載 SVG</button>
    </div>
  </div>

    result=document.getElementById('result'),
    actions=document.getElementById('actions'),
    downloadBtn=document.getElementById('download'),
    downloadSvgBtn=document.getElementById('downloadSvg');

var lastQr=null,lastCount=0;

sizeInput.addEventListener('input',function(){sizeVal.textContent=sizeInput.value+'px';});

function generate(){
  var text=urlInput.value.trim();
  result.innerHTML='';
  actions.classList.remove('show');
  if(!text||text==='https://'){
    result.innerHTML='<div class="err">請輸入有效的網址或文字</div>';
    return;
  }
  var px=parseInt(sizeInput.value,10);
  // 選自動版本，糾錯等級 M
  // 此函式庫糾錯等級以數字表示：M=0、L=1、H=2、Q=3
  var qr;
  try{
    qr=qrcode(0,0);       // typeNumber 0 = 自動版本，糾錯等級 M
    qr.addData(text);
    qr.make();
  }catch(e){
    // 資料過長時提升版本上限失敗，改用較低糾錯等級重試
    try{
      qr=qrcode(0,1);     // 糾錯等級 L
      qr.addData(text);
      qr.make();
    }catch(e2){
      result.innerHTML='<div class="err">內容過長，無法產生 QR Code</div>';
      return;
    }
  }
  var count=qr.getModuleCount();
  lastQr=qr;lastCount=count;
  var margin=4;                                   // 靜區：四周各留 4 個模組（QR 規格要求，否則掃不出來）
  var cell=Math.max(1,Math.floor(px/(count+margin*2)));
  var dim=cell*(count+margin*2);
  var off=margin*cell;                            // 模組繪製起點偏移
  var box=document.createElement('div');
  box.id='qrcode';
  var canvas=document.createElement('canvas');
  canvas.width=dim;
  canvas.height=dim;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,dim,dim);
  ctx.fillStyle='#000';
  for(var r=0;r<count;r++){
    for(var c=0;c<count;c++){
      if(qr.isDark(r,c)){
        ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
      }
    }
  }
  box.appendChild(canvas);
  result.appendChild(box);
  actions.classList.add('show');
}

function download(){
  var canvas=result.querySelector('canvas');
  if(!canvas)return;
  var a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download='qrcode.png';
  a.click();
}

function downloadSVG(){
  if(!lastQr||!lastCount)return;
  var n=lastCount,m=4,dim=n+m*2;  // m = 邊界靜區
  var rects='';
  for(var r=0;r<n;r++){
    for(var c=0;c<n;c++){
      if(lastQr.isDark(r,c)){
        rects+='<rect x="'+(c+m)+'" y="'+(r+m)+'" width="1" height="1"/>';
      }
    }
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges">'+
          '<rect width="'+dim+'" height="'+dim+'" fill="#fff"/>'+
          '<g fill="#000">'+rects+'</g></svg>';
  var blob=new Blob([svg],{type:'image/svg+xml'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='qrcode.svg';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

genBtn.addEventListener('click',generate);
downloadBtn.addEventListener('click',download);
downloadSvgBtn.addEventListener('click',downloadSVG);
urlInput.addEventListener('keydown',function(e){if(e.key==='Enter')generate();});
</script>
</body>
</html>
