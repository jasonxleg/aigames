<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成語故事館</title>
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#3b2f2a; --sub:#7a6a60; --line:#f0e2cc;
  --accent:#e8743b; --accent2:#2f8f83; --star:#f5b301; --fav:#e8456b;
  --book:#3f6fd8;
  --g1:#ff8a65; --g2:#ffb74d; --g3:#81c784; --g4:#4fc3f7; --g5:#9575cd; --g6:#f06292;
  --shadow:0 3px 10px rgba(120,80,40,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:17px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0}
header{background:linear-gradient(135deg,#ffcf8a,#ff9f6b);padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow)}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header p{margin:4px 0 0;font-size:14px;color:#5a3b2a}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}

/* 搜尋 */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;padding:13px 44px 13px 46px;font-size:18px;border:2px solid var(--line);border-radius:30px;background:#fff;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#eee;border-radius:50%;width:28px;height:28px;display:none}

/* 分頁 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-weight:bold;color:var(--sub);display:flex;align-items:center;gap:6px}
.tab .n{font-size:12px;background:#f3ebe0;border-radius:10px;padding:0 7px;color:var(--sub)}
.tab.on{color:#fff}
.tab.on .n{background:rgba(255,255,255,.3);color:#fff}
.tab[data-k="all"].on{background:var(--accent2)}
.tab[data-k="fav"].on{background:var(--fav)}
.tab[data-k="book"].on{background:var(--book)}
.lessons{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:10px;background:#eef4ff;border-radius:14px}
.lchip{padding:6px 11px;border-radius:12px;background:#fff;border:1.5px solid #c9d8f5;font-size:14px;color:#3a4a6b}
.lchip b{color:var(--book)}
.lchip.on{background:var(--book);border-color:var(--book);color:#fff}
.lchip.on b{color:#fff}
.lhead{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin:10px 0 -2px;padding:8px 14px;border-radius:12px;background:#eef4ff;color:#3a4a6b;font-size:17px;cursor:pointer}
.lhead b{color:var(--book)}
.lhead .lprog{margin-left:auto;font-size:13px;color:var(--sub)}
.lhead:first-child{margin-top:0}
.tab[data-k="1"].on{background:var(--g1)}.tab[data-k="2"].on{background:var(--g2)}.tab[data-k="3"].on{background:var(--g3)}
.tab[data-k="4"].on{background:var(--g4)}.tab[data-k="5"].on{background:var(--g5)}.tab[data-k="6"].on{background:var(--g6)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-size:14px;color:var(--sub)}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:bold}
.spacer{flex:1}
.btn{padding:8px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:bold;box-shadow:var(--shadow)}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.fav{background:var(--fav)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}

.status{font-size:14px;color:var(--sub);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--card);border-radius:18px;padding:14px 12px 12px;box-shadow:var(--shadow);cursor:pointer;border-top:6px solid var(--gc);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card .emo{font-size:30px;line-height:1}
.card .gb{position:absolute;top:10px;right:44px;font-size:12px;background:var(--gc);color:#fff;border-radius:10px;padding:1px 8px}
.card .fv{position:absolute;top:6px;right:8px;font-size:22px;background:none;padding:2px;color:#ccc;line-height:1}
.card .fv.on{color:var(--fav)}
.card .learned{position:absolute;bottom:10px;right:12px;font-size:16px}
.word{font-size:26px;font-weight:bold;letter-spacing:2px;margin:6px 0 4px}
ruby rt{font-size:11px;color:var(--accent2);letter-spacing:0;font-weight:normal}
body.nozy ruby rt{display:none}
.card .m{font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:50px 10px;color:var(--sub)}
.empty .big{font-size:48px}

/* 彈窗 */
.mask{position:fixed;inset:0;background:rgba(40,25,15,.5);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:24px 12px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:720px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.mhead{background:var(--gc);color:#fff;padding:16px 18px;position:relative}
.mhead .emo{font-size:42px;line-height:1}
.mhead .word{font-size:36px;margin:6px 0 0}
.mhead ruby rt{color:#fff;font-size:13px}
.mhead .meta{font-size:14px;opacity:.95}
.mclose{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:20px}
.mbody{padding:16px 18px 18px}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f6fbfa;border:1.5px solid #cfe9e5;border-radius:14px;padding:10px 12px;margin-bottom:14px}
.player .lbl{font-weight:bold;color:var(--accent2)}
.player select{font:inherit;font-size:14px;padding:4px;border-radius:8px;border:1px solid #cfe9e5}
.sec{margin:14px 0}
.sec h3{margin:0 0 6px;font-size:17px;color:var(--accent)}
.story p{margin:0 0 10px;padding:6px 10px;border-radius:10px;transition:background .2s}
.story p.reading,.sec .reading{background:#fff1c9}
.box{background:#fff8ec;border-radius:12px;padding:10px 12px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px}
.mfoot .spacer{flex:1}

/* 測驗 / 複習 */
.qbox{padding:18px}
.qtitle{font-size:14px;color:var(--sub)}
.qtext{font-size:20px;margin:10px 0 16px;background:#fff8ec;border-radius:14px;padding:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:22px;font-weight:bold;letter-spacing:2px}
.opt.ok{background:#d9f5df;border-color:#4caf50}
.opt.no{background:#ffe0e0;border-color:#e57373}
.qmsg{min-height:28px;margin-top:12px;font-weight:bold}
.flash{text-align:center;padding:10px 0}
.flash .word{font-size:44px}
.flash .back{display:none;text-align:left;margin-top:12px}
.flash.flip .back{display:block}
.prog{height:8px;background:#f3ebe0;border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b2f2a;color:#fff;padding:8px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none}
.toast.show{opacity:.92}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:30px}
@media (max-width:520px){
  header h1{font-size:23px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .word{font-size:21px}
  .mhead .word{font-size:28px}
  .opts{grid-template-columns:1fr}
  .card .gb{display:none}
}
</style>
</head>
<body>
<header>
  <h1>📚 成語故事館</h1>
  <p>國小一～六年級・點一下成語，聽聽它背後的故事</p>
</header>

<div class="wrap">
  <div class="search">
    <span class="ic">🔍</span>
    <input id="q" type="search" placeholder="搜尋成語、意思或故事，例如：兔子、讀書、三國" autocomplete="off">
    <button class="clr" id="qclr" title="清除">✕</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="lessons" id="lessons" style="display:none"></div>

  <div class="tools">
    <div id="cats" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="zyT" checked> 顯示注音</label>
    <button class="btn fav" id="reviewBtn">❤️ 複習我的最愛</button>
    <button class="btn alt" id="quizBtn">🎯 小測驗</button>
  </div>

  <p class="status" id="status"></p>
  <div class="grid" id="grid"></div>

  <p class="note">年級分類依康軒國語各年級的閱讀程度整理，非課文逐課對照；實際內容請以當學期課本為準。<br>我的最愛與「我學會了」只存在這台裝置的瀏覽器裡。</p>
</div>

<!-- 成語詳情 -->
<div class="mask" id="dm"><div class="modal" id="dmodal"></div></div>
<!-- 測驗 / 複習 -->
<div class="mask" id="qm"><div class="modal" id="qmodal"></div></div>
<div class="toast" id="toast"></div>

<script>
// 成語故事資料
// 欄位：w 成語 / zy 注音(空白分隔，一字一組) / g 適讀年級 / c 分類 / e 圖示
//       src 出處 / m 意思 / s 故事(用 | 分段) / x 例句 / t 想一想
//       k:"由來" ＝沒有典故故事的常用成語，s 寫的是字面與出處說明（畫面標題會顯示「成語由來」）
// 年級是依康軒國語各年級的閱讀程度安排，不是課文逐課對照；可直接在這裡增刪修改。
window.IDIOMS = [
// ───────── 一年級 ─────────
{w:"守株待兔",zy:"ㄕㄡˇ ㄓㄨ ㄉㄞˋ ㄊㄨˋ",g:1,c:"寓言",e:"🐰",src:"《韓非子・五蠹》",
 m:"比喻不想努力，只想靠運氣得到好處。",
 s:"從前宋國有一個農夫，每天在田裡辛苦工作。|有一天，一隻兔子跑得太快，一頭撞上田邊的樹樁，就這樣死掉了。農夫高高興興撿回家，吃了一頓美味的兔肉。|他心想：「種田好累，不如每天在樹下等兔子就好！」從此他放下鋤頭，天天守在樹樁旁邊。|可是，再也沒有兔子撞上來。田裡長滿了雜草，農夫什麼也沒得到，還被大家笑話。",
 x:"考試前不讀書，只希望題目剛好都會，這就像守株待兔一樣。",
 t:"好運氣會常常發生嗎？想得到好成果，應該怎麼做？"},
{w:"拔苗助長",zy:"ㄅㄚˊ ㄇㄧㄠˊ ㄓㄨˋ ㄓㄤˇ",g:1,c:"寓言",e:"🌱",src:"《孟子・公孫丑上》（原作「揠苗助長」）",
 m:"比喻做事太心急，不按照道理，反而把事情弄壞。",
 s:"宋國有一個農夫，種了一大片稻苗。他每天去看，總覺得稻苗長得好慢好慢。|他想了一個「好辦法」：跑到田裡，把每一株稻苗都往上拔高一點。|忙了一整天，他累得回家說：「今天我幫稻苗長高了！」|他的兒子趕快跑去田裡看，結果稻苗全都枯萎了。",
 x:"學寫字要一筆一畫慢慢練，太急著求快就是拔苗助長。",
 t:"為什麼稻苗被拔高反而會死掉？你有沒有太心急的時候？"},
{w:"井底之蛙",zy:"ㄐㄧㄥˇ ㄉㄧˇ ㄓ ㄨㄚ",g:1,c:"寓言",e:"🐸",src:"《莊子・秋水》",
 m:"比喻見識很少、眼光狹小的人。",
 s:"有一隻青蛙住在一口廢井裡。牠常常得意地說：「我的井好大好舒服，天空就像井口那麼大！」|有一天，一隻從東海來的大海龜經過，青蛙熱情邀請牠進井裡玩。|海龜的左腳還沒踏進去，右腳就被卡住了。海龜告訴青蛙：「大海寬得看不到邊，深得量不到底，下大雨、遇乾旱都不會變。」|青蛙聽了，嚇得說不出話來，才知道自己的世界原來這麼小。",
 x:"多讀書、多出去走走，才不會變成井底之蛙。",
 t:"你知道的世界有多大？怎麼樣可以看到更多？"},
{w:"狐假虎威",zy:"ㄏㄨˊ ㄐㄧㄚˇ ㄏㄨˇ ㄨㄟ",g:1,c:"寓言",e:"🦊",src:"《戰國策・楚策》",
 m:"比喻依靠別人的勢力來欺負人或嚇唬人。",
 s:"老虎抓到一隻狐狸，正想把牠吃掉。|狐狸急中生智說：「你不能吃我！天帝派我當森林之王，不信你跟在我後面走走看。」|老虎半信半疑，跟著狐狸走進森林。小動物們一看到牠們，全都嚇得四處逃跑。|老虎以為大家怕的是狐狸，其實大家怕的是走在後面的老虎呀！",
 x:"他仗著哥哥是班長，就對同學大呼小叫，真是狐假虎威。",
 t:"動物們真正害怕的是誰？借別人的力量嚇人，算是真的厲害嗎？"},
{w:"畫蛇添足",zy:"ㄏㄨㄚˋ ㄕㄜˊ ㄊㄧㄢ ㄗㄨˊ",g:1,c:"寓言",e:"🐍",src:"《戰國策・齊策》",
 m:"比喻做多餘的事，反而把事情弄糟。",
 s:"楚國有人得到一壺酒，酒只夠一個人喝。大家說好：「比賽在地上畫蛇，誰先畫好，酒就給誰喝！」|有一個人很快就畫好了，他左手拿著酒壺，得意地說：「我還來得及幫蛇畫上腳呢！」|就在他幫蛇畫腳的時候，另一個人也畫好了，一把搶走酒壺說：「蛇本來就沒有腳，你畫的不是蛇！」|說完，就把酒喝光了。",
 x:"作文已經寫得很好了，最後再加那段話反而是畫蛇添足。",
 t:"事情做好了，什麼時候該停下來？"},
{w:"對牛彈琴",zy:"ㄉㄨㄟˋ ㄋㄧㄡˊ ㄊㄢˊ ㄑㄧㄣˊ",g:1,c:"寓言",e:"🐮",src:"東漢・牟融《理惑論》",
 m:"比喻說話不看對象，對方聽不懂也沒興趣。",
 s:"古時候有一位很會彈琴的音樂家，叫公明儀。|有一天，他看見一頭牛在草地上吃草，就對著牛彈了一首高雅的曲子。|可是牛完全不理他，繼續低頭吃草。|公明儀換了一首曲子，彈出像蚊子嗡嗡叫、小牛哞哞叫的聲音，牛竟然豎起耳朵，甩著尾巴走過來聽。",
 x:"跟幼兒園的弟弟講分數的乘法，簡直是對牛彈琴。",
 t:"跟不同的人說話，要怎麼說他才聽得懂？"},
{w:"亡羊補牢",zy:"ㄨㄤˊ ㄧㄤˊ ㄅㄨˇ ㄌㄠˊ",g:1,c:"寓言",e:"🐑",src:"《戰國策・楚策》",
 m:"比喻出了錯以後趕快改正，還來得及。",
 s:"有個人養了一群羊。有一天早上，他發現羊圈破了一個洞，一隻羊被狼叼走了。|鄰居勸他：「快把羊圈補好吧！」他卻說：「羊都已經丟了，補有什麼用？」|第二天，又少了一隻羊。他這才後悔，趕快把破洞補好。|從此以後，狼再也進不來，他的羊再也沒有少過。",
 x:"這次考試粗心錯了很多，亡羊補牢，下次寫完一定要檢查。",
 t:"犯錯以後，最重要的是什麼？"},
{w:"磨杵成針",zy:"ㄇㄛˊ ㄔㄨˇ ㄔㄥˊ ㄓㄣ",g:1,c:"人物",e:"📍",src:"宋・祝穆《方輿勝覽》",
 m:"比喻只要有恆心、肯努力，再難的事也能做成。",
 s:"唐朝大詩人李白小時候不愛讀書，常常偷偷跑出去玩。|有一天，他看見一位老婆婆坐在溪邊，拿著一根粗粗的鐵棒在石頭上磨呀磨。|李白好奇地問：「婆婆，您在做什麼？」老婆婆說：「我要把它磨成一根針。」|李白嚇一跳：「這麼粗的鐵棒，磨得成針嗎？」老婆婆笑著說：「只要天天磨，總有一天會成功。」李白聽了很感動，從此用功讀書。",
 x:"練鋼琴要有磨杵成針的精神，每天練一點就會進步。",
 t:"有什麼事情是你想慢慢練、一直練到會的？"},
{w:"盲人摸象",zy:"ㄇㄤˊ ㄖㄣˊ ㄇㄛ ㄒㄧㄤˋ",g:1,c:"寓言",e:"🐘",src:"《大般涅槃經》",
 m:"比喻只看到事情的一小部分，就以為是全部。",
 s:"從前有一位國王，請了幾個看不見的人來摸一摸大象，再說說大象長什麼樣子。|摸到象牙的人說：「大象像一根蘿蔔。」摸到耳朵的人說：「不對，大象像一把扇子！」|摸到腿的人說：「大象像一根柱子。」摸到尾巴的人說：「明明像一條繩子！」|大家吵個不停，其實每個人都只摸到大象的一部分而已。",
 x:"只聽一個人的說法就下結論，就像盲人摸象。",
 t:"遇到吵架的事情，為什麼要聽聽雙方怎麼說？"},
{w:"掩耳盜鈴",zy:"ㄧㄢˇ ㄦˇ ㄉㄠˋ ㄌㄧㄥˊ",g:1,c:"寓言",e:"🔔",src:"《呂氏春秋・自知》（原作「掩耳盜鐘」）",
 m:"比喻自己騙自己，以為別人也不會知道。",
 s:"有一個小偷看上了別人家門口的一口大鐘，想把它偷走。|鐘太重了搬不動，他就想用鎚子把鐘敲碎再帶走。可是一敲，鐘就「噹——」地響起來。|小偷怕被人聽見，趕緊把自己的耳朵摀起來，心想：「我聽不到，別人就聽不到了！」|結果，鐘聲把大家都引來，小偷當場被抓住。",
 x:"把考卷藏起來不給爸媽看，就以為沒事，真是掩耳盜鈴。",
 t:"自己假裝不知道，問題就會消失嗎？"},
{w:"望梅止渴",zy:"ㄨㄤˋ ㄇㄟˊ ㄓˇ ㄎㄜˇ",g:1,c:"歷史",e:"🍑",src:"南朝宋・劉義慶《世說新語・假譎》",
 m:"比喻用想像來安慰自己。",
 s:"三國時代，曹操帶著軍隊走在路上，天氣很熱，找不到水喝，士兵們都口渴得走不動了。|曹操想了一個辦法，大聲說：「前面有一大片梅子林，梅子又酸又甜，可以解渴！」|士兵們一聽，想到酸酸的梅子，嘴巴裡都流出口水，一下子就不那麼渴了。|大家打起精神繼續趕路，終於找到了水源。",
 x:"肚子餓卻還沒到午餐時間，只好看著食物圖片望梅止渴。",
 t:"曹操用了什麼方法讓士兵有力氣繼續走？"},
{w:"畫龍點睛",zy:"ㄏㄨㄚˋ ㄌㄨㄥˊ ㄉㄧㄢˇ ㄐㄧㄥ",g:1,c:"人物",e:"🐉",src:"唐・張彥遠《歷代名畫記》",
 m:"比喻在最重要的地方加上一筆，讓整體變得更生動。",
 s:"南北朝時，有一位很會畫畫的人，叫張僧繇。他在寺廟的牆上畫了四條龍，可是都沒有畫眼睛。|大家問他為什麼，他說：「如果畫上眼睛，龍就會飛走。」大家都不相信，一直要他畫。|張僧繇只好拿起筆，幫其中兩條龍點上眼睛。|忽然雷電交加，那兩條龍竟然破牆飛上天空！沒點眼睛的兩條，還留在牆上。",
 x:"文章最後那句話寫得真好，有畫龍點睛的效果。",
 t:"一幅畫或一篇文章，哪裡最重要？"},
{w:"孟母三遷",zy:"ㄇㄥˋ ㄇㄨˇ ㄙㄢ ㄑㄧㄢ",g:1,c:"人物",e:"🏠",src:"漢・劉向《列女傳》",
 m:"比喻父母用心為孩子選擇好的學習環境。",
 s:"孟子小時候住在墓地附近，他就學大人辦喪事、哭哭啼啼。孟媽媽說：「這裡不適合孩子住。」就搬家了。|第二次搬到市場旁邊，孟子又學商人大聲叫賣。孟媽媽說：「這裡也不好。」又搬家了。|第三次，他們搬到學校旁邊。孟子開始學讀書人鞠躬行禮、認真念書。|孟媽媽高興地說：「這裡才是孩子該住的地方！」孟子長大後，成為很有學問的人。",
 x:"爸媽為了讓我們好好讀書，像孟母三遷一樣搬到學校附近。",
 t:"身邊的人和環境，會怎麼影響我們？"},
{w:"熟能生巧",zy:"ㄕㄡˊ ㄋㄥˊ ㄕㄥ ㄑㄧㄠˇ",g:1,c:"人物",e:"🏺",src:"宋・歐陽脩〈賣油翁〉",
 m:"做得多、練得熟，自然就能掌握技巧。",
 s:"宋朝有一位很會射箭的人，叫陳堯咨，十支箭能射中八九支，他很得意。|一個賣油的老爺爺看了，只是微微點頭。陳堯咨不高興地問：「你不覺得我很厲害嗎？」|老爺爺拿出一個葫蘆，在口上放一枚銅錢，再用勺子把油從錢孔倒進去，油一滴都沒沾到銅錢。|老爺爺笑著說：「我也沒什麼特別的，只是做得很熟練罷了。」",
 x:"剛開始跳繩常被絆倒，每天練習之後熟能生巧，現在可以連跳一百下。",
 t:"你有哪一件事是越練越厲害的？"},
{w:"精衛填海",zy:"ㄐㄧㄥ ㄨㄟˋ ㄊㄧㄢˊ ㄏㄞˇ",g:1,c:"神話",e:"🐦",src:"《山海經・北山經》",
 m:"比喻意志堅定，不怕困難，努力到底。",
 s:"傳說炎帝有一個小女兒叫女娃，她到東海去玩，不小心被大浪捲走，再也沒有回來。|女娃變成了一隻小鳥，叫聲聽起來像「精衛、精衛」，大家就叫她精衛鳥。|精衛鳥很氣大海奪走她的生命，決定要把大海填平。|她每天從西山銜來小樹枝和小石頭，一顆一顆丟進大海裡，一年又一年，從來沒有停下來。",
 x:"他學游泳嗆了好多次水，仍然有精衛填海的決心，終於學會了。",
 t:"小小的精衛鳥面對大大的海，你覺得她勇敢嗎？"},

{w:"自相矛盾",zy:"ㄗˋ ㄒㄧㄤ ㄇㄠˊ ㄉㄨㄣˋ",g:2,c:"寓言",e:"🛡️",src:"《韓非子・難一》",
 m:"比喻說話或做事前後不一致。",
 s:"楚國有一個人在市場賣矛和盾。|他先舉起盾牌誇口：「我的盾最堅固，什麼東西都刺不穿！」|接著又拿起矛大聲說：「我的矛最鋒利，什麼東西都刺得穿！」|旁邊的人問：「那用你的矛去刺你的盾，會怎麼樣呢？」那個人張大嘴巴，一句話也答不出來。",
 x:"他說自己從不遲到，又說昨天睡過頭，真是自相矛盾。",

{w:"刻舟求劍",zy:"ㄎㄜˋ ㄓㄡ ㄑㄧㄡˊ ㄐㄧㄢˋ",g:2,c:"寓言",e:"🗡️",src:"《呂氏春秋・察今》",
 m:"比喻做事死板，不知道情況已經改變。",
 s:"楚國有個人坐船過江，一不小心，他的寶劍「撲通」一聲掉進水裡。|他不慌不忙，在船邊刻了一個記號說：「我的劍是從這裡掉下去的。」|船到了岸邊停下來，他就從刻記號的地方跳下水去找劍。|可是船一直在往前走，劍卻沉在原來的地方，他當然找不到啦！",
 x:"規則已經改了，你還照舊的方法做，就像刻舟求劍。",
 t:"船在動、劍沒動，他該怎麼做才找得到劍？"},
{w:"杞人憂天",zy:"ㄑㄧˇ ㄖㄣˊ ㄧㄡ ㄊㄧㄢ",g:2,c:"寓言",e:"☁️",src:"《列子・天瑞》",
 m:"比喻擔心不必要、不會發生的事。",
 s:"杞國有一個人，整天擔心天會塌下來、地會陷下去，自己沒有地方躲。|他擔心得吃不下飯、睡不著覺。|一位朋友來安慰他：「天是由空氣聚成的，到處都是，不會掉下來；地是由土堆成的，到處都是，也不會陷下去。」|杞國人聽了，才放下心來，開開心心地笑了。",
 x:"明天才要上台，你從上個月就開始擔心，別杞人憂天了。",
 t:"你有沒有擔心過不太會發生的事？可以找誰聊聊？"},
{w:"朝三暮四",zy:"ㄓㄠ ㄙㄢ ㄇㄨˋ ㄙˋ",g:2,c:"寓言",e:"🐒",src:"《莊子・齊物論》",
 m:"原指用花招騙人，現在多比喻常常改變主意。",
 s:"宋國有一個老人養了一大群猴子，每天餵牠們吃栗子。|後來家裡的糧食不夠了，老人對猴子說：「以後早上給你們三顆，晚上給四顆，好不好？」|猴子們聽了都生氣地跳來跳去。|老人又說：「那改成早上四顆，晚上三顆，好嗎？」猴子們聽了都高興地拍手。其實一天還是一樣七顆呀！",
 x:"他一下子想學畫畫，一下子又想學跳舞，朝三暮四，什麼都沒學好。",
 t:"三加四和四加三，有沒有不一樣？"},
{w:"濫竽充數",zy:"ㄌㄢˋ ㄩˊ ㄔㄨㄥ ㄕㄨˋ",g:2,c:"寓言",e:"🎵",src:"《韓非子・內儲說上》",
 m:"比喻沒有真本事的人混在行家裡面湊數。",
 s:"齊宣王喜歡聽人吹竽（一種樂器），而且一定要三百個人一起合奏。|有一位南郭先生根本不會吹竽，卻混進樂隊裡，每次都裝模作樣地搖頭晃腦，領了很多薪水。|後來齊宣王過世了，他的兒子齊湣王也喜歡聽竽，可是他喜歡一個一個聽人獨奏。|南郭先生知道自己要露出馬腳了，只好連夜偷偷逃走。",
 x:"大合唱時不開口只對嘴，這就是濫竽充數。",
 t:"沒有真本事，可以一直躲下去嗎？"},
{w:"葉公好龍",zy:"ㄧㄝˋ ㄍㄨㄥ ㄏㄠˋ ㄌㄨㄥˊ",g:2,c:"寓言",e:"🐲",src:"漢・劉向《新序・雜事》",
 m:"比喻嘴巴說喜歡，其實並不是真的喜歡。",
 s:"有一位葉公，非常喜歡龍。他的衣服上繡著龍，杯子上刻著龍，連屋子的牆壁上也畫滿了龍。|天上的真龍聽說了，很感動，就飛下來拜訪葉公。|真龍把頭伸進窗戶，尾巴拖在大廳裡。|葉公一看，嚇得臉色發白，轉身就跑。原來他喜歡的只是像龍的東西，不是真正的龍。",
 x:"他說最愛小狗，小狗一靠近卻嚇得大叫，真是葉公好龍。",
 t:"「真的喜歡」和「說說而已」有什麼不同？"},
{w:"南轅北轍",zy:"ㄋㄢˊ ㄩㄢˊ ㄅㄟˇ ㄓㄜˊ",g:2,c:"寓言",e:"🧭",src:"《戰國策・魏策》",
 m:"比喻做法和目標相反，越努力離目標越遠。",
 s:"有一個人要去南方的楚國，卻駕著馬車一直往北走。|路人提醒他：「楚國在南方，你怎麼往北走呢？」|他說：「我的馬跑得快！」「我的錢很多！」「我的車夫技術很好！」|路人搖搖頭說：「這些條件越好，你就離楚國越遠啊！」",
 x:"想減肥卻每天吃炸雞，這樣做是南轅北轍。",
 t:"努力很重要，但方向對不對更重要嗎？"},
{w:"驚弓之鳥",zy:"ㄐㄧㄥ ㄍㄨㄥ ㄓ ㄋㄧㄠˇ",g:2,c:"歷史",e:"🏹",src:"《戰國策・楚策》",
 m:"比喻受過驚嚇的人，遇到一點動靜就很害怕。",
 s:"魏國有一位神射手叫更羸。有一天，他對魏王說：「我不用箭，只要拉一下弓，就能讓天上的鳥掉下來。」|這時一隻大雁慢慢飛過，更羸拉開弓弦「嘣」一聲，大雁真的掉了下來。|魏王驚訝極了。更羸解釋：「這隻雁飛得慢、叫得悲傷，表示牠受過箭傷、傷口還沒好。」|「牠一聽到弓弦聲，嚇得拚命往上飛，傷口裂開，就掉下來了。」",
 x:"上次被狗追過以後，他就像驚弓之鳥，聽到狗叫就發抖。",
 t:"更羸是怎麼知道大雁受過傷的？"},
{w:"老馬識途",zy:"ㄌㄠˇ ㄇㄚˇ ㄕˋ ㄊㄨˊ",g:2,c:"歷史",e:"🐴",src:"《韓非子・說林上》",
 m:"比喻有經驗的人，對事情比較熟悉。",
 s:"春秋時代，齊桓公帶兵出去打仗，回來的時候在山谷裡迷路了。|大家走來走去都找不到出路，又冷又累。|大臣管仲說：「老馬認得路，讓牠們帶路吧！」|他們放開幾匹老馬，跟在後面走，果然順利走出山谷，回到了家鄉。",
 x:"露營時多虧爺爺老馬識途，我們才沒有走錯路。",
 t:"家裡誰最有經驗？遇到問題時你會請教誰？"},
{w:"鷸蚌相爭",zy:"ㄩˋ ㄅㄤˋ ㄒㄧㄤ ㄓㄥ",g:2,c:"寓言",e:"🐚",src:"《戰國策・燕策》",
 m:"比喻雙方爭吵不讓，結果讓第三者得到好處（漁翁得利）。",
 s:"一隻河蚌張開殼在河邊曬太陽，一隻鷸鳥飛來，用長嘴去啄牠的肉。|河蚌馬上把殼合起來，緊緊夾住鷸鳥的嘴。|鷸鳥說：「今天不下雨，明天不下雨，你就會乾死！」河蚌說：「我今天不放，明天不放，你就會餓死！」|兩個誰也不讓誰。這時一位漁夫走過來，輕輕鬆鬆就把牠們一起抓走了。",
 x:"兩隊吵著搶球場，結果被第三隊占走，真是鷸蚌相爭，漁翁得利。",
 t:"吵架吵到最後，誰得到好處了？"},
{w:"愚公移山",zy:"ㄩˊ ㄍㄨㄥ ㄧˊ ㄕㄢ",g:2,c:"寓言",e:"⛰️",src:"《列子・湯問》",
 m:"比喻做事有毅力，不怕困難。",
 s:"從前有一位九十歲的老人叫愚公，家門前有兩座大山擋住了路，出門很不方便。|愚公決定帶著全家，一擔一擔把山上的土石挖走。|有一位叫智叟的人笑他：「你年紀這麼大，怎麼搬得完？」|愚公說：「我死了還有兒子，兒子還有孫子，子子孫孫沒有窮盡，山卻不會再長高，怎麼會搬不完呢？」天帝被他感動，派神仙把兩座山搬走了。",
 x:"整理這麼大的倉庫，要有愚公移山的精神。",
 t:"你覺得愚公「愚」嗎？為什麼？"},
{w:"夸父逐日",zy:"ㄎㄨㄚ ㄈㄨˋ ㄓㄨˊ ㄖˋ",g:2,c:"神話",e:"☀️",src:"《山海經・海外北經》",
 m:"比喻有很大的志向和決心；也比喻不自量力。",
 s:"傳說有一個巨人叫夸父，他想追上太陽，把太陽留住。|他邁開大步，一路往西追，跑得滿身大汗，口渴極了。|他一口氣喝乾了黃河和渭水，還是不夠，又往北方的大湖跑去。|可惜還沒跑到，夸父就倒下了。他的手杖落在地上，變成了一大片桃樹林。",
 x:"他立志要游完整個日月潭，有夸父逐日的氣魄。",
 t:"夸父的手杖變成桃林，你覺得是什麼意思？"},
{w:"班門弄斧",zy:"ㄅㄢ ㄇㄣˊ ㄋㄨㄥˋ ㄈㄨˇ",g:2,c:"人物",e:"🔨",src:"唐・柳宗元〈王氏伯仲唱和詩序〉",
 m:"比喻在行家面前賣弄本領，不自量力。",
 s:"魯班是古時候最有名的木匠，大家都尊稱他是木匠的老祖師。|有一個年輕的木匠學了一點本事，就拿著斧頭到處表演。|有一天，他竟然跑到魯班家的大門口，揮著斧頭說：「我做的東西最好！」|路過的人笑著說：「你知道這是誰家嗎？在魯班門前耍斧頭，太不知天高地厚了！」",
 x:"在書法老師面前寫毛筆字，真是班門弄斧。",
 t:"在比自己厲害的人面前，應該怎麼表現比較好？"},
{w:"東施效顰",zy:"ㄉㄨㄥ ㄕ ㄒㄧㄠˋ ㄆㄧㄣˊ",g:2,c:"寓言",e:"🎭",src:"《莊子・天運》",
 m:"比喻盲目模仿別人，結果反而更糟。",
 s:"古代美女西施有心痛的毛病，發作時常常皺著眉頭、摀著胸口，大家看了都覺得她好美。|同村有一個姑娘叫東施，看到了也學西施皺眉頭、摀胸口，在村子裡走來走去。|結果大家看到她，有的趕快關門，有的帶著家人躲得遠遠的。|東施只學了樣子，卻不知道西施美在哪裡。",
 x:"別人穿好看，不代表你也適合，別東施效顰。",
 t:"做自己和學別人，要怎麼拿捏？"},
{w:"黔驢技窮",zy:"ㄑㄧㄢˊ ㄌㄩˊ ㄐㄧˋ ㄑㄩㄥˊ",g:2,c:"寓言",e:"🦙",src:"唐・柳宗元〈三戒・黔之驢〉",
 m:"比喻僅有的一點本事已經用完了。",
 s:"黔地原本沒有驢子，有人用船載來一頭，放在山腳下。|老虎第一次看到這麼大的動物，很害怕，躲在樹林裡偷看。驢子一叫，老虎嚇得逃得遠遠的。|慢慢地，老虎越靠越近，故意去碰驢子。驢子生氣了，只會用後腳踢老虎。|老虎高興地想：「原來你只有這點本事！」就撲上去把驢子吃掉了。",
 x:"他會的魔術全表演完了，最後黔驢技窮，只好下台。",
 t:"只會一招，夠不夠用？"},

{w:"鑿壁偷光",zy:"ㄗㄠˊ ㄅㄧˋ ㄊㄡ ㄍㄨㄤ",g:3,c:"人物",e:"🕯️",src:"晉・葛洪《西京雜記》",
 m:"形容家境貧窮但刻苦讀書。",
 s:"漢朝有一個叫匡衡的孩子，非常喜歡讀書，可是家裡很窮，晚上買不起蠟燭。|他發現隔壁鄰居家晚上點著燈，就在牆壁上鑿了一個小洞。|燈光從小洞透過來，匡衡就把書靠在洞邊，一個字一個字地讀。|他還到有很多書的人家幫忙做工，不要工錢，只求借書來讀。後來匡衡成為很有學問的大臣。",
 x:"古人鑿壁偷光也要讀書，我們有明亮的檯燈更要用功。",
 t:"匡衡用什麼方法克服困難？"},
{w:"囊螢映雪",zy:"ㄋㄤˊ ㄧㄥˊ ㄧㄥˋ ㄒㄩㄝˇ",g:3,c:"人物",e:"✨",src:"《晉書・車胤傳》、《孫氏世錄》",
 m:"形容在困難的環境中刻苦讀書。",
 s:"晉朝的車胤家裡很窮，沒錢買燈油。夏天晚上，他抓了許多螢火蟲裝進白色的薄布袋，靠螢火蟲的光讀書。|另一位叫孫康的人，也是窮得點不起燈。|冬天下雪的夜晚，他就坐在屋外，藉著白雪反射的亮光，忍著寒冷讀書。|後來兩個人都成了很有學問的人。",
 x:"雖然沒有補習，他靠著囊螢映雪的精神自學，考上了理想學校。",
 t:"如果是你，會想出什麼辦法讀書？"},
{w:"聞雞起舞",zy:"ㄨㄣˊ ㄐㄧ ㄑㄧˇ ㄨˇ",g:3,c:"人物",e:"🐓",src:"《晉書・祖逖傳》",
 m:"比喻有志向的人及時努力、勤奮不懈。",
 s:"晉朝有兩個好朋友，祖逖和劉琨，他們都想長大後報效國家。|有一天半夜，祖逖聽到雞叫聲，就把劉琨叫醒說：「這是叫我們起床的聲音！」|兩個人就到院子裡拔劍練武。|從此以後，他們每天聽到雞叫就起床練習，後來都成為保衛國家的大將。",
 x:"哥哥為了參加比賽，每天聞雞起舞，天還沒亮就去練跑。",
 t:"要達成目標，每天可以做哪一件小事？"},
{w:"程門立雪",zy:"ㄔㄥˊ ㄇㄣˊ ㄌㄧˋ ㄒㄩㄝˇ",g:3,c:"人物",e:"❄️",src:"《宋史・楊時傳》",
 m:"形容尊敬老師、虛心求學。",
 s:"宋朝有一個讀書人叫楊時，他和朋友一起去拜訪老師程頤，想請教問題。|到了老師家，程頤正閉著眼睛坐著休息。|楊時不想吵醒老師，就和朋友安安靜靜地站在門外等。外面下起大雪，他們還是一動也不動。|等程頤醒來，門外的雪已經積了一尺深了。",
 x:"他向老師請教問題時，有程門立雪般的禮貌與耐心。",
 t:"怎樣做才是尊敬老師的表現？"},
{w:"胸有成竹",zy:"ㄒㄩㄥ ㄧㄡˇ ㄔㄥˊ ㄓㄨˊ",g:3,c:"人物",e:"🎋",src:"宋・蘇軾〈文與可畫篔簹谷偃竹記〉",
 m:"比喻做事之前已經有完整的計畫，很有把握。",
 s:"宋朝有一位畫家叫文與可，他最會畫竹子。|他在家旁邊種了好多竹子，每天觀察竹子在晴天、雨天、颳風時的樣子。|因為看得太熟了，竹子的模樣早就深深印在他的心裡。|每次拿起畫筆，他不用多想，一下子就畫出栩栩如生的竹子。",
 x:"他每天都有複習，考試時胸有成竹，一點也不緊張。",
 t:"怎樣才能對一件事「很有把握」？"},
{w:"入木三分",zy:"ㄖㄨˋ ㄇㄨˋ ㄙㄢ ㄈㄣ",g:3,c:"人物",e:"🖌️",src:"唐・張懷瓘《書斷》",
 m:"形容書法筆力強勁；也比喻見解深刻。",
 s:"東晉的王羲之是有名的書法家，大家稱他「書聖」。|有一次，皇帝要舉行祭典，請王羲之把祝詞寫在木板上，再交給工匠雕刻。|工匠削木板的時候嚇了一跳：墨汁竟然滲進木頭裡有三分那麼深！|大家都說王羲之寫字的力氣太厲害了。",
 x:"這篇文章分析得入木三分，讓人佩服。",
 t:"王羲之的字為什麼這麼有力？只靠天分嗎？"},
{w:"一鳴驚人",zy:"ㄧ ㄇㄧㄥˊ ㄐㄧㄥ ㄖㄣˊ",g:3,c:"歷史",e:"📣",src:"《史記・滑稽列傳》",
 m:"比喻平時沒有表現，一做起事來就有驚人的成績。",
 s:"齊威王剛當上國王時，整天只顧著玩樂，不管國家大事。|大臣淳于髡用猜謎的方式提醒他：「有一隻大鳥停在王宮裡，三年不飛也不叫，這是什麼鳥呢？」|齊威王聽懂了，回答說：「這隻鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人！」|從此齊威王認真治理國家，齊國變得非常強大。",
 x:"她平常很安靜，這次演講比賽卻一鳴驚人，拿下第一名。",
 t:"大臣為什麼要用猜謎的方式勸國王？"},
{w:"杯弓蛇影",zy:"ㄅㄟ ㄍㄨㄥ ㄕㄜˊ ㄧㄥˇ",g:3,c:"歷史",e:"🍵",src:"《晉書・樂廣傳》",
 m:"比喻疑神疑鬼，自己嚇自己。",
 s:"晉朝的樂廣請朋友來家裡喝酒。朋友舉起杯子時，好像看到杯子裡有一條小蛇。|他不好意思說，硬著頭皮把酒喝下去，回家後越想越害怕，就生病了。|樂廣知道後，回到原來的房間察看，發現牆上掛著一把弓，弓的影子剛好映在酒杯裡，看起來就像一條蛇。|樂廣再請朋友來，讓他坐在同樣的位置看清楚。朋友恍然大悟，病馬上就好了。",
 x:"晚上把衣架看成人影，嚇得大叫，真是杯弓蛇影。",
 t:"害怕的時候，可以怎麼找出真相？"},
{w:"塞翁失馬",zy:"ㄙㄞˋ ㄨㄥ ㄕ ㄇㄚˇ",g:3,c:"寓言",e:"🐎",src:"《淮南子・人間訓》",
 m:"比喻壞事有時也會變成好事（塞翁失馬，焉知非福）。",
 s:"邊塞住著一位老人，他的馬跑到胡人那邊去了。鄰居來安慰他，他卻說：「這說不定是好事。」|過了幾個月，那匹馬竟然帶著一匹胡人的駿馬回來了。大家來祝賀，老人說：「這說不定是壞事。」|他的兒子很喜歡騎那匹駿馬，結果摔斷了腿。老人又說：「這說不定是好事。」|一年後打仗了，年輕人都被抓去當兵，很多人沒能回來。老人的兒子因為腿受傷不用去，父子平平安安。",
 x:"沒抽到想要的組別，結果認識了好朋友，真是塞翁失馬，焉知非福。",
 t:"遇到不順利的事，可以換個角度想想嗎？"},
{w:"一葉障目",zy:"ㄧ ㄧㄝˋ ㄓㄤˋ ㄇㄨˋ",g:3,c:"寓言",e:"🍃",src:"三國魏・邯鄲淳《笑林》",
 m:"比喻被眼前的小事物遮住，看不清全貌。",
 s:"楚國有一個窮書生，讀到一本書上寫：螳螂捕蟬時躲在葉子後面，那片葉子可以讓人隱形。|他跑到樹下找了好久，摘下一大堆葉子，一片一片拿起來遮住眼睛，問妻子：「你看得到我嗎？」|妻子被問煩了，就說：「看不到了。」|書生高高興興地拿著那片葉子跑到市場拿別人的東西，結果當場被抓住了。",
 x:"只看一次考試成績就說自己不行，是一葉障目。",
 t:"用葉子遮住自己的眼睛，別人就看不到你嗎？"},
{w:"邯鄲學步",zy:"ㄏㄢˊ ㄉㄢ ㄒㄩㄝˊ ㄅㄨˋ",g:3,c:"寓言",e:"🚶",src:"《莊子・秋水》",
 m:"比喻一味模仿別人，反而連自己原本的本領也忘了。",
 s:"燕國有一個少年，聽說趙國邯鄲的人走路姿勢特別優美，就跑到邯鄲去學。|他每天在街上跟在別人後面，學人家怎麼抬腳、怎麼擺手。|可是學了很久都學不像，反而把自己原來怎麼走路都忘記了。|最後，他只好爬著回到燕國。",
 x:"寫作文要寫出自己的想法，一直抄範文只會邯鄲學步。",
 t:"學習別人時，怎樣才不會忘了自己？"},
{w:"買櫝還珠",zy:"ㄇㄞˇ ㄉㄨˊ ㄏㄨㄢˊ ㄓㄨ",g:3,c:"寓言",e:"💎",src:"《韓非子・外儲說左上》",
 m:"比喻只看外表，不懂得真正有價值的東西。",
 s:"楚國有個商人要到鄭國賣珍珠。他用名貴的木頭做了一個盒子（櫝），還刻上花紋、鑲上寶石，非常漂亮。|一個鄭國人看到這個盒子，愛得不得了，花了很多錢把它買下來。|他打開盒子，拿出裡面的珍珠，把珍珠還給了商人。|他只要漂亮的盒子，卻把真正值錢的珍珠退回去了。",
 x:"只看包裝漂亮就買，不管內容好不好，就是買櫝還珠。",
 t:"選東西時，你會先看外表還是內容？"},
{w:"三顧茅廬",zy:"ㄙㄢ ㄍㄨˋ ㄇㄠˊ ㄌㄨˊ",g:3,c:"歷史",e:"🏡",src:"三國蜀・諸葛亮〈出師表〉",
 m:"比喻誠心誠意地一再邀請別人。",
 s:"三國時代，劉備想找一位聰明的軍師幫忙，聽說諸葛亮很有智慧，就去他住的草屋（茅廬）拜訪。|第一次去，諸葛亮不在家；第二次頂著大風雪再去，還是沒見到。|第三次，諸葛亮正在睡午覺，劉備就恭恭敬敬地站在門外等他醒來。|諸葛亮被劉備的誠意感動，答應出來幫忙，後來幫劉備建立了蜀國。",
 x:"教練三顧茅廬，終於請到那位選手加入球隊。",
 t:"劉備靠什麼打動了諸葛亮？"},
{w:"草船借箭",zy:"ㄘㄠˇ ㄔㄨㄢˊ ㄐㄧㄝˋ ㄐㄧㄢˋ",g:3,c:"歷史",e:"⛵",src:"明・羅貫中《三國演義》",
 m:"比喻運用智慧，借用別人的力量達成目的。",
 s:"三國時代，周瑜要諸葛亮在十天內造好十萬支箭，想故意為難他。諸葛亮卻說：「只要三天就夠了。」|諸葛亮準備了二十艘小船，船上綁滿稻草人，算準第三天清晨江上會起大霧。|他命令船隊開到曹操的軍營前擂鼓吶喊。曹操在大霧中看不清楚，以為敵人來攻，下令放箭。|成千上萬支箭全插在稻草人上，諸葛亮帶著十多萬支箭回來，順利完成任務。",
 x:"他借用學長整理的筆記來複習，像草船借箭一樣聰明。",
 t:"諸葛亮用了哪些知識才成功？"},
{w:"開卷有益",zy:"ㄎㄞ ㄐㄩㄢˋ ㄧㄡˇ ㄧˋ",g:3,c:"歷史",e:"📖",src:"宋・王闢之《澠水燕談錄》",
 m:"只要打開書來讀，就一定會有收穫。",
 s:"宋太宗很喜歡讀書。他命人編了一套一千卷的大書，叫做《太平御覽》。|他規定自己每天要讀三卷，如果忙得沒時間讀，以後也一定要補回來。|大臣怕皇帝太累，勸他休息。|宋太宗說：「只要打開書本就會有好處，我一點都不覺得累！」",
 x:"開卷有益，每天睡前讀十分鐘的書吧！",
 t:"你最近讀了哪一本書？學到什麼？"},
{w:"沾沾自喜",zy:"ㄓㄢ ㄓㄢ ㄗˋ ㄒㄧˇ",g:3,c:"歷史",e:"😏",src:"《史記・魏其武安侯列傳》",
 m:"形容自以為很好，得意洋洋的樣子。",
 s:"漢朝時，竇太后很疼愛自己的姪子竇嬰（封號魏其侯），想讓他當丞相。|漢景帝卻沒有答應，改派了另一位穩重的大臣衛綰當丞相。|景帝向太后解釋：「我不是捨不得讓魏其侯當丞相。他這個人做了一點事就沾沾自喜，做事又太輕率。」|「丞相要管整個國家，需要穩重的人才行啊！」",
 x:"考了一次一百分就沾沾自喜，下次可能就會粗心了。",
 t:"表現好的時候，怎樣開心才不會變成驕傲？"},

{w:"臥薪嘗膽",zy:"ㄨㄛˋ ㄒㄧㄣ ㄔㄤˊ ㄉㄢˇ",g:4,c:"歷史",e:"😣",src:"《史記・越王句踐世家》",
 m:"比喻刻苦自勵，下定決心發憤圖強。",
 s:"春秋時代，越王句踐被吳國打敗，還被抓去吳國當僕人，受了很多屈辱。|三年後他回到越國，決心報仇雪恥。|他晚上睡在粗硬的柴草上，在座位旁掛了一顆苦膽，吃飯、睡覺前都嘗一口，提醒自己不要忘記失敗的痛苦。|經過十多年努力，越國變得強大，終於打敗了吳國。",
 x:"上次比賽輸了以後，他臥薪嘗膽苦練一年，今年拿下冠軍。",
 t:"失敗以後，你會怎麼提醒自己再努力？"},
{w:"完璧歸趙",zy:"ㄨㄢˊ ㄅㄧˋ ㄍㄨㄟ ㄓㄠˋ",g:4,c:"歷史",e:"💍",src:"《史記・廉頗藺相如列傳》",
 m:"比喻把原物完好無缺地歸還原主。",
 s:"趙國有一塊珍貴的玉，叫「和氏璧」。秦王說要用十五座城來換。|趙王怕被騙，派藺相如帶著玉去秦國。秦王拿到玉後非常高興，卻絕口不提換城的事。|藺相如說：「玉上有個小斑點，我指給大王看。」拿回玉後，他退到柱子旁說：「大王沒有誠意，再逼我，我就和玉一起撞碎在柱子上！」|秦王只好讓步。藺相如偷偷派人把玉送回趙國，玉完好無缺地回家了。",
 x:"借來的書我一定會完璧歸趙，不會弄髒。",
 t:"藺相如靠的是勇氣還是智慧？還是兩個都有？"},
{w:"負荊請罪",zy:"ㄈㄨˋ ㄐㄧㄥ ㄑㄧㄥˇ ㄗㄨㄟˋ",g:4,c:"歷史",e:"🙇",src:"《史記・廉頗藺相如列傳》",
 m:"比喻主動向人認錯道歉。",
 s:"藺相如立了大功，官位比大將軍廉頗還高。廉頗很不服氣：「我出生入死，他只靠一張嘴！我見到他一定要羞辱他。」|藺相如知道後，總是避開廉頗，連出門遇到也繞路走。|他說：「秦國不敢攻打趙國，是因為有我們兩人。如果我們吵架，就讓秦國有機會了。」|廉頗聽了非常慚愧，背著荊條到藺相如家門口跪下道歉。兩人從此成為好朋友。",
 x:"他知道自己誤會同學後，馬上負荊請罪，大家又和好如初。",
 t:"道歉需要勇氣嗎？為什麼？"},
{w:"紙上談兵",zy:"ㄓˇ ㄕㄤˋ ㄊㄢˊ ㄅㄧㄥ",g:4,c:"歷史",e:"📜",src:"《史記・廉頗藺相如列傳》",
 m:"比喻只會說空話，沒有實際的本領。",
 s:"趙國名將趙奢的兒子趙括，從小讀了很多兵書，講起打仗頭頭是道，連爸爸都說不過他。|可是趙奢說：「打仗是生死大事，括兒說得太輕鬆了。如果讓他當將軍，趙國一定會吃敗仗。」|後來秦國攻打趙國，趙王派趙括當大將。他只會照著書本死板地指揮。|結果趙軍被秦軍包圍，四十多萬士兵全軍覆沒。",
 x:"游泳只看影片不下水，就是紙上談兵。",
 t:"「知道」和「做得到」有什麼不同？"},
{w:"毛遂自薦",zy:"ㄇㄠˊ ㄙㄨㄟˋ ㄗˋ ㄐㄧㄢˋ",g:4,c:"歷史",e:"🙋",src:"《史記・平原君虞卿列傳》",
 m:"比喻自己推薦自己，主動爭取機會。",
 s:"秦國包圍趙國，趙國的平原君要去楚國求救，想從門客中挑二十個人一起去，挑來挑去只有十九個。|一個叫毛遂的門客站出來說：「讓我去吧！」平原君說：「你來我家三年，我都沒聽過你有什麼表現。」|毛遂說：「把錐子放進袋子裡，尖端馬上就會露出來。我只是一直沒有被放進袋子裡而已。」|到了楚國，談判不順利，毛遂拿著劍走上前，說服楚王出兵救趙。",
 x:"班上要選小老師，他毛遂自薦，願意幫大家收作業。",

{w:"唇亡齒寒",zy:"ㄔㄨㄣˊ ㄨㄤˊ ㄔˇ ㄏㄢˊ",g:4,c:"歷史",e:"👄",src:"《左傳・僖公五年》",
 m:"比喻關係密切，互相依存。",
 s:"春秋時代，晉國想消滅虢國，可是要先經過虞國。晉國就送了寶馬和美玉給虞國國君，請他借路。|虞國的大臣宮之奇勸國君：「虞國和虢國就像嘴唇和牙齒，嘴唇沒了，牙齒就會冷。」|虞國國君貪圖禮物，不肯聽勸。|晉國借路滅了虢國之後，回程時順便把虞國也消滅了。",

{w:"退避三舍",zy:"ㄊㄨㄟˋ ㄅㄧˋ ㄙㄢ ㄕㄜˋ",g:4,c:"歷史",e:"↩️",src:"《左傳・僖公二十三年》",
 m:"比喻主動讓步，不和人相爭。",
 s:"晉國公子重耳流亡到楚國時，楚王熱情地招待他。|楚王問：「將來你回國當國王，要怎麼報答我？」重耳說：「如果晉楚兩國不得不打仗，我會先把軍隊後退三舍（九十里）。」|後來重耳成為晉文公，兩國真的打起仗來。|晉文公遵守承諾，下令軍隊退後九十里。楚軍卻步步進逼，最後反而被晉軍打敗了。",

{w:"一鼓作氣",zy:"ㄧ ㄍㄨˇ ㄗㄨㄛˋ ㄑㄧˋ",g:4,c:"歷史",e:"🥁",src:"《左傳・莊公十年》",
 m:"比喻趁著士氣旺盛時，一口氣把事情做完。",
 s:"齊國攻打魯國，魯莊公帶著一位叫曹劌的人一起上戰場。|齊軍打了第一次鼓衝過來，魯莊公想馬上應戰，曹劌說：「還不行。」齊軍打了第二次、第三次鼓，曹劌才說：「可以了！」|魯軍一衝出去，就把齊軍打得大敗。|曹劌解釋：「打仗靠勇氣。第一次擊鼓時士氣最旺，第二次就變弱，第三次就沒了。他們沒氣了，我們正旺，所以能贏。」",
 x:"趁著有精神，我們一鼓作氣把作業寫完吧！",

{w:"三人成虎",zy:"ㄙㄢ ㄖㄣˊ ㄔㄥˊ ㄏㄨˇ",g:4,c:"歷史",e:"🐯",src:"《戰國策・魏策》",
 m:"比喻謠言說的人多了，大家就會信以為真。",
 s:"魏國大臣龐恭要陪太子去趙國，臨走前問魏王：「如果有人說市場上有老虎，大王相信嗎？」魏王說：「不信。」|「如果兩個人都這樣說呢？」魏王說：「我會有點懷疑。」|「如果三個人都這樣說呢？」魏王說：「那我就相信了。」|龐恭說：「市場上明明不會有老虎，三個人一說就成真了。我走以後，說我壞話的人一定不只三個，請大王明察。」後來魏王果然聽信讒言，不再信任他。",

{w:"一字千金",zy:"ㄧ ㄗˋ ㄑㄧㄢ ㄐㄧㄣ",g:4,c:"歷史",e:"💰",src:"《史記・呂不韋列傳》",

{w:"刮目相看",zy:"ㄍㄨㄚ ㄇㄨˋ ㄒㄧㄤ ㄎㄢˋ",g:4,c:"歷史",e:"👀",src:"《三國志・呂蒙傳》裴松之注引《江表傳》",

 x:"他暑假天天練字，開學後字寫得好漂亮，讓大家刮目相看。",

{w:"狡兔三窟",zy:"ㄐㄧㄠˇ ㄊㄨˋ ㄙㄢ ㄎㄨ",g:4,c:"歷史",e:"🕳️",src:"《戰國策・齊策》",
 m:"比喻事先多準備幾條退路。",
 s:"齊國的孟嘗君有一位門客叫馮諼。孟嘗君派他去收債，他卻把窮人的借據全燒了，說是替孟嘗君「買了義氣」。|後來孟嘗君被齊王免官，回到封地時，當地百姓扶老攜幼來迎接他，他才明白馮諼的用意。|馮諼說：「聰明的兔子有三個洞，才能保住性命。現在您只有一個洞，我再幫您挖兩個。」|馮諼又幫孟嘗君得到魏國的重視，並讓齊王把宗廟建在他的封地，孟嘗君從此平安無事。",
 x:"出遊前多查幾條路線，狡兔三窟比較保險。",
 t:"做計畫時，為什麼要準備「B 計畫」？"},
{w:"雞鳴狗盜",zy:"ㄐㄧ ㄇㄧㄥˊ ㄍㄡˇ ㄉㄠˋ",g:4,c:"歷史",e:"🐔",src:"《史記・孟嘗君列傳》",
 m:"比喻有微小技能的人；也指偷偷摸摸的行為。",
 s:"孟嘗君到秦國，被秦王扣留，想要害他。|孟嘗君請秦王的寵妃幫忙，寵妃卻要一件已經送給秦王的白狐皮衣。門客中有一個人很會偷東西，半夜像狗一樣潛入宮中把皮衣偷了出來。|寵妃說情後，秦王放了孟嘗君。他們連夜逃到函谷關，可是關門要雞叫才開。|另一位門客學雞叫，附近的雞也跟著叫起來，守關的人打開城門，孟嘗君才平安逃回齊國。",
 x:"每個人都有用處，就算是雞鳴狗盜的小本事，也可能派上用場。",
 t:"你有什麼特別的小本領？"},
{w:"洛陽紙貴",zy:"ㄌㄨㄛˋ ㄧㄤˊ ㄓˇ ㄍㄨㄟˋ",g:4,c:"人物",e:"📄",src:"《晉書・左思傳》",
 m:"比喻作品寫得好，大家爭相傳閱。",
 s:"晉朝有一位作家叫左思，長得不好看、說話也不流利，可是很有才華。|他花了整整十年，在家裡、廁所都放著紙筆，想到好句子就馬上寫下來，終於完成了〈三都賦〉。|文章一寫好，大家都讚不絕口，洛陽城裡的人都搶著買紙來抄寫。|結果洛陽的紙一下子變得好貴好貴。",

{w:"樂不思蜀",zy:"ㄌㄜˋ ㄅㄨˋ ㄙ ㄕㄨˇ",g:4,c:"歷史",e:"🎉",src:"《三國志・蜀書・後主傳》裴松之注引《漢晉春秋》",

 s:"三國時代，蜀國被魏國滅了，蜀國的皇帝劉禪被帶到洛陽居住。|有一天，司馬昭請劉禪吃飯，還故意表演蜀國的歌舞。|蜀國的舊臣看了都很傷心，劉禪卻看得笑嘻嘻。|司馬昭問他：「你想念蜀國嗎？」劉禪說：「這裡很快樂，我不想念蜀國。」",

{w:"人才濟濟",zy:"ㄖㄣˊ ㄘㄞˊ ㄐㄧˇ ㄐㄧˇ",g:4,c:"歷史",e:"👥",src:"《詩經・大雅・文王》「濟濟多士，文王以寧」",
 m:"形容有才能的人很多。",
 s:"三千多年前，周文王治理周國時，非常尊重有本領的人。|他聽說有賢能的人，就親自去拜訪，連吃飯都顧不得。傳說他還到渭水邊，請回了正在釣魚的姜太公。|各地有才能的人聽說了，紛紛來到周國幫忙，朝廷裡到處都是能幹的人。|《詩經》讚美說：「濟濟多士，文王以寧。」意思是有這麼多人才，周文王就能讓國家安定。後來周國越來越強大。",

{w:"四面楚歌",zy:"ㄙˋ ㄇㄧㄢˋ ㄔㄨˇ ㄍㄜ",g:5,c:"歷史",e:"🎶",src:"《史記・項羽本紀》",
 m:"比喻四面受敵、孤立無援。",
 s:"楚漢相爭的最後，項羽的軍隊被劉邦圍困在垓下，兵少糧盡。|半夜裡，項羽聽到四面八方的漢軍營中，都傳來楚國家鄉的歌聲。|項羽大吃一驚：「難道漢軍已經占領楚地了嗎？怎麼有這麼多楚國人！」|楚軍士兵聽到家鄉歌聲，想家想得紛紛逃走，項羽最後在烏江邊結束了生命。",

{w:"指鹿為馬",zy:"ㄓˇ ㄌㄨˋ ㄨㄟˊ ㄇㄚˇ",g:5,c:"歷史",e:"🦌",src:"《史記・秦始皇本紀》",
 m:"比喻故意顛倒是非、混淆黑白。",

{w:"草木皆兵",zy:"ㄘㄠˇ ㄇㄨˋ ㄐㄧㄝ ㄅㄧㄥ",g:5,c:"歷史",e:"🌳",src:"《晉書・苻堅載記》",
 m:"形容非常驚慌，疑神疑鬼。",

{w:"投筆從戎",zy:"ㄊㄡˊ ㄅㄧˇ ㄘㄨㄥˊ ㄖㄨㄥˊ",g:5,c:"人物",e:"✒️",src:"《後漢書・班超傳》",
 m:"比喻放下文書工作，去從軍報國。",
 s:"東漢的班超家裡很窮，靠著幫官府抄寫文書賺錢養家。|有一天他抄得很累，丟下筆嘆氣說：「大丈夫應該像張騫一樣到遠方立功，怎麼能一輩子只拿筆抄寫呢？」|後來班超真的去從軍，被派到西域。|他在西域待了三十一年，讓五十多個國家和漢朝和平往來，成為很有名的英雄。",

{w:"一諾千金",zy:"ㄧ ㄋㄨㄛˋ ㄑㄧㄢ ㄐㄧㄣ",g:5,c:"人物",e:"🤝",src:"《史記・季布欒布列傳》",
 m:"形容說話算話，非常守信用。",
 s:"秦末漢初有一位叫季布的人，非常重視承諾，答應別人的事一定做到。|楚國人之間流傳一句話：「得到一百斤黃金，不如得到季布的一句承諾。」|季布曾經因為得罪劉邦而被通緝，但很多人敬佩他的為人，冒著危險保護他。|後來劉邦原諒了他，還讓他當官。",

 m:"比喻考試沒有考上。",
 s:"宋朝有一個叫孫山的人，說話很幽默。他和同鄉的一個年輕人一起去參加考試。|放榜時，孫山考上了最後一名，同鄉的年輕人卻沒考上。|孫山先回到家鄉，年輕人的爸爸跑來問：「我兒子考上了嗎？」|孫山不好意思直說，就笑著說：「榜上最後一個名字是孫山，你兒子的名字還在孫山後面呢！」",
 x:"哥哥這次比賽名落孫山，但他說明年會再挑戰。",
 t:"孫山為什麼不直接說「沒考上」？"},
{w:"江郎才盡",zy:"ㄐㄧㄤ ㄌㄤˊ ㄘㄞˊ ㄐㄧㄣˋ",g:5,c:"人物",e:"🖊️",src:"《南史・江淹傳》",
 m:"比喻才思減退，寫不出好作品了。",
 s:"南朝有一位叫江淹的人，年輕時文章寫得非常好，大家都稱讚他。|可是他當了大官以後，生活舒服，越來越少讀書寫作。|傳說有一天他夢見一個人對他說：「我有一支筆放在你那裡很多年了，現在該還給我了。」江淹就從懷裡拿出一支五色筆還給他。|從此以後，江淹再也寫不出好文章，大家就說他「才盡」了。",
 x:"寫作要常常練習，不然也會江郎才盡。",
 t:"江淹的才華為什麼會消失？真的是因為那支筆嗎？"},
{w:"懸梁刺股",zy:"ㄒㄩㄢˊ ㄌㄧㄤˊ ㄘˋ ㄍㄨˇ",g:5,c:"人物",e:"📚",src:"《漢書》（孫敬）、《戰國策・秦策》（蘇秦）",
 m:"形容非常刻苦地讀書。",
 s:"漢朝有一位叫孫敬的人，讀書常讀到深夜。為了不打瞌睡，他用繩子一頭綁住頭髮，一頭綁在屋梁上，一打瞌睡頭髮被拉，就醒過來了。|戰國時代的蘇秦，到秦國推銷自己的主張失敗，窮困地回到家，家人都看不起他。|他發憤讀書，讀到想睡覺時，就拿錐子刺一下自己的大腿。|後來蘇秦說服六個國家聯合起來對抗秦國，成為有名的人物。",
 x:"古人懸梁刺股太辛苦了，我們讀書要有精神，也要記得休息。",
 t:"這樣讀書你贊成嗎？有沒有更好的讓自己專心的方法？"},
{w:"一飯千金",zy:"ㄧ ㄈㄢˋ ㄑㄧㄢ ㄐㄧㄣ",g:5,c:"人物",e:"🍚",src:"《史記・淮陰侯列傳》",
 m:"比喻受人恩惠，加倍報答。",
 s:"韓信年輕時很窮，常常吃不飽，只好在城下的河邊釣魚。|河邊有一位洗衣服的老婆婆（漂母），看他餓得可憐，連續好幾十天都分飯給他吃。|韓信感動地說：「將來我一定會好好報答您！」老婆婆說：「我是可憐你，哪是要你報答！」|後來韓信成為楚王，找到當年的老婆婆，送給她一千兩黃金。",
 x:"老師以前常鼓勵他，他長大後一飯千金，回學校捐了很多書。",
 t:"有誰幫助過你？你想怎麼謝謝他？"},
{w:"世外桃源",zy:"ㄕˋ ㄨㄞˋ ㄊㄠˊ ㄩㄢˊ",g:5,c:"文學",e:"🌸",src:"晉・陶淵明〈桃花源記〉",
 m:"比喻環境優美、與世隔絕的理想地方。",
 s:"晉朝時，有一個漁夫划船沿著溪流前進，忽然看到兩岸開滿了桃花，非常美麗。|他划到溪水的盡頭，發現一座山上有個小洞，鑽進去以後，眼前出現一大片田地、房屋，人們生活得快樂又安詳。|村民說，他們的祖先為了躲避秦朝的戰亂來到這裡，從此和外面隔絕，連朝代換了都不知道。|漁夫離開時沿路做了記號，可是後來再去找，卻怎麼也找不到了。",
 x:"山裡的小村莊安靜又美麗，就像世外桃源。",
 t:"你心中的世外桃源是什麼樣子？"},
{w:"鞠躬盡瘁",zy:"ㄐㄩ ㄍㄨㄥ ㄐㄧㄣˋ ㄘㄨㄟˋ",g:5,c:"歷史",e:"🙏",src:"三國蜀・諸葛亮〈後出師表〉",
 m:"形容盡心盡力，貢獻全部的心力。",
 s:"劉備臨終前，把兒子劉禪和蜀國託付給諸葛亮。|諸葛亮為了完成劉備的心願，處理大大小小的政事，還多次帶兵北伐。|他在〈後出師表〉中寫道：「鞠躬盡瘁，死而後已。」意思是要恭敬謹慎、用盡力氣，直到死去為止。|最後，諸葛亮在五丈原的軍營中病逝，真的做到了這句話。",
 x:"校長鞠躬盡瘁為學校付出，大家都很感謝她。",
 t:"你覺得諸葛亮為什麼這麼拚？"},
{w:"妄自菲薄",zy:"ㄨㄤˋ ㄗˋ ㄈㄟˇ ㄅㄛˊ",g:5,c:"歷史",e:"🥺",src:"三國蜀・諸葛亮〈出師表〉「不宜妄自菲薄，引喻失義，以塞忠諫之路也」",
 m:"過分看輕自己，沒有自信。",
 s:"劉備過世後，年輕的劉禪當上蜀國的皇帝。諸葛亮要帶兵北伐，出發前寫了一封長信給他，就是有名的〈出師表〉。|諸葛亮擔心劉禪沒有自信，遇到事情就說「我不行」，也不肯聽大臣的意見。|他在信裡勸劉禪：「不宜妄自菲薄」——不要隨便看輕自己，要多聽忠臣的建議，好好治理國家。|「妄」是隨便、胡亂，「菲」和「薄」都是微小、不好的意思。合起來就是隨便把自己看得很差。",
 x:"你畫得很好，不要妄自菲薄，大膽參加比賽吧！",
 t:"謙虛和妄自菲薄，有什麼不一樣？"},
{w:"曾參殺人",zy:"ㄗㄥ ㄕㄣ ㄕㄚ ㄖㄣˊ",g:5,c:"人物",e:"🗣️",src:"《戰國策・秦策》",
 m:"比喻謠言可怕，說的人多了，連最親近的人也會相信。",
 s:"孔子的學生曾參是個品德很好的人。他的家鄉有另一個也叫曾參的人殺了人。|有人跑去告訴曾參的媽媽：「曾參殺人了！」曾媽媽正在織布，頭也不抬地說：「我兒子不會殺人。」|過了一會兒，又有人來說：「曾參殺人了！」曾媽媽還是照樣織布。|第三個人又來說同樣的話，曾媽媽終於害怕了，丟下梭子翻牆逃跑。",
 x:"沒有查證就轉傳消息，可能會造成曾參殺人的誤會。",
 t:"連媽媽都會相信謠言，我們可以怎麼避免？"},

{w:"病入膏肓",zy:"ㄅㄧㄥˋ ㄖㄨˋ ㄍㄠ ㄏㄨㄤ",g:6,c:"歷史",e:"🏥",src:"《左傳・成公十年》",
 m:"比喻病得很重，或事情壞到無法挽救。",
 s:"晉景公生了重病，派人到秦國請名醫來治。|醫生還沒到，晉景公夢見兩個小孩在說話。一個說：「名醫要來了，我們躲到哪裡？」另一個說：「躲在膏的下面、肓的上面，他就拿我們沒辦法了。」|醫生到了以後，替晉景公檢查說：「病已經在膏之下、肓之上，針灸和藥都到不了，沒辦法治了。」|晉景公說：「真是好醫生！」送了厚禮讓他回去。",
 x:"這家店問題拖太久，已經病入膏肓，只好關門了。",
 t:"為什麼有問題要早點處理？"},
{w:"諱疾忌醫",zy:"ㄏㄨㄟˋ ㄐㄧˊ ㄐㄧˋ ㄧ",g:6,c:"歷史",e:"💊",src:"《韓非子・喻老》、宋・周敦頤《通書》",
 m:"比喻隱瞞自己的缺點，不肯接受別人的勸告。",
 s:"名醫扁鵲見到蔡桓公說：「您皮膚上有小病，不治會加重。」蔡桓公說：「我沒病！」|過了十天，扁鵲說：「病已經到了肌肉裡。」蔡桓公不理他。又過十天，扁鵲說：「病到腸胃了。」蔡桓公更不高興。|再過十天，扁鵲遠遠看到蔡桓公，轉身就走。他說：「病已經深入骨髓，治不了了。」|五天後，蔡桓公全身疼痛，派人找扁鵲，扁鵲早已逃到秦國，蔡桓公就病死了。",
 x:"有錯就要改，不要諱疾忌醫。",
 t:"別人指出我們的缺點時，該怎麼面對？"},
{w:"抱薪救火",zy:"ㄅㄠˋ ㄒㄧㄣ ㄐㄧㄡˋ ㄏㄨㄛˇ",g:6,c:"歷史",e:"🔥",src:"《戰國策・魏策》、《史記・魏世家》",
 m:"比喻用錯方法，反而讓災禍更嚴重。",
 s:"戰國時代，秦國不斷攻打魏國，魏國打不過，有大臣主張把土地割讓給秦國，換取和平。|謀士蘇代勸魏王：「秦國的胃口是填不滿的。用土地去討好秦國，就像抱著木柴去救火。」|「木柴沒有燒完，火就不會熄滅。」|魏王不聽，一再割地。最後魏國的土地越來越少，還是被秦國滅掉了。",
 x:"用熬夜來趕做不完的作業，結果隔天更沒精神，簡直是抱薪救火。",
 t:"解決問題時，怎麼判斷方法對不對？"},
{w:"韋編三絕",zy:"ㄨㄟˊ ㄅㄧㄢ ㄙㄢ ㄐㄩㄝˊ",g:6,c:"人物",e:"🎐",src:"《史記・孔子世家》",
 m:"形容讀書非常勤奮、反覆鑽研。",
 s:"古時候還沒有紙，書是寫在一片一片的竹簡上，再用皮繩（韋）串起來。|孔子晚年很喜歡讀《易經》，這本書內容很深奧，他一讀再讀。|因為翻得太多次，串竹簡的牛皮繩斷了好幾次，斷了就換新的，繼續讀。|孔子還說：「如果再多給我幾年，我對《易經》就能了解得更透徹了。」",
 x:"這本字典被他翻到快散了，真有韋編三絕的精神。",
 t:"有沒有一本書，讓你想一讀再讀？"},
{w:"一暴十寒",zy:"ㄧ ㄆㄨˋ ㄕˊ ㄏㄢˊ",g:6,c:"人物",e:"🌡️",src:"《孟子・告子上》",
 m:"比喻做事沒有恆心，一下努力，一下又懈怠。",
 s:"孟子覺得齊王不夠聰明，不能怪別人，就打了一個比方。|「天下最容易生長的植物，如果曬一天太陽，又凍它十天，也不可能長得好。」|「我和齊王見面的時間很少，我一離開，那些說壞話的人就來了。」|「就算我讓他心中長出一點好的嫩芽，又有什麼用呢？」",
 x:"練英文一暴十寒是不會進步的，要每天練一點。",
 t:"「曬一天、凍十天」，植物會怎樣？學習也一樣嗎？"},
{w:"庖丁解牛",zy:"ㄆㄠˊ ㄉㄧㄥ ㄐㄧㄝˇ ㄋㄧㄡˊ",g:6,c:"寓言",e:"🔪",src:"《莊子・養生主》",
 m:"比喻熟悉事物的規律，做起事來得心應手。",
 s:"有一位廚師叫庖丁，替梁惠王分解一頭牛。他的動作像跳舞一樣流暢，刀聲像音樂一樣有節奏。|梁惠王稱讚他技術高超。庖丁說：「剛開始，我看到的是一整頭牛；三年以後，我看到的是牛的骨頭和筋肉縫隙。」|「我順著縫隙下刀，不硬砍骨頭，所以這把刀用了十九年，還像新的一樣鋒利。」|普通廚師一個月就要換一把刀，因為他們都硬砍骨頭。",
 x:"他對電腦的熟悉程度，修起來就像庖丁解牛般輕鬆。",
 t:"為什麼庖丁的刀用了十九年還很利？"},
{w:"破鏡重圓",zy:"ㄆㄛˋ ㄐㄧㄥˋ ㄔㄨㄥˊ ㄩㄢˊ",g:6,c:"人物",e:"🌕",src:"唐・孟棨《本事詩・情感》",
 m:"比喻分散的家人或夫妻重新團聚。",
 s:"南朝陳國快要滅亡時，駙馬徐德言擔心和妻子樂昌公主會在戰亂中失散。|他把一面銅鏡分成兩半，夫妻各拿一半，約好每年正月十五，到京城市場上叫賣半面鏡子，用來找彼此。|後來國家滅亡，兩人真的分開了。徐德言千辛萬苦來到京城，在市場上看到有人賣半面鏡子。|兩半鏡子一拼，剛好合在一起，夫妻終於團圓了。",
 x:"失散多年的兄弟在節目中相認，真是破鏡重圓。",
 t:"那面鏡子為什麼這麼重要？"},
{w:"枕戈待旦",zy:"ㄓㄣˇ ㄍㄜ ㄉㄞˋ ㄉㄢˋ",g:6,c:"人物",e:"⚔️",src:"《晉書・劉琨傳》",
 m:"形容時時刻刻警惕，隨時準備作戰。",
 s:"晉朝的劉琨就是「聞雞起舞」裡的那位好朋友。|當時北方戰亂不斷，劉琨一心想收復國土。|他聽說好友祖逖被朝廷重用，寫信給朋友說：「我常常枕著兵器睡覺，等待天亮，一心想消滅敵人。」|他還說：「我常怕祖逖比我先騎上戰馬立功呢！」",
 x:"颱風要來了，救災人員枕戈待旦，隨時準備出動。",
 t:"劉琨和祖逖是好朋友，也是好對手，這樣的關係好嗎？"},
{w:"曲高和寡",zy:"ㄑㄩˇ ㄍㄠ ㄏㄜˋ ㄍㄨㄚˇ",g:6,c:"文學",e:"🎼",src:"戰國楚・宋玉〈對楚王問〉",
 m:"比喻作品或言論太深奧，能理解的人很少。",
 s:"楚王問宋玉：「為什麼很多人都說你的壞話？」|宋玉說：「有一個歌手在城裡唱歌。他唱通俗的〈下里巴人〉，跟著唱的有幾千人。」|「他唱比較難的〈陽春白雪〉，跟著唱的只剩幾十人。再唱更高深的曲子，能跟著唱的只有幾個人。」|「曲子越高雅，能跟著唱的人就越少。我的想法，一般人不了解，也是這樣啊！」",
 x:"這部電影太難懂了，曲高和寡，看的人不多。",
 t:"想讓更多人懂你，可以怎麼做？"},
{w:"高山流水",zy:"ㄍㄠ ㄕㄢ ㄌㄧㄡˊ ㄕㄨㄟˇ",g:6,c:"人物",e:"🏞️",src:"《列子・湯問》、《呂氏春秋・本味》",
 m:"比喻知己好友，或形容樂曲美妙。",
 s:"春秋時代的伯牙很會彈琴，鍾子期很會聽琴。|伯牙彈琴時心裡想著高山，鍾子期就說：「好啊！像泰山一樣高大！」伯牙心裡想著流水，鍾子期又說：「好啊！像江河一樣浩蕩！」|不管伯牙想什麼，鍾子期都能從琴聲裡聽出來。兩人成為最懂彼此的好朋友。|後來鍾子期過世了，伯牙覺得世上再也沒有人懂他的琴聲，就把琴摔破，從此不再彈琴。",
 x:"他們兩人默契十足，彼此是高山流水般的知音。",
 t:"你有沒有一個很懂你的朋友？"},
{w:"管鮑之交",zy:"ㄍㄨㄢˇ ㄅㄠˋ ㄓ ㄐㄧㄠ",g:6,c:"人物",e:"👬",src:"《史記・管晏列傳》",
 m:"比喻彼此了解、互相信任的深厚友誼。",
 s:"春秋時代的管仲和鮑叔牙是好朋友。兩人一起做生意，管仲總是多拿一些錢，鮑叔牙不怪他，因為知道管仲家裡窮。|管仲打仗時好幾次逃跑，鮑叔牙也不說他膽小，因為知道他家裡還有老母親要照顧。|後來管仲跟錯了主人，差點被殺。鮑叔牙向齊桓公大力推薦管仲，自己甘願當他的下屬。|管仲成為齊國宰相，讓齊國強大起來。他感嘆地說：「生我的是父母，了解我的是鮑叔牙啊！」",
 x:"他們從小學就是好朋友，互相信任，真是管鮑之交。",
 t:"真正的朋友，會怎麼看待你的缺點？"},
{w:"天衣無縫",zy:"ㄊㄧㄢ ㄧ ㄨˊ ㄈㄥˋ",g:6,c:"神話",e:"👘",src:"五代前蜀・牛嶠《靈怪錄》",
 m:"比喻事物完美自然，沒有一點破綻。",
 s:"傳說有一個叫郭翰的人，夏天晚上在院子裡乘涼。|忽然，一位仙女從天上慢慢飄下來，自稱是天上的織女。|郭翰仔細看她的衣服，發現上面竟然沒有一條縫線，覺得很奇怪。|仙女笑著說：「天上的衣服本來就不是用針線縫的呀！」",
 x:"他們兩人合作的表演配合得天衣無縫。",
 t:"「沒有縫線的衣服」用來形容什麼最適合？"},

{w:"同舟共濟",zy:"ㄊㄨㄥˊ ㄓㄡ ㄍㄨㄥˋ ㄐㄧˋ",g:4,c:"歷史",e:"🚣",src:"《孫子・九地》",
 m:"比喻同心協力，戰勝困難。",
 s:"春秋時代，吳國和越國是死對頭，兩國的人見了面就互相討厭。|兵法家孫子說了一個比方：有一天，一群吳國人和越國人坐在同一條船上過河。|船到河中央，忽然颳起大風，大浪打來，船快要翻了。|這時候，吳國人和越國人都忘了彼此的仇恨，像左手幫右手一樣，同心協力划船、穩住船身，終於一起平安過了河。「濟」就是渡河的意思。",
 x:"颱風來襲時，全村的人同舟共濟，一起守護家園。",
 t:"連敵人都能合作，是因為什麼？"},
{w:"風雨無阻",zy:"ㄈㄥ ㄩˇ ㄨˊ ㄗㄨˇ",g:4,c:"常用",e:"☔",k:"由來",src:"常用成語（沒有特定典故）",
 m:"不論發生何種情況，心意或行動仍不變。",
 s:"「阻」是阻擋。|不管颳風還是下雨，都擋不住，照樣去做。|原本是說天氣不好也照常進行，後來也用來形容不論遇到什麼情況，心意和行動都不改變。",
 x:"爺爺每天早上風雨無阻地去公園運動。",
 t:"有什麼事是你風雨無阻都會去做的？"},
{w:"器宇軒昂",zy:"ㄑㄧˋ ㄩˇ ㄒㄩㄢ ㄤˊ",g:4,c:"常用",e:"🦁",k:"由來",src:"常用成語（沒有特定典故）",
 m:"形容人的神采奕奕，氣度不凡。",
 s:"「器宇」是一個人的氣度、風度，就是給人的整體感覺。|「軒昂」是高高揚起的樣子，像抬頭挺胸、精神飽滿。|合起來就是：一個人看起來很有精神、很有氣魄，讓人覺得不平凡。",
 x:"升旗手穿上制服，看起來器宇軒昂。",
 t:"怎樣站、怎樣走，會讓人看起來器宇軒昂？"},
{w:"震耳欲聾",zy:"ㄓㄣˋ ㄦˇ ㄩˋ ㄌㄨㄥˊ",g:4,c:"常用",e:"🔊",k:"由來",src:"常用成語（沒有特定典故）",
 m:"形容聲音很大。",
 s:"「震」是震動，「欲」是快要，「聾」是聽不見。|聲音大到耳朵都被震動，好像快要聽不見了，就是震耳欲聾。|太大的聲音會傷害耳朵，聽到很吵的聲音時，記得摀住耳朵、走遠一點。",
 x:"煙火秀開始了，砰砰的聲音震耳欲聾。",
 t:"「欲」在這裡是「想要」還是「快要」？"},
{w:"聚沙成塔",zy:"ㄐㄩˋ ㄕㄚ ㄔㄥˊ ㄊㄚˇ",g:4,c:"文學",e:"🏖️",k:"由來",src:"《妙法蓮華經・方便品》「乃至童子戲，聚沙為佛塔」",
 m:"比喻積少成多。",
 s:"佛經裡說，小孩子在沙灘上玩，把一粒一粒的沙子堆起來，堆成一座佛塔。|一粒沙子很小，可是聚集很多很多粒，就能堆成高高的塔。|後來就用「聚沙成塔」比喻一點一點累積，小的也能變成大的。",
 x:"每天存十元，聚沙成塔，一年後就能買一本好書。",
 t:"你有什麼事情是一點一點累積起來的？"},
{w:"出奇制勝",zy:"ㄔㄨ ㄑㄧˊ ㄓˋ ㄕㄥˋ",g:4,c:"歷史",e:"🐂",src:"《孫子・兵勢》「凡戰者，以正合，以奇勝」；田單故事見《史記・田單列傳》",
 m:"比喻用奇特、創新的方法取得好效果。",
 s:"孫子兵法說：打仗要用一般的方法對陣，再用出人意料的「奇」招取勝。|戰國時代，燕國攻打齊國，齊國只剩下即墨城還在苦守。守城的將軍田單想出一個奇招。|他找來一千多頭牛，牛角綁上尖刀，尾巴綁上沾了油的蘆葦，半夜點火，讓牛衝向燕軍。|燕軍從沒見過這種「火牛陣」，嚇得四處逃跑。田單趁勢反攻，收回了七十多座城。",
 x:"我們隊用了新的戰術出奇制勝，贏得比賽。",
 t:"想出新方法解決問題，需要什麼能力？"},
{w:"無懈可擊",zy:"ㄨˊ ㄒㄧㄝˋ ㄎㄜˇ ㄐㄧ",g:4,c:"常用",e:"💯",k:"由來",src:"常用成語（沒有特定典故）",
 m:"沒有任何破綻可讓人攻擊，形容非常完美。",
 s:"「懈」是鬆懈、破綻，就是沒做好、有漏洞的地方。|「擊」是攻擊。沒有任何破綻，別人找不到地方可以攻擊，就是無懈可擊。|原本是說打仗時防守得很嚴密，現在也用來形容表演、文章、計畫非常完美。",
 x:"她的鋼琴演奏無懈可擊，全場起立鼓掌。",
 t:"世界上有沒有真正無懈可擊的事？"},
{w:"借花獻佛",zy:"ㄐㄧㄝˋ ㄏㄨㄚ ㄒㄧㄢˋ ㄈㄛˊ",g:5,c:"寓言",e:"💐",src:"《過去現在因果經》",
 m:"比喻借用他人的東西來作人情。",
 s:"佛經裡有一個故事：很久很久以前，有一位叫善慧的年輕人，聽說燃燈佛要來，很想獻花表達敬意。|可是城裡的花都被國王買走了。他好不容易遇到一位拿著七朵蓮花的姑娘，就用身上所有的錢，向她買了五朵。|姑娘被他的誠心感動，把剩下的兩朵也交給他說：「請幫我把這兩朵一起獻給佛吧！」|善慧就拿著別人託付的花獻給了佛。後來「借花獻佛」就比喻拿別人的東西來送人情。",
 x:"這盒餅乾是阿姨送的，我借花獻佛，請大家一起吃。",
 t:"借花獻佛是好事還是壞事？什麼時候用比較恰當？"},
{w:"否極泰來",zy:"ㄆㄧˇ ㄐㄧˊ ㄊㄞˋ ㄌㄞˊ",g:5,c:"文學",e:"🌅",k:"由來",src:"《易經》否卦、泰卦",
 m:"情況由壞逐漸好轉。",
 s:"《易經》裡有兩個卦，一個叫「否」，代表不順利、阻塞；一個叫「泰」，代表平安、順利。|古人觀察到，事情壞到了極點（否極），就會開始轉好（泰來），就像最黑的夜晚過去，天就要亮了。|注意「否」在這裡念ㄆㄧˇ，不是ㄈㄡˇ喔！",
 x:"經歷了一連串倒楣事後，他終於否極泰來，找到好工作。",
 t:"遇到很糟的時候，想想「否極泰來」會有什麼幫助？"},
{w:"門可羅雀",zy:"ㄇㄣˊ ㄎㄜˇ ㄌㄨㄛˊ ㄑㄩㄝˋ",g:5,c:"歷史",e:"🐦",src:"《史記・汲鄭列傳》",
 m:"做官的人失勢後賓客稀少的景況；也形容地方很冷清。",
 s:"漢朝有一個叫翟公的人，當廷尉（大官）的時候，每天來拜訪他的客人多到擠滿了門口。|後來他被免官，客人一個都不來了，門口冷清到可以張網捕麻雀（羅雀）。|過了不久，翟公又當官了，那些客人又想來拜訪。|翟公在大門上寫道：「一貧一富，乃知交態；一貴一賤，交情乃見。」意思是：從貧富貴賤的變化，才看得出誰是真朋友。",
 x:"這家店東西不好吃，現在門可羅雀。",
 t:"翟公在門上寫的話，是什麼意思？"},
{w:"勢均力敵",zy:"ㄕˋ ㄐㄩㄣ ㄌㄧˋ ㄉㄧˊ",g:5,c:"常用",e:"🤼",k:"由來",src:"常用成語（沒有特定典故）",
 m:"指雙方力量情勢相當，不分上下。",
 s:"「勢」是情勢，「均」是平均、相等。|「力」是力量，「敵」在這裡不是敵人，而是「相當、對等」的意思。|雙方的情勢一樣、力量也一樣，比賽起來分不出高下，就是勢均力敵。",
 x:"兩隊勢均力敵，比賽一直打到延長賽才分出勝負。",
 t:"「敵」在這裡是什麼意思？"},
{w:"防微杜漸",zy:"ㄈㄤˊ ㄨㄟˊ ㄉㄨˋ ㄐㄧㄢˋ",g:5,c:"歷史",e:"🚧",src:"《後漢書・丁鴻傳》",
 m:"錯誤或壞事萌芽時及時制止。",
 s:"東漢和帝即位時年紀還小，太后的哥哥竇憲掌握大權，越來越囂張。|大臣丁鴻上書給和帝說：「壞事剛開始的時候就要防止，就像小火苗要趁早撲滅。」|他說：「杜漸防萌，則凶妖消滅。」——堵住壞事慢慢發展的路，災禍就不會發生。|和帝聽了，及時削去竇憲的權力，避免了更大的禍害。「微」是細小，「杜」是堵住，「漸」是慢慢發展。",
 x:"小謊也要防微杜漸，不然會越說越多。",
 t:"為什麼壞習慣要在剛開始就改掉？"},
{w:"心血來潮",zy:"ㄒㄧㄣ ㄒㄩㄝˋ ㄌㄞˊ ㄔㄠˊ",g:5,c:"文學",e:"🌊",k:"由來",src:"明・許仲琳《封神演義》",
 m:"思緒像浪潮般突起，形容突然興起的念頭。",
 s:"在神話小說《封神演義》裡，神仙們常常坐著坐著，忽然覺得心裡一陣翻騰，就像血液像浪潮一樣湧上來。|這時候神仙就會掐指一算，知道某個地方發生了事情。|後來「心血來潮」就用來形容一個人突然想到要做某件事。",
 x:"媽媽心血來潮，說今天晚上要帶我們去看電影。",
 t:"你最近有沒有心血來潮做的事？結果怎麼樣？"},
{w:"汗流浹背",zy:"ㄏㄢˋ ㄌㄧㄡˊ ㄐㄧㄚˊ ㄅㄟˋ",g:5,c:"歷史",e:"💦",src:"《後漢書・伏皇后紀》",
 m:"形容工作辛勞，汗出溼背；本義是形容非常慚愧、驚恐的樣子。",
 s:"東漢末年，曹操掌握了大權，連漢獻帝都要看他的臉色。|有一天，曹操進宮見漢獻帝。獻帝忍不住對他說：「你如果真心輔佐我，就好好待我；如果不是，乾脆放過我吧！」|曹操聽了臉色大變，嚇得趕緊告退。走出宮門時，他已經汗流浹背，衣服全濕透了。|「浹」是濕透。原本是形容害怕、驚慌到冒冷汗，現在也常用來形容運動或工作後流很多汗。",
 x:"大熱天在操場跑完三圈，大家都汗流浹背。",
 t:"這個成語原本是因為「熱」還是因為「怕」？"},
{w:"深思熟慮",zy:"ㄕㄣ ㄙ ㄕㄡˊ ㄌㄩˋ",g:5,c:"常用",e:"🧠",k:"由來",src:"常用成語（沒有特定典故）",
 m:"仔細而深入的考慮。",
 s:"「深思」是想得很深，「熟慮」是想得很周到、很成熟。|就像煮飯要煮到熟才好吃，想事情也要想到「熟」，才不會出錯。|重要的決定，像選社團、花大錢，都要深思熟慮。",
 x:"經過深思熟慮，他決定參加科學營。",
 t:"「深思熟慮」和「三思而行」意思像嗎？"},
{w:"根深蒂固",zy:"ㄍㄣ ㄕㄣ ㄉㄧˋ ㄍㄨˋ",g:5,c:"文學",e:"🌳",k:"由來",src:"《老子》「深根固柢，長生久視之道」",
 m:"比喻根基堅固，不可動搖。",
 s:"老子說：樹的根要扎得深、根基要穩固，才能活得長長久久。|「蒂」原本寫作「柢」，是樹木的主根；「固」是牢固。|根扎得又深又牢的樹，颱風也吹不倒。現在常用來形容想法、習慣很難改變。",
 x:"愛乾淨的習慣在他心裡根深蒂固。",
 t:"好習慣根深蒂固是好事，壞習慣呢？"},
{w:"從容不迫",zy:"ㄘㄨㄥ ㄖㄨㄥˊ ㄅㄨˋ ㄆㄛˋ",g:5,c:"常用",e:"🧘",k:"由來",src:"常用成語（「從容」見《莊子・秋水》「鯈魚出遊從容」）",
 m:"沉著鎮定，不慌不忙。",
 s:"《莊子》裡有一段有名的對話：莊子和朋友惠施在橋上看魚，莊子說：「鯈魚出遊從容，是魚之樂也。」——小魚游得悠閒自在，真快樂啊！|「從容」就是悠閒、不慌張的樣子；「迫」是急迫。|遇到事情不急不忙、冷靜處理，就是從容不迫。注意「從」在這裡念ㄘㄨㄥ。",
 x:"上台前他很緊張，可是演講時卻從容不迫。",
 t:"緊張的時候，怎麼讓自己從容不迫？"},
{w:"姍姍來遲",zy:"ㄕㄢ ㄕㄢ ㄌㄞˊ ㄔˊ",g:5,c:"歷史",e:"🐢",src:"《漢書・外戚傳》",
 m:"形容人或事物不依時出現，害人苦等。",
 s:"漢武帝非常寵愛李夫人，李夫人病逝後，漢武帝日夜思念她。|有一位方士說能把李夫人的魂請回來。夜裡他點起燈燭、掛起帳子，漢武帝遠遠看見帳中好像有個美麗的身影慢慢走動。|可是不能靠近，漢武帝更加傷心，寫詩說：「是邪？非邪？立而望之，偏何姍姍其來遲！」|「姍姍」是走路緩慢、搖曳的樣子。後來就用「姍姍來遲」形容人來得很慢。",
 x:"大家都到了，他才姍姍來遲。",
 t:"等人很久的時候，你有什麼感覺？"},
{w:"掉以輕心",zy:"ㄉㄧㄠˋ ㄧˇ ㄑㄧㄥ ㄒㄧㄣ",g:5,c:"文學",e:"😪",k:"由來",src:"唐・柳宗元〈答韋中立論師道書〉「未嘗敢以輕心掉之」",
 m:"處理事情時抱持著輕忽、漫不經心的態度。",
 s:"柳宗元回信給一個想拜他為師的年輕人，談自己怎麼寫文章。|他說：我每次寫文章，「未嘗敢以輕心掉之」——從來不敢用隨便、輕忽的態度去對待。|「掉」在這裡是擺弄、對待的意思，「輕心」是不在乎的心。後來就說成「掉以輕心」。",
 x:"比賽還沒結束，我們不能掉以輕心。",
 t:"柳宗元寫文章這麼認真，你寫功課呢？"},
{w:"重門深鎖",zy:"ㄔㄨㄥˊ ㄇㄣˊ ㄕㄣ ㄙㄨㄛˇ",g:5,c:"常用",e:"🔒",k:"由來",src:"常用成語（沒有特定典故）",
 m:"形容保護、封鎖得很嚴密。",
 s:"「重」在這裡念ㄔㄨㄥˊ，是一層又一層的意思。|一道門接著一道門，每道門都深深鎖上，別人很難進去。|可以用來形容房子、倉庫守得很嚴，也可以形容一個人把心事藏得很深，不讓別人知道。",
 x:"博物館的寶物室重門深鎖，小偷根本進不去。",
 t:"「重」有哪兩個讀音？各舉一個例子。"},
{w:"絞盡腦汁",zy:"ㄐㄧㄠˇ ㄐㄧㄣˋ ㄋㄠˇ ㄓ",g:5,c:"常用",e:"🤯",k:"由來",src:"常用成語（沒有特定典故）",
 m:"形容費盡腦力。",
 s:"「絞」是用力扭轉擰乾，像擰毛巾一樣。|把腦袋裡的汁液都擰乾了，形容想得非常用力、費盡心思。|遇到很難的謎題、數學題，或要想出好點子的時候，常常會絞盡腦汁。",
 x:"為了想出班級表演的點子，大家都絞盡腦汁。",
 t:"你最近為了什麼事絞盡腦汁？"},
{w:"老夫老妻",zy:"ㄌㄠˇ ㄈㄨ ㄌㄠˇ ㄑㄧ",g:5,c:"常用",e:"👵",k:"由來",src:"常用成語（沒有特定典故）",
 m:"結婚很久、感情深厚的夫妻。",
 s:"「夫」是丈夫，「妻」是妻子，前面都加上「老」。|不一定是指年紀很老，而是說兩個人在一起很多年，彼此非常熟悉、互相了解。|有時候也帶點開玩笑的語氣，表示感情好到不用客套。",
 x:"爺爺奶奶是老夫老妻了，一個眼神就知道對方要什麼。",
 t:"你身邊有哪一對老夫老妻？他們怎麼相處？"},
{w:"耐人尋味",zy:"ㄋㄞˋ ㄖㄣˊ ㄒㄩㄣˊ ㄨㄟˋ",g:5,c:"常用",e:"🍵",k:"由來",src:"常用成語（沒有特定典故）",
 m:"意涵深遠，值得人仔細體會、思考。",
 s:"「耐」是經得起，「尋味」是仔細品嘗、體會其中的味道。|就像一杯好茶，越喝越有味道；一句話、一個故事，越想越有意思，就是耐人尋味。|很多寓言故事都是耐人尋味的，第一次看覺得好笑，再想一想又有新的道理。",
 x:"老師最後說的那句話很耐人尋味，我想了好久。",
 t:"哪一個故事讓你覺得耐人尋味？"},
{w:"洗心革面",zy:"ㄒㄧˇ ㄒㄧㄣ ㄍㄜˊ ㄇㄧㄢˋ",g:5,c:"文學",e:"🧼",k:"由來",src:"《易經・繫辭上》「聖人以此洗心」；《易經・革卦》「君子豹變，小人革面」",
 m:"比喻徹底悔改，重新做人。",
 s:"「洗心」出自《易經》，是洗去心中的壞念頭；「革面」也出自《易經》，是改變原本的面貌。|合起來就是：從內心到外表，徹底改過。|有一個很適合說明它的故事：晉朝的周處年輕時橫行鄉里，被大家當成「三害」之一。他知道後下定決心，殺了猛虎和蛟龍，又去拜師讀書，最後成為正直的好官。這就是洗心革面。",
 x:"他洗心革面以後，變成一個認真負責的人。",
 t:"犯錯的人，要怎樣才算真的洗心革面？"},
{w:"倚老賣老",zy:"ㄧˇ ㄌㄠˇ ㄇㄞˋ ㄌㄠˇ",g:5,c:"常用",e:"🧓",k:"由來",src:"元・無名氏《謝金吾》",
 m:"仗著自己年紀大、資格老，看不起別人。",

{w:"事半功倍",zy:"ㄕˋ ㄅㄢˋ ㄍㄨㄥ ㄅㄟˋ",g:5,c:"論語",e:"📈",k:"由來",src:"《孟子・公孫丑上》「故事半古之人，功必倍之」",
 m:"花一半的力氣，得到加倍的成果。",
 s:"孟子對學生說，現在齊國這麼強大，百姓又渴望好的政治，只要齊王肯施行仁政，就會非常容易成功。|他說：「事半古之人，功必倍之。」——做的事只要古人的一半，成果卻是古人的兩倍。|方法對了、時機對了，就能事半功倍；方法錯了，就會「事倍功半」。",

{w:"暮鼓晨鐘",zy:"ㄇㄨˋ ㄍㄨˇ ㄔㄣˊ ㄓㄨㄥ",g:5,c:"文學",e:"🔔",k:"由來",src:"唐・李咸用〈山中〉「朝鐘暮鼓不到耳」",
 m:"比喻使人警惕、覺悟的話。",
 s:"古時候的寺廟，早上敲鐘，傍晚擊鼓，用來報時，也提醒和尚們按時作息、用心修行。|「暮」是傍晚，「晨」是早晨。每天聽到鐘鼓聲，就提醒自己不要虛度光陰。|後來就用「暮鼓晨鐘」比喻能讓人警醒的話。",

{w:"旁敲側擊",zy:"ㄆㄤˊ ㄑㄧㄠ ㄘㄜˋ ㄐㄧ",g:5,c:"常用",e:"🥁",k:"由來",src:"常用成語（沒有特定典故）",

{w:"福至心靈",zy:"ㄈㄨˊ ㄓˋ ㄒㄧㄣ ㄌㄧㄥˊ",g:5,c:"常用",e:"🍀",k:"由來",src:"常用成語（俗語「福至心靈，禍來神昧」）",

{w:"冥頑不靈",zy:"ㄇㄧㄥˊ ㄨㄢˊ ㄅㄨˋ ㄌㄧㄥˊ",g:5,c:"人物",e:"🐊",src:"唐・韓愈〈祭鱷魚文〉",
 m:"形容愚昧無知，固執不聽勸。",
 s:"唐朝的韓愈被貶到潮州當官。當地的河裡有很多鱷魚，常常吃掉百姓的牛羊，大家都很害怕。|韓愈寫了一篇〈祭鱷魚文〉，在河邊宣讀，限鱷魚在七天內搬到海裡去。|他說：如果七天還不走，就是「冥頑不靈」——又笨又固執、不聽勸，那就要派人用強弓毒箭把你們全部除掉！|傳說後來鱷魚真的游走了，潮州人非常感激韓愈。",
 x:"勸了他好多次都不聽，真是冥頑不靈。",
 t:"「固執」和「堅持」有什麼不一樣？"},
{w:"心滿意足",zy:"ㄒㄧㄣ ㄇㄢˇ ㄧˋ ㄗㄨˊ",g:5,c:"常用",e:"☺️",k:"由來",src:"常用成語（沒有特定典故）",

 x:"吃完媽媽做的晚餐，弟弟心滿意足地摸摸肚子。",

{w:"循規蹈矩",zy:"ㄒㄩㄣˊ ㄍㄨㄟ ㄉㄠˇ ㄐㄩˇ",g:5,c:"常用",e:"📐",k:"由來",src:"常用成語（「規矩」見《孟子・離婁上》「不以規矩，不能成方圓」）",
 m:"遵守規矩，不輕易逾越。",

 x:"他在學校一向循規蹈矩，從來不遲到。",
 t:"「蹈」也出現在哪個成語裡？（提示：很高興的時候）"},
{w:"咬牙切齒",zy:"ㄧㄠˇ ㄧㄚˊ ㄑㄧㄝˋ ㄔˇ",g:6,c:"常用",e:"😬",k:"由來",src:"常用成語（元代雜劇中已常見）",

{w:"拾人牙慧",zy:"ㄕˊ ㄖㄣˊ ㄧㄚˊ ㄏㄨㄟˋ",g:6,c:"人物",e:"🦷",src:"南朝宋・劉義慶《世說新語・文學》",

 s:"東晉有一位很會說話、很有學問的人叫殷浩。他的外甥韓康伯也很聰明，常常跟在舅舅身邊。|韓康伯說話時，常常把殷浩說過的話拿來用，大家都稱讚他。|殷浩卻說：「康伯連我牙縫後面的一點聰明（牙後慧）都還沒學到呢！」|意思是外甥只是撿我說過的話來說，還沒有自己的想法。後來就用「拾人牙慧」比喻抄襲別人的話。",

{w:"困獸猶鬥",zy:"ㄎㄨㄣˋ ㄕㄡˋ ㄧㄡˊ ㄉㄡˋ",g:6,c:"歷史",e:"🐗",src:"《左傳・定公四年》「困獸猶鬥，況人乎」",

 s:"春秋時代，吳國大敗楚國，楚軍一路逃到清發河邊。吳王的弟弟夫概想馬上攻擊。|夫概說：「被困住的野獸都還會拚命反抗，何況是人呢？如果他們知道逃不掉，一定會拚死作戰。」|「不如等他們一半的人過了河，剩下的人只想趕快逃，就沒心思打仗了。」|吳軍照著做，果然又打了一場大勝仗。",
 x:"對手雖然落後，但困獸猶鬥，我們不能大意。",
 t:"為什麼被逼到絕路的人反而更難對付？"},
{w:"欣欣向榮",zy:"ㄒㄧㄣ ㄒㄧㄣ ㄒㄧㄤˋ ㄖㄨㄥˊ",g:6,c:"文學",e:"🌿",k:"由來",src:"晉・陶淵明〈歸去來兮辭〉「木欣欣以向榮，泉涓涓而始流」",

 s:"陶淵明不喜歡官場的生活，辭去官職回到家鄉種田。|他在〈歸去來兮辭〉裡描寫春天的田園：「木欣欣以向榮，泉涓涓而始流。」|樹木高高興興地長得茂盛，泉水細細地開始流動。「欣欣」是歡喜的樣子，「榮」是草木茂盛。",
 x:"春天到了，校園裡的花草欣欣向榮。",

{w:"不著邊際",zy:"ㄅㄨˋ ㄓㄨㄛˊ ㄅㄧㄢ ㄐㄧˋ",g:6,c:"常用",e:"🎈",k:"由來",src:"常用成語（沒有特定典故）",

{w:"一落千丈",zy:"ㄧ ㄌㄨㄛˋ ㄑㄧㄢ ㄓㄤˋ",g:6,c:"文學",e:"📉",k:"由來",src:"唐・韓愈〈聽穎師彈琴〉「躋攀分寸不可上，失勢一落千丈強」",

 s:"唐朝有一位叫穎師的和尚很會彈琴。韓愈聽了他的演奏，寫了一首詩。|詩裡形容琴聲往上爬時，一分一寸都很難再高；突然往下降時，就像一下子掉落千丈還多。|原本是形容琴聲從高音猛然降到低音，後來用來形容情況突然變得很差。",

{w:"無妄之災",zy:"ㄨˊ ㄨㄤˋ ㄓ ㄗㄞ",g:6,c:"寓言",e:"🐄",src:"《易經・無妄卦》「無妄之災，或繫之牛，行人之得，邑人之災」",
 m:"意料之外的災禍。",
 s:"《易經》裡舉了一個例子：有人把一頭牛綁在村子的路邊。|一個路過的人看到，就把牛牽走了。|牛的主人回來找不到牛，就懷疑是村子裡的人偷的，結果村民們平白無故被冤枉。|路人得到了牛，村民卻遭了殃，這就是「無妄之災」——不是自己的錯，卻遇上的災禍。",
 x:"他好好地走在路上，卻被掉下來的招牌砸到，真是無妄之災。",
 t:"被冤枉的時候，可以怎麼證明自己？"},
{w:"不遺餘力",zy:"ㄅㄨˋ ㄧˊ ㄩˊ ㄌㄧˋ",g:6,c:"歷史",e:"🏋️",k:"由來",src:"《戰國策・趙策》「秦之攻我也，不遺餘力矣」",

 s:"戰國時代，秦國大舉攻打趙國，趙國大臣分析局勢時說：「秦國攻打我們，是用盡了全部的力量。」|「遺」是留下，「餘力」是剩下的力氣。|一點力氣都不留下，全部用上，就是不遺餘力。現在多用在好的事情上。",

{w:"赴湯蹈火",zy:"ㄈㄨˋ ㄊㄤ ㄉㄠˇ ㄏㄨㄛˇ",g:5,c:"歷史",e:"🔥",src:"《三國志・魏書・劉表傳》裴松之注引《傅子》",
 m:"比喻不怕艱難危險，奮不顧身。",
 s:"東漢末年，荊州的劉表想派部下韓嵩到許都去，打探曹操的虛實。|韓嵩知道這是件很危險、又兩面不討好的差事，就先把話說清楚。|他說：「如果我認定了主人，就一心守節，就算要赴湯蹈火——跳進滾燙的熱水、踩進燃燒的大火，死了也不推辭。」|「湯」在古代是滾燙的熱水。後來就用赴湯蹈火形容為了朋友或理想，再危險也不退縮。",
 x:"好朋友有困難，我一定赴湯蹈火幫他。",
 t:"「湯」在這裡是喝的湯嗎？"},

 m:"比喻先提出自己粗淺的意見，引出別人更好的想法（多用於謙虛）。",
 s:"傳說唐朝詩人常建很欣賞另一位詩人趙嘏，很想讀到他的好詩。|他聽說趙嘏要到蘇州的靈巖寺遊玩，就先跑去寺廟，在牆上寫了兩句詩，故意不寫完。|趙嘏看到牆上沒寫完的詩，果然手癢，提筆補上兩句，寫得比常建的還好。|常建用自己的「磚」引出了趙嘏的「玉」。（這個故事是傳說；「拋磚引玉」一詞最早見於宋朝的禪宗書籍。）",

 m:"形容事物非常出色，和一般的不一樣。",

 m:"好人自然會得到上天的幫助（多用來安慰遇到困難的人）。",

// 依使用者提供的課本目錄（第 2～12 課）。同一個成語可以出現在多課。
window.BOOK = {
  title: "國語課本",
  lessons: [
    {n:"第 2 課", t:"放學後",         w:["赴湯蹈火","拋磚引玉","力爭上游","以身作則","捨本逐末","束手無策"]},
    {n:"第 3 課", t:"我的籃球夢",     w:["無與倫比","五體投地","耳熟能詳","弄巧成拙","對牛彈琴","借題發揮"]},
    {n:"第 4 課", t:"永遠的馬偕",     w:["耳提面命","借花獻佛","精衛填海","良藥苦口","天翻地覆","打退堂鼓"]},
    {n:"第 5 課", t:"假如給我三天光明", w:["懸崖勒馬","兢兢業業","雞犬不寧","一視同仁","孤注一擲","盡善盡美"]},
    {n:"第 6 課", t:"攀登生命的高峰", w:["秀外慧中","額手稱慶","豁然開朗","登峰造極","虛懷若谷","不同凡響"]},
    {n:"第 7 課", t:"美味的一堂課",   w:["妄自菲薄","沾沾自喜","心心相印","因材施教","義不容辭","壽比南山"]},
    {n:"第 8 課", t:"建築界的長頸鹿", w:["同舟共濟","風雨無阻","器宇軒昂","震耳欲聾","聚沙成塔","吉人天相"]},
    {n:"第 9 課", t:"請到我的家鄉來", w:["借花獻佛","否極泰來","門可羅雀","勢均力敵","防微杜漸","心血來潮"]},
    {n:"第 10 課", t:"奇幻旋律",      w:["咬牙切齒","拾人牙慧","掩耳盜鈴","困獸猶鬥","欣欣向榮","哀鴻遍野"]},
    {n:"第 11 課", t:"兔子先生等等我", w:["汗流浹背","背水一戰","深思熟慮","根深蒂固","從容不迫","姍姍來遲"]},
    {n:"第 12 課", t:"老鞋匠與小精靈", w:["洗心革面","事半功倍","旁敲側擊","福至心靈","心滿意足","循規蹈矩"]}
  ]
};

</script>
<script>
(function(){
'use strict';
var SHOW_LOG = true;
function log(){ if(SHOW_LOG) console.log.apply(console, ['[成語館]'].concat([].slice.call(arguments))); }

var DATA = (window.IDIOMS || []).map(function(d,i){ d.id = i; return d; });
var GCOLOR = {1:'var(--g1)',2:'var(--g2)',3:'var(--g3)',4:'var(--g4)',5:'var(--g5)',6:'var(--g6)'};
var GNAME = {1:'一年級',2:'二年級',3:'三年級',4:'四年級',5:'五年級',6:'六年級'};
var BOOK = window.BOOK || { title:'', lessons:[] };
var LESSONS = BOOK.lessons || [];
var BYWORD = {}; DATA.forEach(function(d){ BYWORD[d.w] = d; });
var LESSON_OF = {};   // 成語 → [課次索引]
LESSONS.forEach(function(l,i){ l.w.forEach(function(w){ (LESSON_OF[w] = LESSON_OF[w] || []).push(i); if(!BYWORD[w]) console.warn('[成語館] 課次裡的成語找不到資料：', l.n, w); }); });
log('步驟1 載入資料', DATA.length, '則成語、', LESSONS.length, '課課次');

// ── 本機儲存（失敗也不影響使用）──
function load(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ log('儲存失敗', k, e.message); } }
var favs = load('idiom.favs', []);       // 存成語文字，資料增刪時不會錯位
var learned = load('idiom.learned', []);
var state = { tab: load('idiom.tab', LESSONS.length ? 'book' : 'all'), lesson: load('idiom.lesson', 'all'), cat: '全部', q: '' };
if(state.tab==='book' && !LESSONS.length) state.tab = 'all';
if(state.lesson!=='all' && !LESSONS[state.lesson]) state.lesson = 'all';
log('步驟2 讀取紀錄 最愛=', favs.length, '已學會=', learned.length, '分頁=', state.tab);

function isFav(d){ return favs.indexOf(d.w) >= 0; }
function isLearned(d){ return learned.indexOf(d.w) >= 0; }
function toggleFav(d){
  var before = favs.length;
  if(isFav(d)) favs.splice(favs.indexOf(d.w),1); else favs.push(d.w);
  save('idiom.favs', favs);
  log('切換最愛', d.w, before, '→', favs.length);
  toast(isFav(d) ? '❤️ 已加入我的最愛' : '已從我的最愛移除');
  renderTabs();
}
function toggleLearned(d){
  if(isLearned(d)) learned.splice(learned.indexOf(d.w),1); else learned.push(d.w);
  save('idiom.learned', learned);
  log('切換學會', d.w, isLearned(d));
  toast(isLearned(d) ? '⭐ 太棒了，學會一個！' : '已取消學會');
}

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1600); }

function ruby(d, hl){
  var zy = d.zy.split(' ');
  var chars = Array.from(d.w);
  var hit = hl ? d.w.indexOf(hl) : -1;
  return chars.map(function(ch,i){
    var inHit = hit>=0 && i>=hit && i<hit+hl.length;
    var c = inHit ? '<mark>'+esc(ch)+'</mark>' : esc(ch);
    return '<ruby>'+c+'<rt>'+(zy[i]||'')+'</rt></ruby>';
  }).join('');
}
function hlText(s, q){
  if(!q) return esc(s);
  return esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>');
}

// ── 篩選 ──
function inTab(d, tab){
  if(tab==='book') return !!LESSON_OF[d.w];
  return tab==='all' ? true : tab==='fav' ? isFav(d) : String(d.g)===String(tab);
}
function matchQ(d, q){
  if(!q) return true;
  return d.w.indexOf(q)>=0 || d.m.indexOf(q)>=0 || d.s.indexOf(q)>=0 || d.src.indexOf(q)>=0 || d.x.indexOf(q)>=0 || d.c===q;
}
function passFilter(d){ return (state.cat==='全部' || d.c===state.cat) && matchQ(d, state.q); }
// 課本分頁：依課次順序排列（同一個成語出現在多課時只列一次）
function bookList(){
  var ls = state.lesson==='all' ? LESSONS : [LESSONS[state.lesson]];
  var seen = {}, out = [];
  ls.forEach(function(l){ l.w.forEach(function(w){ var d = BYWORD[w]; if(d && !seen[w] && passFilter(d)){ seen[w]=1; out.push(d); } }); });
  return out;
}
function currentList(){
  if(state.tab==='book') return bookList();
  return DATA.filter(function(d){ return inTab(d, state.tab) && passFilter(d); });
}
function lessonLabel(d){
  var ix = LESSON_OF[d.w]; if(!ix) return '';
  return ix.map(function(i){ return LESSONS[i].n.replace(/\s/g,''); }).join('、');
}

function renderLessons(){
  var box = $('lessons');
  if(state.tab!=='book' || !LESSONS.length){ box.style.display='none'; return; }
  box.style.display='';
  box.innerHTML = '<button class="lchip'+(state.lesson==='all'?' on':'')+'" data-l="all">📘 全部課次</button>' +
    LESSONS.map(function(l,i){
      return '<button class="lchip'+(String(state.lesson)===String(i)?' on':'')+'" data-l="'+i+'"><b>'+l.n+'</b> '+esc(l.t)+'</button>';
    }).join('');
}

function renderTabs(){
  var keys = (LESSONS.length ? ['book'] : []).concat(['all','1','2','3','4','5','6','fav']);
  $('tabs').innerHTML = keys.map(function(k){
    var label = k==='book' ? '📘 '+BOOK.title+'課次' : k==='all' ? '🌈 全部' : k==='fav' ? '❤️ 我的最愛' : GNAME[k];
    var n = DATA.filter(function(d){ return inTab(d,k); }).length;
    return '<button class="tab'+(state.tab===k?' on':'')+'" data-k="'+k+'">'+label+' <span class="n">'+n+'</span></button>';
  }).join('');
}
function renderCats(){
  var cats = ['全部'];
  DATA.forEach(function(d){ if(cats.indexOf(d.c)<0) cats.push(d.c); });
  $('cats').innerHTML = cats.map(function(c){
    return '<button class="chip'+(state.cat===c?' on':'')+'" data-c="'+c+'">'+c+'</button>';
  }).join('');
}
function renderGrid(){
  var list = currentList();
  var q = state.q;
  var where = state.tab==='book' ? (state.lesson==='all' ? BOOK.title+'・全部課次' : LESSONS[state.lesson].n+'「'+LESSONS[state.lesson].t+'」')
    : state.tab==='all' ? '全部年級' : state.tab==='fav' ? '我的最愛' : GNAME[state.tab];
  $('status').textContent = where + (state.cat!=='全部' ? '・'+state.cat : '') + (q ? '・搜尋「'+q+'」' : '') + '：共 ' + list.length + ' 則';
  if(!list.length){
    var tip = state.tab==='fav' && !favs.length
      ? '<div class="big">🤍</div>還沒有我的最愛喔！<br>打開成語故事，按「❤️ 加入我的最愛」，下次就能在這裡快速複習。'
      : '<div class="big">🔎</div>找不到符合的成語，換個關鍵字試試看';
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">'+tip+'</div>';
    return;
  }
  var inBook = state.tab==='book';
  function card(d){
    return '<div class="card" data-id="'+d.id+'" style="--gc:'+(inBook?'var(--book)':GCOLOR[d.g])+'">'+
      '<span class="gb">'+(inBook ? lessonLabel(d) : GNAME[d.g])+'</span>'+
      '<button class="fv'+(isFav(d)?' on':'')+'" data-fav="'+d.id+'" title="加入／移除我的最愛">'+(isFav(d)?'❤':'♡')+'</button>'+
      '<div class="emo">'+d.e+'</div>'+
      '<div class="word">'+ruby(d, q)+'</div>'+
      '<div class="m">'+hlText(d.m, q)+'</div>'+
      (isLearned(d)?'<span class="learned" title="我學會了">⭐</span>':'')+
    '</div>';
  }
  // 課本「全部課次」且沒有搜尋/分類篩選時，按課分組顯示
  if(inBook && state.lesson==='all' && !q && state.cat==='全部'){
    $('grid').innerHTML = LESSONS.map(function(l,i){
      var ds = l.w.map(function(w){ return BYWORD[w]; }).filter(Boolean);
      var done = ds.filter(isLearned).length;
      return '<div class="lhead" data-l="'+i+'"><b>'+l.n+'</b>｜'+esc(l.t)+'<span class="lprog">⭐ '+done+' / '+ds.length+'</span></div>'+
        ds.map(card).join('');
    }).join('');
    return;
  }
  $('grid').innerHTML = list.map(card).join('');
}
function renderAll(){ renderTabs(); renderLessons(); renderCats(); renderGrid(); }

// ── 朗讀 ──
var TTS = { ok: 'speechSynthesis' in window, voice: null, rate: load('idiom.rate', 0.9), queue: [], idx: 0, playing: false, paused: false, onEl: null };
function pickVoice(){
  if(!TTS.ok) return;
  var vs = speechSynthesis.getVoices();
  TTS.voice = vs.find(function(v){ return /zh[-_]TW/i.test(v.lang); }) ||
              vs.find(function(v){ return /zh[-_](HK|Hant)/i.test(v.lang); }) ||
              vs.find(function(v){ return /^zh/i.test(v.lang); }) || null;
  log('朗讀聲音', TTS.voice ? TTS.voice.name+' ('+TTS.voice.lang+')' : '使用預設');
}
if(TTS.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function ttsMark(el){
  document.querySelectorAll('.reading').forEach(function(x){ x.classList.remove('reading'); });
  if(el){ el.classList.add('reading'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function ttsUpdateUI(){
  var p = $('ttsPlay'); if(!p) return;
  p.textContent = TTS.playing && !TTS.paused ? '⏸ 暫停' : (TTS.paused ? '▶ 繼續' : '▶ 播放');
  $('ttsStop').disabled = !TTS.playing;
}
// queue: [{text, el}]
function ttsStart(queue){
  if(!TTS.ok){ toast('這個瀏覽器不支援朗讀，請改用 Chrome 或 Edge'); return; }
  ttsStop(true);
  TTS.queue = queue; TTS.idx = 0; TTS.playing = true; TTS.paused = false;
  log('朗讀開始，共', queue.length, '段');
  ttsNext(); ttsUpdateUI();
}
function ttsNext(){
  if(!TTS.playing) return;
  if(TTS.idx >= TTS.queue.length){ log('朗讀結束'); ttsStop(); return; }
  var item = TTS.queue[TTS.idx];
  var u = new SpeechSynthesisUtterance(item.text);
  u.lang = 'zh-TW'; u.rate = TTS.rate; if(TTS.voice) u.voice = TTS.voice;
  var myIdx = TTS.idx;
  u.onend = function(){ if(TTS.playing && TTS.idx===myIdx){ TTS.idx++; ttsNext(); } };
  u.onerror = function(e){ if(e.error!=='interrupted' && e.error!=='canceled'){ log('朗讀錯誤', e.error); TTS.idx++; ttsNext(); } };
  ttsMark(item.el);
  speechSynthesis.speak(u);
}
function ttsToggle(queueFn){
  if(!TTS.playing){ ttsStart(queueFn()); return; }
  if(TTS.paused){ speechSynthesis.resume(); TTS.paused=false; log('朗讀繼續'); }
  else { speechSynthesis.pause(); TTS.paused=true; log('朗讀暫停'); }
  ttsUpdateUI();
}
function ttsStop(silent){
  TTS.playing=false; TTS.paused=false; TTS.queue=[]; TTS.idx=0;
  if(TTS.ok) speechSynthesis.cancel();
  ttsMark(null); if(!silent) ttsUpdateUI();
}
function speakOnce(text){ ttsStart([{text:text, el:null}]); }

// ── 詳情彈窗 ──
var cur = null;
function openDetail(d){
  cur = d; ttsStop(true);
  log('開啟成語', d.w, GNAME[d.g]);
  var paras = d.s.split('|');
  var m = $('dmodal');
  m.style.setProperty('--gc', GCOLOR[d.g]);
  m.innerHTML =
    '<div class="mhead">'+
      '<button class="mclose" id="dclose" title="關閉">✕</button>'+
      '<div class="emo">'+d.e+'</div>'+
      '<div class="word">'+ruby(d)+'</div>'+
      '<div class="meta">'+(LESSON_OF[d.w] ? '📘 '+LESSON_OF[d.w].map(function(i){return LESSONS[i].n+'「'+esc(LESSONS[i].t)+'」';}).join('、')+'<br>' : '')+
        GNAME[d.g]+'・'+d.c+'・出處：'+esc(d.src)+'</div>'+
    '</div>'+
    '<div class="mbody">'+
      '<div class="player">'+
        '<span class="lbl">🔊 朗讀</span>'+
        '<button class="btn alt" id="ttsPlay">▶ 播放</button>'+
        '<button class="btn ghost" id="ttsStop" disabled>⏹ 停止</button>'+
        '<select id="ttsWhat"><option value="all">全部</option><option value="word">只念成語</option><option value="story">只念故事</option></select>'+
        '<select id="ttsRate">'+[0.7,0.8,0.9,1,1.2].map(function(r){return '<option value="'+r+'"'+(r==TTS.rate?' selected':'')+'>'+(r==0.7?'很慢':r==0.8?'慢':r==0.9?'稍慢':r==1?'正常':'快')+' '+r+'x</option>';}).join('')+'</select>'+
      '</div>'+
      '<div class="sec"><h3>💡 意思</h3><div class="box" id="secM">'+esc(d.m)+'</div></div>'+
      '<div class="sec"><h3>'+(d.k==='由來'?'📜 成語由來':'📖 故事來源')+'</h3><div class="story" id="story">'+paras.map(function(p,i){return '<p data-i="'+i+'">'+esc(p)+'</p>';}).join('')+'</div></div>'+
      '<div class="sec"><h3>✏️ 例句</h3><div class="box" id="secX">'+esc(d.x)+'</div></div>'+
      '<div class="sec"><h3>🤔 想一想</h3><div class="box" id="secT">'+esc(d.t)+'</div></div>'+
    '</div>'+
    '<div class="mfoot">'+
      '<button class="btn fav" id="dfav">'+(isFav(d)?'💔 移除最愛':'❤️ 加入我的最愛')+'</button>'+
      '<button class="btn alt" id="dlearn">'+(isLearned(d)?'⭐ 已學會':'☆ 我學會了')+'</button>'+
      '<span class="spacer"></span>'+
      '<button class="btn ghost" id="dprev">◀ 上一個</button>'+
      '<button class="btn ghost" id="dnext">下一個 ▶</button>'+
    '</div>';
  $('dm').classList.add('show');
  $('dm').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if(!TTS.ok){ $('ttsPlay').disabled = true; $('ttsPlay').title = '瀏覽器不支援朗讀'; }

  function buildQueue(){
    var what = $('ttsWhat').value, q = [];
    if(what!=='story') q.push({text: d.w, el: m.querySelector('.mhead .word')});
    if(what==='all') q.push({text: '意思：'+d.m, el: $('secM')});
    if(what!=='word') m.querySelectorAll('#story p').forEach(function(p){ q.push({text:p.textContent, el:p}); });
    if(what==='all'){ q.push({text:'例句：'+d.x, el:$('secX')}); q.push({text:'想一想：'+d.t, el:$('secT')}); }
    return q;
  }
  $('ttsPlay').onclick = function(){ ttsToggle(buildQueue); };
  $('ttsStop').onclick = function(){ ttsStop(); };
  $('ttsRate').onchange = function(){ TTS.rate = parseFloat(this.value); save('idiom.rate', TTS.rate); log('語速', TTS.rate); if(TTS.playing){ ttsStart(buildQueue().slice(TTS.idx)); } };
  $('ttsWhat').onchange = function(){ if(TTS.playing) ttsStart(buildQueue()); };
  // 點段落從該段開始念
  m.querySelectorAll('#story p').forEach(function(p){
    p.style.cursor='pointer'; p.title='從這段開始朗讀';
    p.onclick = function(){ var q = buildQueue(); var k = q.findIndex(function(x){return x.el===p;}); ttsStart(q.slice(k<0?0:k)); };
  });
  $('dclose').onclick = closeDetail;
  $('dfav').onclick = function(){ toggleFav(d); this.textContent = isFav(d)?'💔 移除最愛':'❤️ 加入我的最愛'; renderGrid(); };
  $('dlearn').onclick = function(){ toggleLearned(d); this.textContent = isLearned(d)?'⭐ 已學會':'☆ 我學會了'; renderGrid(); };
  var list = currentList(); var pos = list.findIndex(function(x){return x.id===d.id;});
  if(pos<0){ list = DATA; pos = d.id; }
  $('dprev').disabled = pos<=0; $('dnext').disabled = pos>=list.length-1;
  $('dprev').onclick = function(){ if(pos>0) openDetail(list[pos-1]); };
  $('dnext').onclick = function(){ if(pos<list.length-1) openDetail(list[pos+1]); };
}
function closeDetail(){ ttsStop(true); $('dm').classList.remove('show'); document.body.style.overflow=''; cur=null; renderGrid(); }

// ── 小測驗 ──
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function quizPool(){
  var pool = state.tab==='book' ? bookList() : DATA.filter(function(d){ return inTab(d, state.tab); });
  return pool.length >= 4 ? pool : DATA;
}
function startQuiz(pool, title){
  pool = pool || quizPool();
  var qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(function(d){
    var type = Math.random()<0.5 ? 'm' : 'x';
    var others = shuffle(DATA.filter(function(o){ return o.w!==d.w; })).slice(0,3);
    return { d:d, type:type, opts: shuffle([d].concat(others)) };
  });
  var st = { i:0, score:0, wrong:[] };
  log('開始測驗', title || '', qs.length, '題');
  function show(){
    var q = qs[st.i];
    var text = q.type==='m'
      ? '哪一個成語的意思是：<br><b>「'+esc(q.d.m)+'」</b>'
      : '請選出適合填入空格的成語：<br><b>'+esc(q.d.x).split(esc(q.d.w)).join('＿＿＿＿')+'</b>';
    $('qmodal').innerHTML =
      '<div class="qbox">'+
        '<div class="qtitle">'+(title||'🎯 小測驗')+'　第 '+(st.i+1)+' / '+qs.length+' 題　得分 '+st.score+'</div>'+
        '<div class="prog"><i style="width:'+(st.i/qs.length*100)+'%"></i></div>'+
        '<div class="qtext">'+text+'</div>'+
        '<div class="opts">'+q.opts.map(function(o){ return '<button class="opt" data-w="'+o.w+'">'+o.w+'</button>'; }).join('')+'</div>'+
        '<div class="qmsg" id="qmsg"></div>'+
        '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" id="qquit">結束</button><span class="spacer"></span><button class="btn" id="qnext" style="display:none">下一題 ▶</button></div>'+
      '</div>';
    var done = false;
    $('qmodal').querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        if(done) return; done = true;
        var right = b.dataset.w === q.d.w;
        if(right){ st.score++; b.classList.add('ok'); $('qmsg').innerHTML='🎉 答對了！'; speakOnce('答對了，'+q.d.w); }
        else {
          b.classList.add('no'); st.wrong.push(q.d);
          $('qmodal').querySelector('.opt[data-w="'+q.d.w+'"]').classList.add('ok');
          $('qmsg').innerHTML='😅 正確答案是「'+q.d.w+'」<button class="btn ghost" id="qsee" style="margin-left:8px;padding:4px 10px">看故事</button>';
          $('qsee').onclick = function(){ openDetail(q.d); };
        }
        log('第',st.i+1,'題', q.d.w, right?'對':'錯');
        $('qnext').style.display='';
        $('qnext').textContent = st.i<qs.length-1 ? '下一題 ▶' : '看成績 🏆';
      };
    });
    $('qnext').onclick = function(){ st.i++; if(st.i<qs.length) show(); else finish(); };
    $('qquit').onclick = closeQuiz;
  }
  function finish(){
    var pct = st.score/qs.length;
    var stars = pct>=0.9?'⭐⭐⭐':pct>=0.6?'⭐⭐':'⭐';
    log('測驗結束 得分', st.score, '/', qs.length);
    $('qmodal').innerHTML =
      '<div class="qbox" style="text-align:center">'+
        '<div style="font-size:50px">'+stars+'</div>'+
        '<h2>答對 '+st.score+' / '+qs.length+' 題</h2>'+
        (st.wrong.length ? '<p>這些要再複習：</p><p>'+st.wrong.map(function(d){return '<button class="chip" data-id="'+d.id+'">'+d.w+'</button>';}).join(' ')+'</p>'+
          '<p><button class="btn fav" id="qfavw">❤️ 把答錯的加入我的最愛</button></p>' : '<p>全部答對，太厲害了！🎉</p>')+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn ghost" id="qquit">關閉</button><button class="btn" id="qagain">再玩一次</button></div>'+
      '</div>';
    speakOnce('答對 '+st.score+' 題');
    $('qmodal').querySelectorAll('.chip[data-id]').forEach(function(c){ c.onclick=function(){ openDetail(DATA[c.dataset.id]); }; });
    if($('qfavw')) $('qfavw').onclick = function(){
      var add = 0; st.wrong.forEach(function(d){ if(!isFav(d)){ favs.push(d.w); add++; } });
      save('idiom.favs', favs); renderAll(); toast('已加入 '+add+' 則到我的最愛'); log('答錯加入最愛', add); this.disabled=true;
    };
    $('qquit').onclick = closeQuiz;
    $('qagain').onclick = function(){ startQuiz(pool, title); };
  }
  $('qm').classList.add('show'); document.body.style.overflow='hidden';
  show();
}
function closeQuiz(){ ttsStop(true); $('qm').classList.remove('show'); if(!$('dm').classList.contains('show')) document.body.style.overflow=''; }

// ── 複習我的最愛（翻卡）──
function startReview(){
  var list = DATA.filter(isFav);
  if(!list.length){ toast('還沒有我的最愛，先在故事裡按 ❤️ 加入吧！'); return; }
  list = shuffle(list);
  var i = 0;
  log('開始複習最愛', list.length, '則');
  function show(){
    var d = list[i];
    $('qmodal').style.setProperty('--gc', GCOLOR[d.g]);
    $('qmodal').innerHTML =
      '<div class="qbox">'+
        '<div class="qtitle">❤️ 複習我的最愛　'+(i+1)+' / '+list.length+'</div>'+
        '<div class="prog"><i style="width:'+((i+1)/list.length*100)+'%"></i></div>'+
        '<div class="flash" id="fc">'+
          '<div style="font-size:44px">'+d.e+'</div>'+
          '<div class="word">'+ruby(d)+'</div>'+
          '<p style="color:var(--sub)">想一想：這個成語是什麼意思？背後是什麼故事？</p>'+
          '<button class="btn alt" id="fflip">👀 翻開答案</button> '+
          '<button class="btn ghost" id="fsay">🔊 念成語</button>'+
          '<div class="back">'+
            '<div class="sec"><h3>💡 意思</h3><div class="box">'+esc(d.m)+'</div></div>'+
            '<div class="sec"><h3>'+(d.k==='由來'?'📜 由來':'📖 故事重點')+'</h3><div class="box">'+esc(d.s.split('|')[0])+'……</div></div>'+
            '<div class="sec"><h3>✏️ 例句</h3><div class="box">'+esc(d.x)+'</div></div>'+
            '<button class="btn ghost" id="fstory">📖 看完整故事</button> '+
            '<button class="btn ghost" id="fsayall">🔊 念意思和例句</button>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+
          '<button class="btn ghost" id="fquit">結束</button>'+
          '<button class="btn ghost" id="fprev"'+(i===0?' disabled':'')+'>◀ 上一張</button>'+
          '<span class="spacer"></span>'+
          '<button class="btn" id="fnext">'+(i<list.length-1?'下一張 ▶':'完成 🎉')+'</button>'+
        '</div>'+
        '<div style="margin-top:12px;text-align:center"><button class="btn fav" id="fquiz">🎯 用我的最愛出題</button></div>'+
      '</div>';
    $('fflip').onclick = function(){ $('fc').classList.add('flip'); this.style.display='none'; };
    $('fsay').onclick = function(){ speakOnce(d.w); };
    $('fsayall').onclick = function(){ ttsStart([{text:d.w,el:null},{text:'意思：'+d.m,el:null},{text:'例句：'+d.x,el:null}]); };
    $('fstory').onclick = function(){ openDetail(d); };
    $('fprev').onclick = function(){ if(i>0){ i--; ttsStop(true); show(); } };
    $('fnext').onclick = function(){ ttsStop(true); if(i<list.length-1){ i++; show(); } else { toast('複習完成，好棒！'); closeQuiz(); } };
    $('fquit').onclick = closeQuiz;
    $('fquiz').onclick = function(){
      if(list.length<1) return;
      startQuiz(DATA.filter(isFav), '❤️ 我的最愛測驗');
    };
  }
  $('qm').classList.add('show'); document.body.style.overflow='hidden';
  show();
}

// ── 事件 ──
$('tabs').onclick = function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  state.tab = b.dataset.k; save('idiom.tab', state.tab);
  log('切換分頁', state.tab); renderAll();
};
$('cats').onclick = function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  state.cat = b.dataset.c; log('切換分類', state.cat); renderCats(); renderGrid();
};
$('grid').onclick = function(e){
  var f = e.target.closest('[data-fav]');
  if(f){ e.stopPropagation(); toggleFav(DATA[f.dataset.fav]); renderGrid(); return; }
  var h = e.target.closest('.lhead');
  if(h){ state.lesson = h.dataset.l; save('idiom.lesson', state.lesson); log('從標題切換課次', state.lesson); renderLessons(); renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  var c = e.target.closest('.card'); if(c) openDetail(DATA[c.dataset.id]);
};
var qT;
$('q').oninput = function(){
  var v = this.value.trim();
  $('qclr').style.display = v ? 'block' : 'none';
  clearTimeout(qT); qT = setTimeout(function(){ state.q = v; log('搜尋', JSON.stringify(v)); renderGrid(); }, 150);
};
$('qclr').onclick = function(){ $('q').value=''; this.style.display='none'; state.q=''; renderGrid(); $('q').focus(); };
$('zyT').onchange = function(){ document.body.classList.toggle('nozy', !this.checked); save('idiom.zy', this.checked); };
$('lessons').onclick = function(e){
  var b = e.target.closest('.lchip'); if(!b) return;
  state.lesson = b.dataset.l; save('idiom.lesson', state.lesson);
  log('切換課次', state.lesson==='all' ? '全部' : LESSONS[state.lesson].n);
  renderLessons(); renderGrid();
};
$('quizBtn').onclick = function(){
  var t = state.tab==='fav' ? '❤️ 我的最愛測驗'
    : state.tab==='book' ? '📘 課本測驗（'+(state.lesson==='all' ? '全部課次' : LESSONS[state.lesson].n+' '+LESSONS[state.lesson].t)+'）'
    : '🎯 小測驗（'+(state.tab==='all'?'全部':GNAME[state.tab])+'）';
  startQuiz(null, t);
};
$('reviewBtn').onclick = startReview;
$('dm').onclick = function(e){ if(e.target===this) closeDetail(); };
$('qm').onclick = function(e){ if(e.target===this) closeQuiz(); };
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ if($('dm').classList.contains('show')) closeDetail(); else if($('qm').classList.contains('show')) closeQuiz(); }
  if(e.key==='/' && document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); }
});

var zyOn = load('idiom.zy', true);
$('zyT').checked = zyOn; document.body.classList.toggle('nozy', !zyOn);
renderAll();
log('步驟3 畫面完成');
window.__idiomTest = { DATA:DATA, state:state, favs:function(){return favs;}, openDetail:openDetail, toggleFav:toggleFav, renderGrid:renderGrid, startReview:startReview, startQuiz:startQuiz, currentList:currentList };
})();
</script>
</body>
</html>
