<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成語故事館</title>
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#3b2f2a; --sub:#7a6a60; --line:#f0e2cc;
  --accent:#e8743b; --accent2:#2f8f83; --star:#f5b301; --fav:#e8456b;
  --g1:#ff8a65; --g2:#ffb74d; --g3:#81c784; --g4:#4fc3f7; --g5:#9575cd; --g6:#f06292;
  --shadow:0 3px 10px rgba(120,80,40,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:17px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0}
header{background:linear-gradient(135deg,#ffcf8a,#ff9f6b);padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow)}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header p{margin:4px 0 0;font-size:14px;color:#5a3b2a}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}

/* 搜尋 */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;padding:13px 44px 13px 46px;font-size:18px;border:2px solid var(--line);border-radius:30px;background:#fff;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#eee;border-radius:50%;width:28px;height:28px;display:none}

/* 分頁 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-weight:bold;color:var(--sub);display:flex;align-items:center;gap:6px}
.tab .n{font-size:12px;background:#f3ebe0;border-radius:10px;padding:0 7px;color:var(--sub)}
.tab.on{color:#fff}
.tab.on .n{background:rgba(255,255,255,.3);color:#fff}
.tab[data-k="all"].on{background:var(--accent2)}
.tab[data-k="fav"].on{background:var(--fav)}
.tab[data-k="1"].on{background:var(--g1)}.tab[data-k="2"].on{background:var(--g2)}.tab[data-k="3"].on{background:var(--g3)}
.tab[data-k="4"].on{background:var(--g4)}.tab[data-k="5"].on{background:var(--g5)}.tab[data-k="6"].on{background:var(--g6)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-size:14px;color:var(--sub)}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:bold}
.spacer{flex:1}
.btn{padding:8px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:bold;box-shadow:var(--shadow)}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.fav{background:var(--fav)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}

.status{font-size:14px;color:var(--sub);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--card);border-radius:18px;padding:14px 12px 12px;box-shadow:var(--shadow);cursor:pointer;border-top:6px solid var(--gc);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card .emo{font-size:30px;line-height:1}
.card .gb{position:absolute;top:10px;right:44px;font-size:12px;background:var(--gc);color:#fff;border-radius:10px;padding:1px 8px}
.card .fv{position:absolute;top:6px;right:8px;font-size:22px;background:none;padding:2px;color:#ccc;line-height:1}
.card .fv.on{color:var(--fav)}
.card .learned{position:absolute;bottom:10px;right:12px;font-size:16px}
.word{font-size:26px;font-weight:bold;letter-spacing:2px;margin:6px 0 4px}
ruby rt{font-size:11px;color:var(--accent2);letter-spacing:0;font-weight:normal}
body.nozy ruby rt{display:none}
.card .m{font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:50px 10px;color:var(--sub)}
.empty .big{font-size:48px}

/* 彈窗 */
.mask{position:fixed;inset:0;background:rgba(40,25,15,.5);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:24px 12px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:720px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.mhead{background:var(--gc);color:#fff;padding:16px 18px;position:relative}
.mhead .emo{font-size:42px;line-height:1}
.mhead .word{font-size:36px;margin:6px 0 0}
.mhead ruby rt{color:#fff;font-size:13px}
.mhead .meta{font-size:14px;opacity:.95}
.mclose{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:20px}
.mbody{padding:16px 18px 18px}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f6fbfa;border:1.5px solid #cfe9e5;border-radius:14px;padding:10px 12px;margin-bottom:14px}
.player .lbl{font-weight:bold;color:var(--accent2)}
.player select{font:inherit;font-size:14px;padding:4px;border-radius:8px;border:1px solid #cfe9e5}
.sec{margin:14px 0}
.sec h3{margin:0 0 6px;font-size:17px;color:var(--accent)}
.story p{margin:0 0 10px;padding:6px 10px;border-radius:10px;transition:background .2s}
.story p.reading,.sec .reading{background:#fff1c9}
.box{background:#fff8ec;border-radius:12px;padding:10px 12px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px}
.mfoot .spacer{flex:1}

/* 測驗 / 複習 */
.qbox{padding:18px}
.qtitle{font-size:14px;color:var(--sub)}
.qtext{font-size:20px;margin:10px 0 16px;background:#fff8ec;border-radius:14px;padding:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:22px;font-weight:bold;letter-spacing:2px}
.opt.ok{background:#d9f5df;border-color:#4caf50}
.opt.no{background:#ffe0e0;border-color:#e57373}
.qmsg{min-height:28px;margin-top:12px;font-weight:bold}
.flash{text-align:center;padding:10px 0}
.flash .word{font-size:44px}
.flash .back{display:none;text-align:left;margin-top:12px}
.flash.flip .back{display:block}
.prog{height:8px;background:#f3ebe0;border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b2f2a;color:#fff;padding:8px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none}
.toast.show{opacity:.92}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:30px}
@media (max-width:520px){
  header h1{font-size:23px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .word{font-size:21px}
  .mhead .word{font-size:28px}
  .opts{grid-template-columns:1fr}
  .card .gb{display:none}
}
</style>
</head>
<body>
<header>
  <h1>📚 成語故事館</h1>
  <p>國小一～六年級・點一下成語，聽聽它背後的故事</p>
</header>

<div class="wrap">
  <div class="search">
    <span class="ic">🔍</span>
    <input id="q" type="search" placeholder="搜尋成語、意思或故事，例如：兔子、讀書、三國" autocomplete="off">
    <button class="clr" id="qclr" title="清除">✕</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="tools">
    <div id="cats" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="zyT" checked> 顯示注音</label>
    <button class="btn fav" id="reviewBtn">❤️ 複習我的最愛</button>
    <button class="btn alt" id="quizBtn">🎯 小測驗</button>
  </div>

  <p class="status" id="status"></p>
  <div class="grid" id="grid"></div>

  <p class="note">年級分類依康軒國語各年級的閱讀程度整理，非課文逐課對照；實際內容請以當學期課本為準。<br>我的最愛與「我學會了」只存在這台裝置的瀏覽器裡。</p>
</div>

<!-- 成語詳情 -->
<div class="mask" id="dm"><div class="modal" id="dmodal"></div></div>
<!-- 測驗 / 複習 -->
<div class="mask" id="qm"><div class="modal" id="qmodal"></div></div>
<div class="toast" id="toast"></div>

<script>
// 成語故事資料
// 欄位：w 成語 / zy 注音(空白分隔，一字一組) / g 適讀年級 / c 分類 / e 圖示
//       src 出處 / m 意思 / s 故事(用 | 分段) / x 例句 / t 想一想
// 年級是依康軒國語各年級的閱讀程度安排，不是課文逐課對照；可直接在這裡增刪修改。
window.IDIOMS = [
// ───────── 一年級 ─────────
{w:"守株待兔",zy:"ㄕㄡˇ ㄓㄨ ㄉㄞˋ ㄊㄨˋ",g:1,c:"寓言",e:"🐰",src:"《韓非子・五蠹》",
 m:"比喻不想努力，只想靠運氣得到好處。",
 s:"從前宋國有一個農夫，每天在田裡辛苦工作。|有一天，一隻兔子跑得太快，一頭撞上田邊的樹樁，就這樣死掉了。農夫高高興興撿回家，吃了一頓美味的兔肉。|他心想：「種田好累，不如每天在樹下等兔子就好！」從此他放下鋤頭，天天守在樹樁旁邊。|可是，再也沒有兔子撞上來。田裡長滿了雜草，農夫什麼也沒得到，還被大家笑話。",
 x:"考試前不讀書，只希望題目剛好都會，這就像守株待兔一樣。",
 t:"好運氣會常常發生嗎？想得到好成果，應該怎麼做？"},
{w:"拔苗助長",zy:"ㄅㄚˊ ㄇㄧㄠˊ ㄓㄨˋ ㄓㄤˇ",g:1,c:"寓言",e:"🌱",src:"《孟子・公孫丑上》（原作「揠苗助長」）",
 m:"比喻做事太心急，不按照道理，反而把事情弄壞。",
 s:"宋國有一個農夫，種了一大片稻苗。他每天去看，總覺得稻苗長得好慢好慢。|他想了一個「好辦法」：跑到田裡，把每一株稻苗都往上拔高一點。|忙了一整天，他累得回家說：「今天我幫稻苗長高了！」|他的兒子趕快跑去田裡看，結果稻苗全都枯萎了。",
 x:"學寫字要一筆一畫慢慢練，太急著求快就是拔苗助長。",
 t:"為什麼稻苗被拔高反而會死掉？你有沒有太心急的時候？"},
{w:"井底之蛙",zy:"ㄐㄧㄥˇ ㄉㄧˇ ㄓ ㄨㄚ",g:1,c:"寓言",e:"🐸",src:"《莊子・秋水》",
 m:"比喻見識很少、眼光狹小的人。",
 s:"有一隻青蛙住在一口廢井裡。牠常常得意地說：「我的井好大好舒服，天空就像井口那麼大！」|有一天，一隻從東海來的大海龜經過，青蛙熱情邀請牠進井裡玩。|海龜的左腳還沒踏進去，右腳就被卡住了。海龜告訴青蛙：「大海寬得看不到邊，深得量不到底，下大雨、遇乾旱都不會變。」|青蛙聽了，嚇得說不出話來，才知道自己的世界原來這麼小。",
 x:"多讀書、多出去走走，才不會變成井底之蛙。",
 t:"你知道的世界有多大？怎麼樣可以看到更多？"},
{w:"狐假虎威",zy:"ㄏㄨˊ ㄐㄧㄚˇ ㄏㄨˇ ㄨㄟ",g:1,c:"寓言",e:"🦊",src:"《戰國策・楚策》",
 m:"比喻依靠別人的勢力來欺負人或嚇唬人。",
 s:"老虎抓到一隻狐狸，正想把牠吃掉。|狐狸急中生智說：「你不能吃我！天帝派我當森林之王，不信你跟在我後面走走看。」|老虎半信半疑，跟著狐狸走進森林。小動物們一看到牠們，全都嚇得四處逃跑。|老虎以為大家怕的是狐狸，其實大家怕的是走在後面的老虎呀！",
 x:"他仗著哥哥是班長，就對同學大呼小叫，真是狐假虎威。",
 t:"動物們真正害怕的是誰？借別人的力量嚇人，算是真的厲害嗎？"},
{w:"畫蛇添足",zy:"ㄏㄨㄚˋ ㄕㄜˊ ㄊㄧㄢ ㄗㄨˊ",g:1,c:"寓言",e:"🐍",src:"《戰國策・齊策》",
 m:"比喻做多餘的事，反而把事情弄糟。",
 s:"楚國有人得到一壺酒，酒只夠一個人喝。大家說好：「比賽在地上畫蛇，誰先畫好，酒就給誰喝！」|有一個人很快就畫好了，他左手拿著酒壺，得意地說：「我還來得及幫蛇畫上腳呢！」|就在他幫蛇畫腳的時候，另一個人也畫好了，一把搶走酒壺說：「蛇本來就沒有腳，你畫的不是蛇！」|說完，就把酒喝光了。",
 x:"作文已經寫得很好了，最後再加那段話反而是畫蛇添足。",
 t:"事情做好了，什麼時候該停下來？"},
{w:"對牛彈琴",zy:"ㄉㄨㄟˋ ㄋㄧㄡˊ ㄊㄢˊ ㄑㄧㄣˊ",g:1,c:"寓言",e:"🐮",src:"東漢・牟融《理惑論》",
 m:"比喻說話不看對象，對方聽不懂也沒興趣。",
 s:"古時候有一位很會彈琴的音樂家，叫公明儀。|有一天，他看見一頭牛在草地上吃草，就對著牛彈了一首高雅的曲子。|可是牛完全不理他，繼續低頭吃草。|公明儀換了一首曲子，彈出像蚊子嗡嗡叫、小牛哞哞叫的聲音，牛竟然豎起耳朵，甩著尾巴走過來聽。",
 x:"跟幼兒園的弟弟講分數的乘法，簡直是對牛彈琴。",
 t:"跟不同的人說話，要怎麼說他才聽得懂？"},
{w:"亡羊補牢",zy:"ㄨㄤˊ ㄧㄤˊ ㄅㄨˇ ㄌㄠˊ",g:1,c:"寓言",e:"🐑",src:"《戰國策・楚策》",
 m:"比喻出了錯以後趕快改正，還來得及。",
 s:"有個人養了一群羊。有一天早上，他發現羊圈破了一個洞，一隻羊被狼叼走了。|鄰居勸他：「快把羊圈補好吧！」他卻說：「羊都已經丟了，補有什麼用？」|第二天，又少了一隻羊。他這才後悔，趕快把破洞補好。|從此以後，狼再也進不來，他的羊再也沒有少過。",
 x:"這次考試粗心錯了很多，亡羊補牢，下次寫完一定要檢查。",
 t:"犯錯以後，最重要的是什麼？"},
{w:"磨杵成針",zy:"ㄇㄛˊ ㄔㄨˇ ㄔㄥˊ ㄓㄣ",g:1,c:"人物",e:"📍",src:"宋・祝穆《方輿勝覽》",
 m:"比喻只要有恆心、肯努力，再難的事也能做成。",
 s:"唐朝大詩人李白小時候不愛讀書，常常偷偷跑出去玩。|有一天，他看見一位老婆婆坐在溪邊，拿著一根粗粗的鐵棒在石頭上磨呀磨。|李白好奇地問：「婆婆，您在做什麼？」老婆婆說：「我要把它磨成一根針。」|李白嚇一跳：「這麼粗的鐵棒，磨得成針嗎？」老婆婆笑著說：「只要天天磨，總有一天會成功。」李白聽了很感動，從此用功讀書。",
 x:"練鋼琴要有磨杵成針的精神，每天練一點就會進步。",
 t:"有什麼事情是你想慢慢練、一直練到會的？"},
{w:"盲人摸象",zy:"ㄇㄤˊ ㄖㄣˊ ㄇㄛ ㄒㄧㄤˋ",g:1,c:"寓言",e:"🐘",src:"《大般涅槃經》",
 m:"比喻只看到事情的一小部分，就以為是全部。",
 s:"從前有一位國王，請了幾個看不見的人來摸一摸大象，再說說大象長什麼樣子。|摸到象牙的人說：「大象像一根蘿蔔。」摸到耳朵的人說：「不對，大象像一把扇子！」|摸到腿的人說：「大象像一根柱子。」摸到尾巴的人說：「明明像一條繩子！」|大家吵個不停，其實每個人都只摸到大象的一部分而已。",
 x:"只聽一個人的說法就下結論，就像盲人摸象。",
 t:"遇到吵架的事情，為什麼要聽聽雙方怎麼說？"},
{w:"掩耳盜鈴",zy:"ㄧㄢˇ ㄦˇ ㄉㄠˋ ㄌㄧㄥˊ",g:1,c:"寓言",e:"🔔",src:"《呂氏春秋・自知》（原作「掩耳盜鐘」）",
 m:"比喻自己騙自己，以為別人也不會知道。",
 s:"有一個小偷看上了別人家門口的一口大鐘，想把它偷走。|鐘太重了搬不動，他就想用鎚子把鐘敲碎再帶走。可是一敲，鐘就「噹——」地響起來。|小偷怕被人聽見，趕緊把自己的耳朵摀起來，心想：「我聽不到，別人就聽不到了！」|結果，鐘聲把大家都引來，小偷當場被抓住。",
 x:"把考卷藏起來不給爸媽看，就以為沒事，真是掩耳盜鈴。",
 t:"自己假裝不知道，問題就會消失嗎？"},
{w:"望梅止渴",zy:"ㄨㄤˋ ㄇㄟˊ ㄓˇ ㄎㄜˇ",g:1,c:"歷史",e:"🍑",src:"南朝宋・劉義慶《世說新語・假譎》",
 m:"比喻用想像來安慰自己。",
 s:"三國時代，曹操帶著軍隊走在路上，天氣很熱，找不到水喝，士兵們都口渴得走不動了。|曹操想了一個辦法，大聲說：「前面有一大片梅子林，梅子又酸又甜，可以解渴！」|士兵們一聽，想到酸酸的梅子，嘴巴裡都流出口水，一下子就不那麼渴了。|大家打起精神繼續趕路，終於找到了水源。",
 x:"肚子餓卻還沒到午餐時間，只好看著食物圖片望梅止渴。",
 t:"曹操用了什麼方法讓士兵有力氣繼續走？"},
{w:"畫龍點睛",zy:"ㄏㄨㄚˋ ㄌㄨㄥˊ ㄉㄧㄢˇ ㄐㄧㄥ",g:1,c:"人物",e:"🐉",src:"唐・張彥遠《歷代名畫記》",
 m:"比喻在最重要的地方加上一筆，讓整體變得更生動。",
 s:"南北朝時，有一位很會畫畫的人，叫張僧繇。他在寺廟的牆上畫了四條龍，可是都沒有畫眼睛。|大家問他為什麼，他說：「如果畫上眼睛，龍就會飛走。」大家都不相信，一直要他畫。|張僧繇只好拿起筆，幫其中兩條龍點上眼睛。|忽然雷電交加，那兩條龍竟然破牆飛上天空！沒點眼睛的兩條，還留在牆上。",
 x:"文章最後那句話寫得真好，有畫龍點睛的效果。",
 t:"一幅畫或一篇文章，哪裡最重要？"},
{w:"孟母三遷",zy:"ㄇㄥˋ ㄇㄨˇ ㄙㄢ ㄑㄧㄢ",g:1,c:"人物",e:"🏠",src:"漢・劉向《列女傳》",
 m:"比喻父母用心為孩子選擇好的學習環境。",
 s:"孟子小時候住在墓地附近，他就學大人辦喪事、哭哭啼啼。孟媽媽說：「這裡不適合孩子住。」就搬家了。|第二次搬到市場旁邊，孟子又學商人大聲叫賣。孟媽媽說：「這裡也不好。」又搬家了。|第三次，他們搬到學校旁邊。孟子開始學讀書人鞠躬行禮、認真念書。|孟媽媽高興地說：「這裡才是孩子該住的地方！」孟子長大後，成為很有學問的人。",
 x:"爸媽為了讓我們好好讀書，像孟母三遷一樣搬到學校附近。",
 t:"身邊的人和環境，會怎麼影響我們？"},
{w:"熟能生巧",zy:"ㄕㄡˊ ㄋㄥˊ ㄕㄥ ㄑㄧㄠˇ",g:1,c:"人物",e:"🏺",src:"宋・歐陽脩〈賣油翁〉",
 m:"做得多、練得熟，自然就能掌握技巧。",
 s:"宋朝有一位很會射箭的人，叫陳堯咨，十支箭能射中八九支，他很得意。|一個賣油的老爺爺看了，只是微微點頭。陳堯咨不高興地問：「你不覺得我很厲害嗎？」|老爺爺拿出一個葫蘆，在口上放一枚銅錢，再用勺子把油從錢孔倒進去，油一滴都沒沾到銅錢。|老爺爺笑著說：「我也沒什麼特別的，只是做得很熟練罷了。」",
 x:"剛開始跳繩常被絆倒，每天練習之後熟能生巧，現在可以連跳一百下。",
 t:"你有哪一件事是越練越厲害的？"},
{w:"精衛填海",zy:"ㄐㄧㄥ ㄨㄟˋ ㄊㄧㄢˊ ㄏㄞˇ",g:1,c:"神話",e:"🐦",src:"《山海經・北山經》",
 m:"比喻意志堅定，不怕困難，努力到底。",
 s:"傳說炎帝有一個小女兒叫女娃，她到東海去玩，不小心被大浪捲走，再也沒有回來。|女娃變成了一隻小鳥，叫聲聽起來像「精衛、精衛」，大家就叫她精衛鳥。|精衛鳥很氣大海奪走她的生命，決定要把大海填平。|她每天從西山銜來小樹枝和小石頭，一顆一顆丟進大海裡，一年又一年，從來沒有停下來。",
 x:"他學游泳嗆了好多次水，仍然有精衛填海的決心，終於學會了。",
 t:"小小的精衛鳥面對大大的海，你覺得她勇敢嗎？"},

{w:"自相矛盾",zy:"ㄗˋ ㄒㄧㄤ ㄇㄠˊ ㄉㄨㄣˋ",g:2,c:"寓言",e:"🛡️",src:"《韓非子・難一》",
 m:"比喻說話或做事前後不一致。",
 s:"楚國有一個人在市場賣矛和盾。|他先舉起盾牌誇口：「我的盾最堅固，什麼東西都刺不穿！」|接著又拿起矛大聲說：「我的矛最鋒利，什麼東西都刺得穿！」|旁邊的人問：「那用你的矛去刺你的盾，會怎麼樣呢？」那個人張大嘴巴，一句話也答不出來。",
 x:"他說自己從不遲到，又說昨天睡過頭，真是自相矛盾。",
 t:"為什麼賣矛和盾的人答不出來？"},
{w:"刻舟求劍",zy:"ㄎㄜˋ ㄓㄡ ㄑㄧㄡˊ ㄐㄧㄢˋ",g:2,c:"寓言",e:"🗡️",src:"《呂氏春秋・察今》",
 m:"比喻做事死板，不知道情況已經改變。",
 s:"楚國有個人坐船過江，一不小心，他的寶劍「撲通」一聲掉進水裡。|他不慌不忙，在船邊刻了一個記號說：「我的劍是從這裡掉下去的。」|船到了岸邊停下來，他就從刻記號的地方跳下水去找劍。|可是船一直在往前走，劍卻沉在原來的地方，他當然找不到啦！",
 x:"規則已經改了，你還照舊的方法做，就像刻舟求劍。",
 t:"船在動、劍沒動，他該怎麼做才找得到劍？"},
{w:"杞人憂天",zy:"ㄑㄧˇ ㄖㄣˊ ㄧㄡ ㄊㄧㄢ",g:2,c:"寓言",e:"☁️",src:"《列子・天瑞》",
 m:"比喻擔心不必要、不會發生的事。",
 s:"杞國有一個人，整天擔心天會塌下來、地會陷下去，自己沒有地方躲。|他擔心得吃不下飯、睡不著覺。|一位朋友來安慰他：「天是由空氣聚成的，到處都是，不會掉下來；地是由土堆成的，到處都是，也不會陷下去。」|杞國人聽了，才放下心來，開開心心地笑了。",
 x:"明天才要上台，你從上個月就開始擔心，別杞人憂天了。",
 t:"你有沒有擔心過不太會發生的事？可以找誰聊聊？"},
{w:"朝三暮四",zy:"ㄓㄠ ㄙㄢ ㄇㄨˋ ㄙˋ",g:2,c:"寓言",e:"🐒",src:"《莊子・齊物論》",
 m:"原指用花招騙人，現在多比喻常常改變主意。",
 s:"宋國有一個老人養了一大群猴子，每天餵牠們吃栗子。|後來家裡的糧食不夠了，老人對猴子說：「以後早上給你們三顆，晚上給四顆，好不好？」|猴子們聽了都生氣地跳來跳去。|老人又說：「那改成早上四顆，晚上三顆，好嗎？」猴子們聽了都高興地拍手。其實一天還是一樣七顆呀！",
 x:"他一下子想學畫畫，一下子又想學跳舞，朝三暮四，什麼都沒學好。",
 t:"三加四和四加三，有沒有不一樣？"},
{w:"濫竽充數",zy:"ㄌㄢˋ ㄩˊ ㄔㄨㄥ ㄕㄨˋ",g:2,c:"寓言",e:"🎵",src:"《韓非子・內儲說上》",
 m:"比喻沒有真本事的人混在行家裡面湊數。",
 s:"齊宣王喜歡聽人吹竽（一種樂器），而且一定要三百個人一起合奏。|有一位南郭先生根本不會吹竽，卻混進樂隊裡，每次都裝模作樣地搖頭晃腦，領了很多薪水。|後來齊宣王過世了，他的兒子齊湣王也喜歡聽竽，可是他喜歡一個一個聽人獨奏。|南郭先生知道自己要露出馬腳了，只好連夜偷偷逃走。",
 x:"大合唱時不開口只對嘴，這就是濫竽充數。",
 t:"沒有真本事，可以一直躲下去嗎？"},
{w:"葉公好龍",zy:"ㄧㄝˋ ㄍㄨㄥ ㄏㄠˋ ㄌㄨㄥˊ",g:2,c:"寓言",e:"🐲",src:"漢・劉向《新序・雜事》",
 m:"比喻嘴巴說喜歡，其實並不是真的喜歡。",
 s:"有一位葉公，非常喜歡龍。他的衣服上繡著龍，杯子上刻著龍，連屋子的牆壁上也畫滿了龍。|天上的真龍聽說了，很感動，就飛下來拜訪葉公。|真龍把頭伸進窗戶，尾巴拖在大廳裡。|葉公一看，嚇得臉色發白，轉身就跑。原來他喜歡的只是像龍的東西，不是真正的龍。",
 x:"他說最愛小狗，小狗一靠近卻嚇得大叫，真是葉公好龍。",
 t:"「真的喜歡」和「說說而已」有什麼不同？"},
{w:"南轅北轍",zy:"ㄋㄢˊ ㄩㄢˊ ㄅㄟˇ ㄓㄜˊ",g:2,c:"寓言",e:"🧭",src:"《戰國策・魏策》",
 m:"比喻做法和目標相反，越努力離目標越遠。",
 s:"有一個人要去南方的楚國，卻駕著馬車一直往北走。|路人提醒他：「楚國在南方，你怎麼往北走呢？」|他說：「我的馬跑得快！」「我的錢很多！」「我的車夫技術很好！」|路人搖搖頭說：「這些條件越好，你就離楚國越遠啊！」",
 x:"想減肥卻每天吃炸雞，這樣做是南轅北轍。",
 t:"努力很重要，但方向對不對更重要嗎？"},
{w:"驚弓之鳥",zy:"ㄐㄧㄥ ㄍㄨㄥ ㄓ ㄋㄧㄠˇ",g:2,c:"歷史",e:"🏹",src:"《戰國策・楚策》",
 m:"比喻受過驚嚇的人，遇到一點動靜就很害怕。",
 s:"魏國有一位神射手叫更羸。有一天，他對魏王說：「我不用箭，只要拉一下弓，就能讓天上的鳥掉下來。」|這時一隻大雁慢慢飛過，更羸拉開弓弦「嘣」一聲，大雁真的掉了下來。|魏王驚訝極了。更羸解釋：「這隻雁飛得慢、叫得悲傷，表示牠受過箭傷、傷口還沒好。」|「牠一聽到弓弦聲，嚇得拚命往上飛，傷口裂開，就掉下來了。」",
 x:"上次被狗追過以後，他就像驚弓之鳥，聽到狗叫就發抖。",
 t:"更羸是怎麼知道大雁受過傷的？"},
{w:"老馬識途",zy:"ㄌㄠˇ ㄇㄚˇ ㄕˋ ㄊㄨˊ",g:2,c:"歷史",e:"🐴",src:"《韓非子・說林上》",
 m:"比喻有經驗的人，對事情比較熟悉。",
 s:"春秋時代，齊桓公帶兵出去打仗，回來的時候在山谷裡迷路了。|大家走來走去都找不到出路，又冷又累。|大臣管仲說：「老馬認得路，讓牠們帶路吧！」|他們放開幾匹老馬，跟在後面走，果然順利走出山谷，回到了家鄉。",
 x:"露營時多虧爺爺老馬識途，我們才沒有走錯路。",
 t:"家裡誰最有經驗？遇到問題時你會請教誰？"},
{w:"鷸蚌相爭",zy:"ㄩˋ ㄅㄤˋ ㄒㄧㄤ ㄓㄥ",g:2,c:"寓言",e:"🐚",src:"《戰國策・燕策》",
 m:"比喻雙方爭吵不讓，結果讓第三者得到好處（漁翁得利）。",
 s:"一隻河蚌張開殼在河邊曬太陽，一隻鷸鳥飛來，用長嘴去啄牠的肉。|河蚌馬上把殼合起來，緊緊夾住鷸鳥的嘴。|鷸鳥說：「今天不下雨，明天不下雨，你就會乾死！」河蚌說：「我今天不放，明天不放，你就會餓死！」|兩個誰也不讓誰。這時一位漁夫走過來，輕輕鬆鬆就把牠們一起抓走了。",
 x:"兩隊吵著搶球場，結果被第三隊占走，真是鷸蚌相爭，漁翁得利。",
 t:"吵架吵到最後，誰得到好處了？"},
{w:"愚公移山",zy:"ㄩˊ ㄍㄨㄥ ㄧˊ ㄕㄢ",g:2,c:"寓言",e:"⛰️",src:"《列子・湯問》",
 m:"比喻做事有毅力，不怕困難。",
 s:"從前有一位九十歲的老人叫愚公，家門前有兩座大山擋住了路，出門很不方便。|愚公決定帶著全家，一擔一擔把山上的土石挖走。|有一位叫智叟的人笑他：「你年紀這麼大，怎麼搬得完？」|愚公說：「我死了還有兒子，兒子還有孫子，子子孫孫沒有窮盡，山卻不會再長高，怎麼會搬不完呢？」天帝被他感動，派神仙把兩座山搬走了。",
 x:"整理這麼大的倉庫，要有愚公移山的精神。",
 t:"你覺得愚公「愚」嗎？為什麼？"},
{w:"夸父逐日",zy:"ㄎㄨㄚ ㄈㄨˋ ㄓㄨˊ ㄖˋ",g:2,c:"神話",e:"☀️",src:"《山海經・海外北經》",
 m:"比喻有很大的志向和決心；也比喻不自量力。",
 s:"傳說有一個巨人叫夸父，他想追上太陽，把太陽留住。|他邁開大步，一路往西追，跑得滿身大汗，口渴極了。|他一口氣喝乾了黃河和渭水，還是不夠，又往北方的大湖跑去。|可惜還沒跑到，夸父就倒下了。他的手杖落在地上，變成了一大片桃樹林。",
 x:"他立志要游完整個日月潭，有夸父逐日的氣魄。",
 t:"夸父的手杖變成桃林，你覺得是什麼意思？"},
{w:"班門弄斧",zy:"ㄅㄢ ㄇㄣˊ ㄋㄨㄥˋ ㄈㄨˇ",g:2,c:"人物",e:"🔨",src:"唐・柳宗元〈王氏伯仲唱和詩序〉",
 m:"比喻在行家面前賣弄本領，不自量力。",
 s:"魯班是古時候最有名的木匠，大家都尊稱他是木匠的老祖師。|有一個年輕的木匠學了一點本事，就拿著斧頭到處表演。|有一天，他竟然跑到魯班家的大門口，揮著斧頭說：「我做的東西最好！」|路過的人笑著說：「你知道這是誰家嗎？在魯班門前耍斧頭，太不知天高地厚了！」",
 x:"在書法老師面前寫毛筆字，真是班門弄斧。",
 t:"在比自己厲害的人面前，應該怎麼表現比較好？"},
{w:"東施效顰",zy:"ㄉㄨㄥ ㄕ ㄒㄧㄠˋ ㄆㄧㄣˊ",g:2,c:"寓言",e:"🎭",src:"《莊子・天運》",
 m:"比喻盲目模仿別人，結果反而更糟。",
 s:"古代美女西施有心痛的毛病，發作時常常皺著眉頭、摀著胸口，大家看了都覺得她好美。|同村有一個姑娘叫東施，看到了也學西施皺眉頭、摀胸口，在村子裡走來走去。|結果大家看到她，有的趕快關門，有的帶著家人躲得遠遠的。|東施只學了樣子，卻不知道西施美在哪裡。",
 x:"別人穿好看，不代表你也適合，別東施效顰。",
 t:"做自己和學別人，要怎麼拿捏？"},
{w:"黔驢技窮",zy:"ㄑㄧㄢˊ ㄌㄩˊ ㄐㄧˋ ㄑㄩㄥˊ",g:2,c:"寓言",e:"🦙",src:"唐・柳宗元〈三戒・黔之驢〉",
 m:"比喻僅有的一點本事已經用完了。",
 s:"黔地原本沒有驢子，有人用船載來一頭，放在山腳下。|老虎第一次看到這麼大的動物，很害怕，躲在樹林裡偷看。驢子一叫，老虎嚇得逃得遠遠的。|慢慢地，老虎越靠越近，故意去碰驢子。驢子生氣了，只會用後腳踢老虎。|老虎高興地想：「原來你只有這點本事！」就撲上去把驢子吃掉了。",
 x:"他會的魔術全表演完了，最後黔驢技窮，只好下台。",
 t:"只會一招，夠不夠用？"},

{w:"鑿壁偷光",zy:"ㄗㄠˊ ㄅㄧˋ ㄊㄡ ㄍㄨㄤ",g:3,c:"人物",e:"🕯️",src:"晉・葛洪《西京雜記》",
 m:"形容家境貧窮但刻苦讀書。",
 s:"漢朝有一個叫匡衡的孩子，非常喜歡讀書，可是家裡很窮，晚上買不起蠟燭。|他發現隔壁鄰居家晚上點著燈，就在牆壁上鑿了一個小洞。|燈光從小洞透過來，匡衡就把書靠在洞邊，一個字一個字地讀。|他還到有很多書的人家幫忙做工，不要工錢，只求借書來讀。後來匡衡成為很有學問的大臣。",
 x:"古人鑿壁偷光也要讀書，我們有明亮的檯燈更要用功。",
 t:"匡衡用什麼方法克服困難？"},
{w:"囊螢映雪",zy:"ㄋㄤˊ ㄧㄥˊ ㄧㄥˋ ㄒㄩㄝˇ",g:3,c:"人物",e:"✨",src:"《晉書・車胤傳》、《孫氏世錄》",
 m:"形容在困難的環境中刻苦讀書。",
 s:"晉朝的車胤家裡很窮，沒錢買燈油。夏天晚上，他抓了許多螢火蟲裝進白色的薄布袋，靠螢火蟲的光讀書。|另一位叫孫康的人，也是窮得點不起燈。|冬天下雪的夜晚，他就坐在屋外，藉著白雪反射的亮光，忍著寒冷讀書。|後來兩個人都成了很有學問的人。",
 x:"雖然沒有補習，他靠著囊螢映雪的精神自學，考上了理想學校。",
 t:"如果是你，會想出什麼辦法讀書？"},
{w:"聞雞起舞",zy:"ㄨㄣˊ ㄐㄧ ㄑㄧˇ ㄨˇ",g:3,c:"人物",e:"🐓",src:"《晉書・祖逖傳》",
 m:"比喻有志向的人及時努力、勤奮不懈。",
 s:"晉朝有兩個好朋友，祖逖和劉琨，他們都想長大後報效國家。|有一天半夜，祖逖聽到雞叫聲，就把劉琨叫醒說：「這是叫我們起床的聲音！」|兩個人就到院子裡拔劍練武。|從此以後，他們每天聽到雞叫就起床練習，後來都成為保衛國家的大將。",
 x:"哥哥為了參加比賽，每天聞雞起舞，天還沒亮就去練跑。",
 t:"要達成目標，每天可以做哪一件小事？"},
{w:"程門立雪",zy:"ㄔㄥˊ ㄇㄣˊ ㄌㄧˋ ㄒㄩㄝˇ",g:3,c:"人物",e:"❄️",src:"《宋史・楊時傳》",
 m:"形容尊敬老師、虛心求學。",
 s:"宋朝有一個讀書人叫楊時，他和朋友一起去拜訪老師程頤，想請教問題。|到了老師家，程頤正閉著眼睛坐著休息。|楊時不想吵醒老師，就和朋友安安靜靜地站在門外等。外面下起大雪，他們還是一動也不動。|等程頤醒來，門外的雪已經積了一尺深了。",
 x:"他向老師請教問題時，有程門立雪般的禮貌與耐心。",
 t:"怎樣做才是尊敬老師的表現？"},
{w:"胸有成竹",zy:"ㄒㄩㄥ ㄧㄡˇ ㄔㄥˊ ㄓㄨˊ",g:3,c:"人物",e:"🎋",src:"宋・蘇軾〈文與可畫篔簹谷偃竹記〉",
 m:"比喻做事之前已經有完整的計畫，很有把握。",
 s:"宋朝有一位畫家叫文與可，他最會畫竹子。|他在家旁邊種了好多竹子，每天觀察竹子在晴天、雨天、颳風時的樣子。|因為看得太熟了，竹子的模樣早就深深印在他的心裡。|每次拿起畫筆，他不用多想，一下子就畫出栩栩如生的竹子。",
 x:"他每天都有複習，考試時胸有成竹，一點也不緊張。",
 t:"怎樣才能對一件事「很有把握」？"},
{w:"入木三分",zy:"ㄖㄨˋ ㄇㄨˋ ㄙㄢ ㄈㄣ",g:3,c:"人物",e:"🖌️",src:"唐・張懷瓘《書斷》",
 m:"形容書法筆力強勁；也比喻見解深刻。",
 s:"東晉的王羲之是有名的書法家，大家稱他「書聖」。|有一次，皇帝要舉行祭典，請王羲之把祝詞寫在木板上，再交給工匠雕刻。|工匠削木板的時候嚇了一跳：墨汁竟然滲進木頭裡有三分那麼深！|大家都說王羲之寫字的力氣太厲害了。",
 x:"這篇文章分析得入木三分，讓人佩服。",
 t:"王羲之的字為什麼這麼有力？只靠天分嗎？"},
{w:"一鳴驚人",zy:"ㄧ ㄇㄧㄥˊ ㄐㄧㄥ ㄖㄣˊ",g:3,c:"歷史",e:"📣",src:"《史記・滑稽列傳》",
 m:"比喻平時沒有表現，一做起事來就有驚人的成績。",
 s:"齊威王剛當上國王時，整天只顧著玩樂，不管國家大事。|大臣淳于髡用猜謎的方式提醒他：「有一隻大鳥停在王宮裡，三年不飛也不叫，這是什麼鳥呢？」|齊威王聽懂了，回答說：「這隻鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人！」|從此齊威王認真治理國家，齊國變得非常強大。",
 x:"她平常很安靜，這次演講比賽卻一鳴驚人，拿下第一名。",
 t:"大臣為什麼要用猜謎的方式勸國王？"},
{w:"杯弓蛇影",zy:"ㄅㄟ ㄍㄨㄥ ㄕㄜˊ ㄧㄥˇ",g:3,c:"歷史",e:"🍵",src:"《晉書・樂廣傳》",
 m:"比喻疑神疑鬼，自己嚇自己。",
 s:"晉朝的樂廣請朋友來家裡喝酒。朋友舉起杯子時，好像看到杯子裡有一條小蛇。|他不好意思說，硬著頭皮把酒喝下去，回家後越想越害怕，就生病了。|樂廣知道後，回到原來的房間察看，發現牆上掛著一把弓，弓的影子剛好映在酒杯裡，看起來就像一條蛇。|樂廣再請朋友來，讓他坐在同樣的位置看清楚。朋友恍然大悟，病馬上就好了。",
 x:"晚上把衣架看成人影，嚇得大叫，真是杯弓蛇影。",
 t:"害怕的時候，可以怎麼找出真相？"},
{w:"塞翁失馬",zy:"ㄙㄞˋ ㄨㄥ ㄕ ㄇㄚˇ",g:3,c:"寓言",e:"🐎",src:"《淮南子・人間訓》",
 m:"比喻壞事有時也會變成好事（塞翁失馬，焉知非福）。",
 s:"邊塞住著一位老人，他的馬跑到胡人那邊去了。鄰居來安慰他，他卻說：「這說不定是好事。」|過了幾個月，那匹馬竟然帶著一匹胡人的駿馬回來了。大家來祝賀，老人說：「這說不定是壞事。」|他的兒子很喜歡騎那匹駿馬，結果摔斷了腿。老人又說：「這說不定是好事。」|一年後打仗了，年輕人都被抓去當兵，很多人沒能回來。老人的兒子因為腿受傷不用去，父子平平安安。",
 x:"沒抽到想要的組別，結果認識了好朋友，真是塞翁失馬，焉知非福。",
 t:"遇到不順利的事，可以換個角度想想嗎？"},
{w:"一葉障目",zy:"ㄧ ㄧㄝˋ ㄓㄤˋ ㄇㄨˋ",g:3,c:"寓言",e:"🍃",src:"三國魏・邯鄲淳《笑林》",
 m:"比喻被眼前的小事物遮住，看不清全貌。",
 s:"楚國有一個窮書生，讀到一本書上寫：螳螂捕蟬時躲在葉子後面，那片葉子可以讓人隱形。|他跑到樹下找了好久，摘下一大堆葉子，一片一片拿起來遮住眼睛，問妻子：「你看得到我嗎？」|妻子被問煩了，就說：「看不到了。」|書生高高興興地拿著那片葉子跑到市場拿別人的東西，結果當場被抓住了。",
 x:"只看一次考試成績就說自己不行，是一葉障目。",
 t:"用葉子遮住自己的眼睛，別人就看不到你嗎？"},
{w:"邯鄲學步",zy:"ㄏㄢˊ ㄉㄢ ㄒㄩㄝˊ ㄅㄨˋ",g:3,c:"寓言",e:"🚶",src:"《莊子・秋水》",
 m:"比喻一味模仿別人，反而連自己原本的本領也忘了。",
 s:"燕國有一個少年，聽說趙國邯鄲的人走路姿勢特別優美，就跑到邯鄲去學。|他每天在街上跟在別人後面，學人家怎麼抬腳、怎麼擺手。|可是學了很久都學不像，反而把自己原來怎麼走路都忘記了。|最後，他只好爬著回到燕國。",
 x:"寫作文要寫出自己的想法，一直抄範文只會邯鄲學步。",
 t:"學習別人時，怎樣才不會忘了自己？"},
{w:"買櫝還珠",zy:"ㄇㄞˇ ㄉㄨˊ ㄏㄨㄢˊ ㄓㄨ",g:3,c:"寓言",e:"💎",src:"《韓非子・外儲說左上》",
 m:"比喻只看外表，不懂得真正有價值的東西。",
 s:"楚國有個商人要到鄭國賣珍珠。他用名貴的木頭做了一個盒子（櫝），還刻上花紋、鑲上寶石，非常漂亮。|一個鄭國人看到這個盒子，愛得不得了，花了很多錢把它買下來。|他打開盒子，拿出裡面的珍珠，把珍珠還給了商人。|他只要漂亮的盒子，卻把真正值錢的珍珠退回去了。",
 x:"只看包裝漂亮就買，不管內容好不好，就是買櫝還珠。",
 t:"選東西時，你會先看外表還是內容？"},
{w:"三顧茅廬",zy:"ㄙㄢ ㄍㄨˋ ㄇㄠˊ ㄌㄨˊ",g:3,c:"歷史",e:"🏡",src:"三國蜀・諸葛亮〈出師表〉",
 m:"比喻誠心誠意地一再邀請別人。",
 s:"三國時代，劉備想找一位聰明的軍師幫忙，聽說諸葛亮很有智慧，就去他住的草屋（茅廬）拜訪。|第一次去，諸葛亮不在家；第二次頂著大風雪再去，還是沒見到。|第三次，諸葛亮正在睡午覺，劉備就恭恭敬敬地站在門外等他醒來。|諸葛亮被劉備的誠意感動，答應出來幫忙，後來幫劉備建立了蜀國。",
 x:"教練三顧茅廬，終於請到那位選手加入球隊。",
 t:"劉備靠什麼打動了諸葛亮？"},
{w:"草船借箭",zy:"ㄘㄠˇ ㄔㄨㄢˊ ㄐㄧㄝˋ ㄐㄧㄢˋ",g:3,c:"歷史",e:"⛵",src:"明・羅貫中《三國演義》",
 m:"比喻運用智慧，借用別人的力量達成目的。",
 s:"三國時代，周瑜要諸葛亮在十天內造好十萬支箭，想故意為難他。諸葛亮卻說：「只要三天就夠了。」|諸葛亮準備了二十艘小船，船上綁滿稻草人，算準第三天清晨江上會起大霧。|他命令船隊開到曹操的軍營前擂鼓吶喊。曹操在大霧中看不清楚，以為敵人來攻，下令放箭。|成千上萬支箭全插在稻草人上，諸葛亮帶著十多萬支箭回來，順利完成任務。",
 x:"他借用學長整理的筆記來複習，像草船借箭一樣聰明。",
 t:"諸葛亮用了哪些知識才成功？"},
{w:"開卷有益",zy:"ㄎㄞ ㄐㄩㄢˋ ㄧㄡˇ ㄧˋ",g:3,c:"歷史",e:"📖",src:"宋・王闢之《澠水燕談錄》",
 m:"只要打開書來讀，就一定會有收穫。",
 s:"宋太宗很喜歡讀書。他命人編了一套一千卷的大書，叫做《太平御覽》。|他規定自己每天要讀三卷，如果忙得沒時間讀，以後也一定要補回來。|大臣怕皇帝太累，勸他休息。|宋太宗說：「只要打開書本就會有好處，我一點都不覺得累！」",
 x:"開卷有益，每天睡前讀十分鐘的書吧！",
 t:"你最近讀了哪一本書？學到什麼？"},

{w:"臥薪嘗膽",zy:"ㄨㄛˋ ㄒㄧㄣ ㄔㄤˊ ㄉㄢˇ",g:4,c:"歷史",e:"😣",src:"《史記・越王句踐世家》",
 m:"比喻刻苦自勵，下定決心發憤圖強。",
 s:"春秋時代，越王句踐被吳國打敗，還被抓去吳國當僕人，受了很多屈辱。|三年後他回到越國，決心報仇雪恥。|他晚上睡在粗硬的柴草上，在座位旁掛了一顆苦膽，吃飯、睡覺前都嘗一口，提醒自己不要忘記失敗的痛苦。|經過十多年努力，越國變得強大，終於打敗了吳國。",
 x:"上次比賽輸了以後，他臥薪嘗膽苦練一年，今年拿下冠軍。",
 t:"失敗以後，你會怎麼提醒自己再努力？"},
{w:"完璧歸趙",zy:"ㄨㄢˊ ㄅㄧˋ ㄍㄨㄟ ㄓㄠˋ",g:4,c:"歷史",e:"💍",src:"《史記・廉頗藺相如列傳》",
 m:"比喻把原物完好無缺地歸還原主。",
 s:"趙國有一塊珍貴的玉，叫「和氏璧」。秦王說要用十五座城來換。|趙王怕被騙，派藺相如帶著玉去秦國。秦王拿到玉後非常高興，卻絕口不提換城的事。|藺相如說：「玉上有個小斑點，我指給大王看。」拿回玉後，他退到柱子旁說：「大王沒有誠意，再逼我，我就和玉一起撞碎在柱子上！」|秦王只好讓步。藺相如偷偷派人把玉送回趙國，玉完好無缺地回家了。",
 x:"借來的書我一定會完璧歸趙，不會弄髒。",
 t:"藺相如靠的是勇氣還是智慧？還是兩個都有？"},
{w:"負荊請罪",zy:"ㄈㄨˋ ㄐㄧㄥ ㄑㄧㄥˇ ㄗㄨㄟˋ",g:4,c:"歷史",e:"🙇",src:"《史記・廉頗藺相如列傳》",
 m:"比喻主動向人認錯道歉。",
 s:"藺相如立了大功，官位比大將軍廉頗還高。廉頗很不服氣：「我出生入死，他只靠一張嘴！我見到他一定要羞辱他。」|藺相如知道後，總是避開廉頗，連出門遇到也繞路走。|他說：「秦國不敢攻打趙國，是因為有我們兩人。如果我們吵架，就讓秦國有機會了。」|廉頗聽了非常慚愧，背著荊條到藺相如家門口跪下道歉。兩人從此成為好朋友。",
 x:"他知道自己誤會同學後，馬上負荊請罪，大家又和好如初。",
 t:"道歉需要勇氣嗎？為什麼？"},
{w:"紙上談兵",zy:"ㄓˇ ㄕㄤˋ ㄊㄢˊ ㄅㄧㄥ",g:4,c:"歷史",e:"📜",src:"《史記・廉頗藺相如列傳》",
 m:"比喻只會說空話，沒有實際的本領。",
 s:"趙國名將趙奢的兒子趙括，從小讀了很多兵書，講起打仗頭頭是道，連爸爸都說不過他。|可是趙奢說：「打仗是生死大事，括兒說得太輕鬆了。如果讓他當將軍，趙國一定會吃敗仗。」|後來秦國攻打趙國，趙王派趙括當大將。他只會照著書本死板地指揮。|結果趙軍被秦軍包圍，四十多萬士兵全軍覆沒。",
 x:"游泳只看影片不下水，就是紙上談兵。",
 t:"「知道」和「做得到」有什麼不同？"},
{w:"毛遂自薦",zy:"ㄇㄠˊ ㄙㄨㄟˋ ㄗˋ ㄐㄧㄢˋ",g:4,c:"歷史",e:"🙋",src:"《史記・平原君虞卿列傳》",
 m:"比喻自己推薦自己，主動爭取機會。",
 s:"秦國包圍趙國，趙國的平原君要去楚國求救，想從門客中挑二十個人一起去，挑來挑去只有十九個。|一個叫毛遂的門客站出來說：「讓我去吧！」平原君說：「你來我家三年，我都沒聽過你有什麼表現。」|毛遂說：「把錐子放進袋子裡，尖端馬上就會露出來。我只是一直沒有被放進袋子裡而已。」|到了楚國，談判不順利，毛遂拿著劍走上前，說服楚王出兵救趙。",
 x:"班上要選小老師，他毛遂自薦，願意幫大家收作業。",
 t:"你願意主動爭取機會嗎？要先準備好什麼？"},
{w:"唇亡齒寒",zy:"ㄔㄨㄣˊ ㄨㄤˊ ㄔˇ ㄏㄢˊ",g:4,c:"歷史",e:"👄",src:"《左傳・僖公五年》",
 m:"比喻關係密切，互相依存。",
 s:"春秋時代，晉國想消滅虢國，可是要先經過虞國。晉國就送了寶馬和美玉給虞國國君，請他借路。|虞國的大臣宮之奇勸國君：「虞國和虢國就像嘴唇和牙齒，嘴唇沒了，牙齒就會冷。」|虞國國君貪圖禮物，不肯聽勸。|晉國借路滅了虢國之後，回程時順便把虞國也消滅了。",
 x:"小組裡每個人都很重要，唇亡齒寒，要互相幫忙。",
 t:"你和誰是「嘴唇和牙齒」的關係？"},
{w:"退避三舍",zy:"ㄊㄨㄟˋ ㄅㄧˋ ㄙㄢ ㄕㄜˋ",g:4,c:"歷史",e:"↩️",src:"《左傳・僖公二十三年》",
 m:"比喻主動讓步，不和人相爭。",
 s:"晉國公子重耳流亡到楚國時，楚王熱情地招待他。|楚王問：「將來你回國當國王，要怎麼報答我？」重耳說：「如果晉楚兩國不得不打仗，我會先把軍隊後退三舍（九十里）。」|後來重耳成為晉文公，兩國真的打起仗來。|晉文公遵守承諾，下令軍隊退後九十里。楚軍卻步步進逼，最後反而被晉軍打敗了。",

function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ log('儲存失敗', k, e.message); } }

function isFav(d){ return favs.indexOf(d.w) >= 0; }

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1600); }

function ruby(d, hl){
  var zy = d.zy.split(' ');
  var chars = Array.from(d.w);
  var hit = hl ? d.w.indexOf(hl) : -1;
  return chars.map(function(ch,i){
    var inHit = hit>=0 && i>=hit && i<hit+hl.length;
    var c = inHit ? '<mark>'+esc(ch)+'</mark>' : esc(ch);
    return '<ruby>'+c+'<rt>'+(zy[i]||'')+'</rt></ruby>';
  }).join('');
}
function hlText(s, q){
  if(!q) return esc(s);
  return esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>');
}

// ── 篩選 ──
function inTab(d, tab){ return tab==='all' ? true : tab==='fav' ? isFav(d) : String(d.g)===String(tab); }
function matchQ(d, q){
  if(!q) return true;
  return d.w.indexOf(q)>=0 || d.m.indexOf(q)>=0 || d.s.indexOf(q)>=0 || d.src.indexOf(q)>=0 || d.x.indexOf(q)>=0 || d.c===q;
}
function currentList(){

// ── 朗讀 ──
var TTS = { ok: 'speechSynthesis' in window, voice: null, rate: load('idiom.rate', 0.9), queue: [], idx: 0, playing: false, paused: false, onEl: null };
function pickVoice(){
  if(!TTS.ok) return;
  var vs = speechSynthesis.getVoices();
  TTS.voice = vs.find(function(v){ return /zh[-_]TW/i.test(v.lang); }) ||
              vs.find(function(v){ return /zh[-_](HK|Hant)/i.test(v.lang); }) ||
              vs.find(function(v){ return /^zh/i.test(v.lang); }) || null;
  log('朗讀聲音', TTS.voice ? TTS.voice.name+' ('+TTS.voice.lang+')' : '使用預設');
}
if(TTS.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function ttsMark(el){
  document.querySelectorAll('.reading').forEach(function(x){ x.classList.remove('reading'); });
  if(el){ el.classList.add('reading'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function ttsUpdateUI(){
  var p = $('ttsPlay'); if(!p) return;
  p.textContent = TTS.playing && !TTS.paused ? '⏸ 暫停' : (TTS.paused ? '▶ 繼續' : '▶ 播放');
  $('ttsStop').disabled = !TTS.playing;
}
// queue: [{text, el}]
function ttsStart(queue){
  if(!TTS.ok){ toast('這個瀏覽器不支援朗讀，請改用 Chrome 或 Edge'); return; }
  ttsStop(true);
  TTS.queue = queue; TTS.idx = 0; TTS.playing = true; TTS.paused = false;
  log('朗讀開始，共', queue.length, '段');
  ttsNext(); ttsUpdateUI();
}
function ttsNext(){
  if(!TTS.playing) return;
  if(TTS.idx >= TTS.queue.length){ log('朗讀結束'); ttsStop(); return; }
  var item = TTS.queue[TTS.idx];
  var u = new SpeechSynthesisUtterance(item.text);
  u.lang = 'zh-TW'; u.rate = TTS.rate; if(TTS.voice) u.voice = TTS.voice;
  var myIdx = TTS.idx;
  u.onend = function(){ if(TTS.playing && TTS.idx===myIdx){ TTS.idx++; ttsNext(); } };
  u.onerror = function(e){ if(e.error!=='interrupted' && e.error!=='canceled'){ log('朗讀錯誤', e.error); TTS.idx++; ttsNext(); } };
  ttsMark(item.el);
  speechSynthesis.speak(u);
}
function ttsToggle(queueFn){
  if(!TTS.playing){ ttsStart(queueFn()); return; }
  if(TTS.paused){ speechSynthesis.resume(); TTS.paused=false; log('朗讀繼續'); }
  else { speechSynthesis.pause(); TTS.paused=true; log('朗讀暫停'); }
  ttsUpdateUI();
}
function ttsStop(silent){
  TTS.playing=false; TTS.paused=false; TTS.queue=[]; TTS.idx=0;
  if(TTS.ok) speechSynthesis.cancel();
  ttsMark(null); if(!silent) ttsUpdateUI();
}
function speakOnce(text){ ttsStart([{text:text, el:null}]); }

  function buildQueue(){

    if(what!=='story') q.push({text: d.w, el: m.querySelector('.mhead .word')});

// ── 小測驗 ──
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function quizPool(){
  var pool = DATA.filter(function(d){ return inTab(d, state.tab); });
  return pool.length >= 4 ? pool : DATA;
}
function startQuiz(pool, title){
  pool = pool || quizPool();
  var qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(function(d){
    var type = Math.random()<0.5 ? 'm' : 'x';
    var others = shuffle(DATA.filter(function(o){ return o.w!==d.w; })).slice(0,3);
    return { d:d, type:type, opts: shuffle([d].concat(others)) };
  });
  var st = { i:0, score:0, wrong:[] };
  log('開始測驗', title || '', qs.length, '題');
  function show(){
    var q = qs[st.i];
    var text = q.type==='m'
      ? '哪一個成語的意思是：<br><b>「'+esc(q.d.m)+'」</b>'
      : '請選出適合填入空格的成語：<br><b>'+esc(q.d.x).split(esc(q.d.w)).join('＿＿＿＿')+'</b>';
    $('qmodal').innerHTML =
      '<div class="qbox">'+
        '<div class="qtitle">'+(title||'🎯 小測驗')+'　第 '+(st.i+1)+' / '+qs.length+' 題　得分 '+st.score+'</div>'+
        '<div class="prog"><i style="width:'+(st.i/qs.length*100)+'%"></i></div>'+
        '<div class="qtext">'+text+'</div>'+
        '<div class="opts">'+q.opts.map(function(o){ return '<button class="opt" data-w="'+o.w+'">'+o.w+'</button>'; }).join('')+'</div>'+
        '<div class="qmsg" id="qmsg"></div>'+
        '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" id="qquit">結束</button><span class="spacer"></span><button class="btn" id="qnext" style="display:none">下一題 ▶</button></div>'+
      '</div>';
    var done = false;
    $('qmodal').querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        if(done) return; done = true;
        var right = b.dataset.w === q.d.w;
        if(right){ st.score++; b.classList.add('ok'); $('qmsg').innerHTML='🎉 答對了！'; speakOnce('答對了，'+q.d.w); }
        else {
          b.classList.add('no'); st.wrong.push(q.d);
          $('qmodal').querySelector('.opt[data-w="'+q.d.w+'"]').classList.add('ok');
          $('qmsg').innerHTML='😅 正確答案是「'+q.d.w+'」<button class="btn ghost" id="qsee" style="margin-left:8px;padding:4px 10px">看故事</button>';
          $('qsee').onclick = function(){ openDetail(q.d); };
        }
        log('第',st.i+1,'題', q.d.w, right?'對':'錯');
        $('qnext').style.display='';
        $('qnext').textContent = st.i<qs.length-1 ? '下一題 ▶' : '看成績 🏆';
      };
    });
    $('qnext').onclick = function(){ st.i++; if(st.i<qs.length) show(); else finish(); };
    $('qquit').onclick = closeQuiz;
  }
  function finish(){
    var pct = st.score/qs.length;
    var stars = pct>=0.9?'⭐⭐⭐':pct>=0.6?'⭐⭐':'⭐';
    log('測驗結束 得分', st.score, '/', qs.length);
    $('qmodal').innerHTML =
      '<div class="qbox" style="text-align:center">'+
        '<div style="font-size:50px">'+stars+'</div>'+
        '<h2>答對 '+st.score+' / '+qs.length+' 題</h2>'+
        (st.wrong.length ? '<p>這些要再複習：</p><p>'+st.wrong.map(function(d){return '<button class="chip" data-id="'+d.id+'">'+d.w+'</button>';}).join(' ')+'</p>'+
          '<p><button class="btn fav" id="qfavw">❤️ 把答錯的加入我的最愛</button></p>' : '<p>全部答對，太厲害了！🎉</p>')+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn ghost" id="qquit">關閉</button><button class="btn" id="qagain">再玩一次</button></div>'+
      '</div>';
    speakOnce('答對 '+st.score+' 題');
    $('qmodal').querySelectorAll('.chip[data-id]').forEach(function(c){ c.onclick=function(){ openDetail(DATA[c.dataset.id]); }; });
    if($('qfavw')) $('qfavw').onclick = function(){
      var add = 0; st.wrong.forEach(function(d){ if(!isFav(d)){ favs.push(d.w); add++; } });
      save('idiom.favs', favs); renderAll(); toast('已加入 '+add+' 則到我的最愛'); log('答錯加入最愛', add); this.disabled=true;
    };
    $('qquit').onclick = closeQuiz;
    $('qagain').onclick = function(){ startQuiz(pool, title); };
  }
  $('qm').classList.add('show'); document.body.style.overflow='hidden';
  show();
}
function closeQuiz(){ ttsStop(true); $('qm').classList.remove('show'); if(!$('dm').classList.contains('show')) document.body.style.overflow=''; }
