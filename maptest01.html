<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP Reading Interactive Practice (Lexile 680L)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 3px solid #3498db; padding-bottom: 15px; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 1.1em; margin-bottom: 30px; }
        .passage { background: #eaf2f8; padding: 20px; border-left: 6px solid #3498db; margin: 25px 0; font-style: italic; border-radius: 5px; }
        .question-block { margin-bottom: 35px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .question { font-weight: bold; font-size: 1.2em; margin-top: 0; color: #34495e; }
        .options { list-style: none; padding: 0; margin: 15px 0 0 0; }
        .options li { margin: 12px 0; }
        .options label { cursor: pointer; display: block; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.2s ease; position: relative; }
        .options label:hover { background-color: #f9f9f9; border-color: #bbb; }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); vertical-align: middle; }
        
        /* 提交按鈕樣式 */
        button#submitBtn { display: block; width: 100%; padding: 18px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 40px; transition: background 0.3s; }
        button#submitBtn:hover { background: #2980b9; }
        button#submitBtn:disabled { background: #bdc3c7; cursor: not-allowed; }

        /* 結果顯示區域 */
        #result-summary { margin-top: 30px; padding: 25px; display: none; border-radius: 10px; text-align: center; }
        .score-display { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .comment { font-size: 1.2em; color: #7f8c8d; }

        /* 互動反饋樣式 (核心修改) */
        
        /* 1. 當選錯時，將該選項標示為紅色 */
        .options input[type="radio"]:checked + label.wrong-selection { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .options label.wrong-selection::after { content: " (Wrong Answer)"; color: #c0392b; font-weight: bold; margin-left: 10px; }

        /* 2. 不論是否選對，皆將正確答案標示為綠色 */
        .options label.correct-answer { background-color: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; }
        .options label.correct-answer::after { content: " (Correct Answer)"; color: #27ae60; font-weight: bold; margin-left: 10px; }

        /* 3. 提交後鎖定所有選項，防止再次點擊 */
        .options input[type="radio"]:disabled + label { cursor: default; opacity: 0.8; }
        .options input[type="radio"]:disabled + label:hover { background-color: white; border-color: #ddd; }

    </style>
</head>
<body>

<div class="container">
    <h1>MAP Reading 模擬練習 (互動版)</h1>
    <p class="subtitle">Lexile 等級：680L | 總計 20 題 | 提交後將顯示正確答案與反饋</p>

    <form id="quizForm">
        <div id="quiz-content">
            </div>
        <button type="button" id="submitBtn" onclick="calculateAndShowResults()">提交答案並查看結果</button>
    </form>

    <div id="result-summary">
        <div class="score-display">你的得分: <span id="score"></span> / <span id="total"></span></div>
        <div class="comment" id="score-comment"></div>
    </div>
</div>

<script>
    const quizData = [
        { q: "1. The hiker felt <b>weary</b> after walking up the steep mountain for five hours. He needed to sit down and close his eyes.", options: ["Excited", "Tired", "Angry", "Hungry"], ans: 1 },
        { q: "2. The scientist used a <b>microscope</b> to look at the tiny cells that were too small to see with just his eyes.", options: ["Make small things look larger", "Measure how heavy something is", "Change the color of an object", "Keep things cold"], ans: 0 },
        { q: "3. 'Please <b>summarize</b> the story,' said the teacher. 'I only want to hear the most important parts, not every little detail.'", options: ["Write a very long book", "Read the story out loud", "Give a short review of the main points", "Draw a picture of the characters"], ans: 2 },
        { q: "4. The weather was <b>unpredictable</b>. One minute it was sunny, and the next minute it started to hail.", options: ["Always stays the same", "Is very beautiful", "Cannot be known beforehand", "Happens every morning"], ans: 2 },
        { q: "5. The puppy was so <b>mischievous</b> that he hid his owner's shoes under the bed and chewed on the rug.", options: ["Helpful and kind", "Playfully causing trouble", "Very sleepy", "Scared of loud noises"], ans: 1 },
        { isPassage: true, text: "<b>[Passage: The Life of Ants]</b><br>Ants are social insects that live in large groups called colonies. Each ant has a specific job. The queen ant lays eggs. The worker ants find food and take care of the babies. Some ants are 'soldiers' that protect the nest from enemies." },
        { q: "6. What is the main idea of this passage?", options: ["Queen ants are the largest ants.", "Ants live in groups and work together to survive.", "Soldier ants are very brave.", "Ants like to eat crumbs from people's houses."], ans: 1 },
        { q: "7. According to the text, what is the job of a worker ant?", options: ["To lay eggs", "To fight enemies", "To find food", "To lead the colony"], ans: 2 },
        { q: "8. Why did the author write this passage?", options: ["To persuade you to buy an ant farm", "To inform you about how ant colonies work", "To tell a funny story about an ant", "To explain how to get rid of ants"], ans: 1 },
        { isPassage: true, text: "<b>[Passage: The Water Cycle]</b><br>Water on Earth is always moving. When the sun heats up water in oceans or lakes, it turns into gas called water vapor. This is called evaporation. The vapor rises into the sky and cools down to form clouds. Eventually, the water falls back to the ground as rain or snow." },
        { q: "9. What happens right after water vapor cools down in the sky?", options: ["It turns into salt water.", "It forms clouds.", "It flows into the ocean.", "The sun heats it up."], ans: 1 },
        { q: "10. Which word in the text means 'water turning into gas'?", options: ["Vapor", "Cooling", "Evaporation", "Flowing"], ans: 2 },
        { isPassage: true, text: "<b>[Passage: The Big Game]</b><br>Leo gripped his baseball bat tightly. His palms were sweaty, and his heart was thumping against his chest. He looked at the scoreboard: two outs, bases loaded, and his team was down by one run. The pitcher threw the ball. <i>Whack!</i> Leo ran as fast as he could toward first base." },
        { q: "11. How is Leo feeling at the beginning of the story?", options: ["Bored", "Nervous", "Angry", "Sleepy"], ans: 1 },
        { q: "12. What can you infer happened at the end of the passage?", options: ["Leo decided to quit the team.", "Leo hit the ball.", "The game was cancelled because of rain.", "Leo forgot his helmet."], ans: 1 },
        { q: "13. Which detail from the story shows that Leo was anxious?", options: ["He looked at the scoreboard.", "He ran to first base.", "His palms were sweaty.", "The bases were loaded."], ans: 2 },
        { isPassage: true, text: "<b>[Passage: Sarah’s New Neighbor]</b><br>Sarah saw a big moving truck parked next door. A girl about her age was carrying a box of books into the house. Sarah grabbed her favorite ball and walked over to the fence. She smiled and waved." },
        { q: "14. Why did Sarah go to the fence?", options: ["She wanted to see if the truck was broken.", "She wanted to meet the new neighbor.", "She was looking for her lost dog.", "She wanted to help carry the books."], ans: 1 },
        { q: "15. What kind of person is Sarah?", options: ["Shy", "Friendly", "Lazy", "Serious"], ans: 1 },
        { q: "16. Choose the word that best completes the sentence: 'The cat ______ silently through the tall grass to catch the grasshopper.'", options: ["crept", "creep", "creeping", "creeps"], ans: 0 },
        { q: "17. Which sentence is written correctly?", options: ["They was going to the park.", "They is going to the park.", "They are going to the park.", "They be going to the park."], ans: 2 },
        { q: "18. What is the opposite (antonym) of the word ancient?", options: ["Old", "Modern", "Large", "Heavy"], ans: 1 },
        { q: "19. Identify the adjective in this sentence: 'The bright stars sparkled in the dark sky.'", options: ["Sparkled", "Stars", "Bright", "Sky"], ans: 2 },
        { q: "20. Which sentence uses a comma correctly?", options: ["I need to buy apples, milk, and bread.", "I need to buy, apples milk and bread.", "I need, to buy apples milk and bread.", "I, need to buy apples, milk and bread."], ans: 0 }
    ];

    const quizContent = document.getElementById('quiz-content');

    // 動態生成題目 HTML
    quizData.forEach((item, index) => {
        if (item.isPassage) {
            const passageDiv = document.createElement('div');
            passageDiv.className = 'passage';
            passageDiv.innerHTML = item.text;
            quizContent.appendChild(passageDiv);
        } else {
            const qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            qBlock.innerHTML = `<p class="question">${item.q}</p>`;
            
            const uList = document.createElement('ul');
            uList.className = 'options';
            
            item.options.forEach((opt, i) => {
                const li = document.createElement('li');
                // 為了方便選取，給 label 一個唯一的 ID
                const optionId = `q${index}_opt${i}`;
                li.innerHTML = `
                    <input type="radio" name="q${index}" id="${optionId}" value="${i}">
                    <label for="${optionId}">${opt}</label>
                `;
                uList.appendChild(li);
            });
            
            qBlock.appendChild(uList);
            quizContent.appendChild(qBlock);
        }
    });

    function calculateAndShowResults() {
        let score = 0;
        let answeredQuestions = 0;
        const totalQuestions = quizData.filter(item => !item.isPassage).length;

        quizData.forEach((item, index) => {
            if (!item.isPassage) {
                answeredQuestions++;
                const selectedRadio = document.querySelector(`input[name="q${index}"]:checked`);
                const correctAnsIndex = item.ans;
                const correctLabel = document.querySelector(`label[for="q${index}_opt${correctAnsIndex}"]`);

                // 1. 標示正確答案 (綠色)
                if (correctLabel) {
                    correctLabel.classList.add('correct-answer');
                }

                if (selectedRadio) {
                    const selectedAnsIndex = parseInt(selectedRadio.value);
                    const selectedLabel = document.querySelector(`label[for="${selectedRadio.id}"]`);

                    if (selectedAnsIndex === correctAnsIndex) {
                        // 答對了
                        score++;
                    } else {
                        // 2. 答錯了，將選錯的選項標示為紅色
                        if (selectedLabel) {
                            selectedLabel.classList.add('wrong-selection');
                        }
                    }
                }

                // 3. 鎖定所有選項 (disabled)
                const allRadiosInQuestion = document.querySelectorAll(`input[name="q${index}"]`);
                allRadiosInQuestion.forEach(radio => radio.disabled = true);
            }
        });

        // 顯示結果總結
        const resultSummary = document.getElementById('result-summary');
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.disabled = true; // 禁用提交按鈕
        submitBtn.innerText = "測驗已結束";

        resultSummary.style.display = 'block';
        document.getElementById('score').innerText = score;
        document.getElementById('total').innerText = totalQuestions;
        
        // 根據分數給予評語
        let comment = "";
        if (score === totalQuestions) comment = "太棒了！全對！🌟";
        else if (score >= 16) comment = "非常優秀！繼續保持！👍";
        else if (score >= 12) comment = "做得好！還有進步空間。";
        else comment = "加油！多練習幾次會更好。";
        document.getElementById('score-comment').innerText = comment;

        resultSummary.style.backgroundColor = score >= 12 ? '#d4edda' : '#f8d7da';
        
        // 滾動到頁面底部查看結果
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
