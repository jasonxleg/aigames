<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 加入 iPad/iPhone 主畫面後以全螢幕 App 方式開啟 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="代辦時間表">
<title>代辦時間表</title>
<style>
  :root{
    --bg:#f4f1ea; --paper:#fffdf8; --ink:#2b2b2b; --muted:#8a8478; --line:#d9d3c5;
    --accent:#e0533d; --accent2:#2f7d6d; --sel:#fff2c7; --now:#e3f4ef; --drag:#ffe0d9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 18px}
  #dateLabel{font-size:26px;font-weight:700;letter-spacing:2px;margin-right:auto}
  button{font:inherit;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--ink)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.go{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  #status{width:100%;font-size:15px;color:var(--muted);min-height:22px}
  #status b{color:var(--accent);font-size:20px}
  /* 剩餘時間大字倒數，一眼看得到 */
  #status .cd{display:inline-block;font-size:46px;font-weight:800;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:1px;vertical-align:middle;margin:0 4px}
  #status .cd.warn{color:#e8590c}
  main{display:grid;grid-template-columns:var(--leftW,55%) 8px 1fr;gap:0;margin:0 18px 18px;
       background:var(--paper);border:2px solid var(--ink);border-radius:6px;min-height:calc(100vh - 140px)}
  table{width:100%;border-collapse:collapse;user-select:none}
  #left{position:relative;overflow:auto}
  #splitter{width:8px;cursor:col-resize;background:var(--ink);opacity:.15}
  #splitter:hover{opacity:.4}
  tr.row td{height:var(--rowH,64px)}
  td.task{font-size:var(--taskFs,18px)}
  .zoom{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:middle}
  th{font-size:14px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink)}
  td.time:hover{text-decoration:underline dotted;cursor:pointer}
  td.time{font-size:var(--timeFs,17px)}
  td.time{width:200px;border-right:2px solid var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.time .badge{display:inline-block;margin-left:4px;font-size:12px;background:var(--accent2);color:#fff;border-radius:4px;padding:1px 5px}
  tr.row{cursor:grab}
  tr.row:hover td{background:#faf6ec}
  tr.row.sel td{background:var(--sel)}
  tr.row.sel td.task{box-shadow:inset -4px 0 0 var(--accent)}
  tr.row.now td{background:var(--now);border-top:3px solid var(--accent2);border-bottom:3px solid var(--accent2)}
  tr.row.now td:first-child{border-left:3px solid var(--accent2)}
  tr.row.now td:last-child{border-right:3px solid var(--accent2)}
  tr.row.now.sel td{background:#eef6d9}
  tr.row.now td.task span.t{font-weight:700}
  .nowTag{display:inline-block;margin-left:10px;font-size:13px;font-weight:700;color:#fff;background:var(--accent2);
          border-radius:999px;padding:2px 10px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,125,109,.55)}50%{box-shadow:0 0 0 7px rgba(47,125,109,0)}}
  #nowBanner{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--now);border:2px solid var(--accent2);font-size:15px;cursor:pointer}
  #nowBanner b{color:var(--accent2);font-size:18px}
  tr.row.past td{color:#b3ad9f}
  tr.row.past td.task span.t{text-decoration:line-through}
  tr.row.dragging td{opacity:.45}
  tr.row.target td{background:var(--drag)}
  td.task .grip{color:#c2bbab;margin-right:8px;cursor:grab;touch-action:none;display:inline-block;padding:10px 6px;margin:-10px 2px -10px -6px}
  tr.row{-webkit-touch-callout:none;-webkit-user-select:none}
  tr.row.dragging td{opacity:.45;box-shadow:inset 0 0 0 2px var(--accent)}
  td.task .cnt{font-size:12px;color:var(--muted);margin-left:6px}
  td.act{width:40px;text-align:center}
  td.act button{border:none;background:none;color:#c2bbab;padding:2px 6px;font-size:16px}
  td.act button:hover{color:var(--accent)}
  #right{padding:16px 20px}
  #right h2{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600}
  #detTitle{width:100%;font:inherit;font-size:22px;font-weight:700;border:none;border-bottom:2px dashed var(--line);background:none;padding:4px 0;color:var(--accent)}
  #detTime{color:var(--muted);font-size:14px;margin:6px 0 14px}
  ol#detList{padding-left:0;list-style:none;margin:0;counter-reset:n}
  ol#detList li{display:flex;align-items:center;gap:8px;margin:6px 0;counter-increment:n}
  ol#detList li::before{content:counter(n) ".";color:var(--accent);font-weight:700;width:24px;text-align:right}
  ol#detList li input[type=text]{flex:1;font:inherit;font-size:16px;border:none;border-bottom:1px solid var(--line);background:none;padding:6px 2px}
  ol#detList li.done input[type=text]{text-decoration:line-through;color:#b3ad9f}
  ol#detList li button{border:none;background:none;color:#c2bbab;padding:2px 6px}
  #detNote{width:100%;min-height:110px;margin-top:14px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
  .hint{font-size:13px;color:var(--muted);margin:8px 10px}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .mask.show{display:flex}
  .dlg{background:var(--paper);border-radius:12px;padding:20px 22px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .dlg h3{margin:0 0 12px}
  .dlg textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px}
  .dlg label{display:flex;align-items:center;gap:8px;margin:10px 0}
  .dlg input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
  .dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #alarmDlg .dlg{text-align:center;border:4px solid var(--accent)}
  #alarmDlg .big{font-size:30px;font-weight:700;color:var(--accent);margin:10px 0}
  .ring{animation:shake .3s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  /* ===== 滿版版面：整頁剛好一個螢幕高，表格/細項各自捲動 ===== */
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{flex:none}
  main{flex:1;min-height:0}
  #left,#right{overflow:auto;-webkit-overflow-scrolling:touch}
  #detToggle{display:none}

  /* 平板(iPad 直/橫向)：貼齊螢幕邊緣滿版 */
  @media (min-width:761px) and (max-width:1366px){
    header{padding:10px 14px}
    main{margin:0;border-left:none;border-right:none;border-bottom:none;border-radius:0}
  }

  /* 手機：上下排列，細項預設收起 */
  @media (max-width:760px){
    header{padding:8px 10px;gap:6px}
    header button{padding:6px 10px;font-size:14px}
    #dateLabel{font-size:20px;width:100%}
    .zoom input[type=range]{width:90px}
    main{display:flex;flex-direction:column;margin:0;border-left:none;border-right:none;border-bottom:none;border-radius:0}
    #splitter{display:none}
    #left{flex:1;min-height:0}
    td.time{width:96px;font-size:15px;padding:8px 6px;white-space:normal}
    td.task{font-size:min(var(--taskFs,18px),22px);padding:8px 6px}
    td.act{width:30px;padding:0}
    th{padding:8px 6px}
    #status{font-size:13px}
    #status b{font-size:16px}
    #status .cd{font-size:38px}
    .zoom{font-size:13px}
    #detToggle{display:flex;align-items:center;gap:8px;flex:none;width:100%;border:none;border-top:2px solid var(--ink);border-radius:0;
               background:var(--sel);padding:10px 14px;font-size:15px;text-align:left}
    #detToggle .name{color:var(--accent);font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #right{flex:none;height:55%;border-top:1px solid var(--line);padding:12px 14px}
    main.collapsed #right{display:none}
  }
</style>
</head>
<body>
<header>
  <div id="dateLabel"></div>
  <button id="btnAdd">＋ 填入代辦</button>
  <button id="btnClear" title="清除全部代辦事項">🗑 清除全部</button>
  <button id="btnTime">⏱ 時間設定</button>
  <label class="zoom">列高 <input type="range" id="rowH" min="40" max="200" step="4"> <button id="btnFit" title="讓所有時段剛好填滿畫面">填滿</button></label>
  <button id="btnTest">🔔 試聽鈴聲</button>
  <button id="btnRun" class="go">▶ 開始計時提醒</button>
  <div id="status"></div>
</header>

<main>
  <section id="left">
    <table>
      <thead><tr><th>時間</th><th>代辦事項</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="hint">點時間可修改該段（後面自動順延）；點事項選取 → 右邊編輯細項；按住拖拉到別列可交換時段（手機：按住 ⋮⋮ 拖，或長按事項）；雙擊事項可改名。</div>
  </section>
  <div id="splitter" title="左右拖拉調整寬度"></div>
  <button id="detToggle" type="button"><span class="arrow">▲ 展開細項</span><span class="name"></span></button>
  <section id="right"></section>
</main>

<!-- 填入代辦 -->
<div class="mask" id="addDlg"><div class="dlg">
  <h3>填入代辦事項</h3>
  <textarea id="addText" placeholder="可用 空格、逗號、換行 或「和」分隔&#10;例：吃飯 讀myview 寫作業&#10;例：吃飯和洗澡和寫作業"></textarea>
  <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
    <button id="micBtn" type="button">🎤 錄音輸入</button>
    <span id="micState" class="hint" style="margin:0"></span>
  </div>
  <div id="micHelp" hidden style="margin-top:8px;padding:10px 12px;border:2px solid #e0a400;border-radius:10px;background:rgba(255,200,0,.12);font-size:15px;line-height:1.6">
    <b>🎤 需要開啟麥克風權限</b>
    <ol id="micHelpSteps" style="margin:6px 0;padding-left:22px"></ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="micRetry" type="button" class="primary">我開好了，重新檢查</button>
      <button id="micHelpClose" type="button">先不用</button>
    </div>
  </div>
  <div id="addPreview" class="hint" style="margin:8px 0 0"></div>
  <label><input type="checkbox" id="addReplace"> 取代目前所有事項（從現在重新排）</label>
  <div class="btns"><button data-close>取消</button><button class="primary" id="addOk">確認排入</button></div>
</div></div>

<!-- 時間設定 -->
<div class="mask" id="timeDlg"><div class="dlg">
  <h3>重新設定時間範圍</h3>
  <div class="hint" style="margin:0 0 6px">套用後會整份重新排，個別改過的時段會被清掉。</div>
  <label>開始時間 <input type="datetime-local" id="tStart"> <button id="tNow" type="button">現在</button></label>
  <label>每段間隔 <input type="number" id="tInterval" min="1" max="600" style="width:90px"> 分鐘</label>
  <label><input type="checkbox" id="tAlign"> 以 XX:00 / XX:30 為切割點（間隔會取 30 分鐘的倍數）</label>
  <div id="tPreview" class="hint" style="margin:0"></div>
  <label>鈴聲間隔 <input type="range" id="tBeep" min="0.6" max="2.5" step="0.1" style="flex:1"> <span id="tBeepVal" style="width:90px"></span>
    <button type="button" id="tBeepTest">試聽</button></label>
  <div class="btns"><button data-close>取消</button><button class="primary" id="tOk">套用</button></div>
</div></div>

<!-- 修改單一時段 -->
<div class="mask" id="slotDlg"><div class="dlg">
  <h3 id="slotTitle">修改時段</h3>
  <label>開始 <input type="time" id="sStart"></label>
  <label>結束 <input type="time" id="sEnd"></label>
  <div id="sPreview" class="hint" style="margin:0"></div>
  <div class="btns"><button id="sReset" style="margin-right:auto" title="這段恢復成預設長度">恢復預設</button><button data-close>取消</button><button class="primary" id="sOk">套用</button></div>
</div></div>

<!-- 鬧鐘 -->
<div class="mask" id="alarmDlg"><div class="dlg">
  <div style="font-size:54px" class="ring">⏰</div>
  <div id="alarmMsg"></div>
  <div class="big" id="alarmNext"></div>
  <div class="btns" style="justify-content:center"><button class="primary" id="alarmStop">我知道了</button></div>
  <div class="hint" style="margin:10px 0 0">點畫面任何地方都可以停止鈴聲，計時會繼續</div>
</div></div>

<script>
// ===== log 開關 =====
const SHOW_LOG = true;
const log = (...a) => { if (SHOW_LOG) console.log('[代辦]', ...a); };

const KEY = 'lefttime-schedule-v1';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = ts => { const d = new Date(ts); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()); };
const uid = () => Math.random().toString(36).slice(2, 9);
const floorMin = ts => Math.floor(ts / 60000) * 60000;

let state = { startTs: floorMin(Date.now()), intervalMin: 60, align: true,items: [], selectedId: null, running: false, lastFiredIdx: -1 };

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = Object.assign(state, s); } catch (e) {}
  syncDurs();
  if (!state.viewV2) { state.viewV2 = true; if (!state.rowH || state.rowH < 110) state.rowH = 110; } // 預設列高加大
  log('1. 載入資料', state.items.length, '件');
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

// ===== 時段切割 =====
// align 開啟時：第一段「現在 ~ 下一個 XX:00/XX:30」，之後每段都落在 :00 或 :30
// 第一段若不到 10 分鐘，就併到再下一個半點，避免只有幾分鐘的零碎段
const HALF = 30 * 60000, MIN_FIRST = 10 * 60000;
const ivMs = () => state.intervalMin * 60000;
function firstEnd() {
  if (state.align === false) return state.startTs + ivMs();
  let a = Math.ceil(state.startTs / HALF) * HALF;
  // 以本地時區對齊（台灣 +8 整點，ceil 對 UTC 半點即本地半點；其他時區也都是半點倍數）
  if (a === state.startTs) return a + ivMs();      // 剛好在半點上 → 第一段就是完整一段
  if (a - state.startTs < MIN_FIRST) a += HALF;
  return a;
}
// state.durs[i]：第 i 段手動改過的長度(分鐘)，null = 用預設(對齊/間隔)。
// 時段跟著「位置」走，所以拖拉交換事項時長度不動；改了某段，後面各段自動接在它後面。
function slotEnd(i) {
  const d = state.durs || [];
  let end = d[0] != null ? state.startTs + d[0] * 60000 : firstEnd();
  for (let k = 1; k <= i; k++) end += (d[k] != null ? d[k] : state.intervalMin) * 60000;
  return end;
}
const slotStart = i => i === 0 ? state.startTs : slotEnd(i - 1);
function currentIdx(now = Date.now()) {
  if (now < state.startTs) return -1;
  const n = state.items.length;
  for (let i = 0; i < n; i++) if (now < slotEnd(i)) return i;
  return n;
}
function syncDurs() { // durs 長度跟 items 一致
  if (!Array.isArray(state.durs)) state.durs = [];
  while (state.durs.length < state.items.length) state.durs.push(null);
  state.durs.length = state.items.length;
}

// ===== 畫表格 =====
// 上方日期一律顯示「今天」(不是排程開始那天)；tick 每秒呼叫，過午夜自動換日
function updateDateLabel() {
  const el = $('#dateLabel'), t = ymd(Date.now());
  if (el.textContent !== t) { el.textContent = t; log('日期更新為今天', t); }
}
function render() {
  updateDateLabel();
  const tb = $('#tbody'); tb.innerHTML = '';
  const now = Date.now(), cur = currentIdx(now);
  if (!state.items.length) {
    tb.innerHTML = '<tr><td colspan="3" class="empty">還沒有代辦，按「＋ 填入代辦」開始</td></tr>';
  }
  state.items.forEach((it, i) => {
    const tr = document.createElement('tr');
    tr.className = 'row' + (it.id === state.selectedId ? ' sel' : '') + (i === cur ? ' now' : '') + (i < cur ? ' past' : '');
    tr.dataset.idx = i;
    const isNow = i === cur;
    const startLabel = isNow ? '現在' : hm(slotStart(i));
    const dayDiff = new Date(slotStart(i)).toDateString() !== new Date(state.startTs).toDateString() ? ' <small>(隔天)</small>' : '';
    const done = it.details.filter(d => d.done && d.text).length, total = it.details.filter(d => d.text).length;
    tr.innerHTML = `<td class="time">${startLabel}~${hm(slotEnd(i))}${dayDiff}</td>
      <td class="task"><span class="grip">⋮⋮</span><span class="t"></span>${total ? `<span class="cnt">${done}/${total}</span>` : ''}${isNow ? '<span class="nowTag">▶ 現在做這件</span>' : ''}</td>
      <td class="act"><button title="刪除" data-del="${it.id}">✕</button></td>`;
    tr.querySelector('.t').textContent = it.title;
    tb.appendChild(tr);
  });
  renderRight();
  renderStatus();
  applyDetToggle();
}
function scrollToNow() {
  const r = document.querySelector('tr.row.now');
  if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderRight() {
  const box = $('#right');
  const i = state.items.findIndex(x => x.id === state.selectedId);
  if (i < 0) { box.innerHTML = '<div class="empty">← 點選左邊的事項<br>在這裡編輯要做的細項</div>'; return; }
  const it = state.items[i];
  const cur = currentIdx();
  const nowItem = state.items[cur];
  const banner = !nowItem ? '' : cur === i
    ? `<div id="nowBanner">▶ 這是<b>現在</b>應該做的事，到 ${hm(slotEnd(cur))} 結束</div>`
    : `<div id="nowBanner" title="點一下跳到現在的事項">▶ 現在應該做：<b></b>（到 ${hm(slotEnd(cur))}）　點此切換</div>`;
  box.innerHTML = banner + `<h2>細項說明</h2>
    <input id="detTitle">
    <div id="detTime">${hm(slotStart(i))} ~ ${hm(slotEnd(i))}　（第 ${i + 1} 段）　<button id="detEditTime" style="padding:2px 8px;font-size:13px">✎ 改時間</button></div>
    <ol id="detList"></ol>
    <button id="detAdd">＋ 新增細項</button>
    <textarea id="detNote" placeholder="備註…"></textarea>`;
  const nb = $('#nowBanner');
  if (nb && cur !== i) { nb.querySelector('b').textContent = nowItem.title; nb.onclick = () => { state.selectedId = nowItem.id; save(); render(); scrollToNow(); }; }
  $('#detEditTime').onclick = () => openSlotEditor(i);
  $('#detTitle').value = it.title;
  $('#detTitle').oninput = e => { it.title = e.target.value; save(); const t = document.querySelector(`tr.row[data-idx="${i}"] .t`); if (t) t.textContent = it.title; };
  $('#detNote').value = it.note || '';
  $('#detNote').oninput = e => { it.note = e.target.value; save(); };
  if (!it.details.length) it.details.push({ text: '', done: false });
  const ol = $('#detList');
  it.details.forEach((d, k) => {
    const li = document.createElement('li'); if (d.done) li.className = 'done';
    li.innerHTML = `<input type="checkbox" ${d.done ? 'checked' : ''}><input type="text" placeholder="要做什麼…"><button title="刪除">✕</button>`;
    const [cb, tx, del] = li.children;

// ===== 點選 / 拖拉交換 =====

// ===== 修改單一時段：後面各段自動接上 =====
let slotIdx = -1;
// "HH:MM" → 時間戳，取最接近 ref 的那一天（可跨午夜）
function hmToTs(v, ref) {
  if (!v) return NaN;
  const [h, m] = v.split(':').map(Number), d = new Date(ref); d.setHours(h, m, 0, 0);
  let t = d.getTime();
  if (t - ref > 12 * 3600000) t -= 86400000; else if (ref - t > 12 * 3600000) t += 86400000;
  return t;
}
function planSlot() { // 依對話框輸入算出新的 startTs/durs，不寫回 state
  const i = slotIdx, s0 = slotStart(i), e0 = slotEnd(i);
  const ns = hmToTs($('#sStart').value, s0), ne = hmToTs($('#sEnd').value, e0);
  if (isNaN(ns) || isNaN(ne)) return { err: '請填完整的時間' };
  if (ne - ns < 5 * 60000) return { err: '結束要比開始晚至少 5 分鐘' };
  const durs = state.durs.slice(); let startTs = state.startTs;
  if (i === 0) startTs = ns;
  else {
    const ps = slotStart(i - 1);
    if (ns - ps < 5 * 60000) return { err: `開始時間不能早於上一段的 ${hm(ps + 5 * 60000)}` };
    durs[i - 1] = Math.round((ns - ps) / 60000); // 上一段跟著延長/縮短
  }

  const n = state.items.length, from = Math.max(0, slotIdx - 1);

    const a = []; for (let k = from; k < n; k++) a.push(`${state.items[k].title} ${hm(slotStart(k))}~${hm(slotEnd(k))}`);

function readIv(align) { let iv = Math.round(+$('#tInterval').value); if (align) iv = Math.max(30, Math.round(iv / 30) * 30); return iv; }
function updatePreview() {
  const s = new Date($('#tStart').value).getTime(), align = $('#tAlign').checked, iv = readIv(align);
  $('#tInterval').step = align ? 30 : 1;
  if (!s || !iv) { $('#tPreview').textContent = ''; return; }
  const n = Math.max(1, state.items.length);
  // 借用正式的切割函式算預覽，算完還原
  const bak = [state.startTs, state.intervalMin, state.align, state.durs];
  state.startTs = floorMin(s); state.intervalMin = iv; state.align = align; state.durs = [];
  const segs = []; for (let i = 0; i < Math.min(n, 4); i++) segs.push(`${hm(slotStart(i))}~${hm(slotEnd(i))}`);
  const txt = `預覽：${segs.join('、')}${n > 4 ? '…' : ''}（${n} 段，到 ${hm(slotEnd(n - 1))}）`;
  [state.startTs, state.intervalMin, state.align, state.durs] = bak;
  $('#tPreview').textContent = txt;
}
$('#btnTime').onclick = () => { $('#tStart').value = toLocalInput(state.startTs); $('#tInterval').value = state.intervalMin; $('#tAlign').checked = state.align !== false; updatePreview(); openDlg('#timeDlg'); };
// 鈴聲速度：每聲「滴」的間隔(秒)，拖動即時生效並存檔
// 鈴聲：4 聲一組，滑桿調「每組間隔」(秒)
function showBeep() { $('#tBeepVal').textContent = `每組 ${(+$('#tBeep').value).toFixed(1)} 秒`; }
$('#tBeep').oninput = () => {
  state.groupGap = +$('#tBeep').value; save(); showBeep();
  if (alarmSrcNode) { stopAlarmLoop(); playAlarmLoop(); } // 正在響就直接換速度（計時器不動）
};
$('#tBeepTest').onclick = () => { ensureAudio(); if (alarmSrcNode) stopRing(); else startRing(4); };
$('#btnTime').addEventListener('click', () => { $('#tBeep').value = state.groupGap || 1; showBeep(); });
$('#tAlign').onchange =() => { $('#tInterval').value = readIv($('#tAlign').checked); updatePreview(); };
$('#tNow').onclick = () => { $('#tStart').value = toLocalInput(Date.now()); updatePreview(); };
$('#tStart').oninput = updatePreview; $('#tInterval').oninput = updatePreview;
$('#tOk').onclick = () => {
  const align = $('#tAlign').checked;
  const s = new Date($('#tStart').value).getTime(), iv = readIv(align);
  if (!s || !(iv >= 1)) { alert('請填正確的開始時間與間隔'); return; }
  log('6. 重設時間', `${hm(state.startTs)}/${state.intervalMin}分 → ${hm(s)}/${iv}分`, align ? '(對齊半點)' : '(不對齊)');
  state.startTs = floorMin(s); state.intervalMin = iv; state.align = align;
  state.durs = []; syncDurs(); // 整份重排：清掉各段手動改過的長度
  state.lastFiredIdx = Math.max(-1, currentIdx() - 1); // 已經過去的時段不補響
  save(); closeDlg('#timeDlg'); render();
};

// ===== 鬧鐘聲 (Web Audio) =====
let actx = null, ringTimer = null;
function ensureAudio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); }
function beep(t, f) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.01); g.gain.setValueAtTime(0.25, t + 0.12); g.gain.linearRampToValueAtTime(0, t + 0.15);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.16);
}

const alarmAudio = new Audio(ALARM_SRC);
alarmAudio.preload = 'auto'; alarmAudio.loop = true;
let alarmOk = true;
alarmAudio.addEventListener('error', () => { alarmOk = false; log('13. 鬧鐘音檔載入失敗，改用內建嗶聲', ALARM_SRC); });
alarmAudio.addEventListener('canplaythrough', () => log('13. 鬧鐘音檔就緒', ALARM_SRC, alarmAudio.duration.toFixed(1) + '秒'), { once: true });
function unlockAlarm() { // 在使用者點擊時先播一下再停，之後計時到點才有權限自動出聲
  alarmAudio.muted = true;
  alarmAudio.play().then(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; alarmAudio.muted = false; }).catch(() => { alarmAudio.muted = false; });
}
function playAlarmFile() {
  if (!alarmOk) return Promise.reject();
  alarmAudio.muted = false; alarmAudio.currentTime = 0;
  return alarmAudio.play();
}
function stopAlarmFile() { alarmAudio.pause(); alarmAudio.currentTime = 0; }

// ===== 無縫循環：用 Web Audio 解碼音檔，找出「一組滴滴聲」的精確週期來 loop =====
// <audio loop> 會吃到 mp3 頭尾的編碼留白與檔尾靜音，重播時間隔忽長忽短；
// 這裡偵測第一組聲音的起點 s0 與第二組的起點 s1，loopStart=s0、loopEnd=s1，每組間隔完全一樣。
let alarmBuf = null, alarmLoop = null, alarmSrcNode = null;
// 13463.mp3 本身是「滴滴滴滴（每 0.125 秒一聲）＋停 0.5 秒」再一組，停頓那段聽起來像「停下來再播」。
// 所以改成：找出每一聲「滴」的起點，取聲與聲的間隔 P，只 loop 第一組的 N 聲、長度剛好 N×P，
// 循環時最後一聲到下一圈第一聲也是 P → 全程同間隔、連續不斷的滴滴聲。
function detectLoop(buf) {
  const sr = buf.sampleRate, ch = buf.getChannelData(0);
  let peak = 0; for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > peak) peak = a; }
  if (!peak) return null;
  const thr = peak * 0.15, beepGap = Math.round(0.02 * sr); // 安靜 >20ms 就算下一聲
  const on = []; let last = -1e9;
  for (let i = 0; i < ch.length; i++) {
    if (Math.abs(ch[i]) < thr) continue;
    if (i - last > beepGap) on.push(i);
    last = i;
  }
  if (!on.length) return null;
  const pre = Math.round(0.004 * sr);              // 起音前留 4ms，避免切到 attack
  const start = Math.max(0, on[0] - pre);
  if (on.length === 1) return { start: start / sr, end: Math.min(ch.length, last + Math.round(0.1 * sr)) / sr, beeps: 1, period: 0 };
  const gaps = on.slice(1).map((x, k) => x - on[k]).sort((a, b) => a - b);
  const P = gaps[Math.floor(gaps.length / 4)];      // 取偏短的間隔(第一四分位)＝組內滴滴間隔，排除組間長停頓
  let n = 1; while (n < on.length && Math.abs(on[n] - on[n - 1] - P) < 0.15 * P) n++; // 第一組有幾聲
  return { start: start / sr, end: (start + n * P) / sr, beeps: n, period: P / sr };
}
function prepareAlarmBuffer() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); // 未經點擊時是 suspended，但可先解碼
    fetch(ALARM_SRC).then(r => r.arrayBuffer())
      .then(ab => new Promise((ok, ng) => actx.decodeAudioData(ab, ok, ng)))
      .then(buf => {
        alarmBuf = buf; alarmLoop = detectLoop(buf);
        log('16. 鬧鐘無縫循環', alarmLoop ? `每聲間隔 ${alarmLoop.period.toFixed(4)} 秒，循環 ${alarmLoop.beeps} 聲（${alarmLoop.start.toFixed(3)}~${alarmLoop.end.toFixed(3)}）` : '偵測不到聲音');
      })
      .catch(e => log('16. 解碼失敗，改用 <audio>', e && e.message));
  } catch (e) { log('16. 不支援 Web Audio', e.message); }
}
function playAlarmLoop() {
  // 不要求 actx 已是 running：第一次點擊時 resume() 還在進行中，先排好播放，恢復後就會響
  // （以前這裡擋 running，結果第一次試聽都退回 <audio loop>，間隔又不平均）
  if (!alarmBuf || !alarmLoop || !actx || actx.state === 'closed') return false;
  if (actx.state !== 'running') actx.resume();
  const src = actx.createBufferSource(), g = actx.createGain();
  // 只循環「一聲滴」＋靜音，總長 = 使用者設定的間隔 → 速度可調、全程同間隔
  src.buffer = makeBeepBuffer(state.groupGap || 1); src.loop = true;
  g.gain.value = 1; src.connect(g).connect(actx.destination);
  src.start(0);
  alarmSrcNode = src;
  return true;
}
// 從原音檔切出第一組「滴滴滴滴」(4 聲，到第 5 聲之前)，後面補靜音到 gap 秒，做成一個可循環的小 buffer
// gap = 每組起點到下一組起點的時間；預設 1 秒＝原音檔的節奏，每組間隔完全一樣
function groupLen() { return alarmLoop.period ? ((alarmLoop.beeps - 1) + 0.9) * alarmLoop.period : alarmLoop.end - alarmLoop.start; }
function makeBeepBuffer(gap) {
  gap = Math.max(groupLen() + 0.05, gap);
  const sr = alarmBuf.sampleRate, s = Math.round(alarmLoop.start * sr);
  const seg = Math.round(groupLen() * sr); // 一組滴滴的長度
  const len = Math.round(gap * sr), out = actx.createBuffer(alarmBuf.numberOfChannels, len, sr);
  for (let c = 0; c < alarmBuf.numberOfChannels; c++) {
    const src = alarmBuf.getChannelData(c), dst = out.getChannelData(c);
    const n = Math.min(seg, len, src.length - s);
    for (let i = 0; i < n; i++) dst[i] = src[s + i];
    const fade = Math.min(Math.round(0.003 * sr), n); // 結尾 3ms 淡出，避免喀聲
    for (let i = 0; i < fade; i++) dst[n - 1 - i] *= i / fade;
  }
  return out;
}
function stopAlarmLoop() { if (alarmSrcNode) { try { alarmSrcNode.stop(); } catch (e) {} alarmSrcNode = null; } }

function ringOnce() { const t = actx.currentTime + 0.02; [0, 0.2, 0.4, 0.6].forEach((dt, k) => beep(t + dt, k % 2 ? 1320 : 990)); }
function startRing(seconds = 30) {
  ensureAudio(); stopRing();
  if (playAlarmLoop()) {
    log('14. 播放鬧鐘（無縫循環）'); ringTimer = setTimeout(stopRing, seconds * 1000);
    // 瀏覽器不讓出聲(重開頁面後還沒點過) → 0.4 秒後仍未恢復就改走 <audio>/嗶聲
    setTimeout(() => { if (alarmSrcNode && actx.state !== 'running') { log('14. 音訊未解鎖，改用備援'); stopAlarmLoop(); playAlarmFile().catch(() => ringOnce()); } }, 400);
    return;
  }
  playAlarmFile().then(() => {
    log('14. 播放鬧鐘音檔');
    ringTimer = setTimeout(stopRing, seconds * 1000);
  }).catch(() => {
    log('14. 音檔無法播放，改用嗶聲');
    ringOnce(); let n = 0;
    ringTimer = setInterval(() => { if (++n * 1.2 >= seconds) return stopRing(); ringOnce(); }, 1200);
  });
}
function stopRing() { clearInterval(ringTimer); clearTimeout(ringTimer); ringTimer = null; stopAlarmFile(); stopAlarmLoop(); }
prepareAlarmBuffer();

let testing = false;
$('#btnTest').onclick = () => {
  ensureAudio();
  if (testing) { stopRing(); testing = false; $('#btnTest').textContent = '🔔 試聽鈴聲'; return; }
  testing = true; $('#btnTest').textContent = '⏹ 停止試聽';
  startRing(8);
  setTimeout(() => { testing = false; $('#btnTest').textContent = '🔔 試聽鈴聲'; }, 8000);
};

function fireAlarm(endedIdx) {
  const ended = state.items[endedIdx], next = state.items[endedIdx + 1];
  log('7. 鬧鐘響', `第${endedIdx + 1}段「${ended && ended.title}」結束`, next ? `→ 下一項「${next.title}」` : '→ 全部完成');
  $('#alarmMsg').textContent = ended ? `「${ended.title}」時間到！` : '時間到！';
  $('#alarmNext').textContent = next ? `接下來：${next.title}` : '今天的代辦全部完成 🎉';
  openDlg('#alarmDlg'); startRing();
  if (next) { state.selectedId = next.id; }
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('⏰ ' + ($('#alarmMsg').textContent), { body: $('#alarmNext').textContent }); } catch (e) {}
  }
  const oldTitle = document.title; document.title = '⏰ 時間到！'; setTimeout(() => document.title = oldTitle, 15000);
}
$('#alarmStop').onclick = () => { stopRing(); closeDlg('#alarmDlg'); };

// ===== 響鈴時點畫面任一處（或按任意鍵）就停止鈴聲，計時繼續、等下一段再響 =====
// 這一下只拿來關鈴聲，不會同時觸發底下的按鈕/選取（吞掉接著的 click）
const isRinging = () => !!(alarmSrcNode || ringTimer || (!alarmAudio.paused && !alarmAudio.muted)); // muted=開始計時時的靜音解鎖，不算
let swallowClick = false;
function silenceByTap(where) {
  stopRing(); closeDlg('#alarmDlg');
  testing = false; $('#btnTest').textContent = '🔔 試聽鈴聲';
  log('17. 點畫面停止鈴聲', where, state.running ? '（計時繼續，等下一段）' : '');
}
document.addEventListener('pointerdown', e => {
  if (!isRinging()) return;
  if (e.target.closest('#timeDlg')) return; // 在時間設定裡調鈴聲速度時不要被打斷
  swallowClick = true; e.preventDefault(); e.stopPropagation();
  silenceByTap('pointer');
}, true);
document.addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false; e.preventDefault(); e.stopPropagation();
}, true);
document.addEventListener('keydown', e => { if (isRinging()) { e.preventDefault(); silenceByTap('key ' + e.key); } }, true);

// ===== 計時 =====
// 清除全部代辦：先確認，同時停止計時/鈴聲，開始時間重設為現在
$('#btnClear').onclick = () => {
  if (!state.items.length) { alert('目前沒有代辦事項'); return; }
  if (!confirm(`確定要清除全部 ${state.items.length} 件代辦事項（含細項與備註）？\n清除後無法復原。`)) return;
  log('14. 清除全部代辦，原本', state.items.length, '件');
  stopRing();
  state.items = []; state.durs = []; state.selectedId = null; state.running = false; state.lastFiredIdx = -1;
  state.startTs = floorMin(Date.now());
  save(); render();
  log('14. 清除完成，剩', state.items.length, '件');
};
$('#btnRun').onclick = () => {
  if (!state.items.length) { alert('請先填入代辦事項'); return; }
  state.running = !state.running;
  if (state.running) {
    ensureAudio(); unlockAlarm();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    state.lastFiredIdx = Math.max(-1, currentIdx() - 1);
    log('8. 開始計時，目前在第', currentIdx() + 1, '段');
  } else { stopRing(); log('8. 停止計時'); }
  save(); render();
};

let lastCur = null;
function tick() {
  updateDateLabel();
  if (state.running && state.items.length) {
    const cur = currentIdx();
    // 剛跨過某段的結束點：cur-1 是剛結束的那段
    const ended = Math.min(cur - 1, state.items.length - 1);
    if (ended > state.lastFiredIdx) {
      state.lastFiredIdx = ended; save();
      fireAlarm(ended);
      if (ended >= state.items.length - 1) { state.running = false; save(); }
      render();
    }
  }
  const cur = currentIdx();
  if (cur !== lastCur) { log('10. 現在時段 →', cur + 1, state.items[cur] && state.items[cur].title); lastCur = cur; render(); scrollToNow(); } else renderStatus();
}

// ===== 表格大小：列高滑桿 / 填滿 / 左右分隔線 =====
function applyView() {
  const h = state.rowH || 110;
  document.documentElement.style.setProperty('--rowH', h + 'px');
  document.documentElement.style.setProperty('--timeFs', Math.round(Math.min(26, Math.max(16, h / 5))) + 'px');
  document.documentElement.style.setProperty('--taskFs', Math.round(Math.min(34, Math.max(16, h / 3.6))) + 'px');
  document.documentElement.style.setProperty('--leftW', (state.leftW || 55) + '%');
  $('#rowH').value = h;
}
$('#rowH').oninput = e => { state.rowH = +e.target.value; applyView(); save(); };
$('#btnFit').onclick = () => {
  const n = Math.max(1, state.items.length);
  const avail = $('main').clientHeight - $('thead').offsetHeight - 60;
  state.rowH = Math.max(40, Math.min(200, Math.floor(avail / n) - 25));
  log('9. 填滿畫面 列高', state.rowH); applyView(); save();
};
$('#splitter').addEventListener('pointerdown', e => {
  const sp = e.currentTarget; sp.setPointerCapture(e.pointerId);
  const box = $('main').getBoundingClientRect();
  const mv = ev => { state.leftW = Math.max(25, Math.min(80, (ev.clientX - box.left) / box.width * 100)); applyView(); };
  const up = () => { sp.removeEventListener('pointermove', mv); sp.removeEventListener('pointerup', up); save(); };
  sp.addEventListener('pointermove', mv); sp.addEventListener('pointerup', up);
});

// ===== 手機：細項區收合（每次開啟預設收起） =====
let detCollapsed = true;
function applyDetToggle() {
  $('main').classList.toggle('collapsed', detCollapsed);
  $('#detToggle .arrow').textContent = detCollapsed ? '▲ 展開細項' : '▼ 收起細項';
  const it = state.items.find(x => x.id === state.selectedId);
  $('#detToggle .name').textContent = it ? it.title : '';
}
$('#detToggle').onclick = () => {
  detCollapsed = !detCollapsed; log('15. 細項區', detCollapsed ? '收起' : '展開');
  applyDetToggle();
  if (!detCollapsed) { const r = document.querySelector('tr.row.sel'); if (r) r.scrollIntoView({ block: 'nearest' }); }
};

// ===== 啟動 =====
load();
applyView();
if (state.running) { /* 重新開啟頁面後，瀏覽器需要點一下才能出聲 */ document.addEventListener('pointerdown', () => { ensureAudio(); unlockAlarm(); }, { once: true }); }
render();
setInterval(tick, 1000);
if (!state.items.length) $('#btnAdd').click();
</script>
