<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#232838">
<title>金幣小鎮大亨</title>
<style>
:root{--ui:#2a2f45;--ui2:#1b1f30;--blue:#2fa3ff;--green:#3ddc84;--gold:#ffc83d;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#151824;overflow:hidden;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#fff}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;overflow:hidden;background:#7cc66a}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.o{text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.6)}
button{font-family:inherit;color:#fff;border:0;cursor:pointer}
/* ===== 頂部 HUD ===== */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:#232838;display:flex;gap:6px;align-items:center;z-index:5}
.lvbox{position:relative;flex:0 0 27%;height:42px;display:flex;align-items:center}
.xpbar{position:absolute;left:18px;right:0;top:9px;height:24px;background:#151826;border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(#8e6bff,#6a45e6);transition:width .3s}
.star{position:relative;width:46px;height:46px;flex:none;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%);background:linear-gradient(#f0b8ff,#b04fe8);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#4a1670;padding-top:5px}
.cashbox,.goldbox{flex:1;height:44px;background:var(--ui2);border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 6px;position:relative}
.cashbox .ic{font-size:24px;position:relative}
.x2b{position:absolute;left:-2px;bottom:-4px;font-size:11px;font-weight:900;color:#ffd84a;display:none}
.cashbox .v{flex:1;text-align:center;line-height:1.05}
.cashbox .v b{font-size:18px;display:block}
.cashbox .v small{font-size:11px;color:#c9cde0}
.goldbox{flex:0 0 28%}
.goldbox b{flex:1;text-align:center;font-size:18px}
.plus{width:26px;height:26px;border-radius:7px;font-weight:900;font-size:18px;line-height:26px;padding:0;flex:none}
.plus.g{background:linear-gradient(#58e88f,#22b45c)} .plus.o2{background:linear-gradient(#ffb347,#f27a1a)}
/* 章節列 */
#chap{position:absolute;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:4}
.cbar{flex:1;height:30px;background:#1b1f30cc;border-radius:8px;position:relative;overflow:hidden;border:2px solid #0d1020}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#55bfff,#1f8be8);transition:width .4s}
.cbar .seg{position:absolute;top:5px;bottom:5px;width:2px;background:#ffffff55}
.cbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sq{width:44px;height:44px;border-radius:10px;background:linear-gradient(#f4f4f8,#c9cbd8);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #8d90a3;flex:none;position:relative}
.sq.glow{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 3px 0 #8d90a3,0 0 4px #ffd84a}to{box-shadow:0 3px 0 #8d90a3,0 0 18px 4px #ffd84a}}
.dot{position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none}
/* 任務卡 */
#tasks{position:absolute;left:8px;right:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:4}
.task{background:#1b1f30e6;border:2px solid #0d1020;border-radius:10px;padding:5px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:66px;cursor:pointer;position:relative}
.task .tt{display:flex;gap:4px;align-items:flex-start;font-size:12px;line-height:1.25;flex:1}
.task .tt .ti{font-size:18px;flex:none}
.task .pb{height:16px;background:#3a3f57;border-radius:5px;position:relative;overflow:hidden}
.task .pb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#55bfff,#1f8be8)}
.task .pb span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;font-weight:700}
.task.done{border-color:#3ddc84;animation:pulse 1s infinite alternate}
.task.done .pb i{background:linear-gradient(#58e88f,#22b45c)}
.task.claimed{opacity:.45}
@keyframes pulse{to{transform:scale(1.03)}}
/* 側邊按鈕 */
.side{position:absolute;display:flex;flex-direction:column;gap:10px;z-index:3}
.rbtn{width:52px;height:52px;border-radius:14px;background:linear-gradient(#f4f4f8,#c9cbd8);box-shadow:0 3px 0 #8d90a3;font-size:26px;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.ibtn{display:flex;flex-direction:column;align-items:center;gap:0;background:none;padding:0;width:72px}
.ibtn .e{font-size:40px;filter:drop-shadow(0 3px 2px #0005);line-height:1.1}
.ibtn small{background:#1b1f30d9;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap}
.cd{position:absolute;inset:0;border-radius:14px;background:conic-gradient(#0008 var(--p,0%),transparent 0);pointer-events:none}
/* 底部列 */
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5;align-items:flex-end}
.bb{flex:1;height:64px;border-radius:14px;background:linear-gradient(#3fa9ff,#1f6fe0);box-shadow:0 4px 0 #0d4aa0;font-size:28px;position:relative;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bb small{font-size:11px;font-weight:700;margin-top:3px}
.bb.big{flex:1.7;height:72px;background:linear-gradient(#5dea8e,#24b25b);box-shadow:0 4px 0 #13813d}
.bb.big b{font-size:28px;color:#ffe45c;-webkit-text-stroke:1px #7a4b00}
.bb.big small{background:#0f6a3388;border-radius:6px;padding:2px 6px;font-size:12px}
.bb .dot{display:none}
/* 底部抽屜 */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:55%;background:var(--ui);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:20;display:flex;flex-direction:column;box-shadow:0 -6px 20px #0007}
#sheet.open{transform:none}
#sheetBody{overflow:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 12px 8px;border-bottom:1px solid #ffffff14}
.sh-head .ico{font-size:34px}
.sh-head .nm{font-size:19px;font-weight:900}
.sh-head .sub{font-size:13px;color:#9fe8b6;font-weight:700}
.sh-head .x{margin-left:auto;width:36px;height:36px;border-radius:10px;background:#ffffff1a;font-size:18px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.statrow div{background:var(--ui2);border-radius:8px;padding:5px;text-align:center;font-size:11px;color:#aab}
.statrow b{display:block;color:#fff;font-size:14px}
.hint{font-size:12px;color:#ffd27a;margin:0 0 8px;min-height:0}
.bulk{display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:8px;color:#aab}
.bulk button{flex:1;height:28px;border-radius:7px;background:#ffffff14;font-weight:700}
.bulk button.on{background:var(--blue)}
.row{display:flex;align-items:center;gap:8px;background:var(--ui2);border-radius:10px;padding:7px 8px;margin-bottom:6px}
.row .ri{font-size:26px;width:34px;text-align:center}
.row .rt{flex:1;min-width:0;font-size:14px;font-weight:700}
.row .rt .small{font-size:11px;color:#aab;font-weight:400;margin-top:2px}
.row .lv{color:#ffd84a;margin-left:4px}
.ms{height:5px;background:#3a3f57;border-radius:3px;margin-top:4px;overflow:hidden}
.ms i{display:block;height:100%;background:#ffd84a;width:0}
.buy{min-width:96px;height:44px;border-radius:10px;background:linear-gradient(#58e88f,#22b45c);box-shadow:0 3px 0 #13813d;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0 6px;touch-action:manipulation}
.buy .n{font-size:11px;font-weight:700}
.buy .c{font-size:14px}
.buy.no{background:linear-gradient(#7c8196,#5b6075);box-shadow:0 3px 0 #3e4254}
.buy.max{background:#3a3f57;box-shadow:none}
.buy.gold{background:linear-gradient(#ffd25c,#e9a210);box-shadow:0 3px 0 #a86e00;color:#4a2c00}
.buy:active{transform:translateY(2px)}
.desc{font-size:13px;color:#c9cde0;margin:4px 0 10px;line-height:1.5}
/* modal */
#modal{position:absolute;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.mbox{background:var(--ui);border-radius:16px;width:100%;max-width:400px;max-height:86%;overflow:auto;padding:16px;box-shadow:0 10px 30px #000a;border:2px solid #ffffff1a}
.mbox h2{margin:0 0 8px;font-size:20px;text-align:center}
.mbox .big{font-size:30px;font-weight:900;text-align:center;color:#ffe45c;margin:6px 0}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns button{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:700;background:linear-gradient(#3fa9ff,#1f6fe0);box-shadow:0 3px 0 #0d4aa0}
.mbtns button.g{background:linear-gradient(#58e88f,#22b45c);box-shadow:0 3px 0 #13813d}
.mbtns button.y{background:linear-gradient(#ffd25c,#e9a210);box-shadow:0 3px 0 #a86e00;color:#4a2c00}
.mbtns button.r{background:linear-gradient(#ff7a7a,#d93c3c);box-shadow:0 3px 0 #8f1f1f}
.mbtns button.n{background:#ffffff1f;box-shadow:none}
.mbtns button:disabled{opacity:.4}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--ui2);border-radius:10px;padding:8px;font-size:14px}
.li .e{font-size:26px}
.li .f{flex:1;min-width:0}
.li .f small{display:block;color:#aab;font-size:11px}
.hb{height:8px;background:#3a3f57;border-radius:4px;overflow:hidden;margin-top:4px}
.hb i{display:block;height:100%;background:linear-gradient(90deg,#55bfff,#3ddc84)}
textarea{width:100%;height:90px;background:#151826;color:#cfe;border:1px solid #444;border-radius:8px;font-size:11px;user-select:text;-webkit-user-select:text}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:90%}
.tst{background:#1b1f30ee;border:2px solid #ffd84a;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:scale(.6);opacity:0}}
.tog{display:flex;justify-content:space-between;align-items:center;background:var(--ui2);border-radius:10px;padding:10px;margin-bottom:6px}
.tog button{width:64px;height:32px;border-radius:16px;background:#555;font-weight:700}
.tog button.on{background:var(--green)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="lvbox"><div class="xpbar"><i id="xpFill"></i></div><div class="star" id="lvStar">1</div></div>
    <div class="cashbox"><div class="ic">💵<span class="x2b o" id="x2b">x2</span></div><div class="v o"><b id="cash">0</b><small id="rate">0/秒</small></div><button class="plus g" data-m="shop">+</button></div>
    <div class="goldbox"><span style="font-size:24px">🪙</span><b class="o" id="gold">0</b><button class="plus o2" data-m="shop">+</button></div>
  </div>

  <div id="chap">
    <div class="cbar" id="cbar"><i id="cfill"></i><span class="o" id="clabel">第 1 章</span></div>
    <button class="sq" id="chest" data-m="chest">🎁<span class="dot" id="chestDot"></span></button>
    <button class="sq" data-m="next">📍</button>
  </div>

  <div id="tasks"></div>

  <div class="side" id="sideL">
    <div style="display:flex;gap:8px">
      <button class="rbtn" data-m="settings">⚙️</button>
      <button class="rbtn" data-m="rush" id="rushBtn">📢<span class="cd" id="rushCd"></span></button>
    </div>
    <button class="ibtn" data-m="piggy"><span class="e">🐷</span><small id="piggyT">0%</small></button>
    <button class="ibtn" data-m="gift"><span class="e">🎁</span><small id="giftT">可領取</small></button>
  </div>
  <div class="side" id="sideR">
    <button class="rbtn" data-m="stats">📊</button>
  </div>

  <div id="bar">
    <button class="bb" data-m="shop">🏪<small>商店</small></button>
    <button class="bb" data-m="fame">⭐<small>名聲</small><span class="dot" id="fameDot"></span></button>
    <button class="bb big" data-m="boost"><b>x2</b><small id="boostT">點我收益加倍</small></button>
    <button class="bb" data-m="list">🏙️<small>事業</small></button>
    <button class="bb" data-m="help">❓<small>說明</small></button>
  </div>

  <div id="sheet"><div id="sheetHead"></div><div id="sheetBody"></div></div>
  <div id="modal"><div class="mbox" id="mbox"></div></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
// =====================================================================
//  金幣小鎮大亨 — 純 HTML5 等角視角放置經營遊戲（原創）
//  SHOW_LOG = true 時會在 Console 印出每個步驟的中文紀錄
// =====================================================================
const SHOW_LOG = false;
const log = (...a) => { if (SHOW_LOG) console.log('[小鎮]', ...a); };
const TEST = location.hash === '#selftest';

// ---------- 常數 ----------
const HW = 32, HH = 16;          // 等角格子半寬 / 半高（世界像素）
const LOT = 9, PITCH = 12;        // 店面 9×9 格，含馬路間距 12 格
const WALL_H = 62;
const MAX_LV = 300, MAX_CTR = 6, MAX_MKT = 40, QMAX = 15;
const PAY_MS = [10, 25, 50, 100, 150, 200, 250, 300];   // 每到這些等級：每位客人收入 ×2
const SPD_MS = [25, 75, 150, 250];                      // 每到這些等級：服務時間 ×0.8
const SAVE_KEY = 'cointown_v1';
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

const BIZ_DEF = [
  { name: '小鎮銀行', icon: '🏦', unlock: 0, mgr: 2e4, floor: ['#f9c0b8', '#f2a7a1'], wall: '#d86a78', wallTop: '#f6e9df', counter: '#e6a95e', accent: '#7b5cff', staff: '櫃員', desc: '存款、匯款、換外幣，小鎮金流的起點。' },
  { name: '星光咖啡', icon: '☕', unlock: 2500, mgr: 6e5, floor: ['#ecd9bd', '#ddc4a0'], wall: '#7a5442', wallTop: '#f3e3cf', counter: '#5d8f62', accent: '#3c9a5f', staff: '咖啡師', desc: '一杯拿鐵開啟美好的一天，上班族最愛。' },
  { name: '大口漢堡', icon: '🍔', unlock: 1.2e5, mgr: 2.5e7, floor: ['#ffe39a', '#ffd26b'], wall: '#e0523f', wallTop: '#fff2d6', counter: '#d43d2f', accent: '#ff8a1f', staff: '店員', desc: '雙層起司牛肉堡，排隊也要吃。' },
  { name: '鮮採超市', icon: '🛒', unlock: 6e6, mgr: 1e9, floor: ['#cfeec4', '#b9e3ab'], wall: '#3f9a6b', wallTop: '#eef8e6', counter: '#4a7fc9', accent: '#2f7de1', staff: '收銀員', desc: '生鮮蔬果日用品，一次買齊。' },
  { name: '星空影城', icon: '🎬', unlock: 3e8, mgr: 5e10, floor: ['#b9b3e6', '#a59ddb'], wall: '#43357a', wallTop: '#e6e1ff', counter: '#c03a6b', accent: '#e8336f', staff: '售票員', desc: '大銀幕、爆米花，週末一位難求。' },
  { name: '夢幻遊樂中心', icon: '🎡', unlock: 1.5e10, mgr: 2.5e12, floor: ['#bfe7ff', '#a3d8fb'], wall: '#2c79c7', wallTop: '#e3f4ff', counter: '#f2a51a', accent: '#ff5fa2', staff: '服務員', desc: '雲霄飛車與摩天輪，小鎮最熱鬧的地方。' },
];
const BIZ = BIZ_DEF.map((d, k) => {
  const f = Math.pow(16, k);
  return Object.assign({}, d, { pay: 4 * f, cost: 6 * f, ctr: 60 * f, mkt: 40 * f });
});

// ---------- 工具 ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nowMs = () => Date.now();
const UNITS = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad', 'ae', 'af', 'ag', 'ah'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? (Math.floor(n * 10) / 10).toString() : Math.floor(n).toString();
  let i = -1;
  while (n >= 1000 && i < UNITS.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + UNITS[i];
}
function fmtTime(ms) {
  ms = Math.max(0, ms); const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  if (h >= 24) return Math.floor(h / 24) + '日' + (h % 24) + '小時';
  if (h > 0) return h + '小時' + String(m).padStart(2, '0') + '分';
  return m + '分' + String(ss).padStart(2, '0') + '秒';
}
function niceRound(n) { if (n < 100) return Math.ceil(n); const p = Math.pow(10, Math.floor(Math.log10(n)) - 1); return Math.ceil(n / p) * p; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  r = clamp(Math.round(r * amt), 0, 255); g = clamp(Math.round(g * amt), 0, 255); b = clamp(Math.round(b * amt), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

// ---------- 存檔 ----------
function freshBiz() { return BIZ.map((_, k) => ({ u: k === 0, c: k === 0 ? [1] : [], m: 0, g: false, lost: 0, served: 0 })); }
function freshState() {
  return {
    ver: 1, cash: 0, gold: 20, xp: 0, lvl: 1, fame: 0, perm: 1, permBuys: 0,
    totalEarned: 0, runEarned: 0, served: 0, lost: 0, upgrades: 0,
    biz: freshBiz(), boostUntil: 0, rushUntil: 0, rushCd: 0, giftAt: 0, piggy: 0,
    chapter: 1, tasks: [], bulk: 1, sound: true, last: nowMs(), created: nowMs(), play: 0, tut: 0, cam: null,
  };
}
let S = freshState();
function save() {
  if (TEST) return;
  S.last = nowMs(); S.cam = { x: cam.x, y: cam.y, z: cam.z };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { log('存檔失敗', e); }
}
function load() {
  if (TEST) return false;
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const o = JSON.parse(raw); const base = freshState();
    S = Object.assign(base, o);
    // 補齊新版本可能新增的店面
    const fb = freshBiz(); while (S.biz.length < fb.length) S.biz.push(fb[S.biz.length]);
    log('讀檔完成：現金', fmt(S.cash), '章節', S.chapter);
    return true;
  } catch (e) { log('讀檔失敗', e); return false; }
}

// ---------- 經濟公式 ----------
function payOf(k, lv) { let m = 1; for (const x of PAY_MS) if (lv >= x) m *= 2; return BIZ[k].pay * lv * m; }
function svcTime(lv) { let t = 3; for (const x of SPD_MS) if (lv >= x) t *= 0.8; return t; }
function nextMs(lv) { for (const x of PAY_MS) if (lv < x) return x; return MAX_LV; }
function prevMs(lv) { let p = 0; for (const x of PAY_MS) if (lv >= x) p = x; return p; }
function rushOn() { return nowMs() < S.rushUntil; }
function boostOn() { return nowMs() < S.boostUntil; }
function demand(k) { return 0.45 * (1 + 0.35 * S.biz[k].m) * (rushOn() ? 3 : 1); }
function gmult() { return (boostOn() ? 2 : 1) * S.perm * (1 + 0.1 * S.fame) * (1 + 0.02 * (S.lvl - 1)); }
function bizMult(k) { return (S.biz[k].g ? 2 : 1) * gmult(); }
function upgCost(k, lv) { return BIZ[k].cost * Math.pow(1.12, lv - 1); }
function ctrCost(k, n) { return BIZ[k].ctr * Math.pow(9, n - 1); }
function mktCost(k, m) { return BIZ[k].mkt * Math.pow(1.85, m); }
function bizStats(k) {
  const b = S.biz[k]; if (!b.u) return { cap: 0, dem: 0, rate: 0, thr: 0 };
  let cap = 0, payCap = 0;
  for (const lv of b.c) { const t = svcTime(lv); cap += 1 / t; payCap += payOf(k, lv) / t; }
  const dem = demand(k), thr = Math.min(dem, cap);
  const avg = cap ? payCap / cap : 0;
  return { cap, dem, thr, rate: thr * avg * bizMult(k) };
}
function totalRate() { let r = 0; for (let k = 0; k < BIZ.length; k++) r += bizStats(k).rate; return r; }
function bulk(k, lv, cashAvail) {
  const c0 = upgCost(k, lv), room = MAX_LV - lv, mode = S.bulk;
  let n;
  if (mode > 0) n = Math.min(mode, room);
  else n = Math.min(room, Math.floor(Math.log(cashAvail * 0.12 / c0 + 1) / Math.log(1.12)));
  if (n < 1) n = Math.min(1, room);
  const cost = c0 * (Math.pow(1.12, n) - 1) / 0.12;
  return { n, cost };
}
function earn(v) {
  if (!(v > 0)) return;
  S.cash += v; S.totalEarned += v; S.runEarned += v;
  const cap = Math.max(5000, totalRate() * 7200);
  S.piggy = Math.min(cap, S.piggy + v * 0.03);
}
function canPay(c) { return S.cash >= c * 0.999999; }
function addXp(n) {
  S.xp += n;
  let leveled = false;
  while (S.xp >= xpNeed(S.lvl)) { S.xp -= xpNeed(S.lvl); S.lvl++; S.gold += 5; leveled = true; }
  if (leveled) { toast(`⭐ 升到 Lv ${S.lvl}！獲得 🪙5，全收益 +2%`); sfx('lvl'); log('升級', S.lvl); }
}
function xpNeed(l) { return Math.floor(15 * Math.pow(l, 1.6)); }

function lotOrigin(k) { return [(k % 2) * PITCH, Math.floor(k / 2) * PITCH]; }
function P(gx, gy, z = 0) { return [(gx - gy) * HW, (gx + gy) * HH - z]; }
function W(k, u, v, z = 0) { const o = lotOrigin(k); return P(o[0] + u, o[1] + v, z); }
const ctrU = (i) => 1.2 + 1.25 * i;
function slotPos(s) { const r = Math.floor(s / 5), i = s % 5; return [r === 1 ? 6.8 - i * 1.2 : 2 + i * 1.2, 3.7 + r * 1.2]; }
const WORLD = { gx0: -3, gx1: PITCH * 2, gy0: -3, gy1: PITCH * 3 };

function spawnCust(k) {
  const rt = RT[k];
  const sx = 7.8 + (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2.5);
  const c = { k, u: sx, v: 10.6, path: [[7.8, 10.6], [7.8, 8.2], slotPos(rt.queue.length)], st: 'q', L: randLook(), ph: Math.random() * 6, a: 0, spd: 2.2 + Math.random() * 0.6, back: false, moving: true };
  rt.queue.push(c); rt.cust.push(c);
}
function spawnAngry(k) {
  const sx = 7.8 + (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);
  RT[k].cust.push({ k, u: sx, v: 10.6, path: [[7.8, 10.6], [7.8, 9.5]], st: 'angry', wait: 1.6, L: randLook(), ph: 0, a: 0, spd: 2.4, back: false, moving: true });
}
function moveC(c, dt) {
  if (!c.path.length) { c.moving = false; return true; }
  const t = c.path[0], du = t[0] - c.u, dv = t[1] - c.v, d = Math.hypot(du, dv), st = c.spd * dt;
  if (d <= st) { c.u = t[0]; c.v = t[1]; c.path.shift(); }
  else { c.u += du / d * st; c.v += dv / d * st; c.back = (du + dv) < -0.01; }
  c.moving = true; c.ph += dt * 12;
  return false;
}

function simulate(dt) {
  coinSfxT -= dt;
  for (let k = 0; k < BIZ.length; k++) {
    const b = S.biz[k], rt = RT[k];
    if (!b.u) continue;
    while (rt.ctr.length < b.c.length) rt.ctr.push({ cust: null, t: 0, on: false });
    // 1) 依客流產生客人；排隊滿了就流失（生氣離開）
    rt.acc += demand(k) * dt;
    while (rt.acc >= 1) {
      rt.acc -= 1;
      if (rt.queue.length < QMAX) spawnCust(k);
      else {
        b.lost++; S.lost++;
        if (rt.cust.filter((c) => c.st === 'angry').length < 3) spawnAngry(k);
      }
    }
    // 2) 排隊位置跟著往前遞補
    rt.queue.forEach((c, idx) => {
      const sp = slotPos(idx);
      if (c.path.length) c.path[c.path.length - 1] = sp;
      else if (Math.hypot(c.u - sp[0], c.v - sp[1]) > 0.02) c.path.push(sp);
    });
    // 3) 空櫃台叫號（等級高的櫃台優先）
    const order = b.c.map((lv, i) => i).sort((x, y) => b.c[y] - b.c[x]);
    for (const i of order) {
      const cs = rt.ctr[i]; if (cs.cust) continue;
      const f = rt.queue[0]; if (!f || f.path.length > 1) break;
      rt.queue.shift(); f.st = 'go'; f.path = [[ctrU(i), 2.35]]; f.ci = i;
      cs.cust = f; cs.t = 0; cs.on = false;
    }
    // 4) 櫃台服務計時 → 結帳
    rt.ctr.forEach((cs, i) => {
      if (!cs.cust) return;
      if (!cs.on && cs.cust.path.length === 0) { cs.on = true; cs.cust.back = true; }
      if (!cs.on) return;
      cs.t += dt;
      const lv = b.c[i];
      if (cs.t >= svcTime(lv)) {
        const pay = payOf(k, lv) * bizMult(k);
        earn(pay); b.served++; S.served++;
        if (floats.length < 50) { const p = W(k, ctrU(i), 1.4, 46); floats.push({ x: p[0], y: p[1], s: '+$' + fmt(pay), t: 0, col: '#9dffb8' }); }
        if (coinSfxT <= 0) { sfx('coin'); coinSfxT = 0.18; }
        const c = cs.cust;
        c.st = 'leave'; c.back = false;
        c.path = [[c.u, 2.9], [8.4, 2.9], [8.4, 10.6], [8.4 + (Math.random() < 0.5 ? -6 : 5), 10.6]];
        cs.cust = null; cs.on = false; cs.t = 0;
      }
    });
    // 5) 移動所有客人
    for (const c of rt.cust) {
      c.a = Math.min(1, c.a + dt * 3);
      if (c.st === 'angry') {
        if (c.path.length) moveC(c, dt);
        else { c.mad = true; c.moving = false; c.wait -= dt; if (c.wait <= 0) { c.st = 'leave'; c.path = [[c.u, 10.6], [c.u - 6, 10.6]]; } }
        continue;
      }
      if (c.st === 'go' && !c.path.length) { c.moving = false; continue; }
      const arrived = moveC(c, dt);
      if (c.st === 'leave') {
        if (c.path.length === 1) c.a = Math.max(0, c.a - dt * 0.9);
        if (arrived || c.a <= 0) c.dead = true;
      }
    }
    if (rt.cust.some((c) => c.dead)) rt.cust = rt.cust.filter((c) => !c.dead);
  }
  // 浮動文字
  for (const f of floats) f.t += dt;
  while (floats.length && floats[0].t > 1.3) floats.shift();
  // 天降現金
  if (drop) { drop.t -= dt; if (drop.t <= 0) drop = null; }
  else if ((dropTimer -= dt) <= 0) {
    dropTimer = 40 + Math.random() * 40;
    const un = S.biz.map((b, k) => b.u ? k : -1).filter((k) => k >= 0);
    drop = { k: pick(un), t: 25, v: Math.max(50, totalRate() * 45) };
    log('天降現金出現', drop);
  }
}
// 畫面不在前景時（分頁切走/鎖屏）改用公式補收益
function creditAnalytic(sec) {
  let v = 0, srv = 0;
  for (let k = 0; k < BIZ.length; k++) { const st = bizStats(k); v += st.rate * sec; srv += st.thr * sec; }
  earn(v); S.served += Math.floor(srv);
  log('背景補收益', sec.toFixed(1), '秒 →', fmt(v));
  return v;
}

const cv = $('cv'), ctx = cv.getContext('2d');

function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function box(gx, gy, w, d, h, top, left, right, z0 = 0) {
  const a = P(gx, gy + d, z0), b = P(gx + w, gy + d, z0), c = P(gx + w, gy, z0);
  const at = P(gx, gy + d, z0 + h), bt = P(gx + w, gy + d, z0 + h), ct = P(gx + w, gy, z0 + h), dt = P(gx, gy, z0 + h);
  poly([a, b, bt, at], left); poly([b, c, ct, bt], right); poly([dt, ct, bt, at], top);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function text(s, x, y, size, col, align = 'center', stroke = '#0009') {

  ctx.lineWidth = Math.max(2, size / 5); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawPerson(x, y, L, ph, moving, opt = {}) {
  const bob = moving ? Math.abs(Math.sin(ph)) * 1.6 : (opt.idle ? Math.sin(ph) * 0.6 : 0);
  ellipse(x, y, 8, 3.5, 'rgba(0,0,0,.2)');
  const sw = moving ? Math.sin(ph) * 2.6 : 0;
  ctx.fillStyle = L.pants;
  ctx.fillRect(x - 4.4, y - 11 - bob, 3.6, 11 - Math.max(0, sw));
  ctx.fillRect(x + 0.8, y - 11 - bob, 3.6, 11 - Math.max(0, -sw));
  // 手
  ctx.fillStyle = L.skin;
  circle(x - 7.2, y - 13 - bob + (moving ? sw * 0.6 : 0), 2.2, L.skin);
  circle(x + 7.2, y - 13 - bob - (moving ? sw * 0.6 : 0), 2.2, L.skin);
  // 身體
  rr(x - 6.8, y - 23 - bob, 13.6, 13.5, 4.5); ctx.fillStyle = L.shirt; ctx.fill();
  if (opt.tie) { ctx.fillStyle = '#e84d4d'; ctx.fillRect(x - 1, y - 22 - bob, 2, 8); }
  const hy = y - 31 - bob;
  // 後髮
  if (L.style === 2) circle(x, hy - 2, 10, L.hair);
  if (L.style === 4) circle(x + (opt.back ? 0 : 6), hy - 1, 4, L.hair);
  circle(x, hy, 7.6, L.skin);
  // 前髮
  ctx.fillStyle = L.hair; ctx.beginPath();
  if (opt.back) { ctx.arc(x, hy, 7.9, Math.PI * 0.95, Math.PI * 2.05); ctx.fill(); }
  else if (L.style === 3) { ctx.arc(x, hy - 1, 7.9, Math.PI * 1.15, Math.PI * 1.85); ctx.fill(); }
  else { ctx.arc(x, hy - 1, 8, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); }
  if (L.style === 1) circle(x, hy - 9.5, 3.4, L.hair);
  if (!opt.back) {
    ctx.fillStyle = '#222'; ctx.fillRect(x - 3.4, hy + 0.2, 1.8, 2.4); ctx.fillRect(x + 1.6, hy + 0.2, 1.8, 2.4);
    if (opt.shades) { ctx.fillStyle = '#111'; ctx.fillRect(x - 5, hy - 0.5, 10, 3); }
    ctx.fillStyle = 'rgba(255,120,120,.5)'; ctx.fillRect(x - 5.5, hy + 3, 2, 1.4); ctx.fillRect(x + 3.5, hy + 3, 2, 1.4);
  }
  if (opt.hat) { ctx.fillStyle = opt.hat; rr(x - 7, hy - 10, 14, 4, 2); ctx.fill(); ctx.fillRect(x - 5, hy - 13, 10, 4); }
}
function drawMad(x, y) {

function actInfo(act, k, i) {
  const b = S.biz[k], d = BIZ[k];
  switch (act) {
    case 'upg': { const lv = b.c[i]; if (lv >= MAX_LV) return { max: true }; const q = bulk(k, lv, S.cash); return { cost: q.cost, label: '升級 +' + q.n, can: canPay(q.cost) }; }
    case 'upgAll': {
      let cash = S.cash, cost = 0, n = 0;
      for (const lv of b.c) { if (lv >= MAX_LV) continue; const q = bulk(k, lv, S.bulk ? Infinity : cash / b.c.length); cost += q.cost; n++; }
      if (!n) return { max: true };
      return { cost, label: '全部升級', can: canPay(cost) };
    }
    case 'ctr': if (b.c.length >= MAX_CTR) return { max: true }; { const c = ctrCost(k, b.c.length); return { cost: c, label: '新增', can: canPay(c) }; }
    case 'mkt': if (b.m >= MAX_MKT) return { max: true }; { const c = mktCost(k, b.m); return { cost: c, label: '宣傳', can: canPay(c) }; }
    case 'mgr': if (b.g) return { max: true, maxLabel: '已聘請' }; return { cost: d.mgr, label: '聘請', can: canPay(d.mgr) };
    case 'unlock': { const first = S.biz.findIndex((x) => !x.u) === k; return { cost: d.unlock, label: '解鎖', can: first && canPay(d.unlock) }; }
  }
  return { max: true };
}
function updateSheet() {
  if (sheetK < 0) return;
  const k = sheetK, b = S.biz[k], st = bizStats(k);
  const sr = $('shRate'); if (sr) sr.textContent = b.u ? `$${fmt(st.rate)}/秒` : `解鎖價 $${fmt(BIZ[k].unlock)}`;
  if (b.u) {
    $('shDem').textContent = (st.dem * 60).toFixed(0) + ' 人/分';
    $('shCap').textContent = (st.cap * 60).toFixed(0) + ' 人/分';
    const tot = b.served + b.lost; $('shLost').textContent = tot ? Math.round(b.lost / tot * 100) + '%' : '0%';
    $('shHint').textContent = st.dem > st.cap * 1.05 ? '⚠️ 客人太多，櫃台忙不過來！新增或升級櫃台可接更多客人。' : st.cap > st.dem * 1.6 ? '💡 櫃台很閒，做行銷宣傳可吸引更多客人。' : '';
    b.c.forEach((lv, i) => {
      const l = $('lv' + i); if (!l) return;
      l.textContent = 'Lv ' + lv;
      $('inf' + i).textContent = `每位 $${fmt(payOf(k, lv) * bizMult(k))} · ${svcTime(lv).toFixed(1)} 秒`;
      const nm = nextMs(lv), pm = prevMs(lv);
      $('msb' + i).style.width = (lv >= MAX_LV ? 100 : (lv - pm) / (nm - pm) * 100) + '%';
    });
    $('mktLv').textContent = 'Lv ' + b.m;
    $('mktInf').textContent = `客流 ${(0.45 * (1 + 0.35 * b.m) * 60).toFixed(0)} → ${(0.45 * (1 + 0.35 * (b.m + 1)) * 60).toFixed(0)} 人/分`;
  }
  document.querySelectorAll('#sheetBody [data-act]').forEach((btn) => {
    const inf = actInfo(btn.dataset.act, k, +btn.dataset.i);
    btn.classList.toggle('max', !!inf.max); btn.classList.toggle('no', !inf.max && !inf.can);
    btn.querySelector('.n').textContent = inf.max ? (inf.maxLabel || '已滿級') : inf.label;
    btn.querySelector('.c').textContent = inf.max ? '' : '$' + fmt(inf.cost);
  });
}
function doAct(act, k, i) {
  const b = S.biz[k], d = BIZ[k], inf = actInfo(act, k, i);
  if (inf.max) return false;
  if (!inf.can) { if (act === 'unlock' && S.biz.findIndex((x) => !x.u) !== k) toast('要先解鎖前一間店喔'); else toast('現金不足 💸'); sfx('err'); return false; }
  switch (act) {
    case 'upg': {
      const lv0 = b.c[i], q = bulk(k, lv0, S.cash); S.cash -= q.cost; b.c[i] += q.n; S.upgrades += q.n; addXp(q.n);
      const crossed = PAY_MS.filter((m) => lv0 < m && b.c[i] >= m);
      if (crossed.length) toast(`🎉 櫃台 #${i + 1} 達 Lv ${crossed[crossed.length - 1]}：每位收入 ×${Math.pow(2, crossed.length)}！`);
      log('升級櫃台', k, i, lv0, '→', b.c[i], '花費', fmt(q.cost));
      break;
    }
    case 'upgAll': {
      for (let j = 0; j < b.c.length; j++) {
        if (b.c[j] >= MAX_LV) continue;
        const q = bulk(k, b.c[j], S.bulk ? S.cash : S.cash / (b.c.length - j));
        if (!canPay(q.cost)) continue;
        S.cash -= q.cost; b.c[j] += q.n; S.upgrades += q.n; addXp(q.n);
      }
      log('全部升級', k, b.c);
      break;
    }
    case 'ctr': S.cash -= inf.cost; b.c.push(1); S.upgrades++; addXp(5); toast(`🪑 ${d.name} 新增第 ${b.c.length} 個櫃台`); break;
    case 'mkt': S.cash -= inf.cost; b.m++; S.upgrades++; addXp(3); break;
    case 'mgr': S.cash -= inf.cost; b.g = true; S.upgrades++; addXp(20); toast(`🕶️ ${d.name} 經理上任，收入 ×2！`); break;
    case 'unlock': S.cash -= inf.cost; b.u = true; b.c = [1]; addXp(30); S.gold += 10; toast(`🎊 ${d.name} 開幕！獲得 🪙10`); focusLot(k, false, sheetK >= 0); log('解鎖店面', d.name); break;
  }
  S.cash = Math.max(0, S.cash);
  sfx('buy'); renderSheet(); return true;
}

  next() {
    const un = S.biz.map((b, k) => b.u ? k : -1).filter((k) => k >= 0);
    const lockedFirst = S.biz.findIndex((b) => !b.u); if (lockedFirst >= 0) un.push(lockedFirst);
    nextIdx = (nextIdx + 1) % un.length; focusLot(un[nextIdx]);
  },
  rush() {
    if (nowMs() < S.rushCd) { toast('📢 大聲公冷卻中：' + fmtTime(S.rushCd - nowMs())); return; }
    S.rushUntil = nowMs() + 30e3; S.rushCd = nowMs() + 5 * 60e3; sfx('lvl'); toast('📢 限時特賣！30 秒內客流 ×3');
  },
};
let nextIdx = 0;
function fameGain() { return Math.floor(Math.sqrt(S.runEarned / 5e7)); }
MH.buy = (btn) => {
  const it = shopItems().find((x) => x.id === btn.dataset.id); if (!it) return;
  if (S.gold < it.price) { toast('金條不足 🪙'); sfx('err'); return; }
  if (it.id === 'boost' && S.boostUntil - nowMs() > 16 * 3600e3) { toast('加倍時間已達上限'); return; }
  S.gold -= it.price;
  if (it.v) earn(it.v);
  if (it.id === 'boost') S.boostUntil = Math.min(nowMs() + 24 * 3600e3, Math.max(nowMs(), S.boostUntil) + 8 * 3600e3);
  if (it.id === 'perm') { S.perm *= 1.5; S.permBuys++; }
  sfx('cash'); toast(`購買成功：${it.name}`); MENU.shop(); log('商店購買', it.id);
};
MH.prestige = () => {
  const g = fameGain(); if (g < 1) return;
  S.fame += g; S.biz = freshBiz(); S.cash = 0; S.runEarned = 0; S.piggy = 0; resetRT(); drop = null;
  closeModal(); closeSheet(); focusLot(0); genTasks(); sfx('lvl');
  toast(`🚚 搬到新城市！名聲 +${g}，收入 ×${(1 + 0.1 * S.fame).toFixed(1)}`); save(); log('搬家', S.fame);
};
MH.goto = (el) => { const k = +el.dataset.k; closeModal(); openBiz(k); };
MH.snd = () => { S.sound = !S.sound; MENU.settings(); };
MH.exp = () => { save(); try { $('saveTxt').value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); $('saveTxt').select(); } catch (e) { toast('匯出失敗'); } };
MH.imp = () => {
  try { const o = JSON.parse(decodeURIComponent(escape(atob($('saveTxt').value.trim())))); if (!o || !o.biz) throw 0; S = Object.assign(freshState(), o); resetRT(); taskSig = ''; sheetKey = ''; if (!S.tasks.length) genTasks(); save(); closeModal(); toast('📥 匯入成功'); }
  catch (e) { toast('存檔碼格式錯誤'); }
};
MH.reset = (btn) => {
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = '再按一次確認重置'; return; }
  S = freshState(); resetRT(); taskSig = ''; genTasks(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
  closeModal(); closeSheet(); focusLot(0, true); toast('已重置進度');
};
MH.piggy = () => { if (S.gold < 10 || S.piggy < 1) return; S.gold -= 10; const v = S.piggy; S.piggy = 0; S.cash += v; sfx('cash'); closeModal(); toast('🐷 打破存錢筒：$' + fmt(v)); };
MH.offline = (btn) => {
  const v = +btn.dataset.v, dbl = btn.dataset.d === '1';
  if (dbl) { if (S.gold < 5) { toast('金條不足'); return; } S.gold -= 5; }
  earn(dbl ? v * 2 : v); sfx('cash'); closeModal(); toast('💵 領取離線收益 $' + fmt(dbl ? v * 2 : v));
};

// ---------- HUD 更新 ----------
function updateHud() {
  $('cash').textContent = fmt(S.cash);
  $('rate').textContent = fmt(totalRate()) + '/秒';
  $('gold').textContent = fmt(S.gold);
  $('lvStar').textContent = S.lvl;
  $('xpFill').style.width = clamp(S.xp / xpNeed(S.lvl) * 100, 0, 100) + '%';
  const bo = boostOn(); $('x2b').style.display = bo ? 'block' : 'none';
  $('boostT').textContent = bo ? fmtTime(S.boostUntil - nowMs()) : '點我收益加倍';
  const cap = Math.max(5000, totalRate() * 7200); $('piggyT').textContent = Math.floor(S.piggy / cap * 100) + '%';
  $('giftT').textContent = nowMs() >= S.giftAt ? '可領取！' : fmtTime(S.giftAt - nowMs());
  const rc = S.rushCd - nowMs();
  $('rushCd').style.setProperty('--p', (rc > 0 ? rc / 300e3 * 100 : 0) + '%');
  $('fameDot').style.display = fameGain() >= 1 ? 'block' : 'none';
  renderTasks();
  if (sheetK >= 0) updateSheet();
}

// ---------- 主迴圈 ----------
let lastT = performance.now(), uiAcc = 0, saveAcc = 0, T0 = performance.now();
function frame() {
  const now = performance.now(); let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 1) {   // 分頁切回來：用公式補背景收益
    const v = creditAnalytic(dt); if (v > 0 && dt > 5) toast(`⏱️ 離開 ${fmtTime(dt * 1000)}，店面賺了 $${fmt(v)}`);
    dt = 0;
  }
  dt = Math.min(dt, 0.1); S.play += dt;
  simulate(dt);
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 2.5); const e = 1 - Math.pow(1 - camAnim.t, 3);
    for (const key of ['x', 'y', 'z']) cam[key] = camAnim.from[key] + (camAnim.to[key] - camAnim.from[key]) * e;
    if (camAnim.t >= 1) camAnim = null;
  }
  draw((now - T0) / 1000);
  if ((uiAcc += dt) > 0.2) { uiAcc = 0; updateHud(); }
  if ((saveAcc += dt) > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { resize(); });

// ---------- 啟動 ----------
function boot() {
  const had = load();
  resize();
  if (!S.tasks || !S.tasks.length) genTasks();
  if (had && S.cam) { Object.assign(cam, S.cam); clampCam(); } else focusLot(0, true);
  updateHud();
  if (had) {
    const away = (nowMs() - S.last) / 1000;
    if (away > 60) {
      const sec = Math.min(away, 8 * 3600); const r = totalRate(); const v = r * sec * 0.5;
      if (v > 0) modal(`<h2>👋 歡迎回來！</h2><div class="desc" style="text-align:center">你離開了 ${fmtTime(away * 1000)}${away > 8 * 3600 ? '（最多計算 8 小時）' : ''}，店員們幫你顧店賺了：</div><div class="big">$${fmt(v)}</div>
      <div class="mbtns"><button data-mm="offline" data-v="${v}" data-d="0">領取</button><button class="y" data-mm="offline" data-v="${v}" data-d="1" ${S.gold < 5 ? 'disabled' : ''}>雙倍領取 🪙5</button></div>`);
      log('離線', away, '秒，收益', fmt(v));
    }
  } else if (!TEST) MENU.help();
  requestAnimationFrame(frame);
}

// ---------- 自我測試（網址加 #selftest）----------
function selfTest() {
  const R = { errors: [] };
  try {
    resize(); genTasks(); focusLot(0, true);
    // 1) 銀行模擬 60 秒
    for (let i = 0; i < 1800; i++) simulate(1 / 30);
    R.bankServed60s = S.biz[0].served; R.bankLost60s = S.biz[0].lost; R.cash60s = S.cash; R.rate1 = totalRate();
    // 2) 給錢、購買各種升級
    S.cash = 1e13;
    for (let n = 0; n < 5; n++) doAct('ctr', 0);
    S.bulk = 25; doAct('upgAll', 0); doAct('mkt', 0); doAct('mgr', 0);
    for (let k = 1; k < BIZ.length; k++) { doAct('unlock', k); doAct('ctr', k); doAct('ctr', k); S.bulk = 10; doAct('upgAll', k); }
    R.unlocked = S.biz.filter((b) => b.u).length; R.bankCtr = S.biz[0].c.slice();
    const before = S.served;
    for (let i = 0; i < 1800; i++) simulate(1 / 30);
    R.served60sAll = S.served - before; R.rateAll = totalRate();
    R.analyticCheck = bizStats(0);
    // 3) 背景補收益
    const c0 = S.cash; creditAnalytic(10); R.analytic10s = S.cash - c0;
    // 4) UI 操作
    for (const m of ['shop', 'fame', 'list', 'stats', 'settings', 'help', 'piggy', 'gift', 'chest', 'next', 'rush', 'boost']) { MENU[m](); closeModal(); }
    openBiz(0); updateSheet(); openBiz(3); closeSheet(); updateHud();
    S.runEarned = 1e9; MENU.fame(); MH.prestige(); R.fameAfter = S.fame; R.afterPrestigeUnlocked = S.biz.filter((b) => b.u).length;
    // 重新解鎖做截圖
    S.cash = 1e12; for (let n = 0; n < 4; n++) doAct('ctr', 0); doAct('unlock', 1); doAct('ctr', 1);
    S.biz[0].m = 25; closeSheet();
    for (let i = 0; i < 600; i++) simulate(1 / 30);
    R.tasks = S.tasks.map(taskText); R.cashFinite = isFinite(S.cash);
    focusLot(0, true); draw(3);
    R.shot = cv.toDataURL('image/png');
  } catch (e) { R.errors.push(String(e && e.stack || e)); }
  const pre = document.createElement('pre'); pre.id = 'selftest';
  pre.textContent = 'SELFTEST_RESULT:' + JSON.stringify(R) + ':END';
  document.body.appendChild(pre);
}
window.addEventListener('error', (e) => { if (TEST) { const p = document.createElement('pre'); p.textContent = 'SELFTEST_ERROR:' + e.message + ' @' + e.lineno + ':END'; document.body.appendChild(p); } });
if (TEST) selfTest(); else { boot(); if (location.hash === '#ui') { closeModal(); openBiz(0); } }
</script>
